# cargo deny policy of the root workspace (everything bins/jc links). The nested workspaces
# (crates/antares, crates/ekiben, crates/portal) keep their own deny.toml beside their lockfile.
# A vulnerable or unmaintained crate turns the supply-chain job red until it is upgraded or
# replaced (bins/jc/STATUS.md lists the open ones). Two advisories are ignored, the same ids and
# reasons crates/portal (and prod's joinedcontext-portal) carries, each with no fixed release and
# no reachable danger: RUSTSEC-2023-0071 (rsa) and RUSTSEC-2026-0374 (basic-toml). cargo audit
# does not read this file: .cargo/audit.toml repeats the rsa id (audit only warns on basic-toml).
[graph]
all-features = false

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9 (Marvin, private-key timing) via openidconnect 4 -> joinedcontext-portal; no fixed rsa release. Runtime use is openidconnect's RS256 verification with Keycloak's public keys, which Marvin does not reach; rsa private keys exist only in tests (portal dev-dependency: src/auth/bearer.rs #[cfg(test)] mod tests, tests/auth_tests.rs); kaisatsu signs with aws-lc-rs (crypto/src/keys.rs). Drop when rsa releases a constant-time fix or openidconnect drops rsa" },
    { id = "RUSTSEC-2026-0374", reason = "basic-toml 0.1.10 unmaintained (no vulnerability): build-time read of i18n.toml inside proc-macros, age 0.12.1 -> i18n-embed-fl 0.10.1 / i18n-embed-impl -> i18n-config 0.4.8, the newest of each. Drop when i18n-config releases without basic-toml" },
]

[licenses]
# The union of the nested workspaces' allow-lists; each entry carries its reason there
# (crates/portal/deny.toml, crates/antares/deny.toml).
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0", "Zlib", "MPL-2.0", "EUPL-1.2", "CC0-1.0", "MIT-0", "0BSD", "OpenSSL",
  "CDLA-Permissive-2.0",
  # finl_unicode 1.5.0 (assistant: kreuzberg 4.10.4 -> comrak 0.55 -> finl_unicode), which every
  # version carries; the OSI-approved predecessor of Unicode-3.0. The platform workspace's
  # allowance, owner decision (a) on T-3209 (vendor/joinedcontext-platform, T-3191, T-3202).
  "Unicode-DFS-2016",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The monorepo's own crates depend on each other by path without a version; nothing here is
# published, so a path dependency is the only kind a wildcard is allowed for.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# daiya-model's OData crates come from the broker's repository at a pinned rev
# (crates/daiya/model/Cargo.toml).
allow-git = ["https://github.com/marek-mraz-jc/Antares-NGSI-LD-Context-Broker"]
