# cargo-mutants configuration for the coverage and mutants-diff workflows (T-7529).
# Equivalent mutants: a mutation no test can tell from the original (same observable behaviour).
# One regex per entry, matched against the names `cargo mutants --list` prints, each with its reason
# on the line above it. A branch whose new mutant survives either adds the test that kills it or
# lists it here with the reason; a reviewer reads every entry.
exclude_re = [
  # jc-chart Canvas::rect: set() drops a pixel past the edge, so a clamp one wider (or none) draws
  # the same; the clamp only bounds the loop (T-7622).
  'jc-chart/src/raster\.rs:\d+:\d+: replace - with (\+|/) in Canvas::rect',
  # jc-chart Canvas::line: on an axis the line does not move along, the step's sign is never used
  # (dx or dy is 0 and Bresenham never steps that way), so < and <= draw alike (T-7622).
  'jc-chart/src/raster\.rs:\d+:\d+: replace < with <= in Canvas::line',
  # jc-chart Canvas::disc: the offsets run -r..=r, so cx - x covers the same pixels as cx + x (T-7622).
  'jc-chart/src/raster\.rs:\d+:\d+: replace \+ with - in Canvas::disc',
  # jc-chart check: Instant::now() equal to the deadline to the nanosecond is never observed (T-7622).
  'jc-chart/src/raster\.rs:\d+:\d+: replace > with >= in check',
  # jc-chart canvas: with no legend (0 px) the swatch loop runs for at most one colour and draws it
  # past the right edge, which set() drops (T-7622).
  'jc-chart/src/raster\.rs:\d+:\d+: replace > with >= in canvas',
  # jc-chart rows_of: `id` and `type` hold strings, which the instance loop skips as non-objects, so
  # skipping them by name or not is alike; the @context half is held by a test (T-7622).
  'jc-chart/src/spec\.rs:\d+:29: replace \|\| with && in rows_of',
  # T-7669 json_schema type_of: an integer is i64 or u64 and its f64 has no fraction, so any one test answers
  # "integer"; the true schema matched by its own arm and by `_` both answer Ok.
  'ekiben-bloblang/src/json_schema\.rs:\d+:\d+: replace \|\| with && in type_of',
  'ekiben-bloblang/src/json_schema\.rs:\d+:\d+: delete match arm Json::Bool\(true\) in Validator<.*>::validate',
  # T-7669 msgpack len_header and Reader::uint: the fix base (0xa0, 0x90, 0x80) has its low bits zero and
  # the length is below the fix limit; `acc << 8` has its low byte zero: `|` and `^` add the same bits.
  'ekiben-bloblang/src/msgpack\.rs:\d+:\d+: replace \| with \^ in (len_header|Reader<.*>::uint)',
  # T-7669 msgpack Reader::len: a length between what is left and buf.len() + pos passes the looser bound and
  # then take() answers the same "unexpected EOF"; collect() over a Result reserves nothing up front.
  'ekiben-bloblang/src/msgpack\.rs:\d+:\d+: replace - with \+ in Reader<.*>::len',
  # jc-types from_b32: `n << 5` has its low five bits zero and `v` is below 32, so `|` and `^` add the same bits.
  'jc-types/src/lib\.rs:\d+:\d+: replace \| with \^ in from_b32',
  # jc-http carried_v4 (T-7623): `high << 16` has its low 16 bits zero and `low` fits in them, so `|` and `^` add the same bits.
  'jc-http/src/lib\.rs:\d+:\d+: replace \| with \^ in carried_v4',
  # jc-time from_system_time (T-7623): the comparison picks the clamp only when jiff refuses the instant; at exactly
  # UNIX_EPOCH jiff never refuses, so `<` and `<=` cannot be told apart.
  'jc-time/src/lib\.rs:\d+:\d+: replace < with <= in from_system_time',
  # jc-types cache: an entry expiring at exactly this Instant: two reads of the monotonic clock in one test never tie, so `>` and `>=` cannot be told apart.
  'jc-types/src/cache\.rs:\d+:\d+: replace > with >= in Inner<K, V>::expire',
  'jc-types/src/cache\.rs:\d+:\d+: replace > with >= in BoundedCache<K, V>::entries_of',
  # dataroom-plugin fragment_is_safe: `end * 1` restarts the scan at the tag's own `>`, which holds no `<` and is text either way.
  'dataroom/plugin/src/lib\.rs:\d+:\d+: replace \+ with \* in fragment_is_safe',
  # Every Store sets org_id and catalogue_id from the request ctx on upsert (store-memory, store-pg), so the copy's own fields
  # never reach a row; a dataset copy still naming the source catalogue only rewrites identical content.
  'dataroom/server/src/writer\.rs:\d+:\d+: delete field (org_id|catalogue_id) from struct (Dataset|Publisher) expression in CatalogueWriter::list_from',
  # T-7539: the cached token differs only when Instant::now() equals its expiry to the nanosecond.
  'crates/embedder/src/client\.rs:\d+:\d+: replace < with <= in Remote::token',
  # T-7539: the pinned model always answers a [1, tokens, 384] tensor, so neither half of the shape check is ever true.
  'crates/embedder/src/model\.rs:\d+:\d+: replace \|\| with && in Engine::embed',
  # T-7539: tokenizers 0.23.2 defaults max_length to 512, which is MAX_TOKENS.
  'crates/embedder/src/model\.rs:\d+:\d+: delete field max_length from struct TruncationParams expression in Embedder::load',
  # antares-bus NatsBus::ensure_streams -> Ok(()): get_or_create keeps a stream that exists, and a
  # live-NATS test cannot delete the shared streams under the other tests (nextest runs the binaries
  # side by side), so only a fresh server tells; streams_and_bucket_carry_their_contract pins the
  # configs it creates (T-7530).
  'antares-bus/src/nats\.rs:.*replace NatsBus::ensure_streams -> Result<\(\), BusError> with Ok\(\(\)\)',
  # dataroom-api handle_odata `/{set}/$count`: top 0 only spares the rows the answer never
  # carries; without it the count is the same, the page is built and dropped (T-7627).
  'dataroom/api/src/odata_routes\.rs:\d+:\d+: delete field top from struct QueryOptions expression in handle_odata',
  # ekiben-js fuzzing::run is compiled only with the `fuzzing` feature, which no test build turns
  # on; cargo fuzz runs it from crates/ekiben/crates/ekiben-js/fuzz (T-7584).
  'ekiben-js/src/lib\.rs:.*fuzzing::run',
  # ekiben-io-amqp read_batch: RabbitMQ refuses a message over its max_message_size (16 MiB by
  # default) at publish, so no test broker can deliver one past MAX_MESSAGE_BYTES (64 MiB); the
  # size guard and its reject serve brokers configured above 64 MiB (T-7580).
  'ekiben-io-amqp/src/lib.rs:\d+:\d+: replace match guard d\.data\.len\(\) > MAX_MESSAGE_BYTES with false in <impl Input for AmqpInput>::read_batch',
  'ekiben-io-amqp/src/lib.rs:\d+:\d+: replace > with (==|>=) in <impl Input for AmqpInput>::read_batch',
  'ekiben-io-amqp/src/lib.rs:\d+:\d+: delete ! in <impl Input for AmqpInput>::read_batch',
  # ekiben-text go-syslog machines: generated by scripts/ragel-go-to-rust.py from go-syslog v3.0.0's Ragel
  # output, so a mutant is a change to generated code, not to code anyone writes. The parity corpus takes
  # every transition of both charts (chart_tests) and Bento 1.22.0 recorded every expected output; a
  # sample of every 150th mutant per file is the evidence of what it kills (T-7677). A relational mutant
  # inside a byte-range test survives when the one byte per class the corpus takes lies outside the
  # changed range; the upgrade is the min and max byte of each run per class (about three times the corpus).
  'ekiben-text/src/go_syslog/rfc(3164|5424)/machine\.rs:',
  # ngsild-residual compare: an ordered comparison with a Boolean on one side is Unknown either
  # way, since order() has no ordering between a Boolean and any other kind (T-7599).
  'antares-residual/src/eval.rs:\d+:\d+: replace \|\| with && in compare',
  # ngsild-residual pow: the exact 1/b^e arm exists for platforms whose powf is not correctly
  # rounded; on glibc powf gives the same bits for every integer case (T-7599).
  'antares-residual/src/eval.rs:\d+:\d+: delete match arm \(Val::Int\(b\), Val::Int\(e\)\) in call',
  # ngsild-residual translate: a `]` outside a class pushes `]` and leaves the class off either
  # way, so the guard `if class` changes nothing observable (T-7599).
  'antares-residual/src/pattern.rs:\d+:\d+: replace match guard class with true in translate',
  # joinedcontext-policy read_filter: every rule names one type (rules() and the per-type loop), so with no
  # type refused and no rule dropped the block keeps every rule and adds none; < and <= read alike (T-7672).
  'addons/joinedcontext-policy/src/decide\.rs:\d+:\d+: replace < with <= in read_filter',
  # joinedcontext-policy Information::narrowed: without `attributes` (or for a schema read, which every
  # capability gives) the general path keeps every listed Attribute, so the early return answers the same; the
  # `attributes` it clears is read by nothing after it (rules() takes the names alone) (T-7672).
  'addons/joinedcontext-policy/src/document\.rs:\d+:\d+: replace \|\| with && in Information::narrowed',
  'addons/joinedcontext-policy/src/document\.rs:\d+:\d+: delete field attributes from struct Self expression in Information::narrowed',
  # kaisatsu-import apply_realm_files: listing a re-applied person's groups when the file names none only adds a read;
  # `in_every_group` over an empty file list is true either way, so the plan and the writes are the same.
  'crates/kaisatsu/import/src/lib\.rs:.*replace match guard !file_groups\.is_empty\(\) with true in apply_realm_files',
  # kaisatsu-store-pg: push_email_match picks the bare email_lower column only so the unique index serves an
  # exact non-empty match; coalesce(email_lower, '') selects the same rows for every operator and value (a NULL
  # never equals, contains or starts with a non-empty value, and an empty value takes coalesce either way).
  'crates/kaisatsu/store-pg/src/lib\.rs:.*replace == with != in push_email_match',
  # kaisatsu-store-pg: list_groups' search query keeps only the matches and their ancestors (keep CTE), so the
  # Rust prune after it finds no node to drop; kept as a second check on the search result.
  'crates/kaisatsu/store-pg/src/lib\.rs:.*replace matches_or_has_matching_child -> bool with true',
  # kaisatsu-store-pg: lock_grants orders a grant write against a cascading delete in another transaction
  # (advisory lock); a single-connection test commits one after the other, so no test observes the lock.
  'crates/kaisatsu/store-pg/src/lib\.rs:.*replace lock_grants -> Result<\(\)> with Ok\(\(\)\)',
  # kaisatsu-crypto: Kek's Drop zeroizes the key bytes on drop; no safe code can read freed memory, so no
  # test tells a zeroizing drop from an empty one (the zeroize crate's own tests hold it).
  'crates/kaisatsu/crypto/src/keys\.rs:.*replace <impl Drop for Kek>::drop with \(\)',
  # kaisatsu-crypto: aws-lc-rs hands every generated P-256 public key back as the 65-byte uncompressed point,
  # so the format guard in generate_es256 never sees another shape and `||` and `&&` refuse the same keys.
  'crates/kaisatsu/crypto/src/keys\.rs:.*replace \|\| with && in KeyManager::generate_es256',
  # kaisatsu-crypto: compute_hotp_at joins four bytes shifted to disjoint bit ranges (24, 16, 8, 0), where `|`
  # and `^` give the same word.
  'crates/kaisatsu/crypto/src/totp\.rs:.*replace \| with \^ in compute_hotp_at',
  # kaisatsu-crypto: compute_hotp_at hashes every algorithm name other than SHA1 and SHA512 with SHA-256,
  # so a default of "", "xyzzy" or "HmacSHA256" computes the same code.
  'crates/kaisatsu/crypto/src/totp\.rs:.*replace default_alg -> String with ',
  # kaisatsu-crypto: AUTH_DATA_FLAG_UP is `1 << 0`, and `1 >> 0` is the same 1.
  'crates/kaisatsu/crypto/src/webauthn\.rs:35:.*replace << with >>',
  # kaisatsu-crypto: decode_cbor refuses an input over 64 KiB before decoding, so no byte or text string of
  # exactly 64 KiB (head included) reaches the per-string cap, where `>` and `>=` differ only at that length.
  'crates/kaisatsu/crypto/src/webauthn\.rs:(200|212):.*replace > with >= in CborReader',
  # daiya-store-memory: insert_plan drops plans whose expires_at is before `now`, read inside the call; a
  # plan expiring at that exact microsecond is the only one `>` and `>=` treat apart, and no test can pin it.
  'crates/daiya/store-memory/src/lib\.rs:.*replace > with >= in <impl DaiyaStore for MemoryStore>::insert_plan',
  # daiya-api execute_public_dashboard_query: a span exactly at the organization's maximum is capped to
  # to - max, which is the `from` it already has, so `>` and `>=` give the same range (T-7684).
  'crates/daiya/api/src/public\.rs:\d+:\d+: replace > with >= in execute_public_dashboard_query',
  # daiya-api SetTable::read: daiya's Scope carries permissions and no row restriction, so scope.cond() is
  # always true and And(true, filter) reads the rows filter alone reads (T-7684).
  'crates/daiya/api/src/sets\.rs:\d+:\d+: replace != with == in SetTable<.a>::read',
  # daiya-api page_reader: every caller with an actor but no Authorization header is a host's server-admin
  # check on another header, and an Authorization header without an actor is a 401 before the page; the
  # reader `&&` would install reads the same organization's same panels (T-7684).
  'crates/daiya/api/src/page\.rs:\d+:\d+: replace \|\| with && in page_reader',
  # daiya-api check_rate_limit: a full table drops windows older than the window; `<` and `<=` differ only for
  # a window that started exactly one window length before this call, an instant no test can pin (T-7684).
  'crates/daiya/api/src/public\.rs:\d+:\d+: replace < with <= in PublicRateLimiter::check_rate_limit',
  # antares-notifier: the retry jitter is 1 + j * (2n - 1) with n uniform clock noise in [0, 1); 1 - j * (2n - 1)
  # has the same distribution over the same range [1 - j, 1 + j], so no test can tell the two apart.
  'crates/antares-notifier/src/lib\.rs:\d+:26: replace \+ with - in DeliveryPolicy::next_delay',
  # antares-notifier: page_sink is cfg(target_arch = "wasm32"); the native test run does not compile it, so its mutants
  # change nothing the native tests build (the browser build of antares-wasm registers and calls it).
  'crates/antares-notifier/src/http\.rs:\d+:\d+: replace .*page_sink::',
  # antares-notifier: the pump-finished guard after a successful publish only decides whether a connection whose broker
  # hung up in the same instant is pooled or the publish retried; both report the delivery, and a dead pooled connection
  # is replaced by the next publish's retry (a_dead_pooled_connection_is_replaced_by_one_retry). No test can order it.
  'crates/antares-notifier/src/mqtt\.rs:\d+:\d+: replace match guard !conn\.pump\.is_finished\(\) with true in MqttSink::publish_message',
]
