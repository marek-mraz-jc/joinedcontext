name: ship
# Builds the jc image (bins/jc/Dockerfile: every module, default features, the Portal UI
# embedded) after a green ci on main, smoke-tests it, pushes ghcr.io/<owner>/jc by digest and
# signs it with cosign, as the platform's image.yml does. image-scan.yml runs after it: the SBOM
# and the trivy gate, attested. Deployments pin the digest (deployment components/jc/images.yaml),
# never a tag; deployment scripts/verify-pinned-images.py accepts this workflow's signature on main
# only. A dispatch builds any ref (its signature is then refused there).
on:
  workflow_run: { workflows: [ci], types: [completed], branches: [main] }
  push:
    tags: ["v*"]
  workflow_dispatch:
# Read-only by default: only the job that publishes holds packages: write and id-token: write.
permissions: { contents: read }
# Never cancelled: the output is an artifact the deployment pins, not a verdict.
concurrency:
  group: "image-${{ github.sha }}"
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/jc
jobs:
  build:
    # A green ci of a push to main in this repository, on the commit main still points at.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_sha == github.sha &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write }
    timeout-minutes: 150
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sh .github/scripts/free-disk.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      # Into the runner's docker first and started there, so only an image that answers is pushed;
      # the push below is the same build again, every layer a cache hit.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: bins/jc/Dockerfile
          build-args: JC_COMMIT=${{ github.sha }}
          load: true
          tags: jc-local:smoke
          cache-from: type=gha,scope=jc
          cache-to: type=gha,mode=max,scope=jc
      - name: jc --role all starts as nonroot on a read-only root filesystem and every mount answers
        run: sh .github/scripts/image-smoke.sh jc-local:smoke
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: bins/jc/Dockerfile
          build-args: JC_COMMIT=${{ github.sha }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:${{ github.ref_name == 'main' && 'main' || format('ref-{0}', github.run_number) }}
          cache-from: type=gha,scope=jc
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - run: cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"
      - run: echo "jc digest ${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
