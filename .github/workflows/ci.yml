name: ci
# The monorepo's gate: fmt, clippy -D warnings and cargo test (--locked) per workspace, the
# Portal UI build, cargo deny + cargo audit, gitleaks over the pushed range and actionlint.
# Four Cargo workspaces live here: the root (bins/jc and the modules it links) and the nested
# crates/antares, crates/ekiben and crates/portal, each with its own lockfile; each is its own job.
# Jobs are gated by the paths changed since the base (`changes`): a docs-only change runs only
# `changes` (gitleaks runs in it). A dispatch runs every job (the repository is private and its
# minutes are metered, so there is no schedule; to put one back: `schedule: [{ cron: "7 2 * * *" }]`).
#
# A push to main ships (ship-proof/** behaves like main, for measuring the pipeline without
# touching main): `image` (image.yml, mode build) compiles the release binary and pushes the image
# unsigned as soon as `changes` ran, `scan` (image-scan.yml) scans it while the tests still run,
# and `promote` signs it only when every gate here and the scan passed; deploy-pin.yml then pins
# the signed digest for dev. clippy and the tests of a workspace are separate jobs, so the two
# builds run side by side; caches (.github/actions/rust) are written by jc-portal-1 (the default
# branch, whose caches every branch reads), main and ship-proof/** only.
on:
  pull_request:
  push:
    branches: [main, "jc-*", "agent/**", "ship-proof/**"]
  workflow_dispatch:
permissions: { contents: read }
# A superseded branch run is cancelled; a main, jc-portal-1 (the merge branch) or ship-proof run never
# is: each merged head gets its own verdict and writes the cache.
concurrency:
  group: "ci-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/jc-portal-1' || startsWith(github.ref, 'refs/heads/ship-proof/')) && github.sha || github.ref }}"
  cancel-in-progress: ${{ !(github.ref == 'refs/heads/main' || github.ref == 'refs/heads/jc-portal-1' || startsWith(github.ref, 'refs/heads/ship-proof/')) }}
env:
  CARGO_TERM_COLOR: always
  # Debuginfo off: the Portal's test binaries and jc's link everything; with line tables the
  # runner's disk and memory run out before a test starts (KNOWLEDGE: portal lib test ~6 GB).
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reads this commit's other ci runs (changes.sh REUSE).
    permissions: { contents: read, actions: read }
    outputs:
      root: ${{ steps.paths.outputs.root }}
      antares: ${{ steps.paths.outputs.antares }}
      ekiben: ${{ steps.paths.outputs.ekiben }}
      portal: ${{ steps.paths.outputs.portal }}
      ui: ${{ steps.paths.outputs.ui }}
      supply: ${{ steps.paths.outputs.supply }}
      platform: ${{ steps.paths.outputs.platform }}
      workflows: ${{ steps.paths.outputs.workflows }}
      image: ${{ steps.paths.outputs.image }}
      dockerfiles: ${{ steps.paths.outputs.dockerfiles }}
      ship: ${{ steps.paths.outputs.ship }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - id: release
        run: echo "release=${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ship-proof/')) }}" >> "$GITHUB_OUTPUT"
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          REUSE: ${{ steps.release.outputs.release == 'true' && '1' || '0' }}
          GH_TOKEN: ${{ github.token }}
        run: sh .github/scripts/changes.sh
      # The checks that need no build ride in this job (one runner slot, not four): gitleaks over
      # every commit this push or pull request brings (not the repository's history: the imported
      # trees carry upstream test vectors their own repositories allow-list); actionlint when a
      # workflow changed; the App bundles both images ship in /srv/apps, from the same sources,
      # when a Dockerfile or an App changed.
      - env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          BRANCH: ${{ github.ref_name }}
        run: sh .github/scripts/gitleaks.sh
      - if: steps.paths.outputs.workflows == 'true'
        run: sh .github/scripts/changes.sh --selftest && sh .github/scripts/deploy-pin.sh --selftest && python3 .github/scripts/test-part.py --selftest && sh .github/scripts/cache-prune.sh --selftest && sh .github/scripts/check-build-context.sh --selftest && sh .github/scripts/check-build-context.sh
      - if: steps.paths.outputs.workflows == 'true'
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color
      - if: steps.paths.outputs.dockerfiles == 'true'
        working-directory: crates/portal
        run: |
          python3 scripts/ci/check-dockerfile-members.py --selftest
          python3 scripts/ci/check-dockerfile-members.py
          python3 scripts/ci/check-dockerfile-members.py --apps Dockerfile ../../bins/jc/Dockerfile
  # The root workspace: every module crate and bins/jc, which links Antares, ekiben and the Portal
  # by path, so a change in any of them reaches it.
  root-clippy:
    needs: changes
    if: needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust
        with: { key: root-clippy, components: "clippy, rustfmt" }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  # Postgres for the store tests of each module (each its own database; kaisatsu and the Portal's
  # apps tests create their own roles). nextest runs the binaries side by side; the tests sharing
  # one module's database stay one at a time (.config/nextest.toml). The tests are split in
  # three jobs (two took 333 s of tests each, run 42616261654), each with its own Postgres: every job compiles the same warm build (no archive to
  # upload and download) and runs its partition of the tests, balanced by the times
  # .github/ci-durations.json records (test-part.py --nextest; a test with no recorded time still
  # lands in exactly one); the first also runs the doc tests, which the split counts. The
  # partition job names are listed in changes.sh (covered).
  root-test:
    name: root-test-${{ matrix.part }}
    needs: changes
    if: needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: { part: [1, 2, 3] }
    services:
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      KAISATSU_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/kaisatsu
      DATAROOM_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/dataroom
      DAIYA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/daiya
      SHAKO_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/shako
      # The assistant's store wants pgvector: the server the step below starts.
      JC_ASSISTANT_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5433/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The assistant (vendor/joinedcontext-platform/crates/assistant), as the platform's ci-full
      # runs it: the PDFium kreuzberg links, pinned and checked (without it kreuzberg's build
      # fetches whatever release is newest, unchecked), the embedding model and the ONNX Runtime
      # its tests load, each checked against its SHA-256.
      - run: |
          sh vendor/joinedcontext-platform/scripts/ci/pdfium.sh "$RUNNER_TEMP/pdfium"
          sh vendor/joinedcontext-platform/scripts/ci/e5-small.sh "$RUNNER_TEMP/e5-small"
          sh vendor/joinedcontext-platform/scripts/ci/onnxruntime.sh "$RUNNER_TEMP/onnxruntime"
          {
            echo "KREUZBERG_PDFIUM_PREBUILT=$RUNNER_TEMP/pdfium"
            echo "JC_ASSISTANT_TEST_MODEL_DIR=$RUNNER_TEMP/e5-small"
            echo "ORT_DYLIB_PATH=$RUNNER_TEMP/onnxruntime/libonnxruntime.so"
          } >> "$GITHUB_ENV"
      # The cluster's own PostgreSQL image (pgvector 0.8.6, pinned in deployment's
      # components/postgres/images.yaml). It has no entrypoint of its own (CloudNativePG drives
      # it), so the step initialises and starts it.
      - run: >-
          docker run -d --name assistant-pg -p 5433:5432 --entrypoint bash
          ghcr.io/cloudnative-pg/postgis@sha256:9d597fcf4350e4bae9ff40cbe0e4383746a9c7f9c60da72483b0e966e4c20765
          -c 'export PATH=/usr/lib/postgresql/16/bin:$PATH; initdb -D /tmp/pg -U postgres --auth=trust >/dev/null
          && echo "host all all 0.0.0.0/0 trust" >> /tmp/pg/pg_hba.conf
          && exec postgres -D /tmp/pg -c listen_addresses=* -c unix_socket_directories=/tmp'
          && for _ in $(seq 1 30); do docker exec assistant-pg /usr/lib/postgresql/16/bin/pg_isready -h 127.0.0.1 -U postgres && break; sleep 1; done
      - run: |
          for db in kaisatsu dataroom daiya shako; do
            psql postgres://postgres:postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE $db"
          done
      - uses: ./.github/actions/rust
        with: { key: root-test }
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with: { tool: cargo-nextest }
      # Build once, then run the slice from the built binaries (no cargo call, so no build lock):
      # job 1 compiles and runs the doc tests beside it instead of after it (1-2 min when a crate
      # every lib links changed, run 42617984832).
      - run: |
          cargo nextest list --workspace --locked --profile ci --timings --list-type binaries-only --message-format json > "$RUNNER_TEMP/binaries.json"
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
          doc=
          if [ "${{ matrix.part }}" = 1 ]; then
            cargo test --workspace --locked --no-fail-fast --doc > "$RUNNER_TEMP/doc.log" 2>&1 & doc=$!
          fi
          # the doc build beside the first job's tests slowed them by up to 1.7x (run 42756711313)
          python3 .github/scripts/test-part.py --nextest root ${{ matrix.part }} ${{ strategy.job-total }} --extra 1=45 \
            --reuse "$RUNNER_TEMP/binaries.json" "$RUNNER_TEMP/cargo-metadata.json" > "$RUNNER_TEMP/part.txt"
          set --; while IFS= read -r term; do set -- "$@" -E "$term"; done < "$RUNNER_TEMP/part.txt"
          tests=0
          cargo nextest run --profile ci --no-fail-fast \
            --binaries-metadata "$RUNNER_TEMP/binaries.json" --cargo-metadata "$RUNNER_TEMP/cargo-metadata.json" "$@" || tests=$?
          docs=0
          if [ -n "$doc" ]; then
            wait "$doc" || docs=$?
            echo "::group::doc tests (exit $docs)"; cat "$RUNNER_TEMP/doc.log"; echo "::endgroup::"
            [ "$docs" = 0 ] || echo "::error::doc tests failed (exit $docs)"
          fi
          [ "$tests" = 0 ] && [ "$docs" = 0 ]
      - if: always()
        run: du -sh target/debug/deps
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with: { name: "junit-root-${{ matrix.part }}", path: target/nextest/ci/junit.xml, if-no-files-found: ignore, retention-days: 7 }
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with: { name: "timings-${{ github.job }}-${{ strategy.job-index }}", path: "**/target/cargo-timings/cargo-timing.html", if-no-files-found: ignore, retention-days: 7 }
  # The platform crates vendored under vendor/joinedcontext-platform (context-gateway, jc-core,
  # jcctl and the rest the Portal links): path dependencies of the root build, not members, so
  # root-test runs none of their tests. Their own workspace, whose Cargo.lock repeats the root
  # lockfile's versions (lock-subset.py) and whose ngsild is jc's: of the platform's fast lane,
  # every member's lib and bins, context-gateway's `it` binary and jcctl's Portal API drift test;
  # `cargo test`, as there (in-process locks). jc-core's `it` compares the platform repository's
  # committed schemas and examples, which are not vendored. Beside root-test, so the run does not
  # get longer. The assistant is a root member (root-test).
  platform-test:
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: vendor/joinedcontext-platform } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 ../../.github/scripts/lock-subset.py ../../Cargo.lock Cargo.lock
      - uses: ./.github/actions/rust
        with: { workspace: vendor/joinedcontext-platform, key: platform-test }
      - run: cargo test --workspace --locked --no-fail-fast --lib --bins
      - run: cargo test --locked --no-fail-fast -p context-gateway --test it
        env: { DCAT_RECORDS_DIR: "${{ runner.temp }}/dcat-records" }
      - run: "cargo test --locked --no-fail-fast -p jcctl --test it portal_api_drift_tests::"
  antares-clippy:
    needs: changes
    if: needs.changes.outputs.antares == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: crates/antares } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust
        with: { workspace: crates/antares, key: antares-clippy, components: "clippy, rustfmt" }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  # nextest with Antares' own groups (crates/antares/.config/nextest.toml), in three jobs, each
  # with its own PostGIS: the first builds and runs only pg_explain, then the view matrix and the
  # doc tests; the other two run every other test, split by the times .github/ci-durations.json
  # records (test-part.py --nextest). pg_explain seeds 200 000
  # Entities and ANALYZEs them in one transaction held for about a minute, once per database:
  # beside every slice it deadlocked a concurrent index build and timed out a week partition's DDL
  # in two of three jobs (run 42610186767).
  antares-test:
    name: antares-test-${{ matrix.part }}
    needs: changes
    if: needs.changes.outputs.antares == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: { part: [1, 2, 3] }
    defaults: { run: { working-directory: crates/antares } }
    services:
      postgis:
        # The major dev and prod run, as Antares' own workspace.yml pins it.
        image: postgis/postgis:16-3.6@sha256:d07ce3f06f657b6516c7511412232e97174d7e9dcf4c9fe520109b682b44a201
        env: { POSTGRES_USER: antares, POSTGRES_PASSWORD: antares, POSTGRES_DB: antares }
        # Below 32768, out of the ephemeral range outbound sockets take (Antares workspace.yml).
        ports: ["15432:5432"]
        # 1 GB /dev/shm: nextest runs the pg tests side by side and a parallel VACUUM or index build
        # outgrows docker's 64 MB ("could not resize shared memory segment", pg_explain).
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U antares" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ANTARES_TEST_DATABASE_URL: postgresql://antares:antares@localhost:15432/antares
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust
        with: { workspace: crates/antares, key: antares-test }
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with: { tool: cargo-nextest }
      # --test: only pg_explain's binary is built (--workspace keeps the workspace's features)
      - if: matrix.part == 1
        run: cargo nextest run --workspace --locked --profile ci --timings --no-fail-fast --test pg_explain -E 'binary(pg_explain)'
      - if: matrix.part != 1
        run: |
          cargo nextest list --workspace --locked --profile ci --timings --list-type binaries-only --message-format json > "$RUNNER_TEMP/binaries.json"
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
          python3 ../../.github/scripts/test-part.py --nextest antares $(( ${{ matrix.part }} - 1 )) 2 \
            --filter 'not binary(pg_explain)' --reuse "$RUNNER_TEMP/binaries.json" "$RUNNER_TEMP/cargo-metadata.json" > "$RUNNER_TEMP/part.txt"
          set --; while IFS= read -r term; do set -- "$@" -E "$term"; done < "$RUNNER_TEMP/part.txt"
          cargo nextest run --profile ci --no-fail-fast \
            --binaries-metadata "$RUNNER_TEMP/binaries.json" --cargo-metadata "$RUNNER_TEMP/cargo-metadata.json" "$@"
      # The view and policy matrix compiles only with `full,jc-policy` (no member turns them on):
      # jc's own feature set (bins/jc/Cargo.toml antares-broker), so each view sees only its own
      # data through the shared Router and an unvouched subject is refused (T-6677, F-01).
      - if: matrix.part == 1
        run: cargo nextest run --locked --profile ci -p antares-broker --features full,jc-policy,linkml,ical,feed,parquet,tabular --test views_matrix
      - if: matrix.part == 1
        run: cargo test --workspace --locked --no-fail-fast --doc
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with: { name: "junit-antares-${{ matrix.part }}", path: crates/antares/target/nextest/ci/junit.xml, if-no-files-found: ignore, retention-days: 7 }
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with: { name: "timings-${{ github.job }}-${{ strategy.job-index }}", path: "**/target/cargo-timings/cargo-timing.html", if-no-files-found: ignore, retention-days: 7 }
  ekiben:
    needs: changes
    if: needs.changes.outputs.ekiben == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: crates/ekiben } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust
        with: { workspace: crates/ekiben, key: ekiben, components: "clippy, rustfmt" }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
  portal-clippy:
    needs: changes
    if: needs.changes.outputs.portal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: crates/portal } }
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust
        with: { workspace: crates/portal, key: portal-clippy, components: "clippy, rustfmt" }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  # cargo test, not nextest: the Portal's database tests serialize on in-process locks
  # (KNOWLEDGE: the DATABASE mutex), which separate processes would not hold. The test binaries
  # are split in four jobs, each with its own Postgres (.github/scripts/test-part.py: every
  # tests/*.rs by its recorded build and run time in .github/ci-durations.json, the libs and bins
  # in the first, the doc tests in the second); binaries of one job still run one after another,
  # as before. The partition job names are listed in changes.sh (covered).
  portal-test:
    name: portal-test-${{ matrix.part }}
    needs: changes
    if: needs.changes.outputs.portal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: { part: [1, 2, 3, 4] }
    defaults: { run: { working-directory: crates/portal } }
    services:
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      JC_PORTAL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/portal
      # A server whose user may create roles and databases (tests/common/apps_db.rs).
      JC_APPS_DB_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      JC_WASM_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      # Two jobs: one Portal test binary links in ~6 GB, the runner has 7 GB.
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: psql postgres://postgres:postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE portal"
      # The Portal's lib test binary peaks above the runner's 7.9 GB beside a second rustc (measured
      # 7889/7931 MB before the runner was shut down, run 42523032193): 8 GB of swap lets the peak
      # spill instead of losing the runner.
      - run: |
          sudo fallocate -l 8G /swap-portal && sudo chmod 600 /swap-portal
          sudo mkswap /swap-portal >/dev/null && sudo swapon /swap-portal && swapon --show
      - uses: ./.github/actions/rust
        with: { workspace: crates/portal, key: portal-test }
      # Memory and disk once a minute: a runner that runs out of either ends the step with 143 and
      # no error line.
      - run: |
          (while sleep 60; do echo "$(date -u +%T) $(free -m | awk '/Mem/ {print "mem used " $3 "/" $2 " MB"}') $(df -h / | awk 'NR == 2 {print "disk free " $4}')"; done) &
          # -j 4: the runner's four cores for the link phase (~160 test binaries); a flag, not
          # CARGO_BUILD_JOBS, which is part of the rust-cache key
          targets=$(python3 ../../.github/scripts/test-part.py ${{ matrix.part }} ${{ strategy.job-total }} --doc 2)
          # shellcheck disable=SC2086
          cargo test --workspace --locked --no-fail-fast -j 4 --timings $targets
      # in the second job: the first runs the lib tests and compiles the lib's test build
      - if: matrix.part == 2
        run: cargo test --workspace --locked --no-fail-fast --doc
      - if: always()
        run: du -sh target/debug/deps
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with: { name: "timings-${{ github.job }}-${{ strategy.job-index }}", path: "**/target/cargo-timings/cargo-timing.html", if-no-files-found: ignore, retention-days: 7 }
  # The bundles the jc image embeds: a UI that does not build ships the placeholder page.
  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: crates/portal } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { package_json_file: crates/portal/ui/package.json }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - run: cd sdk && pnpm install --frozen-lockfile && pnpm build
      - run: cd ui && pnpm install --frozen-lockfile
      - run: cd ui && pnpm lint
      - run: cd ui && pnpm build && test -s dist/index.html
      # The SDK's own suite (the standalone Portal's sdk job, about 70 s): it reads only sdk/.
      - run: cd sdk && pnpm vitest run
  # The whole UI vitest in four shards (vitest --shard splits the files: every file once, in one
  # of them), as the standalone Portal ran it. The ui job above ran none of it, so a branch went
  # green with 46 red files (jc-multiorg-portal 42601018361, merged as 12aa4b3e). Shard job names
  # are listed in changes.sh (covered).
  ui-test:
    name: ui-test-${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3, 4] }
    defaults: { run: { working-directory: crates/portal } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { package_json_file: crates/portal/ui/package.json }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      # The UI links the SDK's sources and build.
      - run: cd sdk && pnpm install --frozen-lockfile && pnpm build
      - run: cd ui && pnpm install --frozen-lockfile
      - run: cd ui && pnpm vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }}
  # Advisories, licenses, bans and sources of every lockfile, one job for the four workspaces (one
  # runner slot of the account's 20, not four): each workspace runs deny and audit whatever the one
  # before it answered, and the job fails if any of them did. Each workspace reads its own deny.toml
  # and .cargo/audit.toml; the root ignores only what crates/portal ignores (deny.toml's header).
  supply-chain:
    needs: changes
    if: needs.changes.outputs.supply == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with: { tool: "cargo-audit,cargo-deny" }
      - run: |
          red=
          for dir in . crates/antares crates/ekiben crates/portal; do
            echo "::group::cargo deny $dir"
            (cd "$dir" && cargo deny --locked check advisories bans licenses sources) || red="$red deny:$dir"
            echo "::endgroup::"
            echo "::group::cargo audit $dir"
            (cd "$dir" && cargo audit) || red="$red audit:$dir"
            echo "::endgroup::"
          done
          if [ -n "$red" ]; then echo "::error::red:$red"; exit 1; fi
  # A branch that changes the Dockerfile or its ignore file: the full `docker build` (every stage,
  # no push), which the shipped image skips by handing in its compiled binary.
  # It reads the layer cache (scope jc) and, through the Actions cache token handed in as build
  # secrets, the sccache the Dockerfile's cargo builds use; both are written only by
  # dockerfile-cache.yml on every jc-portal-1 push (the default branch, whose caches every branch
  # reads; without a writer every branch built cold: 39 min, runs 42617814130 and 42611953211). This
  # job writes neither (sccache READ_ONLY), so no branch evicts those entries.
  dockerfile:
    needs: changes
    if: needs.changes.outputs.image == 'true' && needs.changes.outputs.release != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sh .github/scripts/check-build-context.sh
      - run: sh .github/scripts/free-disk.sh --wait
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # Exports ACTIONS_RESULTS_URL and ACTIONS_RUNTIME_TOKEN to the steps after it (the build's
      # secrets); the sccache it installs on the runner is not used.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with: { version: v0.18.0 }
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        env: { SCCACHE_GHA_RW_MODE: READ_ONLY }
        with:
          context: .
          file: bins/jc/Dockerfile
          push: false
          cache-from: type=gha,scope=jc
          secret-envs: |
            ACTIONS_RUNTIME_TOKEN=ACTIONS_RUNTIME_TOKEN
            ACTIONS_RESULTS_URL=ACTIONS_RESULTS_URL
            SCCACHE_GHA_RW_MODE=SCCACHE_GHA_RW_MODE
  # main and ship-proof/** only, from here on.
  image:
    needs: changes
    if: needs.changes.outputs.release == 'true' && needs.changes.outputs.ship == 'true'
    # image.yml's sign job (skipped in mode build) asks id-token: a caller grants what every job of
    # a called workflow asks, run or not.
    permissions: { contents: read, packages: write, id-token: write }
    uses: ./.github/workflows/image.yml
    with: { mode: build }
  scan:
    needs: image
    permissions: { contents: read, packages: write, id-token: write }
    uses: ./.github/workflows/image-scan.yml
    with: { digest: "${{ needs.image.outputs.digest }}" }
  # Signs the digest once every gate that ran passed and the scan did: the signature is what makes
  # it deployable (deployment verify-pinned-images.py). A skipped gate is one this push's paths
  # do not reach, or one another run of this commit passed (changes.sh REUSE).
  promote:
    needs: [changes, root-clippy, root-test, platform-test, antares-clippy, antares-test, ekiben, portal-clippy, portal-test, ui, ui-test, supply-chain, image, scan]
    if: >-
      always() && needs.image.result == 'success' && needs.scan.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    permissions: { contents: read, packages: write, id-token: write }
    uses: ./.github/workflows/image.yml
    with: { mode: sign, digest: "${{ needs.image.outputs.digest }}" }
