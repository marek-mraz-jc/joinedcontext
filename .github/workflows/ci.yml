name: ci
# The monorepo's gate: fmt, clippy -D warnings and cargo test (--locked) per workspace, the
# Portal UI build, cargo deny + cargo audit, gitleaks over the pushed range and actionlint.
# Four Cargo workspaces live here: the root (bins/jc and the modules it links) and the nested
# crates/antares, crates/ekiben and crates/portal, each with its own lockfile; each is its own job.
# Jobs are gated by the paths changed since the base (`changes`): a docs-only change runs only
# `changes` (gitleaks runs in it). A dispatch runs every job. There is no schedule (to put one
# back: `schedule: [{ cron: "7 2 * * *" }]`). The repository is public: its standard runners have
# 4 cores (root-test prints nproc) and cost no minutes, but the account runs at most 20 jobs at
# once across its repositories, so each job here takes a slot from the others.
#
# A push to main ships (ship-proof/** behaves like main, for measuring the pipeline without
# touching main): `image` (image.yml, mode build) compiles the release binary and pushes the image
# unsigned as soon as `changes` ran, `scan` (image-scan.yml) scans it while the tests still run,
# and `promote` signs it only when every gate here and the scan passed; deploy-pin.yml then pins
# the signed digest for dev. clippy and the tests of a workspace are separate jobs, so the two
# builds run side by side; caches (.github/actions/rust) are written by jc-portal-1 (the default
# branch, whose caches every branch reads), main and ship-proof/** only.
on:
  pull_request:
  push:
    branches: [main, "jc-*", "agent/**", "ship-proof/**"]
  workflow_dispatch:
permissions: { contents: read }
# A superseded branch run is cancelled; a main, jc-portal-1 (the merge branch) or ship-proof run never
# is: each merged head gets its own verdict and writes the cache.
concurrency:
  group: "ci-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/jc-portal-1' || startsWith(github.ref, 'refs/heads/ship-proof/')) && github.sha || github.ref }}"
  cancel-in-progress: ${{ !(github.ref == 'refs/heads/main' || github.ref == 'refs/heads/jc-portal-1' || startsWith(github.ref, 'refs/heads/ship-proof/')) }}
env:
  CARGO_TERM_COLOR: always
  # Debuginfo off: the Portal's test binaries and jc's link everything; with line tables the
  # runner's disk and memory run out before a test starts (KNOWLEDGE: portal lib test ~6 GB).
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reads this commit's other push runs of ci.yml in this repository (changes.sh REUSE).
    permissions: { contents: read, actions: read }
    outputs:
      root: ${{ steps.paths.outputs.root }}
      antares: ${{ steps.paths.outputs.antares }}
      ekiben: ${{ steps.paths.outputs.ekiben }}
      portal: ${{ steps.paths.outputs.portal }}
      ui: ${{ steps.paths.outputs.ui }}
      supply: ${{ steps.paths.outputs.supply }}
      platform: ${{ steps.paths.outputs.platform }}
      workflows: ${{ steps.paths.outputs.workflows }}
      image: ${{ steps.paths.outputs.image }}
      dockerfiles: ${{ steps.paths.outputs.dockerfiles }}
      deploy: ${{ steps.paths.outputs.deploy }}
      ship: ${{ steps.paths.outputs.ship }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - id: release
        run: echo "release=${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ship-proof/')) }}" >> "$GITHUB_OUTPUT"
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          # Every push: a job that passed in another push run of this commit is not run again;
          # image, scan, promote and ship-apps are no reused key and always run on main.
          REUSE: ${{ github.event_name == 'push' && '1' || '0' }}
          GH_TOKEN: ${{ github.token }}
        run: sh .github/scripts/changes.sh
      # The checks that need no build ride in this job (one runner slot, not four): gitleaks over
      # every commit this push or pull request brings (not the repository's history: the imported
      # trees carry upstream test vectors their own repositories allow-list); actionlint when a
      # workflow changed; the App bundles both images ship in /srv/apps, from the same sources,
      # when a Dockerfile or an App changed.
      - env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          BRANCH: ${{ github.ref_name }}
        run: sh .github/scripts/gitleaks.sh
      # The second line behind the board's pre-push public check (docs/Deployment/01-repository-layout.md
      # §4): no server address, age recipient, sops value or tfvars file in the deployment code.
      - if: steps.paths.outputs.deploy == 'true'
        run: python3 deploy/ci/public-check.py deploy .gitleaksignore
      # The T-6676 R cleanup tool's selftests against a stub gateway (stdlib, seconds).
      - run: python3 -m unittest discover -s bins/jc/deploy/minted-cleanup
      # Every security-review row and every threat-model STRIDE row names a test that exists
      # (stdlib, seconds).
      - run: python3 .github/scripts/security-review-tests.py --selftest && python3 .github/scripts/security-review-tests.py
      - run: python3 crates/antares/dev/threat-tests.py --self-test && python3 crates/antares/dev/threat-tests.py
      - if: steps.paths.outputs.workflows == 'true'
        run: sh .github/scripts/changes.sh --selftest && sh .github/scripts/deploy-pin.sh --selftest && python3 .github/scripts/test-part.py --selftest && sh .github/scripts/cache-prune.sh --selftest && sh .github/scripts/free-disk.sh --selftest && sh .github/scripts/check-build-context.sh --selftest && sh .github/scripts/check-build-context.sh
      - if: steps.paths.outputs.workflows == 'true'
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color
      - if: steps.paths.outputs.dockerfiles == 'true'
        working-directory: crates/portal
        run: |
          python3 scripts/ci/check-dockerfile-members.py --selftest
          python3 scripts/ci/check-dockerfile-members.py
          python3 scripts/ci/check-dockerfile-members.py --apps Dockerfile ../../bins/jc/Dockerfile
  # The deployment code in deploy/ (T-6986, docs/Deployment/01-repository-layout.md), ported from the
  # deployment repository's ci.yml: deploy-changes picks the tests that read the changed files and the
  # environments to render (deploy/scripts/ci/changes.py), deploy-render renders and gates them,
  # deploy-tests runs the picked test files in shards. Public examples only: this repository and its
  # logs are public, so the private environments render and run their tests on the host (the board's
  # branch check and the deployer's apply), never here.
  deploy-changes:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults: { run: { working-directory: deploy } }
    outputs:
      full: ${{ steps.scope.outputs.full }}
      tests: ${{ steps.scope.outputs.tests }}
      envs: ${{ steps.scope.outputs.envs }}
      pins: ${{ steps.scope.outputs.pins }}
      cluster: ${{ steps.scope.outputs.cluster }}
      shards: ${{ steps.scope.outputs.shards }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/ci/changes.py "$BASE" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"
  deploy-render:
    needs: deploy-changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults: { run: { working-directory: deploy } }
    env:
      RENDER_ENVS: ${{ needs.deploy-changes.outputs.envs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/deploy-tools
      - name: kubeconform, conftest, gitleaks
        run: |
          set -eu
          curl --fail --retry 3 --retry-all-errors -sSLo kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_CHECKSUM}  kubeconform.tar.gz" | sha256sum --check --status
          tar xzf kubeconform.tar.gz kubeconform
          curl --fail --retry 3 --retry-all-errors -sSLo conftest.tar.gz "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          echo "${CONFTEST_CHECKSUM}  conftest.tar.gz" | sha256sum --check --status
          tar xzf conftest.tar.gz conftest
          curl --fail --retry 3 --retry-all-errors -sSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_CHECKSUM}  gitleaks.tar.gz" | sha256sum --check --status
          tar xzf gitleaks.tar.gz gitleaks
          rm -f kubeconform.tar.gz conftest.tar.gz gitleaks.tar.gz
      - name: helm lint every local chart
        # T-4956: lint plus values.schema.json against the chart's defaults, with its
        # ci/lint-values.yaml where the bare chart needs one; a chart vendored under another
        # chart's charts/ is upstream's and left out.
        run: |
          set -eu
          git ls-files '*Chart.yaml' | awk -F/ '{n=0; for (i=1;i<=NF;i++) if ($i=="charts") n++; if (n<=1) print}' \
            | xargs -n1 dirname | while read -r chart; do
                if [ -f "${chart}/ci/lint-values.yaml" ]; then helm lint --quiet "${chart}" -f "${chart}/ci/lint-values.yaml"
                else helm lint --quiet "${chart}"; fi
              done
      - run: just _dev-assemble
      - name: render every environment
        # Three at a time (T-5552); the secret gates first, because the renders leave this job as
        # the shards' artifact: what leaves holds only generated values, no plaintext secret.
        run: |
          set -eu
          mkdir -p /tmp/scan
          # R1/R2: every remote chart pinned exactly in the file a reader sees, no helmfile.lock.
          python3 scripts/ci/check-chart-pins.py --no-lock .
          helmfile -f ci/kyverno/helmfile.yaml.gotmpl list --output json | python3 scripts/ci/check-chart-pins.py -
          read -ra environments <<< "${RENDER_ENVS:-$(tr '\n' ' ' < ci/golden/ENVIRONMENTS)}"
          echo "::group::render ${environments[*]}"
          RENDER_JOBS=3 scripts/render-all.sh rendered "${environments[@]}"
          echo "::endgroup::"
          for env in "${environments[@]}"; do
            python3 scripts/check-rendered-secrets.py "rendered/${env}.yaml" /tmp/scan/rendered.yaml
            ./gitleaks detect --no-git --source /tmp/scan --config ci/gitleaks-rendered.toml --redact --exit-code 1
            python3 scripts/check-secrets.py "rendered/${env}.yaml"
          done
          printf '%s\n' "${GITHUB_SHA}" > rendered/COMMIT
      # The test shards read these instead of rendering the same environments again (T-6111).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deploy-base-renders
          path: |
            deploy/rendered/*.yaml
            deploy/rendered/COMMIT
          retention-days: 1
      - name: gate every environment
        # Per environment: every chart pinned, kubeconform -strict against the CRDs catalog pinned to one
        # commit, every container by digest (OPS-28), the Rego policies (TS-18, TS-19, CC-12), no legacy
        # name, and the objects of ci/golden/<env>.txt (T-4956).
        run: |
          set -eu
          golden_red=""
          read -ra environments <<< "${RENDER_ENVS:-$(tr '\n' ' ' < ci/golden/ENVIRONMENTS)}"
          for env in "${environments[@]}"; do
            echo "::group::${env}"
            cat "rendered/${env}.log"
            helmfile -f deployment/helmfile.yaml -e "${env}" list --output json | python3 scripts/ci/check-chart-pins.py -
            ./kubeconform -strict -kubernetes-version "${KUBERNETES_VERSION}" -skip CustomResourceDefinition -schema-location default -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/${CRDS_CATALOG_COMMIT}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" -summary "rendered/${env}.yaml"
            python3 scripts/ci/check-image-digests.py "rendered/${env}.yaml"
            ./conftest test --all-namespaces -p policies "rendered/${env}.yaml"
            # `! grep` alone never failed the step (errexit ignores a negated command).
            if grep -i -E 'civitas' "rendered/${env}.yaml"; then echo "::error::${env} renders the legacy name civitas"; exit 1; fi
            python3 ci/golden/list-objects.py "rendered/${env}.yaml" | diff -u "ci/golden/${env}.txt" - || golden_red="${golden_red} ${env}"
            echo "::endgroup::"
          done
          if [ -n "${golden_red}" ]; then
            echo "::error::the rendered objects of${golden_red} changed. Review the diff above and run 'just golden-update' in deploy/."
            exit 1
          fi
  deploy-cluster-hetzner:
    # T-6444: the one kube-hetzner module, without a token: nothing reads a Hetzner project.
    needs: deploy-changes
    if: needs.deploy-changes.outputs.cluster == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: deploy } }
    env:
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/deploy-tools
        with: { helmfile: "false" }
      - name: terraform
        run: |
          curl --fail --retry 3 --retry-all-errors -sSLo terraform.zip "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "${TERRAFORM_CHECKSUM}  terraform.zip" | sha256sum --check --status
          unzip -q terraform.zip terraform
          sudo install -m 0755 terraform /usr/local/bin/terraform
          rm -f terraform.zip terraform
      - run: terraform fmt -check -recursive cluster/hetzner
      - run: terraform -chdir=cluster/hetzner/module init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=cluster/hetzner/module validate
  deploy-tests:
    needs: deploy-changes
    if: needs.deploy-changes.outputs.full == 'true' || needs.deploy-changes.outputs.tests != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # actions: read lets a shard download this run's deploy-base-renders artifact (T-6111).
    permissions: { contents: read, actions: read }
    strategy: { fail-fast: false, matrix: { shard: "${{ fromJSON(needs.deploy-changes.outputs.shards) }}" } }
    name: deploy-tests (${{ needs.deploy-changes.outputs.full == 'true' && 'full' || 'scoped' }} ${{ matrix.shard }}/${{ strategy.job-total }})
    defaults: { run: { working-directory: deploy } }
    env:
      # `*` in the full set: every test file (scripts/ci/test-shard.py files)
      JC_TEST_FILES: ${{ needs.deploy-changes.outputs.full == 'true' && '*' || needs.deploy-changes.outputs.tests }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/deploy-tools
      - name: kyverno, sops, age, gitleaks, conftest
        # tests/test_secrets.py round-trips a SOPS-encrypted secret and the policy tests run the Rego
        # gate and the secret ruleset: without these binaries those tests would skip.
        run: |
          set -eu
          curl --fail --retry 3 --retry-all-errors -sSLo kyverno.tar.gz "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          echo "${KYVERNO_CHECKSUM}  kyverno.tar.gz" | sha256sum --check --status
          tar xzf kyverno.tar.gz kyverno && sudo install -m 0755 kyverno /usr/local/bin/kyverno
          curl --fail --retry 3 --retry-all-errors -sSL -o sops "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_CHECKSUM}  sops" | sha256sum --check --status
          sudo install -m 0755 sops /usr/local/bin/sops
          curl --fail --retry 3 --retry-all-errors -sSLo age.tar.gz "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_CHECKSUM}  age.tar.gz" | sha256sum --check --status
          tar xzf age.tar.gz && sudo install -m 0755 age/age age/age-keygen /usr/local/bin/
          curl --fail --retry 3 --retry-all-errors -sSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_CHECKSUM}  gitleaks.tar.gz" | sha256sum --check --status
          tar xzf gitleaks.tar.gz gitleaks && sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          curl --fail --retry 3 --retry-all-errors -sSLo conftest.tar.gz "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          echo "${CONFTEST_CHECKSUM}  conftest.tar.gz" | sha256sum --check --status
          tar xzf conftest.tar.gz conftest && sudo install -m 0755 conftest /usr/local/bin/conftest
          rm -rf kyverno.tar.gz kyverno sops age.tar.gz age gitleaks.tar.gz gitleaks conftest.tar.gz conftest
      - run: pip install --quiet --require-hashes --no-deps -r ci/requirements-tests.txt
      - name: assemble deployment dir and add the chart repos
        run: |
          just _dev-assemble
          helmfile -f deployment/helmfile.yaml -e local repos
          helmfile -f deployment/helmfile.yaml -e production repos
          helmfile -f deployment/helmfile.yaml -e addons repos
      # T-4694, T-5357: the platform commit components/ai/bundle.lock names, the Portal and gateway
      # pins' commits and platform main, for the tests that rebuild the assistant bundle and hold the
      # seed manifests to those commits' jc-core schemas.
      - name: the platform commits of the ai bundle, the Portal and gateway pins and platform main
        run: |
          set -euo pipefail
          sha=$(sed -n 's/^platform: //p' components/ai/bundle.lock)
          portal=$(yq '.portal.portal.commit' components/portal/images.yaml)
          git init -q "$RUNNER_TEMP/portal"
          git -C "$RUNNER_TEMP/portal" fetch -q --depth 1 https://github.com/marek-mraz-jc/joinedcontext-portal "$portal"
          jc_core=$(git -C "$RUNNER_TEMP/portal" show "$portal:Cargo.toml" | sed -n 's/^jc-core = {.*rev = "\([0-9a-f]\{40\}\)".*/\1/p')
          gateway=$(yq '.["context-gateway"].gateway.commit' components/context-gateway/images.yaml)
          git init -q "$RUNNER_TEMP/platform"
          git -C "$RUNNER_TEMP/platform" fetch -q --depth 1 https://github.com/marek-mraz-jc/joinedcontext-platform \
            "$sha" "$jc_core" "$gateway" 5a24c4298689bd21e842511bda8fbf21157b1580 +main:refs/remotes/origin/main
          echo "JC_PLATFORM_DIR=$RUNNER_TEMP/platform" >> "$GITHUB_ENV"
          echo "JC_PORTAL_DIR=$RUNNER_TEMP/portal" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: the pinned images carry our workflows' signatures (T-5564)
        if: needs.deploy-changes.outputs.pins == 'true' && matrix.shard == 1
        run: scripts/verify-pinned-images.py production
      - name: kyverno policy unit tests
        if: matrix.shard == 1
        run: kyverno test ci/policies
      - name: the render job's renders
        # deploy-render uploads them about two minutes in; a shard waits up to four minutes and then
        # renders for itself (tests/conftest.py).
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -u
          dir="$RUNNER_TEMP/base-renders"
          for _ in $(seq 1 24); do
            if gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n deploy-base-renders -D "$dir" 2>/dev/null; then break; fi
            rm -rf "$dir"
            sleep 10
          done
          if [ -f "$dir/COMMIT" ] && [ "$(cat "$dir/COMMIT")" = "$GITHUB_SHA" ]; then
            echo "JC_RENDERED_DIR=$dir" >> "$GITHUB_ENV"
          else
            echo "::warning::no base renders from deploy-render; this shard renders its own"
          fi
      - name: pytest
        env:
          JC_TEST_SHARD: ${{ format('{0}/{1}', matrix.shard, strategy.job-total) }}
        run: |
          files=$(python3 scripts/ci/test-shard.py "${{ matrix.shard }}" "${{ strategy.job-total }}")
          # an empty list would run every file of tests/
          if [ -z "$files" ]; then echo "no test file for this shard (scripts/ci/changes.py, test-shard.py)"; exit 0; fi
          # shellcheck disable=SC2086 # one word per test file
          pytest -q -n auto --dist loadgroup --durations=30 $files
  # The root workspace: every module crate and bins/jc, which links Antares, ekiben and the Portal
  # by path, so a change in any of them reaches it.
  root-clippy:
    needs: changes
    if: needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust
        with: { key: root-clippy, components: "clippy, rustfmt" }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  # Postgres for the store tests of each module (each its own database; kaisatsu and the Portal's
  # apps tests create their own roles). nextest runs the binaries side by side; the tests sharing
  # one module's database stay one at a time (.config/nextest.toml). The tests are split in
  # four jobs (two of three took 333 s of tests each, run 42616261654; with three, one runner's
  # 1.4x slower tests still set the run, 42766258305), each with its own Postgres, by test
  # binary: each job builds and runs only its share of the targets (test-part.py --binaries:
  # `--test x` per integration test name, the lib, bin and example tests as one block, the names
  # of one serial group together, balanced by the build and test times .github/ci-durations.json
  # and cargo --timings record; a target with no recorded time still lands in exactly one).
  # Building every test binary in every job took 2-4 min of the 5-8 (215 uncacheable rustc
  # calls, run 42812938101); the same targets with --workspace compile the same units with the
  # same features (cargo --unit-graph). The heaviest binaries (assistant::chat_tests, 600-800 s
  # of CPU-bound tests, in every job) are built in two or more jobs and their tests split by name
  # (test-part.py --pieces). The first job also runs the
  # doc tests, which the split counts. The partition job names are listed in changes.sh (covered).
  root-test:
    name: root-test-${{ matrix.part }}
    needs: changes
    if: needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: { part: [1, 2, 3, 4] }
    env:
      KAISATSU_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/kaisatsu
      DATAROOM_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/dataroom
      DAIYA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/daiya
      SHAKO_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/shako
      # The assistant's store wants pgvector: the server the step below starts.
      JC_ASSISTANT_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5433/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The assistant (vendor/joinedcontext-platform/crates/assistant), as the platform's ci-full
      # runs it: the PDFium kreuzberg links, pinned and checked (without it kreuzberg's build
      # fetches whatever release is newest, unchecked), the embedding model and the ONNX Runtime
      # its tests load, each checked against its SHA-256.
      - run: |
          sh vendor/joinedcontext-platform/scripts/ci/pdfium.sh "$RUNNER_TEMP/pdfium"
          sh vendor/joinedcontext-platform/scripts/ci/e5-small.sh "$RUNNER_TEMP/e5-small"
          sh vendor/joinedcontext-platform/scripts/ci/onnxruntime.sh "$RUNNER_TEMP/onnxruntime"
          {
            echo "KREUZBERG_PDFIUM_PREBUILT=$RUNNER_TEMP/pdfium"
            echo "JC_ASSISTANT_TEST_MODEL_DIR=$RUNNER_TEMP/e5-small"
            echo "ORT_DYLIB_PATH=$RUNNER_TEMP/onnxruntime/libonnxruntime.so"
          } >> "$GITHUB_ENV"
      # The cluster's own PostgreSQL image (pgvector 0.8.6, pinned in deployment's
      # components/postgres/images.yaml). It has no entrypoint of its own (CloudNativePG drives
      # it), so the step initialises and starts it. Its pull (about 20 s) runs beside the cache
      # restore and the build: the test step waits for it to answer.
      - run: >-
          (docker run -d --name assistant-pg -p 5433:5432 --entrypoint bash
          ghcr.io/cloudnative-pg/postgis@sha256:9d597fcf4350e4bae9ff40cbe0e4383746a9c7f9c60da72483b0e966e4c20765
          -c 'export PATH=/usr/lib/postgresql/16/bin:$PATH; initdb -D /tmp/pg -U postgres --auth=trust >/dev/null
          && echo "host all all 0.0.0.0/0 trust" >> /tmp/pg/pg_hba.conf
          && exec postgres -D /tmp/pg -c listen_addresses=* -c unix_socket_directories=/tmp'
          > "$RUNNER_TEMP/assistant-pg.log" 2>&1 &)
      # The modules' Postgres, started like the assistant's beside the cache restore and the build
      # (as a service container its pull and health checks held every step for 15-19 s, run
      # 42829330070); the test step waits for it and creates the databases.
      - run: >-
          (docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres
          postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
          > "$RUNNER_TEMP/pg.log" 2>&1 &)
      - uses: ./.github/actions/rust
        with: { key: root-test }
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with: { tool: cargo-nextest }
      # Build this job's targets once, then run its tests from the built binaries (no cargo call, so
      # no build lock): job 1 compiles and runs the doc tests beside it instead of after it (1-2 min
      # when a crate every lib links changed, run 42617984832).
      - run: |
          echo "nproc: $(nproc)"
          # the doc build beside the first job's build and tests slowed them by up to 1.7x (runs
          # 42756711313, 42823061257). At 30 s, part 1 still ended 96, 81 and 107 s after the other
          # parts' mean (42903345215, 42904656041, 42905125870; once 56 s before, 42907020038): its
          # tests run slower beside the doc build and then wait 0-62 s for it, so the split counts 120
          plan="root ${{ matrix.part }} ${{ strategy.job-total }} --extra 1=120"
          # shellcheck disable=SC2086
          python3 .github/scripts/test-part.py --binaries $plan > "$RUNNER_TEMP/targets.txt"
          set --; while IFS= read -r arg; do set -- "$@" "$arg"; done < "$RUNNER_TEMP/targets.txt"
          echo "targets: $*"
          cargo nextest list --workspace --locked --profile ci --list-type binaries-only --message-format json "$@" > "$RUNNER_TEMP/binaries.json"
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
          doc=
          if [ "${{ matrix.part }}" = 1 ]; then
            cargo test --workspace --locked --no-fail-fast --doc > "$RUNNER_TEMP/doc.log" 2>&1 & doc=$!
          fi
          for _ in $(seq 1 60); do docker exec assistant-pg /usr/lib/postgresql/16/bin/pg_isready -h 127.0.0.1 -U postgres && break; sleep 1; done
          # the official image answers on TCP only once its init is done; CREATE DATABASE fails the step if it never does
          for _ in $(seq 1 60); do pg_isready -q -h 127.0.0.1 -p 5432 && break; sleep 1; done
          for db in kaisatsu dataroom daiya shako; do
            psql postgres://postgres:postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE $db" || { cat "$RUNNER_TEMP/pg.log"; exit 1; }
          done
          # shellcheck disable=SC2086
          python3 .github/scripts/test-part.py --pieces $plan \
            --reuse "$RUNNER_TEMP/binaries.json" "$RUNNER_TEMP/cargo-metadata.json" > "$RUNNER_TEMP/part.txt"
          set --; while IFS= read -r term; do set -- "$@" -E "$term"; done < "$RUNNER_TEMP/part.txt"
          tests=0
          cargo nextest run --profile ci --no-fail-fast \
            --binaries-metadata "$RUNNER_TEMP/binaries.json" --cargo-metadata "$RUNNER_TEMP/cargo-metadata.json" "$@" || tests=$?
          docs=0
          if [ -n "$doc" ]; then
            wait "$doc" || docs=$?
            echo "::group::doc tests (exit $docs)"; cat "$RUNNER_TEMP/doc.log"; echo "::endgroup::"
            [ "$docs" = 0 ] || echo "::error::doc tests failed (exit $docs)"
          fi
          [ "$tests" = 0 ] && [ "$docs" = 0 ]
      - if: always()
        run: du -sh target/debug/deps 2>/dev/null || echo "no target/debug/deps (cold target cache)"
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with: { name: "junit-root-${{ matrix.part }}", path: target/nextest/ci/junit.xml, if-no-files-found: ignore, retention-days: 7 }
  # The platform crates vendored under vendor/joinedcontext-platform (context-gateway, jc-core,
  # jcctl and the rest the Portal links): path dependencies of the root build, not members, so
  # root-test runs none of their tests. Their own workspace, whose Cargo.lock repeats the root
  # lockfile's versions (lock-subset.py) and whose ngsild is jc's: of the platform's fast lane,
  # every member's lib and bins, context-gateway's `it` binary and jcctl's Portal API drift test;
  # `cargo test`, as there (in-process locks). jc-core's `it` compares the platform repository's
  # committed schemas and examples, which are not vendored. Beside root-test, so the run does not
  # get longer. The assistant is a root member (root-test).
  platform-test:
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: vendor/joinedcontext-platform } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 ../../.github/scripts/lock-subset.py ../../Cargo.lock Cargo.lock
      - uses: ./.github/actions/rust
        with: { workspace: vendor/joinedcontext-platform, key: platform-test }
      - run: cargo test --workspace --locked --no-fail-fast --lib --bins
      - run: cargo test --locked --no-fail-fast -p context-gateway --test it
        env: { DCAT_RECORDS_DIR: "${{ runner.temp }}/dcat-records" }
      - run: "cargo test --locked --no-fail-fast -p jcctl --test it portal_api_drift_tests::"
  antares-clippy:
    needs: changes
    if: needs.changes.outputs.antares == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: crates/antares } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust
        with: { workspace: crates/antares, key: antares-clippy, components: "clippy, rustfmt" }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  # nextest with Antares' own groups (crates/antares/.config/nextest.toml), in four jobs, each
  # with its own PostGIS: the first builds and runs only pg_explain, then the view matrix and the
  # doc tests; the other three run every other test, split by the times .github/ci-durations.json
  # records (test-part.py --nextest; with two, one slow runner set the run: 211 s of tests where
  # 153 s ran the same split, runs 42767791074, 42766258305). pg_explain seeds 200 000
  # Entities and ANALYZEs them in one transaction held for about a minute, once per database:
  # beside every slice it deadlocked a concurrent index build and timed out a week partition's DDL
  # in two of three jobs (run 42610186767).
  antares-test:
    name: antares-test-${{ matrix.part }}
    needs: changes
    if: needs.changes.outputs.antares == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: { part: [1, 2, 3, 4] }
    defaults: { run: { working-directory: crates/antares } }
    services:
      postgis:
        # The major dev and prod run, as Antares' own workspace.yml pins it.
        image: postgis/postgis:16-3.6@sha256:d07ce3f06f657b6516c7511412232e97174d7e9dcf4c9fe520109b682b44a201
        env: { POSTGRES_USER: antares, POSTGRES_PASSWORD: antares, POSTGRES_DB: antares }
        # Below 32768, out of the ephemeral range outbound sockets take (Antares workspace.yml).
        ports: ["15432:5432"]
        # 1 GB /dev/shm: nextest runs the pg tests side by side and a parallel VACUUM or index build
        # outgrows docker's 64 MB ("could not resize shared memory segment", pg_explain).
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U antares" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ANTARES_TEST_DATABASE_URL: postgresql://antares:antares@localhost:15432/antares
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust
        with: { workspace: crates/antares, key: antares-test }
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with: { tool: cargo-nextest }
      # --test: only pg_explain's binary is built (--workspace keeps the workspace's features)
      - if: matrix.part == 1
        run: cargo nextest run --workspace --locked --profile ci --no-fail-fast --test pg_explain -E 'binary(pg_explain)'
      - if: matrix.part != 1
        run: |
          cargo nextest list --workspace --locked --profile ci --list-type binaries-only --message-format json > "$RUNNER_TEMP/binaries.json"
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
          python3 ../../.github/scripts/test-part.py --nextest antares $(( ${{ matrix.part }} - 1 )) $(( ${{ strategy.job-total }} - 1 )) \
            --filter 'not binary(pg_explain)' --reuse "$RUNNER_TEMP/binaries.json" "$RUNNER_TEMP/cargo-metadata.json" > "$RUNNER_TEMP/part.txt"
          set --; while IFS= read -r term; do set -- "$@" -E "$term"; done < "$RUNNER_TEMP/part.txt"
          cargo nextest run --profile ci --no-fail-fast \
            --binaries-metadata "$RUNNER_TEMP/binaries.json" --cargo-metadata "$RUNNER_TEMP/cargo-metadata.json" "$@"
      # The view and policy matrix compiles only with `full,jc-policy` (no member turns them on):
      # jc's own feature set (bins/jc/Cargo.toml antares-broker), so each view sees only its own
      # data through the shared Router and an unvouched subject is refused (T-6677, F-01).
      - if: matrix.part == 1
        run: cargo nextest run --locked --profile ci -p antares-broker --features full,jc-policy,linkml,ical,feed,parquet,tabular --test views_matrix
      - if: matrix.part == 1
        run: cargo test --workspace --locked --no-fail-fast --doc
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with: { name: "junit-antares-${{ matrix.part }}", path: crates/antares/target/nextest/ci/junit.xml, if-no-files-found: ignore, retention-days: 7 }
  ekiben:
    needs: changes
    if: needs.changes.outputs.ekiben == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: crates/ekiben } }
    # The sql parity cases (tests/parity/sql, T-6834) replay against the images Bento's sql
    # integration tests run, at the digests the cases were recorded on.
    services:
      postgres:
        image: postgres@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env: { POSTGRES_USER: testuser, POSTGRES_PASSWORD: testpass, POSTGRES_DB: testdb }
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U testuser" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql@sha256:3819b2b23835c4a73c8b022fafc33c8095c0f81c929a8b7a84613d2fba6c52f5
        env: { MYSQL_ROOT_PASSWORD: testpass, MYSQL_DATABASE: testdb }
        ports: ["33069:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptestpass" --health-interval 5s --health-timeout 5s --health-retries 30
      # amqp_0_9 input (T-7090): rabbitmq 4.1-alpine of 2026-11-05.
      rabbitmq:
        image: rabbitmq@sha256:cd4009416f83d7e5895020cd71b0963f3b8a4dfc3de74bbb6fb3bfe5f81f01e0
        env: { RABBITMQ_DEFAULT_USER: ekiben, RABBITMQ_DEFAULT_PASS: testpass }
        ports: ["56729:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 10s --health-retries 30
      # sftp input (T-7090): atmoz/sftp alpine of 2026-11-06, user city writing /upload.
      sftp:
        image: atmoz/sftp@sha256:c5fb9e4beb8b7054a4c0b65c5e11df47cc20da95ad6002e88aecff62bab06372
        env: { SFTP_USERS: "city:testpass:::upload" }
        ports: ["22229:22"]
      redis:
        image: redis@sha256:a9cc41d6d01da2aa26c219e4f99ecbeead955a7b656c1c499cce8922311b2514 # 7.4.6
        ports: ["63790:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PG_DSN: postgres://testuser:testpass@127.0.0.1:54329/testdb?sslmode=disable
      MY_DSN: root:testpass@tcp(127.0.0.1:33069)/testdb
      AMQP_TEST_URL: amqp://ekiben:testpass@127.0.0.1:56729/%2f
      SFTP_TEST_ADDRESS: 127.0.0.1:22229
      SFTP_TEST_USER: city
      SFTP_TEST_PASSWORD: testpass
      PG_RESET: PGPASSWORD=testpass psql -h 127.0.0.1 -p 54329 -U testuser -d testdb -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public'
      MY_RESET: mysql -h 127.0.0.1 -P 33069 -uroot -ptestpass -e 'DROP DATABASE testdb; CREATE DATABASE testdb'
      # aws_s3 input/output (T-7080/T-7081) against versitygw, which checks SigV4; the bucket is a directory.
      S3_TEST_ENDPOINT: http://127.0.0.1:7070
      S3_TEST_ID: ekibentest
      S3_TEST_SECRET: ekibentestsecret
      S3_TEST_BUCKET: raw
      REDIS_TEST_URL: redis://127.0.0.1:63790/0
      # kafka_franz input (T-7093) against redpanda, started below (a service cannot pass its arguments).
      KAFKA_TEST_BROKERS: 127.0.0.1:19092
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust
        with: { workspace: crates/ekiben, key: ekiben, components: "clippy, rustfmt" }
      - run: >-
          docker run -d --name versitygw -p 7070:7070 -e "ROOT_ACCESS_KEY=$S3_TEST_ID" -e "ROOT_SECRET_KEY=$S3_TEST_SECRET"
          versity/versitygw@sha256:605de57c0cdc297fc5bc905ece592965d542d8df70d6eedf755734c80f2eb797 --port :7070 posix /tmp
          && sleep 2 && docker exec versitygw mkdir -p "/tmp/$S3_TEST_BUCKET"
      # redpanda v25.2.10 of 2025-10-25, one core, advertising the address the tests dial.
      - run: >-
          docker run -d --name redpanda -p 19092:19092
          redpandadata/redpanda@sha256:8f9e1e944ba5ba21c5bd60877d0d267d8ac6e4d07e12509424197deb43c0ada5
          redpanda start --mode dev-container --smp 1 --kafka-addr 0.0.0.0:19092 --advertise-kafka-addr 127.0.0.1:19092
          && for _ in $(seq 30); do docker exec redpanda rpk cluster health --exit-when-healthy --watch=false >/dev/null 2>&1 && break; sleep 2; done
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
      # The inventory gate (T-7054 G-01): every Bento 1.22 name is in ekiben, refused with a
      # reason, or listed missing in tests/parity/missing.json; an ekiben-only name has a reason.
      - run: cargo build --locked --bin ekiben && python3 scripts/parity-inventory.py --ekiben target/debug/ekiben --check
  portal-clippy:
    needs: changes
    if: needs.changes.outputs.portal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: crates/portal } }
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust
        with: { workspace: crates/portal, key: portal-clippy, components: "clippy, rustfmt" }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  # cargo test, not nextest: the Portal's database tests serialize on in-process locks
  # (KNOWLEDGE: the DATABASE mutex), which separate processes would not hold. The test binaries
  # are split in four jobs, each with its own Postgres (.github/scripts/test-part.py: every
  # tests/*.rs by its recorded build and run time in .github/ci-durations.json, the libs and bins
  # in the first, the doc tests in the second); binaries of one job still run one after another,
  # as before. The partition job names are listed in changes.sh (covered).
  portal-test:
    name: portal-test-${{ matrix.part }}
    needs: changes
    if: needs.changes.outputs.portal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: { part: [1, 2, 3, 4] }
    defaults: { run: { working-directory: crates/portal } }
    services:
      # PostGIS: org_backup_tests applies Antares' own migrations (CREATE EXTENSION postgis).
      postgres:
        image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      JC_PORTAL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/portal
      # A server whose user may create roles and databases (tests/common/apps_db.rs).
      JC_APPS_DB_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      JC_WASM_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      # Two jobs: one Portal test binary links in ~6 GB, the runner has 7 GB.
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: psql postgres://postgres:postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE portal"
      # The Portal's lib test binary peaks above the runner's 7.9 GB beside a second rustc (measured
      # 7889/7931 MB before the runner was shut down, run 42523032193): 8 GB of swap lets the peak
      # spill instead of losing the runner.
      - run: |
          sudo fallocate -l 8G /swap-portal && sudo chmod 600 /swap-portal
          sudo mkswap /swap-portal >/dev/null && sudo swapon /swap-portal && swapon --show
      - uses: ./.github/actions/rust
        with: { workspace: crates/portal, key: portal-test }
      # Memory and disk once a minute: a runner that runs out of either ends the step with 143 and
      # no error line.
      - run: |
          (while sleep 60; do echo "$(date -u +%T) $(free -m | awk '/Mem/ {print "mem used " $3 "/" $2 " MB"}') $(df -h / | awk 'NR == 2 {print "disk free " $4}')"; done) &
          # -j 4: the runner's four cores for the link phase (~160 test binaries); a flag, not
          # CARGO_BUILD_JOBS, which is part of the rust-cache key
          targets=$(python3 ../../.github/scripts/test-part.py ${{ matrix.part }} ${{ strategy.job-total }} --doc 2)
          # shellcheck disable=SC2086
          cargo test --workspace --locked --no-fail-fast -j 4 $targets
      # in the second job: the first runs the lib tests and compiles the lib's test build
      - if: matrix.part == 2
        run: cargo test --workspace --locked --no-fail-fast --doc
      - if: always()
        run: du -sh target/debug/deps 2>/dev/null || echo "no target/debug/deps (cold target cache)"
  # The bundles the jc image embeds: a UI that does not build ships the placeholder page.
  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: crates/portal } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { package_json_file: crates/portal/ui/package.json }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - run: cd sdk && pnpm install --frozen-lockfile && pnpm build
      # The OData client's types are generated from the org-admin $metadata snapshot, which the
      # Portal's test sdk_metadata_snapshot_is_the_org_admins_metadata keeps current (T-6816).
      - run: cd sdk && node scripts/odata-gen.mjs --check
      - run: cd ui && pnpm install --frozen-lockfile
      - run: cd ui && pnpm lint
      # `pnpm build` also writes the open-data explorer, the Portal's grid in one bundle, which jc
      # embeds from dist-explorer (bins/jc/src/modules/viz.rs): one grid, never a committed copy (T-6739, T-7102).
      - run: cd ui && pnpm build && test -s dist/index.html && test -s dist-explorer/explorer.js && test -s dist-explorer/explorer.css
      # The SDK's own suite (the standalone Portal's sdk job, about 70 s): it reads only sdk/.
      - run: cd sdk && pnpm vitest run
  # The whole UI vitest in four shards (vitest --shard splits the files: every file once, in one
  # of them), as the standalone Portal ran it. The ui job above ran none of it, so a branch went
  # green with 46 red files (jc-multiorg-portal 42601018361, merged as 12aa4b3e). Shard job names
  # are listed in changes.sh (covered).
  ui-test:
    name: ui-test-${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3, 4] }
    defaults: { run: { working-directory: crates/portal } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { package_json_file: crates/portal/ui/package.json }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      # The UI links the SDK's sources and build.
      - run: cd sdk && pnpm install --frozen-lockfile && pnpm build
      - run: cd ui && pnpm install --frozen-lockfile
      - run: cd ui && pnpm vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }}
  # Advisories, licenses, bans and sources of every lockfile, one job for the four workspaces (one
  # runner slot of the account's 20, not four): each workspace runs deny and audit whatever the one
  # before it answered, and the job fails if any of them did. Each workspace reads its own deny.toml
  # and .cargo/audit.toml; the root ignores only what crates/portal ignores (deny.toml's header).
  supply-chain:
    needs: changes
    if: needs.changes.outputs.supply == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with: { tool: "cargo-audit,cargo-deny" }
      - run: |
          red=
          for dir in . crates/antares crates/ekiben crates/portal; do
            echo "::group::cargo deny $dir"
            (cd "$dir" && cargo deny --locked check advisories bans licenses sources) || red="$red deny:$dir"
            echo "::endgroup::"
            echo "::group::cargo audit $dir"
            (cd "$dir" && cargo audit) || red="$red audit:$dir"
            echo "::endgroup::"
          done
          if [ -n "$red" ]; then echo "::error::red:$red"; exit 1; fi
  # A branch that changes the Dockerfile or its ignore file: the full `docker build` (every stage,
  # no push), which the shipped image skips by handing in its compiled binary.
  # It reads the layer cache (scope jc) and, through the Actions cache token handed in as build
  # secrets, the sccache the Dockerfile's cargo builds use; both are written only by
  # dockerfile-cache.yml on each jc-portal-1 push that changes a layer input (the default branch,
  # whose caches every branch reads; without a writer every branch built cold: 39 min, runs
  # 42617814130 and 42611953211). This job writes neither (sccache READ_ONLY), so no branch evicts
  # those entries.
  # Not on jc-portal-1: dockerfile-cache.yml runs this same build (and check-build-context.sh) on
  # every jc-portal-1 push that changes a Dockerfile input, the Dockerfile and its ignore file
  # included, and a fast-forward of a branch head that passed here reuses that job (changes.sh).
  dockerfile:
    needs: changes
    if: >-
      needs.changes.outputs.image == 'true' && needs.changes.outputs.release != 'true' &&
      github.ref != 'refs/heads/jc-portal-1'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sh .github/scripts/check-build-context.sh
      - run: sh .github/scripts/free-disk.sh --wait
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # Exports ACTIONS_RESULTS_URL and ACTIONS_RUNTIME_TOKEN to the steps after it (the build's
      # secrets); the sccache it installs on the runner is not used.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with: { version: v0.18.0 }
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        env: { SCCACHE_GHA_RW_MODE: READ_ONLY }
        with:
          context: .
          file: bins/jc/Dockerfile
          push: false
          cache-from: type=gha,scope=jc
          secret-envs: |
            ACTIONS_RUNTIME_TOKEN=ACTIONS_RUNTIME_TOKEN
            ACTIONS_RESULTS_URL=ACTIONS_RESULTS_URL
            SCCACHE_GHA_RW_MODE=SCCACHE_GHA_RW_MODE
  # main and ship-proof/** only, from here on.
  image:
    needs: changes
    if: needs.changes.outputs.release == 'true' && needs.changes.outputs.ship == 'true'
    # image.yml's sign job (skipped in mode build) asks id-token: a caller grants what every job of
    # a called workflow asks, run or not.
    permissions: { contents: read, packages: write, id-token: write }
    uses: ./.github/workflows/image.yml
    with: { mode: build }
  scan:
    needs: image
    permissions: { contents: read, packages: write, id-token: write }
    uses: ./.github/workflows/image-scan.yml
    with: { digest: "${{ needs.image.outputs.digest }}" }
  # Signs the digest once every gate that ran passed and the scan did: the signature is what makes
  # it deployable (deployment verify-pinned-images.py). A skipped gate is one this push's paths
  # do not reach, or one another run of this commit passed (changes.sh REUSE).
  promote:
    needs: [changes, root-clippy, root-test, platform-test, antares-clippy, antares-test, ekiben, portal-clippy, portal-test, ui, ui-test, supply-chain, image, scan]
    if: >-
      always() && needs.image.result == 'success' && needs.scan.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    permissions: { contents: read, packages: write, id-token: write }
    uses: ./.github/workflows/image.yml
    with: { mode: sign, digest: "${{ needs.image.outputs.digest }}" }
  # The ui-rust App images (image-apps.yml) of the commit whose jc image was just signed, when
  # the push touches an App, the build stage or a workflow (changes.sh dockerfiles, workflows):
  # other pushes do not wait for it before deploy-pin, and a dispatch or a `v*` tag rebuilds.
  ship-apps:
    needs: [changes, promote]
    if: >-
      always() && needs.promote.result == 'success' &&
      (needs.changes.outputs.dockerfiles == 'true' || needs.changes.outputs.workflows == 'true')
    permissions: { contents: read, packages: write, id-token: write }
    uses: ./.github/workflows/image-apps.yml
