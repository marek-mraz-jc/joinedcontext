# libFuzzer runs of ekiben: the javascript processor's sandbox (crates/ekiben/crates/ekiben-js/fuzz, T-7082) and
# ekiben-processors' outside inputs (T-7686):
# on demand only, an hour by default. A crash uploads its input as an artifact; add it to
# fuzz/corpus/<target> with the fix so the next run replays it.
name: ekiben-fuzz
on:
  workflow_dispatch:
    inputs:
      seconds: { description: "fuzzing time in seconds", default: "3600" }
permissions: { contents: read }
concurrency:
  group: "ekiben-fuzz-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  script:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults: { run: { working-directory: crates/ekiben/crates/ekiben-js } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust
        with: { workspace: crates/ekiben/crates/ekiben-js/fuzz, key: ekiben-fuzz, toolchain: nightly }
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with: { tool: cargo-fuzz }
      - env: { SECONDS_TO_FUZZ: "${{ inputs.seconds }}" }
        run: |
          case "$SECONDS_TO_FUZZ" in ''|*[!0-9]*) echo "seconds: a whole number" >&2; exit 1 ;; esac
          cargo +nightly fuzz run script --release --target x86_64-unknown-linux-gnu -- -dict=fuzz/script.dict -max_total_time="$SECONDS_TO_FUZZ" -timeout=10 -rss_limit_mb=2048
      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with: { name: ekiben-js-fuzz-artifacts, path: crates/ekiben/crates/ekiben-js/fuzz/artifacts }
  # ekiben-processors' outside inputs (crates/ekiben/crates/ekiben-processors/fuzz, T-7686): every unarchive format,
  # json_schema, and processor configs. A crash input goes to fuzz/corpus/<target> with its fix.
  processors:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: { target: [unarchive, json_schema, config] }
    defaults: { run: { working-directory: crates/ekiben/crates/ekiben-processors } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust
        with: { workspace: crates/ekiben/crates/ekiben-processors/fuzz, key: ekiben-processors-fuzz, toolchain: nightly }
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with: { tool: cargo-fuzz }
      - env: { SECONDS_TO_FUZZ: "${{ inputs.seconds }}", TARGET: "${{ matrix.target }}" }
        run: |
          case "$SECONDS_TO_FUZZ" in ''|*[!0-9]*) echo "seconds: a whole number" >&2; exit 1 ;; esac
          cargo +nightly fuzz run "$TARGET" --release --target x86_64-unknown-linux-gnu -- -max_total_time="$SECONDS_TO_FUZZ" -timeout=10 -rss_limit_mb=2048
      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with: { name: "ekiben-processors-fuzz-${{ matrix.target }}", path: crates/ekiben/crates/ekiben-processors/fuzz/artifacts }
