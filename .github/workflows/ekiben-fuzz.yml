# The javascript processor's sandbox (crates/ekiben/crates/ekiben-js/fuzz, T-7082) and ekiben-text's
# inputs (crates/ekiben/crates/ekiben-text/fuzz: syslog lines, Go regexps, jq, grok, JMESPath,
# MessagePack, processor configs) and ekiben-processors' outside inputs (T-7686) under libFuzzer: on demand only, an hour per target by default.
# A crash uploads its input as an artifact; add it as a named regression test with the fix, and to
# fuzz/corpus/<target> as a seed-* file so the next run replays it.
name: ekiben-fuzz
on:
  workflow_dispatch:
    inputs:
      seconds: { description: "fuzzing time in seconds", default: "3600" }
permissions: { contents: read }
concurrency:
  group: "ekiben-fuzz-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  script:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults: { run: { working-directory: crates/ekiben/crates/ekiben-js } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust
        with: { workspace: crates/ekiben/crates/ekiben-js/fuzz, key: ekiben-fuzz, toolchain: nightly }
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with: { tool: cargo-fuzz }
      - env: { SECONDS_TO_FUZZ: "${{ inputs.seconds }}" }
        run: |
          case "$SECONDS_TO_FUZZ" in ''|*[!0-9]*) echo "seconds: a whole number" >&2; exit 1 ;; esac
          cargo +nightly fuzz run script --release --target x86_64-unknown-linux-gnu -- -dict=fuzz/script.dict -max_total_time="$SECONDS_TO_FUZZ" -timeout=10 -rss_limit_mb=2048
      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with: { name: ekiben-js-fuzz-artifacts, path: crates/ekiben/crates/ekiben-js/fuzz/artifacts }
  text:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: { target: [parse_log, go_regex, jq, grok, documents, config] }
    defaults: { run: { working-directory: crates/ekiben/crates/ekiben-text } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust
        with: { workspace: crates/ekiben/crates/ekiben-text/fuzz, key: ekiben-text-fuzz, toolchain: nightly }
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with: { tool: cargo-fuzz }
      - env: { SECONDS_TO_FUZZ: "${{ inputs.seconds }}", TARGET: "${{ matrix.target }}" }
        run: |
          case "$SECONDS_TO_FUZZ" in ''|*[!0-9]*) echo "seconds: a whole number" >&2; exit 1 ;; esac
          # jq's own budget stops a query at 5 s; -timeout leaves room above it
          cargo +nightly fuzz run "$TARGET" --release --target x86_64-unknown-linux-gnu -- -max_total_time="$SECONDS_TO_FUZZ" -timeout=15 -rss_limit_mb=3072
      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with: { name: "ekiben-text-fuzz-${{ matrix.target }}", path: crates/ekiben/crates/ekiben-text/fuzz/artifacts }
  # The parsers of ekiben-io-file, ekiben-io-http, ekiben-io-remote and ekiben-core (with ekiben-io-nats) that read bytes from outside (T-7579, T-7581, T-7685):
  # io-file scanners, cron, sftp/s3/amqp configs and S3 listings (T-7581, T-7800), io-sql DSNs, configs and value wire forms, MQTT wire, redis replies, multipart bodies, route patterns and paths, ftp/imap config fields, raw mails, ekiben-core interpolation, wire, redaction, stream and NATS configs.
  io:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: ekiben-io-file, target: scan }
          - { crate: ekiben-io-file, target: scanner_config }
          - { crate: ekiben-io-file, target: cron }
          - { crate: ekiben-io-file, target: connector_config }
          - { crate: ekiben-io-file, target: s3_listing }
          - { crate: ekiben-io-sql, target: dsn }
          - { crate: ekiben-io-sql, target: lint }
          - { crate: ekiben-io-sql, target: values }
          - { crate: ekiben-io-http, target: mqtt_wire }
          - { crate: ekiben-io-http, target: multipart }
          - { crate: ekiben-io-http, target: redis_reply }
          - { crate: ekiben-io-http, target: path }
          - { crate: ekiben-io-remote, target: mail }
          - { crate: ekiben-io-remote, target: names }
          - { crate: ekiben-core, target: interpolate }
          - { crate: ekiben-core, target: wire }
          - { crate: ekiben-core, target: redact }
          - { crate: ekiben-core, target: stream_config }
          - { crate: ekiben-core, target: part_json }
          - { crate: ekiben-core, target: nats_config }
    defaults: { run: { working-directory: "crates/ekiben/crates/${{ matrix.crate }}" } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust
        with: { workspace: "crates/ekiben/crates/${{ matrix.crate }}/fuzz", key: ekiben-fuzz-io, toolchain: nightly }
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with: { tool: cargo-fuzz }
      - env: { SECONDS_TO_FUZZ: "${{ inputs.seconds }}", TARGET: "${{ matrix.target }}" }
        run: |
          case "$SECONDS_TO_FUZZ" in ''|*[!0-9]*) echo "seconds: a whole number" >&2; exit 1 ;; esac
          cargo +nightly fuzz run "$TARGET" --release --target x86_64-unknown-linux-gnu -- -max_total_time="$SECONDS_TO_FUZZ" -timeout=10 -rss_limit_mb=2048
      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with: { name: "${{ matrix.crate }}-${{ matrix.target }}-fuzz-artifacts", path: "crates/ekiben/crates/${{ matrix.crate }}/fuzz/artifacts" }
  # The bloblang parsers and formatters that read outside input (crates/ekiben/crates/ekiben-bloblang/fuzz,
  # T-7576; mapping text, message bytes through fixed mappings and field interpolations: T-7666), one
  # target per job; a crash goes to fuzz/corpus/<target> with its fix.
  bloblang:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: { target: [time, sprintf, go_json, msgpack, wkt, gml, json_schema, mapping, execute, field] }
    defaults: { run: { working-directory: crates/ekiben/crates/ekiben-bloblang } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust
        with: { workspace: crates/ekiben/crates/ekiben-bloblang/fuzz, key: ekiben-bloblang-fuzz, toolchain: nightly }
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with: { tool: cargo-fuzz }
      - env: { SECONDS_TO_FUZZ: "${{ inputs.seconds }}", TARGET: "${{ matrix.target }}" }
        run: |
          case "$SECONDS_TO_FUZZ" in ''|*[!0-9]*) echo "seconds: a whole number" >&2; exit 1 ;; esac
          cargo +nightly fuzz run "$TARGET" --release --target x86_64-unknown-linux-gnu -- -max_total_time="$SECONDS_TO_FUZZ" -timeout=10 -rss_limit_mb=2048
      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with: { name: "ekiben-bloblang-fuzz-${{ matrix.target }}", path: crates/ekiben/crates/ekiben-bloblang/fuzz/artifacts }
  # ekiben-processors' outside inputs (crates/ekiben/crates/ekiben-processors/fuzz, T-7686): every unarchive format,
  # json_schema, and processor configs. A crash input goes to fuzz/corpus/<target> with its fix.
  processors:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: { target: [unarchive, json_schema, config] }
    defaults: { run: { working-directory: crates/ekiben/crates/ekiben-processors } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust
        with: { workspace: crates/ekiben/crates/ekiben-processors/fuzz, key: ekiben-processors-fuzz, toolchain: nightly }
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with: { tool: cargo-fuzz }
      - env: { SECONDS_TO_FUZZ: "${{ inputs.seconds }}", TARGET: "${{ matrix.target }}" }
        run: |
          case "$SECONDS_TO_FUZZ" in ''|*[!0-9]*) echo "seconds: a whole number" >&2; exit 1 ;; esac
          cargo +nightly fuzz run "$TARGET" --release --target x86_64-unknown-linux-gnu -- -max_total_time="$SECONDS_TO_FUZZ" -timeout=10 -rss_limit_mb=2048
      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with: { name: "ekiben-processors-fuzz-${{ matrix.target }}", path: crates/ekiben/crates/ekiben-processors/fuzz/artifacts }
