# The Portal's parsers of outside input under libFuzzer (crates/portal/fuzz). The targets are the
# `bin` entries of crates/portal/fuzz/Cargo.toml, read by the `targets` job, so a new target needs
# no line here. On demand only, an hour per target by default. A crash uploads its input as an
# artifact; add it as a named regression test with the fix, and to fuzz/seeds/<target> so the next
# run starts from it. The `build` job compiles every target once and the matrix jobs only run the
# binaries (one build per target held the runners for ~37 min each, run 45533642867).
# --codegen-units 16: with cargo-fuzz's default of 1 the Portal lib's release ASan build outgrows
# the runner's 16 GB (run 45522220685: every target lost its runner mid-build). `target` fuzzes
# one manifest target alone.
name: portal-fuzz
on:
  workflow_dispatch:
    inputs:
      seconds: { description: "fuzzing time in seconds", default: "3600" }
      target: { description: "one target of crates/portal/fuzz/Cargo.toml, empty for all", default: "" }
permissions: { contents: read }
concurrency:
  group: "portal-fuzz-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  targets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs: { list: "${{ steps.list.outputs.list }}" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: list
        env: { ONLY: "${{ inputs.target }}" }
        run: python3 crates/portal/fuzz/targets.py crates/portal/fuzz/Cargo.toml "$ONLY" >> "$GITHUB_OUTPUT"
  build:
    needs: targets
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults: { run: { working-directory: crates/portal } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust
        with: { workspace: crates/portal/fuzz, key: portal-fuzz, toolchain: nightly }
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with: { tool: cargo-fuzz }
      # The names come validated from the targets job ([a-z0-9_]+, each a manifest bin).
      - env: { LIST: "${{ needs.targets.outputs.list }}" }
        run: |
          set -eu
          names=$(printf '%s' "$LIST" | jq -r '.[]')
          if [ "$(printf '%s\n' "$names" | wc -l)" -eq 1 ]; then one=$names; else one=; fi
          cargo +nightly fuzz build ${one:+"$one"} --release --codegen-units 16 --target x86_64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/fuzz-bin"
          for t in $names; do cp "fuzz/target/x86_64-unknown-linux-gnu/release/$t" "$RUNNER_TEMP/fuzz-bin/"; done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with: { name: portal-fuzz-bin, path: "${{ runner.temp }}/fuzz-bin", retention-days: 1, if-no-files-found: error }
  parsers:
    needs: [targets, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: { target: "${{ fromJSON(needs.targets.outputs.list) }}" }
    defaults: { run: { working-directory: crates/portal } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with: { name: portal-fuzz-bin, path: "${{ runner.temp }}/fuzz-bin" }
      # The flags cargo fuzz run passes, run on the prebuilt binary.
      - env: { SECONDS_TO_FUZZ: "${{ inputs.seconds }}", TARGET: "${{ matrix.target }}", ASAN_OPTIONS: detect_odr_violation=0 }
        run: |
          case "$SECONDS_TO_FUZZ" in ''|*[!0-9]*) echo "seconds: a whole number" >&2; exit 1 ;; esac
          bin="$RUNNER_TEMP/fuzz-bin/$TARGET"
          chmod +x "$bin"
          mkdir -p "fuzz/corpus/$TARGET" "fuzz/seeds/$TARGET" "fuzz/artifacts/$TARGET"
          "$bin" -artifact_prefix="fuzz/artifacts/$TARGET/" -max_total_time="$SECONDS_TO_FUZZ" -timeout=10 -rss_limit_mb=2048 "fuzz/corpus/$TARGET" "fuzz/seeds/$TARGET"
      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with: { name: "portal-fuzz-${{ matrix.target }}", path: crates/portal/fuzz/artifacts }
