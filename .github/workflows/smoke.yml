name: smoke
# The smoke gate: jc built from the pushed commit, started on synthetic data (the committed
# bins/jc/smoke/ci/synth-export.tgz, moved to now), and every smoke suite (endpoints, mcp, pipelines,
# charts-apps, logs, ui, whichever are present) plus jc's e2e tests (`cargo test -p jc --tests`)
# against it, one summary table and one verdict. A red verdict fails the `verdict` job; the merged
# results.json and REPORT.md with every shard's files are the smoke-all artifact. Nothing here
# reaches dev or prod: the suites refuse any host but loopback.
#
# Sharded (T-6954): `run all` in one job took 62 min (run 43662696026: ui 916 s, pipelines 658 s,
# restore 531 s, multiorg 427 + 354 s, e2e 236 s, after 12 min of builds). `build` and `apps` build
# once; each `shard` job starts its own rehearsal (gate.sh) from those binaries and runs its suites
# plus logs, which reads each shard's own jc log; `e2e` runs jc's tests beside them. `verdict` folds
# the shards into the one report (ci/merge.py): a shard missing or red, or a run no shard ran, is RED.
on:
  push:
    branches: [jc-portal-1]
    # Not for a change only the deployment code (ci.yml's deploy jobs gate it) or the docs touch;
    # deploy/rehearsal is the single-host form these shards start, so it still runs them (T-6986).
    paths: ["**", "!deploy/**", "deploy/rehearsal/**", "!docs/**"]
  workflow_dispatch:
permissions: { contents: read }
# One run per ref at a time and never cancelled: with cancel-in-progress every merge cancelled the
# run before it (13 of 14 runs on 2026-11-10 09:21-14:48Z) and no merge got a verdict. A push while
# one runs waits; a newer push replaces the waiting one (GitHub keeps one pending run per group).
concurrency:
  group: "smoke-${{ github.ref }}"
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
jobs:
  # jc, kaisatsu, daiya (the -server crates' binaries) and jcctl with the Portal UI jc embeds, as one tar: tar keeps the mtimes
  # up.sh's ui-fresh.sh compares (ui/dist built after the last UI commit, jc linked after ui/dist).
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env: { CARGO_BUILD_JOBS: "3" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sh .github/scripts/free-disk.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { shared-key: smoke, save-if: "${{ github.ref == 'refs/heads/jc-portal-1' }}" }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { package_json_file: crates/portal/ui/package.json }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      # The Portal UI jc embeds; up.sh refuses a jc whose embedded UI is older than its sources.
      - run: cd crates/portal/sdk && pnpm install --frozen-lockfile && pnpm build
      - run: cd crates/portal/ui && pnpm install --frozen-lockfile && pnpm build
      - run: cargo build --locked -p jc -p kaisatsu-server -p daiya-server
      # The import validates every manifest with jcctl (deploy/rehearsal/import.sh JCCTL_BIN, default
      # beside jc): jcctl is a crate of the vendored platform workspace, built into jc's target.
      - run: cargo build --locked --manifest-path vendor/joinedcontext-platform/Cargo.toml -p jcctl --target-dir target
      - run: |
          tar -cf - target/debug/jc target/debug/kaisatsu target/debug/daiya target/debug/jcctl \
            crates/portal/ui/dist | zstd -T0 -3 > "$RUNNER_TEMP/smoke-bin.tar.zst"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: smoke-bin
          path: ${{ runner.temp }}/smoke-bin.tar.zst
          retention-days: 1
          compression-level: 0

  # The App bundles (bins/jc/Dockerfile apps-bundles: the apps stage's /srv/apps alone) built by
  # BuildKit in its own container: apps.sh's own `docker build --target apps` ran inside dockerd,
  # which grew to 13.8 GB and the runner out of memory (run 42931221810, brief 120). The memory
  # cap makes an overrun a red step instead of a lost runner. buildkit is moby/buildkit v0.34.2
  # (the buildx-stable-1 tag setup-buildx pulls, pushed 2026-11-03). Saved as an image tar each
  # shard loads as jc-apps:smoke.
  apps:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: |
            image=moby/buildkit@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
            memory=10g
            memory-swap=10g
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: bins/jc/Dockerfile
          target: apps-bundles
          push: false
          tags: jc-apps:smoke
          outputs: type=docker,dest=${{ runner.temp }}/jc-apps.tar
          cache-from: type=gha,scope=jc
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jc-apps
          path: ${{ runner.temp }}/jc-apps.tar
          retention-days: 1

  runner-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.13" }
      - run: python -m pip install pyyaml==6.0.2 pytest==8.4.2 playwright==1.63.0
      - timeout-minutes: 20
        # Three bounded tries; the script says why and how the apt part is bounded (T-7442, T-7456).
        run: sh .github/scripts/playwright-install.sh
      # test_explore_map serves the explorer bundle jc embeds, the Portal UI's dist-explorer, which
      # is built, never committed (T-7102): the same pins and steps as ci.yml's ui job (T-7108).
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { package_json_file: crates/portal/ui/package.json }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - name: the explorer bundle
        working-directory: crates/portal
        run: |
          (cd sdk && pnpm install --frozen-lockfile && pnpm build)
          cd ui && pnpm install --frozen-lockfile && pnpm build && test -s dist-explorer/explorer.js && test -s dist-explorer/explorer.css
      - name: the smoke runner's own tests
        # Every dir runs, so one red no longer hides the next; the step fails at the end on any red.
        run: |
          red=""
          for t in bins/jc/smoke/*/tests bins/jc/smoke/ci; do python -m pytest -q "$t" || red="$red $t"; done
          [ -z "$red" ] || { echo "red:$red"; exit 1; }

  # jc's own e2e tests (bins/jc/tests restart_pg.rs, the kaisatsu store), one row per test.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      # The password is no role name: restart_pg checks that no module prints it, and `postgres`
      # is in every refusal.
      postgres:
        image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: smoke-superuser-pw }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      JC_PG_TEST_DATABASE_URL: postgres://postgres:smoke-superuser-pw@127.0.0.1:5432/postgres
      KAISATSU_TEST_DATABASE_URL: postgres://postgres:smoke-superuser-pw@127.0.0.1:5432/kaisatsu
      CARGO_BUILD_JOBS: "3"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sh .github/scripts/free-disk.sh
      - run: psql postgres://postgres:smoke-superuser-pw@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE kaisatsu"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { shared-key: smoke-e2e, save-if: "${{ github.ref == 'refs/heads/jc-portal-1' }}" }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { package_json_file: crates/portal/ui/package.json }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.13" }
      # jc embeds the Portal UI: its tests compile only with ui/dist built.
      - run: cd crates/portal/sdk && pnpm install --frozen-lockfile && pnpm build
      - run: cd crates/portal/ui && pnpm install --frozen-lockfile && pnpm build
      - name: run all (e2e)
        run: |
          python3 bins/jc/smoke/run all --base-url http://127.0.0.1:1 --out "$RUNNER_TEMP/smoke" \
            --shard e2e --only e2e --e2e --known bins/jc/smoke/ci/known.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: smoke-shard-e2e
          path: ${{ runner.temp }}/smoke
          retention-days: 14

  # One rehearsal per shard. Every shard runs logs too (its own jc log and result dirs); ui splits
  # by persona, the dataroom and shako walks on ui-admin. restore has a shard of its own (T-7313:
  # riding after pipelines made that shard 22-29 min, the critical path, in runs 44466375658,
  # 44469218044, 44474109775). Alone it once compared 3 min after the import while the Pipelines'
  # first runs still wrote new types (runs 43683591053, 43685936569: TrafficFlowObserved/
  # anon.types.written before absent, after pass), so gate.sh hands it --drain: its before run
  # waits, bounded, until the Portal's Pipeline statuses show no first run running, queued or due
  # (row control.drained, red naming the pending ones). `rest` names what it leaves out, so a new
  # suite runs there. ci/test_smoke_yml.py checks that every suite runs on exactly one shard.
  shard:
    needs: [build, apps]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: rest, skip: "multiorg,pipelines,restore,ui" }
          - { shard: pipelines, only: "pipelines,logs" }
          - { shard: restore, only: "restore,logs" }
          - { shard: ui-admin, only: "ui,logs", with: "ui=--personas admin" }
          - { shard: ui-viewer, only: "ui,logs", with: "ui=--personas viewer --no-shared" }
          - { shard: ui-outsider, only: "ui,logs", with: "ui=--personas outsider --no-shared" }
          - { shard: multiorg, only: "multiorg,logs", skip: "multiorg@path" }
          - { shard: multiorg-path, only: "multiorg@path,logs" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sh .github/scripts/free-disk.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.13" }
      # rehearsal.py reads the bundle's YAML; the ui suite and the charts-apps shots drive Chromium.
      - run: python -m pip install pyyaml==6.0.2 pytest==8.4.2 playwright==1.63.0
      - timeout-minutes: 20
        run: sh .github/scripts/playwright-install.sh
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with: { name: smoke-bin, path: "${{ runner.temp }}/bin" }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with: { name: jc-apps, path: "${{ runner.temp }}/apps" }
      - run: |
          zstd -dc "$RUNNER_TEMP/bin/smoke-bin.tar.zst" | tar -xf -
          docker load -i "$RUNNER_TEMP/apps/jc-apps.tar"
      # REHEARSAL_JC_IMAGE: apps.sh copies /srv/apps out of that image instead of building the apps
      # stage itself. REHEARSAL_APPS=off is never set here: it would drop every App row.
      - name: run all (shard)
        env:
          SMOKE_SHARD: "${{ matrix.shard }}"
          SMOKE_ONLY: "${{ matrix.only }}"
          SMOKE_SKIP: "${{ matrix.skip }}"
          SMOKE_WITH: "${{ matrix.with }}"
          REHEARSAL_HOME: "${{ runner.temp }}/rehearsal"
          REHEARSAL_JC_IMAGE: "jc-apps:smoke"
        run: bins/jc/smoke/ci/gate.sh "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: smoke-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/smoke
          retention-days: 14

  verdict:
    needs: [runner-tests, e2e, shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.13" }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with: { pattern: "smoke-shard-*", path: "${{ runner.temp }}/smoke/shards" }
      # A shard that uploaded nothing is a `shards/missing:<name>` failure in the report.
      - name: merge
        run: |
          mkdir -p "$RUNNER_TEMP/smoke/shards"
          python3 -I bins/jc/smoke/ci/merge.py --out "$RUNNER_TEMP/smoke" --known bins/jc/smoke/ci/known.txt \
            --expect rest,pipelines,restore,ui-admin,ui-viewer,ui-outsider,multiorg,multiorg-path,e2e \
            "$RUNNER_TEMP"/smoke/shards/*
      - name: the runner's own tests passed
        if: always()
        env: { RESULT: "${{ needs.runner-tests.result }}" }
        run: |
          echo "runner-tests: $RESULT"
          [ "$RESULT" = success ]
      - name: summary
        if: always()
        run: |
          f="$RUNNER_TEMP/smoke/REPORT.md"
          if [ -f "$f" ]; then head -c 60000 "$f" >> "$GITHUB_STEP_SUMMARY"; else echo "no REPORT.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: smoke-all
          path: ${{ runner.temp }}/smoke
          retention-days: 14

  # A green verdict on the merge branch fast-forwards main to the tested commit (T-7420), once ci.yml's
  # push run on jc-portal-1 at that commit is green too and main is its ancestor; never a force or a
  # merge commit (.github/scripts/ff-main.sh). The script then dispatches ci.yml on main, which ships
  # the commit (a GITHUB_TOKEN push starts no run), and deploy-pin.yml, which pins it once that ci is
  # green (its run fires no workflow_run); the deployer's dev apply follows as before.
  # The only job here that writes: contents for the ref, actions for the dispatches. One at a time, so
  # an older green run never races a newer one (the older then finds main ahead and leaves it).
  ff-main:
    needs: verdict
    if: github.ref == 'refs/heads/jc-portal-1' && github.repository == 'marek-mraz-jc/joinedcontext'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions: { contents: write, actions: write }
    concurrency: { group: ff-main, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false, sparse-checkout: .github/scripts }
      - env: { SHA: "${{ github.sha }}", GH_TOKEN: "${{ github.token }}" }
        run: sh .github/scripts/ff-main.sh
