name: smoke
# The smoke gate: jc built from the pushed commit, started on synthetic data (the committed
# bins/jc/smoke/ci/synth-export.tgz, moved to now), and `bins/jc/smoke/run all` against it: every
# smoke suite (endpoints, mcp, pipelines, charts-apps, logs, ui, whichever are present) plus jc's
# e2e tests (`cargo test -p jc --tests`), one summary table and one verdict. A red verdict fails
# the job; the suites' results.json and REPORT.md files are the artifact. Nothing here reaches dev
# or prod: the suites refuse any host but loopback.
on:
  push:
    branches: [jc-portal-1]
  workflow_dispatch:
permissions: { contents: read }
# One run per ref at a time and never cancelled: with cancel-in-progress every merge cancelled the
# run before it (13 of 14 runs on 2026-11-10 09:21-14:48Z) and no merge got a verdict. A push while
# one runs waits; a newer push replaces the waiting one (GitHub keeps one pending run per group).
concurrency:
  group: "smoke-${{ github.ref }}"
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
jobs:
  all:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      # jc's own e2e tests (bins/jc/tests restart_pg.rs, the kaisatsu store); the rehearsal starts
      # its own PostgreSQL in docker on another port (deploy/rehearsal/up.sh). The password is no
      # role name: restart_pg checks that no module prints it, and `postgres` is in every refusal.
      postgres:
        image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: smoke-superuser-pw }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      JC_PG_TEST_DATABASE_URL: postgres://postgres:smoke-superuser-pw@127.0.0.1:5432/postgres
      KAISATSU_TEST_DATABASE_URL: postgres://postgres:smoke-superuser-pw@127.0.0.1:5432/kaisatsu
      CARGO_BUILD_JOBS: "3"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sh .github/scripts/free-disk.sh
      - run: psql postgres://postgres:smoke-superuser-pw@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE kaisatsu"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { shared-key: smoke, save-if: "${{ github.ref == 'refs/heads/jc-portal-1' }}" }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { package_json_file: crates/portal/ui/package.json }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.13" }
      # rehearsal.py reads the bundle's YAML; the ui suite and the charts-apps shots drive Chromium.
      - run: python -m pip install pyyaml==6.0.2 pytest==8.4.2 playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - name: the smoke runner's own tests
        run: |
          for t in bins/jc/smoke/*/tests bins/jc/smoke/ci; do python -m pytest -q "$t"; done
      # The Portal UI jc embeds; up.sh refuses a jc whose embedded UI is older than its sources.
      - run: cd crates/portal/sdk && pnpm install --frozen-lockfile && pnpm build
      - run: cd crates/portal/ui && pnpm install --frozen-lockfile && pnpm build
      - run: cargo build --locked -p jc -p kaisatsu-server -p daiya-server
      # The import validates every manifest with jcctl (deploy/rehearsal/import.sh JCCTL_BIN, default
      # beside jc): jcctl is a crate of the vendored platform workspace, built into jc's target.
      - run: cargo build --locked --manifest-path vendor/joinedcontext-platform/Cargo.toml -p jcctl --target-dir target
      # The App bundles (bins/jc/Dockerfile apps-bundles: the apps stage's /srv/apps alone) built by
      # BuildKit in its own container: apps.sh's own `docker build --target apps` ran inside dockerd,
      # which grew to 13.8 GB and the runner out of memory (run 42931221810, brief 120). The memory
      # cap makes an overrun a red step instead of a lost runner. buildkit is moby/buildkit v0.34.2
      # (the buildx-stable-1 tag setup-buildx pulls, pushed 2026-11-03).
      - id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: |
            image=moby/buildkit@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
            memory=10g
            memory-swap=10g
      - name: memory probe for the App bundles build
        run: |
          ( while :; do
              echo "build probe $(date -u +%T): $(free -m | awk 'NR==2{print "mem used "$3" avail "$7" MB"}')," \
                "dockerd $(ps -C dockerd -o rss= | awk '{s+=$1} END{printf "%d", s/1024}') MB," \
                "buildkitd $(ps -C buildkitd -o rss= | awk '{s+=$1} END{printf "%d", s/1024}') MB," \
                "top $(ps -eo rss=,comm= --sort=-rss | head -3 | awk '{printf "%s:%dMB ", $2, $1/1024}')"
              sleep 30
            done ) > "$RUNNER_TEMP/build-probe.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/build-probe.pid"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: bins/jc/Dockerfile
          target: apps-bundles
          load: true
          push: false
          tags: jc-apps:smoke
          cache-from: type=gha,scope=jc
      # The probe lines, then BuildKit stopped so the gate gets its memory back.
      - name: memory probe lines
        if: always()
        env: { BUILDER: "${{ steps.buildx.outputs.name }}" }
        run: |
          kill "$(cat "$RUNNER_TEMP/build-probe.pid")" 2>/dev/null || true
          cat "$RUNNER_TEMP/build-probe.log"
          docker buildx stop "$BUILDER" || true
          echo "after stop: $(free -m | awk 'NR==2{print "mem used "$3" avail "$7" MB"}')"
      # REHEARSAL_JC_IMAGE: apps.sh copies /srv/apps out of that image instead of building the apps
      # stage itself. REHEARSAL_APPS=off is never set here: it would drop every App row.
      - name: run all
        env: { SMOKE_E2E: "1", REHEARSAL_HOME: "${{ runner.temp }}/rehearsal", REHEARSAL_JC_IMAGE: "jc-apps:smoke" }
        run: bins/jc/smoke/ci/gate.sh "$RUNNER_TEMP/smoke"
      - name: summary
        if: always()
        run: |
          f="$RUNNER_TEMP/smoke/REPORT.md"
          if [ -f "$f" ]; then head -c 60000 "$f" >> "$GITHUB_STEP_SUMMARY"; else echo "no REPORT.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: smoke-all
          path: ${{ runner.temp }}/smoke
          retention-days: 14
