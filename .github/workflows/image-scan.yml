name: image-scan
# The CycloneDX SBOM of a jc image ship (image.yml) pushed, attested to its digest, then the
# vulnerability gate (HIGH/CRITICAL with a fix), and on a pass a vuln-scan attestation, as the
# platform's image-scan.yml. A production apply refuses a digest without both attestations of
# this workflow on main (deployment scripts/verify-pinned-images.py --scanned).
#
# ci.yml calls it on a push to main (or ship-proof/**) as soon as the image is pushed, in parallel
# with the tests; its `promote` job signs the image only after this passed, so a HIGH/CRITICAL
# finding with a fix still blocks the digest from being signed and pinned. A called workflow
# attests under its own name (`.github/workflows/image-scan.yml@refs/heads/main`).
on:
  workflow_call:
    inputs:
      digest: { description: "the sha256 digest of ghcr.io/<owner>/jc:<this commit>", type: string, required: true }
  workflow_dispatch:
    inputs:
      sha: { description: "main commit whose image to scan (40 hex)", required: true, type: string }
permissions: { contents: read }
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write }
    timeout-minutes: 20
    env:
      SHA: ${{ github.event.inputs.sha || github.sha }}
      DIGEST: ${{ inputs.digest }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/jc
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: image
        run: |
          set -eu
          # ghcr answers a GITHUB_TOKEN read of a just-pushed tag 404 or 403 now and then (main ci
          # 42702031687): three tries 20 s apart, then the step fails.
          try() { for n in 1 2 3; do "$@" && return 0; [ "$n" = 3 ] || sleep 20; done; return 1; }
          printf '%s' "$SHA" | grep -qxE '[0-9a-f]{40}' || { echo "::error::'$SHA' is no commit"; exit 1; }
          digest=$(try docker buildx imagetools inspect "$IMAGE:$SHA" --format '{{json .Manifest}}' | jq -r '.digest // empty')
          [ -n "$digest" ] || { echo "::error::$IMAGE:$SHA is not published"; exit 1; }
          # A caller names the digest it pushed: the tag must still point at it.
          [ -z "$DIGEST" ] || [ "$DIGEST" = "$digest" ] || { echo "::error::$IMAGE:$SHA is $digest, not $DIGEST"; exit 1; }
          echo "ref=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: cyclonedx
          output: ${{ runner.temp }}/sbom.cdx.json
          cache-dir: ${{ runner.temp }}/trivy
      - run: cosign attest --yes --type cyclonedx --predicate "$RUNNER_TEMP/sbom.cdx.json" "${{ steps.image.outputs.ref }}"
      # Read back by digest and under this workflow's identity: a lane that stops attesting goes red
      # here instead of leaving an image nothing describes.
      - run: |
          cosign verify-attestation --type cyclonedx \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/image-scan.yml@${{ github.ref }}" \
            "${{ steps.image.outputs.ref }}" > /dev/null
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "${{ steps.image.outputs.ref }}", severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true, cache-dir: "${{ runner.temp }}/trivy" }
      # Reached only when the gate above passed: the record the release gate asks for.
      - run: |
          set -eu
          jq -n --arg sha "$SHA" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg at "$(date -u +%FT%TZ)" \
            '{scanner: "trivy", severity: ["HIGH", "CRITICAL"], ignoreUnfixed: true, result: "pass", commit: $sha, run: $run, scannedAt: $at}' \
            > "$RUNNER_TEMP/scan.json"
          cosign attest --yes --type https://joinedcontext.com/attestations/vuln-scan/v1 --predicate "$RUNNER_TEMP/scan.json" "${{ steps.image.outputs.ref }}"
