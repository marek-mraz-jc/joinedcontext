name: rust
description: >-
  The toolchain, the target cache and sccache for one Cargo workspace of this repository. The
  target cache (Swatinem/rust-cache: every dependency, build scripts already run) and sccache
  (GitHub Actions cache backend: the workspace's own crates, which rust-cache drops) are written
  only by main and ship-proof/** pushes and read by every run, so a branch starts warm from main
  and never evicts main's entries.
inputs:
  workspace: { description: "workspace directory, relative to the repository root", default: "." }
  key: { description: "cache key of this job's build (one per build kind: clippy, test, release)", required: true }
  toolchain: { description: "Rust toolchain", default: stable }
  components: { description: "toolchain components", default: "" }
runs:
  using: composite
  steps:
    - run: sh "$GITHUB_WORKSPACE/.github/scripts/free-disk.sh"
      shell: sh
    - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with: { toolchain: "${{ inputs.toolchain }}", components: "${{ inputs.components }}" }
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: ${{ inputs.workspace }}
        shared-key: ${{ inputs.key }}
        # A red test leaves the compiled dependencies as good as a green one.
        cache-on-failure: true
        save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ship-proof/') }}
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with: { version: v0.18.0 }
    - shell: sh
      env:
        RELEASE_REF: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ship-proof/') }}
      run: |
        {
          echo RUSTC_WRAPPER=sccache
          echo SCCACHE_GHA_ENABLED=true
          [ "$RELEASE_REF" = true ] || echo SCCACHE_GHA_RW_MODE=READ_ONLY
        } >> "$GITHUB_ENV"
