<script nonce="fixture" id="kc-page-script" data-show="Show password" data-hide="Hide password">
(function () {
    var me = document.getElementById("kc-page-script");
    document.querySelectorAll("button[data-password-toggle]").forEach(function (b) {
        var input = document.getElementById(b.getAttribute("aria-controls"));
        var icons = b.querySelectorAll("svg");
        icons[1].style.display = "none";
        b.addEventListener("click", function () {
            var show = input.type === "password";
            input.type = show ? "text" : "password";
            icons[0].style.display = show ? "none" : "";
            icons[1].style.display = show ? "" : "none";
            b.setAttribute("aria-label", show ? me.dataset.hide : me.dataset.show);
        });
    });
    var pick = document.getElementById("login-select-toggle");
    if (pick) {
        pick.addEventListener("change", function () {
            if (pick.value) { window.location.href = pick.value; }
        });
    }
    var form = document.querySelector("main form");
    if (form) {
        form.addEventListener("submit", function () {
            var b = form.querySelector("button[type=submit]");
            if (b) { setTimeout(function () { b.disabled = true; }, 0); }
        });
    }
})();
</script>
