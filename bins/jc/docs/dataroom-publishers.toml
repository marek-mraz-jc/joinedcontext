# prod's publisher badges and words (owner 2026-10-12: "Pridaj obrázky"): joinedcontext-deployment
# release 23a43801, components/ckan/values/catalogue/development-values.yaml.gotmpl `organizations`,
# read by jc_theme's jc_org/_badge. A plain badge with initials, no coat of arms: the instance is a
# demo, not affiliated with any of them; the words stand where a publisher set none in CKAN.
# jc.toml `[dataroom.publishers]` gives dataroom the same block (deployment
# components/jc/values/server, jc.server.dataroomPublishers). Copied, never typed.
[dataroom.publishers.hel-fi]
initials = "HEL"
colour = "#0000bf"
description.en = "Open data of the Helsinki region, live from HSL public transport, Fintraffic parking and the city's own services, through joinedcontext endpoints."
description.sk = "Otvorené údaje regiónu Helsinki, naživo z verejnej dopravy HSL, parkovísk Fintraffic a mestských služieb, cez endpointy joinedcontext."

[dataroom.publishers.praha]
