[package]
name = "jc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "One binary hosting the joinedcontext modules behind one mount router"
publish = false

[lib]
name = "jc"
path = "src/lib.rs"

[[bin]]
name = "jc"
path = "src/main.rs"

[features]
default = ["kaisatsu", "dataroom", "daiya", "ekiben", "antares", "gateway", "portal", "shako", "model-tools", "assistant", "viz", "jemalloc"]
shako = [
  "dep:shako-server",
  "dep:shako-core",
  "dep:shako-store-memory",
  "dep:shako-store-pg",
]
kaisatsu = [
  "dep:kaisatsu-server",
  "dep:kaisatsu-core",
  "dep:kaisatsu-crypto",
  "dep:kaisatsu-oidc",
  "dep:kaisatsu-store-memory",
  "dep:kaisatsu-store-pg",
  "dep:kaisatsu-import",
]
dataroom = [
  "dep:dataroom-server",
  "dep:dataroom-api",
  "dep:dataroom-core",
  "dep:dataroom-harvest",
  "dep:dataroom-store-memory",
  "dep:dataroom-store-pg",
  "dep:chrono",
]
daiya = [
  "dep:daiya-server",
  "dep:daiya-model",
  "dep:daiya-store-memory",
  "dep:daiya-store-pg",
]
ekiben = ["dep:ekiben-server", "dep:ekiben-core", "dep:futures", "dep:jc-core"]
# The platform's broker build (Antares image-jc FEATURES without parquet and tabular): Endpoint
# views, the joinedcontext engine and every surface dev's broker serves.
antares = ["dep:antares-broker"]
gateway = ["dep:context-gateway", "dep:jc-core", "dep:jc-manifest", "dep:jcctl", "dep:zip"]
portal = ["dep:joinedcontext-portal"]
# POST /generate for the reconciler: broker schema and @context of a LinkML model.
model-tools = ["dep:linkml-model", "dep:serde_norway"]
# The knowledge assistant's page, widget and chat (vendor/joinedcontext-platform/crates/assistant)
# with its model proxy (agent-proxy) on loopback. ONNX Runtime is loaded from a file at start.
assistant = ["dep:assistant", "dep:agent-proxy", "dep:jc-core", "dep:ort", "gateway"]
jemalloc = ["dep:tikv-jemallocator"]
# The chart renderer and live-data explorer (vendor/viz), static files only.
viz = []

[dependencies]
jc-router = { path = "../../crates/shared/jc-router" }
jc-secret = { path = "../../crates/shared/jc-secret" }
jc-door = { path = "../../crates/shared/jc-door" }
axum = "0.8"
clap = { version = "4.6", features = ["derive", "env"] }
ipnet = { version = "2.12", features = ["serde"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tikv-jemallocator = { version = "0.7", optional = true }
getrandom = "0.3"
hex = "0.4"
base64 = "0.22"
age = { version = "0.12", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "json", "migrate"] }
url = "2"
futures = { version = "0.3", optional = true }

kaisatsu-server = { path = "../../crates/kaisatsu/server", optional = true }
kaisatsu-core = { path = "../../crates/kaisatsu/core", optional = true }
kaisatsu-crypto = { path = "../../crates/kaisatsu/crypto", optional = true }
kaisatsu-oidc = { path = "../../crates/kaisatsu/oidc", optional = true }
kaisatsu-store-memory = { path = "../../crates/kaisatsu/store-memory", optional = true }
kaisatsu-store-pg = { path = "../../crates/kaisatsu/store-pg", optional = true }
kaisatsu-import = { path = "../../crates/kaisatsu/import", optional = true }

dataroom-server = { path = "../../crates/dataroom/server", optional = true }
dataroom-api = { path = "../../crates/dataroom/api", optional = true }
dataroom-core = { path = "../../crates/dataroom/core", optional = true }
dataroom-harvest = { path = "../../crates/dataroom/harvest", optional = true }
dataroom-store-memory = { path = "../../crates/dataroom/store-memory", optional = true }
dataroom-store-pg = { path = "../../crates/dataroom/store-pg", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }

daiya-server = { path = "../../crates/daiya/server", optional = true }
daiya-model = { path = "../../crates/daiya/model", optional = true }
daiya-store-memory = { path = "../../crates/daiya/store-memory", optional = true }
daiya-store-pg = { path = "../../crates/daiya/store-pg", optional = true }

ekiben-server = { path = "../../crates/ekiben/crates/ekiben-server", optional = true }
ekiben-core = { path = "../../crates/ekiben/crates/ekiben-core", optional = true }

antares-broker = { path = "../../crates/antares/crates/antares-broker", optional = true, features = ["full", "jc-policy", "linkml", "ical", "feed", "parquet", "tabular"] }

context-gateway = { path = "../../vendor/joinedcontext-platform/crates/context-gateway", optional = true }
jc-core = { path = "../../vendor/joinedcontext-platform/crates/jc-core", optional = true }
jc-manifest = { path = "../../vendor/joinedcontext-platform/crates/jc-manifest", optional = true }
jcctl = { path = "../../vendor/joinedcontext-platform/crates/jcctl", optional = true, default-features = false }
# The gateway reads shako's repositories as zip archives (the image has no git).
zip = { version = "9.2", default-features = false, features = ["deflate"], optional = true }

joinedcontext-portal = { path = "../../crates/portal", optional = true }

assistant = { path = "../../vendor/joinedcontext-platform/crates/assistant", optional = true }
agent-proxy = { path = "../../vendor/joinedcontext-platform/crates/agent-proxy", optional = true }
# The assistant's own pin and features; jc calls `ort::init_from` with the configured library.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "api-24", "load-dynamic"], optional = true }

linkml-model = { path = "../../crates/antares/crates/linkml-model", optional = true }
serde_norway = { version = "0.9", optional = true }

shako-server = { path = "../../crates/shako/server", optional = true }
shako-core = { path = "../../crates/shako/core", optional = true }
shako-store-memory = { path = "../../crates/shako/store-memory", optional = true }
shako-store-pg = { path = "../../crates/shako/store-pg", optional = true }

[dev-dependencies]
sha2 = "0.10"
jc-core = { path = "../../vendor/joinedcontext-platform/crates/jc-core", features = ["outbound"] }
http-body-util = "0.1"
tempfile = "3"
zeroize = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
