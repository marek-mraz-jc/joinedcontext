[workspace]
resolver = "3"
# Members join as each module gets code; folders hold their README until then.
members = [
  "crates/dataroom/core",
  "crates/dataroom/store-memory",
  "crates/dataroom/store-pg",
  "crates/dataroom/search",
  "crates/dataroom/rdf",
  "crates/dataroom/shacl",
  "crates/dataroom/harvest",
  "crates/dataroom/plugin",
  "crates/dataroom/api",
  "crates/dataroom/mcp",
  "crates/dataroom/web",
  "crates/dataroom/server",
  "crates/shared/jc-router",
  "crates/kaisatsu/core",
  "crates/kaisatsu/crypto",
  "crates/kaisatsu/store-pg",
  "crates/kaisatsu/store-memory",
  "crates/kaisatsu/oidc",
  "crates/kaisatsu/login",
  "crates/kaisatsu/admin",
  "crates/kaisatsu/import",
  "crates/kaisatsu/mcp",
  "crates/kaisatsu/server",
  "crates/daiya/model",
  "crates/daiya/expr",
  "crates/daiya/query",
  "crates/daiya/store-memory",
  "crates/daiya/store-pg",
  "crates/daiya/import",
  "crates/daiya/api",
  "crates/daiya/mcp",
  "crates/daiya/server",
  "crates/shako/core",
  "crates/shako/git",
  "crates/shako/store-pg",
  "crates/shako/store-memory",
  "crates/shako/api",
  "crates/shako/registry",
  "crates/shako/mcp",
  "crates/shako/web",
  "crates/shako/server",
  "bins/jc",
]
# Joined repositories keep their own workspace (lockfile, lints, standalone binaries) for now; jc
# depends on their crates by path. Making them members is a later step (bins/jc/STATUS.md).
exclude = ["crates/ekiben", "crates/antares", "crates/portal", "vendor/joinedcontext-platform", "vendor/ngsild"]

# Antares pins rumqttc 0.25.1 with rustls-webpki 0.103 (crates/antares/vendor/rumqttc/README.md); a
# patch only takes effect from the root manifest.
[patch.crates-io]
rumqttc = { path = "crates/antares/vendor/rumqttc" }

[workspace.package]
edition = "2024"
license = "MIT"

# The Portal's git dependencies, vendored (vendor/SOURCES.md): GitHub refuses the fetch here.
[patch."https://github.com/marek-mraz-jc/joinedcontext-platform.git"]
jc-core = { path = "vendor/joinedcontext-platform/crates/jc-core" }
jcctl = { path = "vendor/joinedcontext-platform/crates/jcctl" }
context-gateway = { path = "vendor/joinedcontext-platform/crates/context-gateway" }

# One ngsild in the binary: the Portal's platform crates take Antares' own crates (the ngsild repository
# only carries released copies of them; vendor/ngsild is what the standalone Portal workspace builds
# against). Two path packages of one name and version cannot share a lockfile.
[patch."https://github.com/marek-mraz-jc/ngsild"]
ngsild-ql = { path = "crates/antares/crates/antares-ql" }
ngsild-jsonld = { path = "crates/antares/crates/antares-jsonld" }
ngsild-matcher = { path = "crates/antares/crates/antares-matcher" }
ngsild-model = { path = "crates/antares/crates/antares-model" }
