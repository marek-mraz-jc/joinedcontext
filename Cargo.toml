[workspace]
resolver = "3"
# Members join as each module gets code; folders hold their README until then.
members = [
  "crates/dataroom/core",
  "crates/dataroom/store-memory",
  "crates/dataroom/store-pg",
  "crates/dataroom/search",
  "crates/dataroom/rdf",
  "crates/dataroom/shacl",
  "crates/dataroom/harvest",
  "crates/dataroom/plugin",
  "crates/dataroom/api",
  "crates/dataroom/mcp",
  "crates/dataroom/web",
  "crates/dataroom/server",
  "crates/shared/jc-router",
  "crates/wardkeep/core",
  "crates/wardkeep/crypto",
  "crates/wardkeep/store-pg",
  "crates/wardkeep/store-memory",
  "crates/wardkeep/oidc",
  "crates/wardkeep/login",
  "crates/wardkeep/admin",
  "crates/wardkeep/import",
  "crates/wardkeep/mcp",
  "crates/wardkeep/server",
  "crates/controlroom/model",
  "crates/controlroom/expr",
  "crates/controlroom/query",
  "crates/controlroom/store-memory",
  "crates/controlroom/store-pg",
  "crates/controlroom/import",
  "crates/controlroom/api",
  "crates/controlroom/mcp",
  "crates/controlroom/server",
  "bins/jc",
]
# Joined repositories keep their own workspace (lockfile, lints, standalone binaries) for now; jc
# depends on their crates by path. Making them members is a later step (bins/jc/STATUS.md).
exclude = ["crates/ekiben", "crates/antares"]

# Antares pins rumqttc 0.25.1 with rustls-webpki 0.103 (crates/antares/vendor/rumqttc/README.md); a
# patch only takes effect from the root manifest.
[patch.crates-io]
rumqttc = { path = "crates/antares/vendor/rumqttc" }

[workspace.package]
edition = "2024"
license = "MIT"
