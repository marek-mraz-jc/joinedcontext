[package]
name = "functions"
version = "0.1.0"
# A member of the jc root workspace (vendor/SOURCES.md), so the fields the platform workspace
# handed down are written out here.
edition = "2021"
license = "EUPL-1.2"
repository = "https://github.com/marek-mraz-jc/joinedcontext-platform"
publish = false

[[bin]]
name = "jc-functions"
path = "src/main.rs"

[dependencies]
jc-core = { path = "../jc-core", version = "0.1.0", features = ["auth", "axum", "logs"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
# ekiben-js's exact pin, so the binary links one QuickJS; a bump is an advisory review of both.
rquickjs = { version = "=0.14.0", features = ["futures", "loader"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The realm's key set (`refresh_keys`), the version jc-core verifies with.
jsonwebtoken = "9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
# a throwaway realm per test run, as in the gateway's tests: no signing key in the repository
base64 = "0.22"
jsonwebtoken = "9"
ring = "0.17"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
