[package]
name = "jc-manifest"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The manifest repository: loading, assembly, validation and model schemas, shared by jcctl and the servers (T-4604)"

[dependencies]
jc-core = { path = "../jc-core", version = "0.1.0" }
# The one helper that starts a child process with a cleared environment (jc secrets design).
jc-secret = { path = "../../../../crates/shared/jc-secret" }
base64 = "0.22"
jsonschema = { version = "0.54", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
serde_norway = "0.9"
sha2 = "0.10"
thiserror.workspace = true
tracing = "0.1"
walkdir = "2"
# The Portal renders `model_schema`'s problems and attributes into its OpenAPI document.
utoipa = { version = "5", optional = true }

[dev-dependencies]
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
# archive_read_bento_tests writes a zip archive field by field (T-4752).
crc32fast = "1"
flate2 = "1"
