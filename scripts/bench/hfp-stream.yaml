# The production HSL HFP pipeline (deployment components/context-gateway/seed/helsinki/
# helsinki-pipeline-hfp-bento.yaml) as the Portal renders a resident source: stdin lines
# '<mqtt topic> <json>', broker batching count 1000 / period 1s. Run by stream-bench.py.
input:
  label: input_batches
  broker:
    inputs:
    - label: input
      stdin: {}
    batching:
      count: 1000
      period: 1s
pipeline:
  threads: ${BENCH_THREADS}
  processors:
  - mapping: 'let line = content().string()

      let i = $line.index_of(" {")

      meta mqtt_topic = $line.slice(0, $i)

      root = $line.slice($i + 1).parse_json()'
  - mutation: 'let topic = meta("mqtt_topic").or("").split("/")

      let mode = {"bus": "bus", "ubus": "bus", "robot": "bus", "tram": "tram", "metro":
      "metro", "train": "train", "ferry": "ferry"}.get($topic.index(6).catch("")).or("")

      let oper = $topic.index(7).catch("").re_match("^[0-9]{1,6}$")

      let veh = $topic.index(8).catch("").re_match("^[0-9]{1,6}$")

      meta mode = $mode

      meta vehicle = if $oper && $veh { "%v-%v".format($topic.index(7).number(), $topic.index(8).number())
      } else { "" }

      meta next_stop = $topic.index(13).catch("")

      root = if $mode == "" || !($oper && $veh) || content().length() > 4096 { deleted()
      }

      '
  - mapping: "let vp = this.VP.catch(null)\nroot = if $vp.type() != \"object\" ||\
      \ $vp.lat.type() != \"number\" || $vp.long.type() != \"number\" { deleted()\
      \ } else { {\n  \"lat\": $vp.lat, \"long\": $vp.long, \"spd\": $vp.spd, \"hdg\"\
      : $vp.hdg, \"tst\": $vp.tst, \"route\": $vp.route,\n  \"dl\": $vp.dl, \"occu\"\
      : $vp.occu,\n  \"_mode\": meta(\"mode\"), \"_vehicle\": meta(\"vehicle\"), \"\
      _next_stop\": meta(\"next_stop\")\n} }\n"
  - archive:
      format: json_array
  - mapping: 'root = this.unique(v -> v.string()).sort_by(v -> v.tst.ts_unix_nano().catch(0))

      '
  - unarchive:
      format: json_array
  - rate_limit:
      resource: hfp_vehicles
  - mutation: 'meta mode = this._mode

      meta vehicle = this._vehicle

      meta next_stop = this._next_stop

      root = this.without("_mode", "_vehicle", "_next_stop")

      '
  - mapping: 'let urn = "urn:ngsi-ld:%v:" + env("JC_ORG_DOMAIN") + ":" + env("JC_SPACE")
      + ":%v"

      let route = this.route.or("").string()

      let next_stop = meta("next_stop").or("")

      meta route_urn = if $route == "" { "none" } else { $urn.format("GtfsRoute",
      $route) }

      meta stop_urn = if !$next_stop.re_match("^[0-9]+$") { "none" } else { $urn.format("GtfsStop",
      $next_stop) }

      '
  - branch:
      request_map: root = ""
      processors:
      - cache:
          resource: gtfs
          operator: exists
          key: ${! meta("route_urn") }
      result_map: meta route_known = content().string()
  - branch:
      request_map: root = ""
      processors:
      - cache:
          resource: gtfs
          operator: exists
          key: ${! meta("stop_urn") }
      result_map: meta stop_known = content().string()
  - mapping: 'root = if this.tst.ts_parse("2006-01-02T15:04:05.999Z07:00").catch(null)
      == null { deleted() } else { this }

      '
  - mapping: "let domain = env(\"JC_ORG_DOMAIN\")\nlet id = \"urn:ngsi-ld:%v:%v:%v:%v\"\
      .format(\"Vehicle\", $domain, env(\"JC_SPACE\"), meta(\"vehicle\"))\nlet route\
      \ = this.route.or(\"\").string()\nroot = {\n  \"id\": $id,\n  \"type\": \"Vehicle\"\
      ,\n  \"location\": {\n    \"type\": \"GeoProperty\",\n    \"value\": { \"type\"\
      : \"Point\", \"coordinates\": [ this.long.number(), this.lat.number() ] },\n\
      \    \"observedAt\": this.tst\n  },\n  \"speed\": if this.spd.type() != \"number\"\
      \ { deleted() } else { {\n    \"type\": \"Property\",\n    \"value\": this.spd,\n\
      \    \"unitCode\": \"MTS\",\n    \"observedAt\": this.tst\n  } },\n  \"heading\"\
      : if this.hdg.type() != \"number\" { deleted() } else { {\n    \"type\": \"\
      Property\",\n    \"value\": this.hdg,\n    \"unitCode\": \"DD\",\n    \"observedAt\"\
      : this.tst\n  } },\n  \"route\": if $route == \"\" { deleted() } else { { \"\
      type\": \"Property\", \"value\": $route, \"observedAt\": this.tst } },\n  \"\
      onRoute\": if meta(\"route_known\") != \"true\" { deleted() } else { {\n   \
      \ \"type\": \"Relationship\", \"object\": meta(\"route_urn\"), \"observedAt\"\
      : this.tst\n  } },\n  \"nextStop\": if meta(\"stop_known\") != \"true\" { deleted()\
      \ } else { {\n    \"type\": \"Relationship\", \"object\": meta(\"stop_urn\"\
      ), \"observedAt\": this.tst\n  } },\n  \"delay\": if this.dl.type() != \"number\"\
      \ { deleted() } else { {\n    \"type\": \"Property\", \"value\": 0 - this.dl.number().round(),\
      \ \"unitCode\": \"SEC\", \"observedAt\": this.tst\n  } },\n  \"occupancy\":\
      \ if this.occu.type() != \"number\" { deleted() } else { {\n    \"type\": \"\
      Property\", \"value\": this.occu.number().round(), \"unitCode\": \"P1\", \"\
      observedAt\": this.tst\n  } },\n  \"transportMode\": { \"type\": \"Property\"\
      , \"value\": meta(\"mode\") },\n  \"vehicleType\": { \"type\": \"Property\"\
      , \"value\": {\"bus\": \"bus\", \"tram\": \"tram\", \"ferry\": \"passengerVessel\"\
      }.get(meta(\"mode\")).or(\"other\") },\n  \"fleetVehicleId\": { \"type\": \"\
      Property\", \"value\": meta(\"vehicle\") }\n}\n"
output:
  file:
    path: ${BENCH_OUT}
    codec: lines
rate_limit_resources:
- label: hfp_vehicles
  local:
    count: 100000000
    interval: 1s
cache_resources:
- label: gtfs
  memory: {}
logger:
  level: warn
metrics:
  none: {}
