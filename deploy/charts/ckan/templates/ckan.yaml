{{- $part := "ckan" }}
{{- $full := include "ckan.fullname" . }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $full }}-storage
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ckan.labels" (dict "root" . "part" $part) | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.ckan.storage.storageClass }}
  storageClassName: {{ .Values.ckan.storage.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.ckan.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ckan.labels" (dict "root" . "part" $part) | nindent 4 }}
spec:
  # The uploads claim is ReadWriteOnce: it binds to one node, so every CKAN pod runs on the
  # node that holds it (the affinity below). Scaling CKAN across nodes needs an RWX volume or
  # object storage.
  replicas: {{ .Values.ckan.replicaCount }}
  # The successor starts beside the running pod and takes traffic once its readiness probe
  # answers; `Recreate` stopped the old pod first and left the catalogue down ~40 s per deploy
  # (T-3032).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "ckan.selectorLabels" (dict "root" . "part" $part) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ckan.selectorLabels" (dict "root" . "part" $part) | nindent 8 }}
      annotations:
        # The theme is a mounted file, so a rebrand has to restart the pod to be seen.
        checksum/theme: {{ include (print $.Template.BasePath "/theme.yaml") . | sha256sum }}
        checksum/startup: {{ include (print $.Template.BasePath "/startup.yaml") . | sha256sum }}
        {{- with (include "ckan.podAnnotations" .) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- if .Values.serviceMesh.enabled }}
        # The proxy outlives the app's pause and the drain of what it let in (T-3008).
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: {{ add .Values.ckan.preStopSleepSeconds .Values.ckan.meshDrainSeconds | quote }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- if le (int .Values.ckan.terminationGracePeriodSeconds) (add .Values.ckan.preStopSleepSeconds .Values.ckan.meshDrainSeconds | int) }}
      {{- fail "ckan.terminationGracePeriodSeconds must be longer than preStopSleepSeconds + meshDrainSeconds, or the kubelet kills the pod mid-drain" }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.ckan.terminationGracePeriodSeconds }}
      # A roll's successor mounts the ReadWriteOnce uploads claim, which only the node that
      # holds it can: so it is placed beside the catalogue's running pod. The first pod matches
      # its own selector, which the scheduler lets through when no such pod runs yet.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "ckan.selectorLabels" (dict "root" . "part" $part) | nindent 18 }}
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        # `start_ckan.sh` edits $CKAN_INI in place with `ckan config-tool`; it never creates
        # it. The file it expects is the one `ckan generate config` wrote when the image was
        # built, at /srv/app/ckan.ini — and that path is read-only here, so $CKAN_INI points
        # at the emptyDir instead and the shipped file has to be copied there first. Without
        # this the entrypoint logs "Path '/tmp/ckan.ini' does not exist" four times, prerun
        # fails to init the database and uWSGI serves 500 until the liveness probe kills it.
        - name: seed-config
          image: {{ include "ckan.image" .Values.ckan.image }}
          imagePullPolicy: {{ .Values.ckan.image.pullPolicy }}
          command: ["cp", "/srv/app/ckan.ini", "/tmp/ckan.ini"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.ckan.resources | nindent 12 }}
      containers:
        - name: ckan
          image: {{ include "ckan.image" .Values.ckan.image }}
          imagePullPolicy: {{ .Values.ckan.image.pullPolicy }}
          env:
            # The emptyDir copy the init container placed there, not the read-only one in the
            # image: the entrypoint edits this file in place with `ckan config-tool` on every
            # start, and the root filesystem is read-only.
            - name: CKAN_INI
              value: /tmp/ckan.ini
            - name: CKAN_SITE_URL
              value: {{ .Values.siteUrl | quote }}
            - name: CKAN__PLUGINS
              # `oidc_pkce` and `dcat` are listed only when their flag is on: CKAN exits on a
              # plugin it cannot import, so the list and the image have to agree (T-0403,
              # T-3010).
              {{- $plugins := .Values.ckan.plugins }}
              {{- if .Values.ckan.sso.enabled }}{{ $plugins = printf "%s oidc_pkce" $plugins }}{{ end }}
              {{- if .Values.ckan.dcat.enabled }}{{ $plugins = printf "%s dcat" $plugins }}{{ end }}
              value: {{ $plugins | quote }}
            # CKAN 2.11 defaults `ckan.auth.public_user_details` to true, which let an
            # anonymous `user_list` name every account and which one is sysadmin (T-4172).
            # `ckanext-envvars` maps this name to that option.
            - name: CKAN__AUTH__PUBLIC_USER_DETAILS
              value: "false"
            # No Gravatar: a signed-in page would send each account's e-mail hash to gravatar.com,
            # and the catalogue's CSP allows images from its own hosts only (T-5147).
            - name: CKAN__GRAVATAR_DEFAULT
              value: disabled
            # An anonymous action API answer is public for 60 s (T-4717), which is what lets the
            # edge's ckan-action-cache route keep it; a page with a session stays `private`.
            - name: CKAN__CACHE_EXPIRES
              value: "60"
            # The catalogue's publishers are Slovak, Czech and Finnish bodies: CKAN serves a
            # language only under its offered prefix (/sk/…), and with English alone a Slovak
            # visitor had no way to Slovak at all (T-4199). Slovak is the default, the others a
            # click in the footer's menu away.
            {{- if .Values.vizOrigin }}
            # The chart renderer's host page reads a published view anonymously through the
            # action API (T-4641, ADR-N-053 §2.5); no other origin gets a CORS answer.
            - name: CKAN__CORS__ORIGIN_WHITELIST
              value: {{ .Values.vizOrigin | quote }}
            {{- end }}
            - name: CKAN__LOCALE_DEFAULT
              value: {{ .Values.ckan.locales.default | quote }}
            - name: CKAN__LOCALES_OFFERED
              value: {{ .Values.ckan.locales.offered | join " " | quote }}
            - name: CKAN_STORAGE_PATH
              value: /var/lib/ckan
            - name: PYTHONPATH
              value: /srv/theme
            - name: JC_BRANDING_FILE
              value: /etc/jc/branding/branding.json
            - name: JC_ASSISTANT_WIDGET_URL
              value: {{ .Values.assistantWidget | quote }}
            - name: JC_ASSISTANT_WIDGET_URLS
              value: {{ .Values.assistantWidgets | default dict | toJson | quote }}
            # The basemap under the dataset map (T-4639); the theme accepts only the tiles host's
            # style or OpenStreetMap's tiles, so anything else draws the data alone.
            - name: JC_MAP_BASEMAP
              value: {{ .Values.mapBasemap | default dict | toJson | quote }}
            # Gemini's card on the assistants page (T-4643), off until its sign-in works here.
            - name: JC_ASSISTANT_GEMINI
              value: {{ (.Values.assistants | default dict).gemini | default false | toString | quote }}
            # The websites the hub's search_documents reads, listed on the assistants page (T-4659).
            - name: JC_ASSISTANT_SOURCES
              value: {{ (.Values.assistants | default dict).sources | default list | toJson | quote }}
            - name: CKAN_SOLR_URL
              value: http://{{ $full }}-solr.{{ .Release.Namespace }}.svc.cluster.local:8983/solr/ckan
            - name: CKAN_REDIS_URL
              value: redis://{{ $full }}-redis.{{ .Release.Namespace }}.svc.cluster.local:6379/0
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secret.name }}
                  key: {{ .Values.database.secret.key }}
            - name: CKAN_SQLALCHEMY_URL
              value: postgresql://{{ .Values.database.user }}:$(PGPASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}
            - name: CKAN_DATASTORE_WRITE_URL
              value: postgresql://{{ .Values.database.user }}:$(PGPASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.datastoreName }}
            - name: DATASTORE_READ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.datastoreRead.secret.name }}
                  key: {{ .Values.database.datastoreRead.secret.key }}
            # A different role from the write URL above, and one that holds SELECT and
            # nothing else. CKAN checks this at startup and refuses to run when the two are
            # the same, because `datastore_search_sql` runs caller-supplied SQL on it.
            - name: CKAN_DATASTORE_READ_URL
              value: postgresql://{{ .Values.database.datastoreRead.user }}:$(DATASTORE_READ_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.datastoreName }}
            # Pool ceilings (values.yaml `database.pool`). `ckanext-envvars` strips the `CKAN___`
            # prefix, so these land as `sqlalchemy.pool_size` and the DataStore's
            # `ckan.datastore.sqlalchemy.pool_size`, both read when the engines are created.
            - name: CKAN___SQLALCHEMY__POOL_SIZE
              value: {{ .Values.database.pool.size | quote }}
            - name: CKAN___SQLALCHEMY__MAX_OVERFLOW
              value: {{ .Values.database.pool.maxOverflow | quote }}
            - name: CKAN__DATASTORE__SQLALCHEMY__POOL_SIZE
              value: {{ .Values.database.datastorePool.size | quote }}
            - name: CKAN__DATASTORE__SQLALCHEMY__MAX_OVERFLOW
              value: {{ .Values.database.datastorePool.maxOverflow | quote }}
            # Read by files/startup/00-secret-key.sh, which writes the session secret into the ini
            # itself; a `CKAN___` variable would work too (ckanext-envvars maps it, as the pool
            # caps above), but this name keeps the secret out of the plugin's environment walk.
            - name: JC_CKAN_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.session.name }}
                  key: {{ .Values.secrets.session.key }}
            - name: CKAN_SYSADMIN_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.admin.name }}
                  key: {{ .Values.secrets.admin.userKey }}
            - name: CKAN_SYSADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.admin.name }}
                  key: {{ .Values.secrets.admin.passwordKey }}
            - name: CKAN_SYSADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.admin.name }}
                  key: {{ .Values.secrets.admin.emailKey }}
            {{- if .Values.ckan.sso.enabled }}
            {{- $issuer := urlParse .Values.ckan.sso.issuer }}
            # Keycloak login through `ckanext-oidc-pkce`, which the image built from
            # `images/ckan/Dockerfile` carries and the stock one does not. The extension reads
            # these three from the environment itself (`os.environ.get` in its `config.py`);
            # every other option it reads from the ini only, so 01-oidc.sh writes those.
            - name: CKANEXT_OIDC_PKCE_BASE_URL
              value: {{ printf "%s://%s" $issuer.scheme $issuer.host | quote }}
            - name: CKANEXT_OIDC_PKCE_CLIENT_ID
              value: {{ .Values.ckan.sso.clientId | quote }}
            # The same two as options: the extension declares them `required`, and CKAN 2.11
            # validates its config before the extension ever reads the environment, so without
            # them CKAN exits "ckanext.oidc_pkce.base_url: Missing value". `ckanext-envvars`
            # maps `CKANEXT__A__B` to `ckanext.a.b`. The secret is optional there and stays
            # env-only.
            - name: CKANEXT__OIDC_PKCE__BASE_URL
              value: {{ printf "%s://%s" $issuer.scheme $issuer.host | quote }}
            - name: CKANEXT__OIDC_PKCE__CLIENT_ID
              value: {{ .Values.ckan.sso.clientId | quote }}
            # The client stays confidential: its secret is only ever this reference, never a
            # value in the ini, an image layer or a log line.
            - name: CKANEXT_OIDC_PKCE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-{{ .Values.ckan.sso.clientId }}
                  key: client-secret
            # Read by files/startup/01-oidc.sh, not by CKAN — same reason as the secret key
            # above: 2.11 has no `CKAN___<OPTION>` env override.
            - name: JC_OIDC_REALM_PATH
              value: {{ $issuer.path | quote }}
            - name: JC_OIDC_SCOPE
              value: {{ .Values.ckan.sso.scope | quote }}
            {{- end }}
            {{- if .Values.ckan.dcat.enabled }}
            # DCAT-AP 3 on /catalog.{rdf,ttl,jsonld} and /dataset/{id}.{rdf,ttl,jsonld}:
            # ckanext-dcat's profile, then the theme's, which puts the controlled vocabularies
            # and the catalogue's publisher on top (files/jc_theme/dcat_profile.py).
            # `ckanext-envvars` maps the name to `ckanext.dcat.rdf.profiles`.
            - name: CKANEXT__DCAT__RDF__PROFILES
              value: euro_dcat_ap_3 jc_dcat_ap
            # ckanext-dcat renames every extra of a page's dataset to an English label
            # (`conforms_to` -> `Conforms to`) by default; the theme labels those keys itself, in
            # the page's language, and found none of them once they were renamed (T-3025). The
            # RDF endpoints never read this.
            - name: CKANEXT__DCAT__TRANSLATE_KEYS
              value: "false"
            {{- end }}
            {{- range $name, $value := .Values.ckan.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 5000
          # APISIX and the mesh still send to a stopping pod until they see its endpoint go, so
          # it keeps serving that long before uWSGI is told to stop (OPS-27, T-3008).
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.ckan.preStopSleepSeconds }}
          readinessProbe:
            httpGet:
              path: /api/3/action/status_show
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/3/action/status_show
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            initialDelaySeconds: 60
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /var/lib/ckan
            - name: tmp
              mountPath: /tmp
            - name: branding
              mountPath: /etc/jc/branding
              readOnly: true
            # `start_ckan.sh` sources every *.sh here after it has minted its own
            # secrets and before uWSGI starts. Mounted as a directory, not with a
            # subPath, because the entrypoint globs it.
            - name: startup
              mountPath: /docker-entrypoint.d
              readOnly: true
            # A CKAN plugin is found through its entry point, so the package and the
            # `dist-info` that declares it are mounted file by file into one directory on
            # PYTHONPATH. A ConfigMap has no directories of its own, which is why each file
            # names its own subPath.
            - name: theme
              mountPath: /srv/theme/ckanext_jc_theme/__init__.py
              subPath: __init__.py
              readOnly: true
            - name: theme
              mountPath: /srv/theme/ckanext_jc_theme/plugin.py
              subPath: plugin.py
              readOnly: true
            - name: theme
              mountPath: /srv/theme/ckanext_jc_theme/dcat_profile.py
              subPath: dcat_profile.py
              readOnly: true
            # The NUTS region names plugin.py reads beside itself (T-4636).
            - name: theme
              mountPath: /srv/theme/ckanext_jc_theme/nuts.json
              subPath: nuts.json
              readOnly: true
            - name: theme
              mountPath: /srv/theme/ckanext_jc_theme/templates/header.html
              subPath: header.html
              readOnly: true
            - name: theme
              mountPath: /srv/theme/ckanext_jc_theme/templates/footer.html
              subPath: footer.html
              readOnly: true
            - name: theme
              mountPath: /srv/theme/ckanext_jc_theme-0.1.0.dist-info/METADATA
              subPath: METADATA
              readOnly: true
            - name: theme
              mountPath: /srv/theme/ckanext_jc_theme-0.1.0.dist-info/entry_points.txt
              subPath: entry_points.txt
              readOnly: true
            # The page templates and static files beyond the header and footer (T-2744): a key
            # with `__` is the file's path under the package, `__` for `/`.
            {{- range $path, $_ := .Files.Glob "files/jc_theme/{templates,public}__*" }}
            - name: theme
              mountPath: /srv/theme/ckanext_jc_theme/{{ base $path | replace "__" "/" }}
              subPath: {{ base $path }}
              readOnly: true
            {{- end }}
            {{- if and (.Values.branding.logoSvg | default "") (.Values.branding.logo | default "") }}
            # CKAN serves the logo from the theme's public directory, so `ckan.site_logo`
            # is a path on this origin and no page fetches an asset from anywhere else.
            - name: theme
              mountPath: /srv/theme/ckanext_jc_theme/public/{{ .Values.branding.logo }}
              subPath: {{ .Values.branding.logo }}
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.ckan.resources | nindent 12 }}
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ $full }}-storage
        - name: tmp
          emptyDir: {}
        - name: branding
          configMap:
            name: {{ $full }}-theme
            items:
              - key: branding.json
                path: branding.json
              - key: organizations.json
                path: organizations.json
              - key: hidden.json
                path: hidden.json
        - name: theme
          configMap:
            name: {{ $full }}-theme
        - name: startup
          configMap:
            name: {{ $full }}-startup
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ckan.labels" (dict "root" . "part" $part) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ckan.selectorLabels" (dict "root" . "part" $part) | nindent 4 }}
  ports:
    - name: http
      port: 5000
      targetPort: http
