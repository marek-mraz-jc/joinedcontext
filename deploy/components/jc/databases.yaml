        - { schema: 'public', table: 'cr_dashboard', columns: [installation_id, org_id, instance_id, project_id, uid, folder_uid, title, slug, tags, panel_count, datasource_uids, version, schema_version, is_provisioned, provisioned_external_id, allow_ui_updates, model, created_by, updated_by, created_at, updated_at] }
        - { schema: 'public', table: 'cr_dashboard_version', columns: [installation_id, org_id, instance_id, dashboard_uid, version, parent_version, restored_from, message, model, created_by, created_at] }
        - { schema: 'public', table: 'cr_datasource', columns: [installation_id, org_id, instance_id, project_id, uid, name, kind, access, url, is_default, read_only, json_data, allow_hosts, wasm_digest, version, created_at, updated_at] }
        - { schema: 'public', table: 'cr_library_panel', columns: [installation_id, org_id, instance_id, folder_uid, uid, name, panel_type, description, model, version, created_at, updated_at] }
        - { schema: 'public', table: 'cr_alert_rule', columns: [installation_id, org_id, instance_id, uid, folder_uid, title, spec, updated_at] }
        - { schema: 'public', table: 'cr_alert_state', columns: [installation_id, org_id, instance_id, rule_uid, state, updated_at] }
