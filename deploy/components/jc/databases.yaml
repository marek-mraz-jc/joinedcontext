---
# jc's Postgres stores on the shared postgres-cluster, one per module (bins/jc/STATUS.md stage 8b):
# without its database a module keeps memory, and a restart loses its repositories, dashboards,
# datasets and streams.
# The Portal migrates as jc_portal, the owner of every table and trigger, and serves as
# jc_portal_app, which it grants the rows of its tables at each start and on the operators' audit
# INSERT and SELECT alone, so the running Portal cannot drop the audit's triggers (T-7179).
jc_portal:
  name: 'jc_portal'
  embedded: true
  user: 'jc_portal'
  secret:
    name: 'db-jc-portal'
    key: 'password'
    generate: true
  hostServiceName: 'postgres-cluster-rw'
  port: 5432
  additionalRoles:
    - name: 'jc_portal_app'
      type: 'login'
      credentialsSecret:
        name: 'db-jc-portal-app'
        passwordKey: 'password'
jc_antares:
  name: 'jc_antares'
  embedded: true
  user: 'jc_antares'
  secret:
    name: 'db-jc-antares'
    key: 'password'
    generate: true
  hostServiceName: 'postgres-cluster-rw'
  port: 5432
  # Antares' first migration needs both, neither of which PostgreSQL trusts (components/context-broker).
  extensions:
    - name: 'postgis'
      ensure: present
    - name: 'btree_gin'
      ensure: present
  # The Portal's data backup reader (T-7170): as the module readers below, under Antares' own
  # row-level security per tenant.
  # jc_antares owns the tables and migrates; with jc.antaresRoleSplit the broker serves as
  # jc_antares_app (rows only, no group, never past row-level security) and runs the cross-Tenant
  # work (outbox drain, reaps, retention, the Tenant inventory) as jc_antares_maint, a member of
  # antares_maintenance, the role migration 0042 keys the escape on (T-7307, T-7310).
  additionalRoles:
    - name: 'jc_antares_app'
      type: 'dml'
      credentialsSecret:
        name: 'db-jc-antares-app'
        passwordKey: 'password'
    - name: 'jc_antares_maint'
      type: 'dml'
      memberOf: ['antares_maintenance']
      credentialsSecret:
        name: 'db-jc-antares-maint'
        passwordKey: 'password'
    - name: 'antares_backup'
      type: 'backup'
      credentialsSecret:
        name: 'db-jc-antares-backup'
        passwordKey: 'password'
      grants:
        - { schema: 'public', table: 'entities', columns: [tenant_id, id, entity, version, types, scopes, location, location_ambiguous, created_at, modified_at, expires_at, attrs_expire_at] }
        - { schema: 'public', table: 'temporal_entities', columns: [tenant_id, id, types, scopes, meta, created_at, modified_at, deleted_at, dataset_attrs, offset_until, bare] }
        - { schema: 'public', table: 'iri_ids', columns: [tenant_id, id, iri] }
        - { schema: 'public', table: 'attr_rows', columns: [tenant_id, entity_no, attr_no, instance_no, dataset_id, observed_at, created_at, modified_at, deleted_at, data, geo_value, version, provenance, short] }
        - { schema: 'public', table: 'attr_instances', columns: [tenant_id, entity_id, attr_id, instance_id, dataset_id, observed_at, created_at, modified_at, deleted_at, data, geo_value, version, provenance] }
        - { schema: 'public', table: 'attr_versions', columns: [tenant_id, entity_id, attr_id, instance_id, dataset_id, observed_at, version, data, provenance, superseded_at] }
        - { schema: 'public', table: 'entity_id_remap', columns: [tenant_id, old_id, new_id, remapped_at] }
        - { schema: 'public', table: 'jsonld_contexts', columns: [id, body, kind, created_at, tenant_id] }
# kaisatsu's migrations grant to the role named kaisatsu_app (crates/kaisatsu/store-pg/migrations),
# so the names are fixed. kaisatsu_app gets CONNECT here; its table rights come from the migrations.
jc_kaisatsu:
  name: 'jc_kaisatsu'
  embedded: true
  user: 'kaisatsu_migrate'
  secret:
    name: 'db-jc-kaisatsu'
    key: 'password'
    generate: true
  hostServiceName: 'postgres-cluster-rw'
  port: 5432
  additionalRoles:
    - name: 'kaisatsu_app'
      type: 'readonly'
      credentialsSecret:
        name: 'db-jc-kaisatsu-app'
        passwordKey: 'password'
    # The Portal's data backup reader (T-7169): SELECT on the columns
    # crates/portal/src/org_backup/modules.rs exports and nothing else, NOBYPASSRLS, so the
    # module's row-level security still decides what it sees. A Portal test holds these lists
    # equal to the Portal's.
    - name: 'kaisatsu_backup'
      type: 'backup'
      credentialsSecret:
        name: 'db-jc-kaisatsu-backup'
        passwordKey: 'password'
      grants:
        - { schema: 'kaisatsu', table: 'organizations', columns: [realm_id, org_id, alias, doc] }
        - { schema: 'kaisatsu', table: 'organization_domains', columns: [realm_id, org_id, domain_lower, verified] }
        - { schema: 'kaisatsu', table: 'memberships', columns: [realm_id, org_id, person_id, doc] }
        - { schema: 'kaisatsu', table: 'groups', columns: [realm_id, id, org_id, path, doc] }
        - { schema: 'kaisatsu', table: 'group_members', columns: [realm_id, group_id, user_id, org_id, doc] }
        - { schema: 'kaisatsu', table: 'people', columns: [realm_id, id, org_id, username_lower, email_lower, transient, doc] }
        - { schema: 'kaisatsu', table: 'roles', columns: [realm_id, id, container_id, client_role, name, doc] }
        - { schema: 'kaisatsu', table: 'role_mappings', columns: [realm_id, id, principal_kind, principal_id, client_uuid, role_name, doc] }
        - { schema: 'kaisatsu', table: 'applications', columns: [realm_id, id, org_id, client_id, doc] }
        - { schema: 'kaisatsu', table: 'client_scopes', columns: [realm_id, id, name, doc] }
        - { schema: 'kaisatsu', table: 'required_actions', columns: [realm_id, alias, doc] }
        - { schema: 'kaisatsu', table: 'branding_blocks', columns: [realm_id, org_key, org_id, doc] }
        - { schema: 'kaisatsu', table: 'events', columns: [realm_id, id, org_id, doc] }
        - { schema: 'kaisatsu', table: 'admin_events', columns: [realm_id, id, org_id, doc] }
# shako, daiya, dataroom and ekiben: the same split as kaisatsu. The owner <m>_migrate runs the
# migrations, which create and grant the request role <m>_app (shako, daiya by name; dataroom and
# ekiben grant the role jc's url names at each start). `login` keeps the role job from revoking
# those grants at every upgrade (daiya's tables sit in schema public).
jc_shako:
  name: 'jc_shako'
  embedded: true
  user: 'shako_migrate'
  secret:
    name: 'db-jc-shako'
    key: 'password'
    generate: true
  hostServiceName: 'postgres-cluster-rw'
  port: 5432
  additionalRoles:
    - name: 'shako_app'
      type: 'login'
      credentialsSecret:
        name: 'db-jc-shako-app'
        passwordKey: 'password'
    # The Portal's data backup reader (T-7169): SELECT on the columns
    # crates/portal/src/org_backup/modules.rs exports and nothing else, NOBYPASSRLS, so the
    # module's row-level security still decides what it sees. A Portal test holds these lists
    # equal to the Portal's.
    - name: 'shako_backup'
      type: 'backup'
      credentialsSecret:
        name: 'db-jc-shako-backup'
        passwordKey: 'password'
      grants:
        - { schema: 'shako', table: 'repo', columns: [id, instance_id, org_id, project_id, owner, name, description, default_branch, private, archived, size_bytes, next_pr_number, created_at, updated_at] }
        - { schema: 'shako', table: 'protection_rule', columns: [id, instance_id, org_id, repo_id, kind, rule_name, doc, created_at, updated_at] }
        - { schema: 'shako', table: 'pull_request', columns: [id, instance_id, org_id, repo_id, number, state, title, body, head_ref, head_sha, base_ref, base_sha, merge_base, mergeable, merged, merge_commit_sha, author_login, author_name, author_email, created_at, updated_at, closed_at] }
        - { schema: 'shako', table: 'review', columns: [id, instance_id, org_id, repo_id, pr_number, verdict, body, author_login, commit_id, dismissed, created_at] }
        - { schema: 'shako', table: 'commit_status', columns: [id, instance_id, org_id, repo_id, sha, context, state, description, target_url, updated_at] }
