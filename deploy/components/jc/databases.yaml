  additionalRoles:
    - name: 'daiya_app'
      type: 'login'
      credentialsSecret:
        name: 'db-jc-daiya-app'
        passwordKey: 'password'
    # The Portal's data backup reader (T-7169): SELECT on the columns
    # crates/portal/src/org_backup/modules.rs exports and nothing else, NOBYPASSRLS, so the
    # module's row-level security still decides what it sees. A Portal test holds these lists
    # equal to the Portal's.
    - name: 'daiya_backup'
      type: 'backup'
      credentialsSecret:
        name: 'db-jc-daiya-backup'
        passwordKey: 'password'
      grants:
