---
ckan:
  name: ckan
  description: Catalogue web headers and rate limiting
  plugins:
    request-id:
      include_in_response: true
    # Every route clears the headers the platform trusts internally, not only the
    # authenticated ones (T-0026): a client that can set them can claim a tenant or an
    # identity. X-Forwarded-For stays — nginx maintains it and the rate limit keys on it.
    # Each name is cleared twice, hyphenated and with underscores (T-1672): the http block
    # runs with `underscores_in_headers on`, so `X_Userinfo` survives to the upstream as a
    # header of its own, and a WSGI or CGI upstream folds it onto the same name the
    # hyphenated spelling has. The Lua is identical on every route and a test holds it so.
    serverless-pre-function:
      phase: rewrite
      functions:
        - >-
          return function()
            local forged = {
              "NGSILD-Tenant", "X-Userinfo", "X-Access-Token", "X-Allowed-Scope-Ids",
              "X-Endpoint-Slug", "X-Consumer-Identity", "X-Forwarded-User",
              "X-Forwarded-Host", "X-Forwarded-Proto", "X-Forwarded-Port",
              "X-Forwarded-Prefix", "X-Forwarded-Server", "X-Real-IP", "JC-Read-Versions",
            }
            for _, header in ipairs(forged) do
              ngx.req.clear_header(header)
              ngx.req.clear_header((header:gsub("%-", "_")))
            end
            for name in pairs(ngx.req.get_headers(0)) do
              local key = name:lower():gsub("_", "-")
              for _, prefix in ipairs({ "x-jc-", "jc-provenance-", "l5d-" }) do
                if key:sub(1, #prefix) == prefix and key ~= "x-jc-visitor" then
                  ngx.req.clear_header(name)
                end
              end
            end
          end
    # Data class (T-4717): 600 requests a minute per client address, 10 a second, for the
    # pages and the CKAN action API alike. A bot can read the whole catalogue at that rate and
    # only that bot gets 429; the fingerprinted assets count apart (ckan-webassets).
    limit-count:
      count: 600
      time_window: 60
      key_type: var
      key: remote_addr
      rejected_code: 429
      policy: local
      show_limit_quota_header: true
    proxy-rewrite:
      headers:
        set:
          X-Forwarded-Proto: https
          X-Forwarded-Port: '443'
    response-rewrite:
      headers:
        set:
          Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
          X-Content-Type-Options: "nosniff"
          # CKAN frames its own resource previews (the `*_view` plugins), so DENY would
          # blank every preview on every dataset page.
          X-Frame-Options: "SAMEORIGIN"
          Referrer-Policy: "strict-origin-when-cross-origin"
    # OPS-34: the upstream owns the Content Security Policy (the Portal's, each App's, AP-12,
    # AP-122), so the edge sets none over it and adds this baseline only to an answer that
    # carries none, its own refusals included. `frame-ancestors` says what X-Frame-Options
    # says. It runs after `response-rewrite`, whose `add` of an App's frame-ancestors counts.
    serverless-post-function:
      phase: header_filter
      functions:
        - >-
          return function()
            if ngx.header["Content-Security-Policy"] == nil then
              ngx.header["Content-Security-Policy"] =
                "frame-ancestors 'self'; object-src 'none'; base-uri 'self'"
            end
          end


# T-4639: /map/{dataset}, the dataset map any site may frame. The catalogue's headers and bucket,
# but no X-Frame-Options and `frame-ancestors *`, and no cookie: the page holds no form and no
# session, and its data is the Endpoint's anonymous reads, made by the visitor's browser.
ckan-map:
  name: ckan-map
  description: The framable dataset map
  plugins:
    request-id:
      include_in_response: true
    # Every route clears the headers the platform trusts internally, not only the
    # authenticated ones (T-0026): a client that can set them can claim a tenant or an
    # identity. X-Forwarded-For stays — nginx maintains it and the rate limit keys on it.
    # Each name is cleared twice, hyphenated and with underscores (T-1672): the http block
    # runs with `underscores_in_headers on`, so `X_Userinfo` survives to the upstream as a
    # header of its own, and a WSGI or CGI upstream folds it onto the same name the
    # hyphenated spelling has. The Lua is identical on every route and a test holds it so.
    serverless-pre-function:
      phase: rewrite
      functions:
        - >-
          return function()
            local forged = {
              "NGSILD-Tenant", "X-Userinfo", "X-Access-Token", "X-Allowed-Scope-Ids",
              "X-Endpoint-Slug", "X-Consumer-Identity", "X-Forwarded-User",
              "X-Forwarded-Host", "X-Forwarded-Proto", "X-Forwarded-Port",
              "X-Forwarded-Prefix", "X-Forwarded-Server", "X-Real-IP", "JC-Read-Versions",
            }
            for _, header in ipairs(forged) do
              ngx.req.clear_header(header)
              ngx.req.clear_header((header:gsub("%-", "_")))
            end
            for name in pairs(ngx.req.get_headers(0)) do
              local key = name:lower():gsub("_", "-")
              for _, prefix in ipairs({ "x-jc-", "jc-provenance-", "l5d-" }) do
                if key:sub(1, #prefix) == prefix and key ~= "x-jc-visitor" then
                  ngx.req.clear_header(name)
                end
              end
            end
          end
    # Class 1 (standard web): a catalogue is browsed and crawled, not called in a loop.
    limit-count:
      count: 300
      time_window: 60
      key_type: var
      key: remote_addr
      rejected_code: 429
      policy: local
      show_limit_quota_header: true
    proxy-rewrite:
      headers:
        set:
          X-Forwarded-Proto: https
          X-Forwarded-Port: '443'
    response-rewrite:
      headers:
        set:
          Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
          X-Content-Type-Options: "nosniff"
          Referrer-Policy: "strict-origin-when-cross-origin"
        # CKAN's session cookie never reaches the site that frames the map.
        remove:
          - Set-Cookie
    # The map page names its own frame-ancestors * (jc_map_page); an answer without a policy,
    # a 404 say, gets the DENY baseline (OPS-34).
    serverless-post-function:
      phase: header_filter
      functions:
        - >-
          return function()
            if ngx.header["Content-Security-Policy"] == nil then
              ngx.header["Content-Security-Policy"] =
                "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
            end
          end

ckan-redirect:
  name: ckan-redirect
  description: Send /ckan on the primary host to the catalogue host
  plugins:
    request-id:
      include_in_response: true
    # A route that answers by itself is still a route (T-1672): the sanitisation and the
    # response headers of every other route apply here too, so the rule stays mechanical and
    # nothing depends on this route continuing to terminate.
    serverless-pre-function:
      phase: rewrite
      functions:
        - >-
          return function()
            local forged = {
              "NGSILD-Tenant", "X-Userinfo", "X-Access-Token", "X-Allowed-Scope-Ids",
              "X-Endpoint-Slug", "X-Consumer-Identity", "X-Forwarded-User",
              "X-Forwarded-Host", "X-Forwarded-Proto", "X-Forwarded-Port",
              "X-Forwarded-Prefix", "X-Forwarded-Server", "X-Real-IP", "JC-Read-Versions",
            }
            for _, header in ipairs(forged) do
              ngx.req.clear_header(header)
              ngx.req.clear_header((header:gsub("%-", "_")))
            end
            for name in pairs(ngx.req.get_headers(0)) do
              local key = name:lower():gsub("_", "-")
              for _, prefix in ipairs({ "x-jc-", "jc-provenance-", "l5d-" }) do
                if key:sub(1, #prefix) == prefix and key ~= "x-jc-visitor" then
                  ngx.req.clear_header(name)
                end
              end
            end
          end
    # Class 1 (standard web), the same bucket the sibling redirect on the apex uses.
    limit-count:
      count: 300
      time_window: 60
      key_type: var
      key: remote_addr
      rejected_code: 429
      policy: local
      show_limit_quota_header: true
    # The route terminates here: APISIX answers 302 in the rewrite phase and never dials
    # the upstream the route declares.
    redirect:
      uri: "https://opendata.${DOMAIN}/"
      ret_code: 302
    response-rewrite:
      headers:
        set:
          Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
          X-Content-Type-Options: "nosniff"
          X-Frame-Options: "DENY"
          Referrer-Policy: "strict-origin-when-cross-origin"
          Cache-Control: "no-store, no-cache, must-revalidate"
    # OPS-34: the upstream owns the Content Security Policy (the Portal's, each App's, AP-12,
    # AP-122), so the edge sets none over it and adds this baseline only to an answer that
    # carries none, its own refusals included. `frame-ancestors` says what X-Frame-Options
    # says. It runs after `response-rewrite`, whose `add` of an App's frame-ancestors counts.
    serverless-post-function:
      phase: header_filter
      functions:
        - >-
          return function()
            if ngx.header["Content-Security-Policy"] == nil then
              ngx.header["Content-Security-Policy"] =
                "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
            end
          end

ckan-old-host:
  name: ckan-old-host
  description: The catalogue's old host data.{domain} answers 301 to opendata.{domain}, same path and query (T-4679)
  plugins:
    request-id:
      include_in_response: true
    # A route that answers by itself is still a route (T-1672): the sanitisation and the
    # response headers of every other route apply here too, so the rule stays mechanical and
    # nothing depends on this route continuing to terminate.
    serverless-pre-function:
      phase: rewrite
      functions:
        - >-
          return function()
            local forged = {
              "NGSILD-Tenant", "X-Userinfo", "X-Access-Token", "X-Allowed-Scope-Ids",
              "X-Endpoint-Slug", "X-Consumer-Identity", "X-Forwarded-User",
              "X-Forwarded-Host", "X-Forwarded-Proto", "X-Forwarded-Port",
              "X-Forwarded-Prefix", "X-Forwarded-Server", "X-Real-IP", "JC-Read-Versions",
            }
            for _, header in ipairs(forged) do
              ngx.req.clear_header(header)
              ngx.req.clear_header((header:gsub("%-", "_")))
            end
            for name in pairs(ngx.req.get_headers(0)) do
              local key = name:lower():gsub("_", "-")
              for _, prefix in ipairs({ "x-jc-", "jc-provenance-", "l5d-" }) do
                if key:sub(1, #prefix) == prefix and key ~= "x-jc-visitor" then
                  ngx.req.clear_header(name)
                end
              end
            end
          end
    # Class 1 (standard web), the same bucket the sibling redirect on the apex uses.
    limit-count:
      count: 300
      time_window: 60
      key_type: var
      key: remote_addr
      rejected_code: 429
      policy: local
      show_limit_quota_header: true
    # Shared links, harvesters and the DCAT isPartOf values in the broker name the old host:
    # the same path and query on the new one, never a target read from the request.
    redirect:
      uri: "https://opendata.${DOMAIN}$request_uri"
      ret_code: 301
    response-rewrite:
      headers:
        set:
          Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
          X-Content-Type-Options: "nosniff"
          X-Frame-Options: "DENY"
          Referrer-Policy: "strict-origin-when-cross-origin"
          Cache-Control: "no-store, no-cache, must-revalidate"
    # OPS-34: the upstream owns the Content Security Policy (the Portal's, each App's, AP-12,
    # AP-122), so the edge sets none over it and adds this baseline only to an answer that
    # carries none, its own refusals included. `frame-ancestors` says what X-Frame-Options
    # says. It runs after `response-rewrite`, whose `add` of an App's frame-ancestors counts.
    serverless-post-function:
      phase: header_filter
      functions:
        - >-
          return function()
            if ngx.header["Content-Security-Policy"] == nil then
              ngx.header["Content-Security-Policy"] =
                "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
            end
          end
