---
apisix:
  podSelector:
    app.kubernetes.io/name: apisix
    app.kubernetes.io/instance: apisix-apisix
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Data plane (9080): the public HTTP entry point, reached through the cluster ingress
    # controller and nothing else. APISIX trusts X-Real-IP from the whole pod network
    # (`trustedProxyCidr`, T-0929), so any other pod that reached 9080 could name itself any
    # caller and spend that caller's rate limit (T-0939, EP-20). The controller is Traefik in
    # `traefik` (kube-hetzner) or `kube-system` (plain k3s), or ingress-nginx; the same peer
    # the pipeline runner's policy names. The node's own probes are always admitted.
    # The Admin API does not exist in standalone mode (ADR-N-007), so no 9180 rule.
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [traefik, kube-system, ingress-nginx]
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [traefik, ingress-nginx]
      ports:
        - protocol: TCP
          port: 9080
  egress:
    # CoreDNS. Every rule below names a Service, and a Service name is worth nothing
    # without this one.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The upstreams the standalone rule file routes to, and nothing else: a route added
    # without a matching line here fails at the gateway, which is the point.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: keycloak-app
          componentNamespace: keycloak
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: portal-portal
          componentNamespace: portal
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: context-gateway-gateway
          componentNamespace: context-gateway
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gitea
              app.kubernetes.io/instance: gitea-forge
          componentNamespace: gitea
      ports:
        - protocol: TCP
          port: 3000
    # A server WASM App's API, /apps/{name}/api/* on its shard (AP-143, T-3361).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: wasm-host-shard
          componentNamespace: wasm-host
      ports:
        - protocol: TCP
          port: 8080
    # A pod-backed App (AP-26, AP-108): the Portal's reconciler labels every App pod
    # `joinedcontext.com/app` in the apps namespace, which is the Portal's, and the App's own
    # policy admits APISIX on its one port.
    - to:
        - podSelector:
            matchLabels:
              joinedcontext.com/app: "true"
          componentNamespace: portal
      ports:
        - protocol: TCP
          port: 8080
    # The openid-connect plugin of the edge login (ADR-N-019) calls the PUBLIC issuer host:
    # discovery, the token endpoint, the JWKS and userinfo. The `iss` claim carries that host,
    # so the in-cluster Keycloak Service above is no substitute. kube-proxy DNATs that host to
    # the ingress controller's POD before this rule is evaluated, on the controller's container
    # port (ingress-nginx binds 443, Traefik 8443), so the controller is the one peer: the edge
    # reaches no other address on the internet (T-6218; wasm-host's realm hop is the same).
    - to:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [traefik, kube-system, ingress-nginx]
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [traefik, ingress-nginx]
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8443

# cert-manager solves the HTTP-01 challenge for the ingress certificate with an
# ephemeral pod in this namespace. Let's Encrypt calls it from the internet through
# the ingress controller, so the default-deny has to make room for exactly that pod,
# port and peer. It exists only for the length of one challenge and serves one random token.
acme-http01-solver:
  podSelector:
    acme.cert-manager.io/http01-solver: 'true'
  policyTypes:
    - Ingress
  ingress:
    # Only the ingress controller proxies the challenge to it, as for 9080 (T-6218).
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [traefik, kube-system, ingress-nginx]
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [traefik, ingress-nginx]
      ports:
        - protocol: TCP
          port: 8089
