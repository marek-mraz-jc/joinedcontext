      # Its own slot, because the shared refPointOfInterest is already WaterQualityObserved's end of
      # another relationship; the attribute name and IRI are Smart Data Models' all the same. No
      # range: an event can name a unit the Service Map read does not hold (a venue outside
      # Helsinki), so it is an external reference (DM-69), not a relationship the broker checks.
