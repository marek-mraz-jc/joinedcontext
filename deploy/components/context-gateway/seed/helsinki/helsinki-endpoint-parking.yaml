    en: 'Parking areas from the parking guide, the parking fee zones and the resident and business parking zones, the parking places of the inner city and the resident parking zones with their rules (category), and the tourist coach stops and parking places (allowedVehicleType bus). Source: City of Helsinki, CC BY 4.0.'
