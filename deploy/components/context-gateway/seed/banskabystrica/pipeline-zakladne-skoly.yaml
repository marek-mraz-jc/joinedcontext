# One KeyPerformanceIndicator per cell of the ŠÚ SR cube sv5002rr for the city, written through the space's one Endpoint with the runner's service account (PL-18, PF-39, T-2781).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: zakladne-skoly
  namespace: banskabystrica
  title: { sk: Základné školy v meste, en: Basic schools in the city }
spec:
  class: auto
  # Annual or quarterly data: a weekly read is already far more often than it changes (PL-26, PL-27).
  period: 168h
  schedule: '39 4 * * 1'
  source:
    dataSourceRef: { kind: DataSource, name: susr-sv5002rr }
  targetEndpoint: urn:ngsi-ld:Endpoint:banskabystrica.sk:banskabystrica-mesto:banskabystrica-mesto
  output: { type: KeyPerformanceIndicator, mode: upsert }
  quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
