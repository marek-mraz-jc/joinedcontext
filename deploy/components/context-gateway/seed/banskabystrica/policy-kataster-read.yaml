apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: kataster-read
  namespace: banskabystrica
  title: { sk: 'Verejné čítanie: parcely katastra' }
spec:
  contextSpaceRef: { kind: ContextSpace, name: banskabystrica-verejne }
  assigner: did:web:banskabystrica.sk
  assignee: { kind: role, id: public }
  # The reads, the discovery (EP-116) and the subscriptions of the Endpoint banskabystrica-kataster,
  # and only its type: the space's other types stay with their own datasets (T-4344).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: CadastralParcel
