  segment: pipeline
  as: steward
  says: "Add a DataSource for https://<fixture>/counters.csv, hourly."
  expect: 'DataSource manifest; check of the source succeeds; host on the outbound allow-list'
  deny: 'a host outside the allow-list or a private IP -> refused by the outbound guard'
  script:
    - proves: expect
      call: jc_change_plan
      args: { changes: [{ op: create, kind: DataSource, name: counters-hourly, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: DataSource, metadata: { name: counters-hourly, namespace: '{project}' }, spec: { type: http, http: { url: 'https://data.example.sk/counters.csv', format: csv } } } }] }
      keep: planId
      contains: ['"planId"', '"ok":true']
    - proves: expect
      call: jc_change_apply
      args: { planId: '{planId}' }
      contains: ['changeRequests']
    - proves: deny
      call: jc_change_plan
      args: { changes: [{ op: create, kind: DataSource, name: counters-inside, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: DataSource, metadata: { name: counters-inside, namespace: '{project}' }, spec: { type: http, http: { url: 'http://10.0.0.5/counters.csv', format: csv } } } }] }
      refused: true
      contains: ['10.0.0.5']
- id: S-18
  segment: pipeline
  as: steward
  says: "Show me 5 sample rows of this source."
  given: 'The source is DataSource counters-csv of the project.'
  expect: 'sample_source returns the real first rows'
  deny: 'none'
  script:
    # The administrator's ceiling, as the reconciler loads it from Git once merged: the pipeline
    # segment, with writes, for the project's pipeline people.
    - proves: expect
      manifest: { kind: Group, name: pipeliners, spec: { members: [{ user: scn.steward@hel.fi }, { user: scn.project-admin@hel.fi }] } }
    - proves: expect
      manifest: { kind: DelegationPolicy, name: pipeliners-doprava, spec: { subjects: [{ kind: Group, name: pipeliners }], projects: ['{project}'], segments: [pipeline], writes: true, maxExpiry: P90D } }
    - proves: expect
      rest:
        method: POST
        path: /connectors
        body: { name: s18-pipeline, segments: [pipeline], scope: [{ project: '{project}', access: read }], expiresAt: '{in7days}' }
      contains: ['"state":"active"']
    - proves: expect
      via: connector
      contains: ['jc_pipeline_sample_source', 'jc_pipeline_try_mapping', 'jc_pipeline_logs']
    # The runner reads the declared DataSource; the scripted lane's runner plays its first row (T-6028).
    - proves: expect
      via: connector
      call: jc_pipeline_sample_source
      args: { dataSource: counters-csv }
      runner: [{ input: 'c1,Most SNP,42,2026-10-27T10:00:00Z', output: { id: c1, name: Most SNP, count: '42', observedAt: '2026-10-27T10:00:00Z' }, error: null }]
      contains: ['"count":1', 'Most SNP', 'observedAt']
    # A URL a prompt carries is never fetched inside the cluster (T-6028).
    - proves: deny
      via: connector
      call: jc_pipeline_sample_source
      args: { sample: { url: 'http://10.0.0.5/counters.csv', format: csv } }
      refused: true
      contains: ['never a URL']
- id: S-19
  segment: pipeline
  as: steward
  says: "Write a mapping from these rows to BikeCounter and test it."
