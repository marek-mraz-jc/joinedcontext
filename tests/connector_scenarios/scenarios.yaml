- id: S-22
  segment: pipeline
  as: steward
  says: "Change the schedule to every 15 minutes."
  expect: 'one-field diff; plan valid'
  deny: 'below the project''s minimum period -> refused naming the limit'
  script:
    # A Pipeline's records are tested on a sample before a plan holds it (T-4840).
    - proves: expect
      call: jc_change_plan
      args: { changes: [{ op: patch, kind: Pipeline, name: counters-hourly, patch: { spec: { schedule: '*/15 * * * *' } } }] }
      refused: true
      contains: ['/changes/0/manifest', 'jc_pipeline_test']
    # The runner's test of the planned spec comes back green (T-4840).
    - proves: expect
      runner_tested: counters-hourly
    - proves: expect
      call: jc_change_plan
      args: { changes: [{ op: patch, kind: Pipeline, name: counters-hourly, patch: { spec: { schedule: '*/15 * * * *' } } }] }
      keep: planId
      contains: ['"planId"', '*/15 * * * *']
    - proves: expect
      call: jc_change_apply
      args: { planId: '{planId}' }
      contains: ['changeRequests']
    # The organization's floor is 15 minutes (PL-116): every five is refused at the field.
    - proves: deny
      call: jc_change_plan
      args: { changes: [{ op: patch, kind: Pipeline, name: counters-hourly, patch: { spec: { schedule: '*/5 * * * *' } } }] }
      refused: true
      contains: ['/changes/0/manifest/spec/schedule', 'minimum period of 900 s', 'minPipelinePeriodSeconds']
- id: S-23
  segment: pipeline
  as: steward
  says: "Switch the output from upsert to replace."
  expect: 'plan warns which stored attributes an older mapping wrote (WriteGuard) before applying'
  deny: 'none'
  script:
    # The broker holds `legacyName` on stored BikeCounters, which the intake Endpoint's write does
    # not admit: the plan stays valid and warns before anything is applied (WriteGuard::pre_whole).
    # The proposal gate refuses an untested Pipeline at plan time (T-5997): the plan names
    # jc_pipeline_test, the runner's test of the planned spec comes back green (T-4840), and
    # the same plan passes.
    - proves: expect
      call: jc_change_plan
      args: { changes: [{ op: patch, kind: Pipeline, name: counters-hourly, patch: { spec: { output: { type: BikeCounter, mode: replace } } } }] }
      refused: true
      contains: ['/changes/0/manifest', 'jc_pipeline_test']
    - proves: expect
      runner_tested: counters-hourly
    - proves: expect
      call: jc_change_plan
      args: { changes: [{ op: patch, kind: Pipeline, name: counters-hourly, patch: { spec: { output: { type: BikeCounter, mode: replace } } } }] }
      keep: planId
      contains: ['"planId"', '"level":"warning"', 'spec.output.mode', 'legacyName', 'WriteGuard::pre_whole']
      absent: ['could not be checked', 'count (', 'location (']
- id: S-24
  segment: pipeline
  as: steward
  says: "Run the pipeline now and tell me the result."
  expect: 'run started, finished state and counts reported'
  deny: 'connector without pipeline-run right -> refused'
  script:
    # The administrator's ceiling, as the reconciler loads it from Git once merged: the pipeline
    # segment, with writes, for the project's pipeline people.
    - proves: expect
      manifest: { kind: Group, name: pipeliners, spec: { members: [{ user: scn.steward@hel.fi }, { user: scn.project-admin@hel.fi }] } }
    - proves: expect
      manifest: { kind: DelegationPolicy, name: pipeliners-doprava, spec: { subjects: [{ kind: Group, name: pipeliners }], projects: ['{project}'], segments: [pipeline], writes: true, maxExpiry: P90D } }
    # A run outside the schedule needs propose and approve on Pipeline: the project's admin.
    - proves: expect
      as: project-admin
      rest:
        method: POST
        path: /connectors
        body: { name: s24-run, segments: [pipeline], scope: [{ project: '{project}', pipeline: counters-hourly, access: write }], writes: true, expiresAt: '{in7days}' }
      contains: ['"state":"active"']
    - proves: expect
      as: project-admin
      via: connector
      call: jc_pipeline_run
      args: { name: counters-hourly }
      accepted: true
      keep: run
      contains: ['"run":']
    - proves: expect
      logged: { pipeline: counters-hourly, run: '{run}', lines: [{ record: 'urn:ngsi-ld:BikeCounter:c1', outcome: sent, message: 'written' }] }
    - proves: expect
      as: project-admin
      via: connector
      call: jc_pipeline_logs
      args: { name: counters-hourly }
      contains: ['"run":"{run}"', '"sent":1', '"failed":0']
    # Another pipeline than the one the scope names.
    - proves: deny
      as: project-admin
      via: connector
      call: jc_pipeline_run
      args: { name: counters-new }
      refused: true
      contains: ['counters-new']
    # Writes off: the run is not the connector's.
    - proves: deny
      as: project-admin
      rest:
        method: POST
        path: /connectors
        body: { name: s24-read, segments: [pipeline], scope: [{ project: '{project}', access: read }], expiresAt: '{in7days}' }
      contains: ['"state":"active"']
    - proves: deny
      as: project-admin
      via: connector
      call: jc_pipeline_run
      args: { name: counters-hourly }
      refused: true
      contains: ['writes off']
- id: S-25
  segment: pipeline
