  deny: 'mapping output invalid -> the error with the field path comes back and the model fixes it in a second try'
  script:
    # The administrator's ceiling, as the reconciler loads it from Git once merged: the pipeline
    # segment, with writes, for the project's pipeline people.
    - proves: expect
      manifest: { kind: Group, name: pipeliners, spec: { members: [{ user: scn.steward@hel.fi }, { user: scn.project-admin@hel.fi }] } }
    - proves: expect
      manifest: { kind: DelegationPolicy, name: pipeliners-doprava, spec: { subjects: [{ kind: Group, name: pipeliners }], projects: ['{project}'], segments: [pipeline], writes: true, maxExpiry: P90D } }
    - proves: expect
      rest:
        method: POST
        path: /connectors
        body: { name: s19-pipeline, segments: [pipeline], scope: [{ project: '{project}', access: read }], expiresAt: '{in7days}' }
      contains: ['"state":"active"']
    - proves: expect
      via: connector
      call: jc_pipeline_try_mapping
      args: { pipeline: { apiVersion: joinedcontext.com/v1alpha1, kind: Pipeline, metadata: { name: counters-try, namespace: '{project}' }, spec: { class: scheduled, schedule: '0 * * * *', source: { dataSourceRef: { kind: DataSource, name: counters-csv } }, compute: { kind: bloblang, bloblang: 'root.id = \"urn:ngsi-ld:BikeCounter:\" + this.id\nroot.type = \"BikeCounter\"\nroot.count = { \"type\": \"Property\", \"value\": this.count.number(), \"observedAt\": this.observedAt }' }, targetEndpoint: 'urn:ngsi-ld:Endpoint:hel.fi:{project}-doprava:{project}-intake', output: { type: BikeCounter, mode: upsert } } }, sample: { text: "id,name,count,observedAt\nc1,Most SNP,42,2026-10-27T10:00:00Z\n", format: csv } }
      runner: [{ input: '{"id":"c1","count":"42"}', output: { id: 'urn:ngsi-ld:BikeCounter:c1', type: BikeCounter, count: { type: Property, value: 42, observedAt: '2026-10-27T10:00:00Z' } }, error: null }]
      contains: ['urn:ngsi-ld:BikeCounter:c1', 'observedAt']
    # The failed record comes back with its step, line and field, so the next try fixes it.
    - proves: deny
      via: connector
      call: jc_pipeline_try_mapping
      args: { pipeline: { apiVersion: joinedcontext.com/v1alpha1, kind: Pipeline, metadata: { name: counters-try, namespace: '{project}' }, spec: { class: scheduled, schedule: '0 * * * *', source: { dataSourceRef: { kind: DataSource, name: counters-csv } }, compute: { kind: bloblang, bloblang: 'root.id = \"urn:ngsi-ld:BikeCounter:\" + this.id\nroot.type = \"BikeCounter\"\nroot.count = { \"type\": \"Property\", \"value\": this.count.number(), \"observedAt\": this.observedAt }' }, targetEndpoint: 'urn:ngsi-ld:Endpoint:hel.fi:{project}-doprava:{project}-intake', output: { type: BikeCounter, mode: upsert } } }, sample: { text: "id,name,count,observedAt\nc1,Most SNP,42,2026-10-27T10:00:00Z\n", format: csv } }
      runner: [{ input: '{"id":"c2","count":"x"}', output: null, error: 'failed assignment (line 3): field this.count: expected number value, got string ("x")', step: '0' }]
      contains: ['"line":3', 'this.count']
- id: S-20
  segment: pipeline
  as: steward
  says: "Create the pipeline, hourly, upsert into Endpoint X."
  expect: 'Pipeline manifest valid; validate passes; change request opened; after merge the first run writes > 0 entities'
  deny: 'pipeline aimed at a policyRef or app-* Endpoint -> refused (writes as pl-{pipeline})'
  script:
    # A Pipeline's records are tested on a sample before a plan holds it (T-4840).
    - proves: expect
      call: jc_change_plan
      args: { changes: [{ op: create, kind: Pipeline, name: counters-new, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: Pipeline, metadata: { name: counters-new, namespace: '{project}' }, spec: { class: scheduled, schedule: '0 * * * *', source: { dataSourceRef: { kind: DataSource, name: counters-csv } }, targetEndpoint: 'urn:ngsi-ld:Endpoint:hel.fi:{project}-doprava:{project}-intake', output: { type: BikeCounter, mode: upsert }, quotas: { maxMemoryMb: 128, cpuMillicores: 100 } } } }] }
      refused: true
      contains: ['/changes/0/manifest', 'jc_pipeline_test']
    # The runner's test of the planned spec comes back green (T-4840).
    - proves: expect
      runner_tested: counters-new
    - proves: expect
      call: jc_change_plan
      args: { changes: [{ op: create, kind: Pipeline, name: counters-new, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: Pipeline, metadata: { name: counters-new, namespace: '{project}' }, spec: { class: scheduled, schedule: '0 * * * *', source: { dataSourceRef: { kind: DataSource, name: counters-csv } }, targetEndpoint: 'urn:ngsi-ld:Endpoint:hel.fi:{project}-doprava:{project}-intake', output: { type: BikeCounter, mode: upsert }, quotas: { maxMemoryMb: 128, cpuMillicores: 100 } } } }] }
      keep: planId
      contains: ['"planId"', '"ok":true']
    - proves: expect
      call: jc_change_apply
      args: { planId: '{planId}' }
      contains: ['changeRequests']
    # An Endpoint and the Pipeline writing into it plan together and open one change (T-6282).
    - proves: expect
      call: jc_change_plan
      args: { changes: [{ op: create, kind: Pipeline, name: counters-bundled, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: Pipeline, metadata: { name: counters-bundled, namespace: '{project}' }, spec: { class: scheduled, schedule: '0 * * * *', source: { dataSourceRef: { kind: DataSource, name: counters-csv } }, targetEndpoint: 'urn:ngsi-ld:Endpoint:hel.fi:{project}-doprava:{project}-bundled', output: { type: BikeCounter, mode: upsert }, quotas: { maxMemoryMb: 128, cpuMillicores: 100 } } } }, { op: create, kind: Endpoint, name: '{project}-bundled', manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: Endpoint, metadata: { name: '{project}-bundled', namespace: '{project}' }, spec: { contextSpaceRef: doprava, audience: public, enabledRepresentations: [ngsi-ld] } } }] }
      refused: true
      contains: ['/changes/0/manifest', 'jc_pipeline_test']
    - proves: expect
      runner_tested: counters-bundled
    - proves: expect
      call: jc_change_plan
      args: { changes: [{ op: create, kind: Pipeline, name: counters-bundled, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: Pipeline, metadata: { name: counters-bundled, namespace: '{project}' }, spec: { class: scheduled, schedule: '0 * * * *', source: { dataSourceRef: { kind: DataSource, name: counters-csv } }, targetEndpoint: 'urn:ngsi-ld:Endpoint:hel.fi:{project}-doprava:{project}-bundled', output: { type: BikeCounter, mode: upsert }, quotas: { maxMemoryMb: 128, cpuMillicores: 100 } } } }, { op: create, kind: Endpoint, name: '{project}-bundled', manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: Endpoint, metadata: { name: '{project}-bundled', namespace: '{project}' }, spec: { contextSpaceRef: doprava, audience: public, enabledRepresentations: [ngsi-ld] } } }] }
      keep: planId
      contains: ['"planId"', '"ok":true']
    - proves: expect
      call: jc_change_apply
      args: { planId: '{planId}' }
      contains: ['"changeRequests":[{', 'pulls/77']
      absent: ['},{"url"']
    # The read Endpoint names its own Policy, so it binds no write of the Pipeline (PL-111).
    - proves: deny
      call: jc_change_plan
      args: { changes: [{ op: create, kind: Pipeline, name: counters-misaimed, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: Pipeline, metadata: { name: counters-misaimed, namespace: '{project}' }, spec: { class: scheduled, schedule: '0 * * * *', source: { dataSourceRef: { kind: DataSource, name: counters-csv } }, targetEndpoint: 'urn:ngsi-ld:Endpoint:hel.fi:{project}-doprava:{project}-readers', output: { type: BikeCounter, mode: upsert }, quotas: { maxMemoryMb: 128, cpuMillicores: 100 } } } }] }
      refused: true
      contains: ['targetEndpoint']
- id: S-21
  segment: pipeline
  as: steward
  says: "The pipeline wrote 0 entities last night. Why?"
  expect: 'reads run state and logs; names the cause (source read failed, nack, refused write) with the log line'
  deny: 'none'
  script:
    # The administrator's ceiling, as the reconciler loads it from Git once merged: the pipeline
    # segment, with writes, for the project's pipeline people.
    - proves: expect
      manifest: { kind: Group, name: pipeliners, spec: { members: [{ user: scn.steward@hel.fi }, { user: scn.project-admin@hel.fi }] } }
    - proves: expect
      manifest: { kind: DelegationPolicy, name: pipeliners-doprava, spec: { subjects: [{ kind: Group, name: pipeliners }], projects: ['{project}'], segments: [pipeline], writes: true, maxExpiry: P90D } }
