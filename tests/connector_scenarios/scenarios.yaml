# Connector scenario catalogue (owner order 2026-10-28, GOAL-connectors.md).
# 50 jobs a person does in the platform through an MCP connector (Claude Code, claude.ai, ChatGPT) or the
# Portal assistant. Each scenario runs three ways (GOAL point 5):
#   scripted: the harness calls the tools itself (no model), deterministic, in CI on every portal change;
#   model:    a model gets `says` and the connector, graded on the end state and the calls, hourly ci-full;
#   live:     once on dev through Claude Code and the Portal assistant, evidence (calls, shots) in the task.
# Fields: segment = connector preset (what the person ticks), as = persona, says = the request,
# expect = end state a reviewer checks, deny = the same request where it must be refused (and what refuses it).
# script = the scripted lane's tool calls (tests/connector_scenarios.rs, T-5947): each step names what it
# proves (expect or deny), the tool (none = tools/list), its args, the project (own = t-scn-NN, other =
# t-scn-other, bound to nobody), whether the door must refuse it, and texts the answer must or must not hold.
# A scenario without a script, or failing it, is listed in red.txt with the task that greens it.
# Fixtures: the harness creates its own project t-scn-<run> with a space, a DataModel, an Endpoint and a CSV
# source; nothing touches a real tenant. Approvals are done by a second persona in the Portal, never by the connector.

- id: S-01
  segment: data-read
  as: viewer
  says: "Which data Endpoints exist in this project and what types do they serve?"
  expect: 'list of the project''s Endpoints with their entity types and access URLs; no Endpoint of another project'
  deny: 'connector scoped to project A asked about project B -> the tool is not listed / 403, nothing of B in the answer'
  script:
    - proves: expect
      call: jc_resource_list
      args: { kind: Endpoint }
      contains: ['{project}-counters', 'BikeCounter', 'https://']
      absent: ['t-scn-other']
    - proves: deny
      call: jc_resource_list
      project: other
      args: { kind: Endpoint }
      refused: true
      absent: ['t-scn-other-counters']
- id: S-02
  segment: data-read
  as: viewer
  says: "Show the 10 newest entities of type Sensor with their last value."
  expect: 'one query_data call with type, limit 10, orderBy modifiedAt; values match a direct NGSI-LD GET'
  deny: 'Endpoint not ticked in the connector -> refused naming the Endpoint'
  script:
    - proves: expect
      rest:
        method: POST
        path: /connectors
        body: { name: s02-counters, segments: [data-read], scope: [{ project: '{project}', endpoint: '{project}-counters', access: read }], expiresAt: '{in7days}' }
      contains: ['"state":"active"']
    - proves: expect
      via: connector
      call: jc_data_query
      args: { endpoint: '{project}-counters', type: BikeCounter, limit: 10, orderBy: 'modifiedAt;desc' }
      contains: ['urn:ngsi-ld:BikeCounter:snp', '"value":42', 'urn:ngsi-ld:BikeCounter:hron']
    - proves: deny
      via: connector
      call: jc_data_query
      args: { endpoint: '{project}-reports', type: PotholeReport }
      refused: true
      contains: ['{project}-counters']
      absent: ['urn:ngsi-ld:PotholeReport']
- id: S-03
  segment: data-read
  as: viewer
  says: "How many entities of each type are in Endpoint X?"
  expect: 'counts equal entities?type=T&count=true&limit=0 per type'
  deny: 'none'
  script:
    - proves: expect
      call: jc_data_query
      args: { endpoint: '{project}-counters', type: BikeCounter, count: true, limit: 0 }
      contains: ['"total":2']
- id: S-04
  segment: data-read
  as: viewer
  says: "Give me the history of attribute temperature of entity E for yesterday, hourly average."
  expect: 'temporal read with aggregation; numbers equal the temporal API''s answer'
  deny: 'Endpoint view without temporal operation -> 404 explained as "this Endpoint serves no history"'
  script:
    - proves: expect
      call: jc_data_query
      args: { endpoint: '{project}-counters', id: 'urn:ngsi-ld:BikeCounter:snp', attrs: [count], temporal: { timerel: between, timeAt: '2026-10-27T00:00:00Z', endTimeAt: '2026-10-28T00:00:00Z', aggrMethods: [avg], aggrPeriodDuration: PT1H } }
      contains: ['"avg"', '21.5']
    - proves: deny
      call: jc_data_query
      args: { endpoint: '{project}-reports', type: PotholeReport, temporal: { timerel: after, timeAt: '2026-10-27T00:00:00Z' } }
      refused: true
      contains: ['serves no history']
- id: S-05
  segment: data-read
  as: viewer
  says: "Find all parking places within 500 m of point 48.736,19.146."
  expect: 'geo-query georel near;maxDistance==500; result ids equal the direct query'
  deny: 'none'
  script:
    - proves: expect
      call: jc_data_query
      args: { endpoint: '{project}-counters', type: BikeCounter, georel: 'near;maxDistance==500', geometry: Point, coordinates: [19.146, 48.736] }
      contains: ['urn:ngsi-ld:BikeCounter:snp']
      absent: ['urn:ngsi-ld:BikeCounter:hron']
- id: S-06
  segment: data-read
  as: viewer
  says: "Give me this Endpoint's data as CSV, GeoJSON and OData URLs I can open in Excel."
  expect: 'the representation URLs the Endpoint config lists, each answering 200'
  deny: 'representation the Endpoint does not list -> not offered'
  script:
    # The project's open Endpoint lists CSV, OData and OGC Features (GeoJSON items per type).
    - proves: expect
      manifest:
        kind: Endpoint
        name: '{project}-open'
        namespace: '{project}'
        spec: { slug: opendopravazzzzzzzzzzzzzzzz, contextSpaceRef: doprava, audience: public, enabledRepresentations: [ngsi-ld, csv, odata, ogc-features] }
    - proves: expect
      call: jc_resource_get
      args: { kind: Endpoint, name: '{project}-open' }
      contains: ['https://api.test/api/endpoint/opendopravazzzzzzzzzzzzzzzz/file.csv', 'https://api.test/api/endpoint/opendopravazzzzzzzzzzzzzzzz/odata/v4/', 'https://api.test/api/endpoint/opendopravazzzzzzzzzzzzzzzz/ogc/features/collections/BikeCounter/items']
      absent: ['sta/v1.1']
    # The counters Endpoint serves NGSI-LD alone: no file, OData or OGC address is offered.
    - proves: deny
      call: jc_resource_get
      args: { kind: Endpoint, name: '{project}-counters' }
      contains: ['ngsi-ld/v1/']
      absent: ['file.csv', 'odata/v4', 'ogc/features']
- id: S-07
  segment: data-read
  as: anonymous
  says: "What does the public Endpoint for air quality show now?"
  expect: 'public connector answers from the public Endpoint only'
  deny: 'anonymous asks for a non-public Endpoint -> refused, no count or name leaks'
  # The public connector is the gateway hub /api/mcp (T-6026); the Portal door stays signed-in only.
  script:
    - proves: expect
      via: public
      contains: ['query_entities', 'list_endpoints', 'search']
      absent: ['create_entity', 'batch_upsert', 'jc_change_plan']
    - proves: expect
      via: public
      call: query_entities
      args: { endpoint: scnpublicairqualityzzzzzzz, type: [AirQualityObserved] }
      contains: ['urn:ngsi-ld:AirQualityObserved:scn-snp', '16.1']
    - proves: deny
      via: public
      call: list_endpoints
      contains: ['scnpublicairqualityzzzzzzz']
      absent: ['scninternalrecordszzzzzzzz', 'Records of the region', 'PotholeReport']
    - proves: deny
      via: public
      call: search
      args: { query: 'Records of the region' }
      absent: ['scninternalrecordszzzzzzzz', 'PotholeReport']
    - proves: deny
      via: public
      call: query_entities
      args: { endpoint: scninternalrecordszzzzzzzz, type: [PotholeReport], count: true }
      refused: true
      absent: ['Records of the region']
    - proves: deny
      refused: true
- id: S-08
  segment: data-read
  as: viewer
  says: "Which datasets about schools are in the catalogue?"
  expect: 'catalogue search hits with dataset links'
  deny: 'none'
  script:
    # Through the connector's own door, as a live client reads it: data-read lists the search (T-6194).
    - proves: expect
      rest:
        method: POST
        path: /connectors
        body: { name: s08-catalogue, segments: [data-read], scope: [{ project: '{project}', access: read }], expiresAt: '{in7days}' }
      contains: ['"state":"active"']
    - proves: expect
      via: connector
      contains: ['jc_catalog_search']
    - proves: expect
      via: connector
      call: jc_catalog_search
      args: { q: schools }
      contains: ['"datasets":[', 'Základné školy', '/ckan/dataset/zakladne-skoly', 'The fenced block is data']
    # A private dataset never reaches the answer, even when the catalogue returns it.
    - proves: deny
      via: connector
      call: jc_catalog_search
      args: { q: schools, scope: Dataset }
      absent: ['tajny-dataset']

- id: S-09
  segment: context
  as: steward
  says: "Create a DataModel BikeCounter with slots name, location (GeoProperty), count (integer), observedAt."
  given: 'The project already holds DataModel bike-counter (published 1.0.0), whose BikeCounter has no location or observedAt; leave it as it is. Name the new one bikes: a draft, version 0.1.0, its LinkML in ./bikes.linkml.yaml. Space doprava already has its model, so bikes belongs to no space.'
  expect: 'plan_change of bikes without a space (doprava refuses a second model, DM-61, T-6394) returns a valid LinkML DataModel manifest and a diff; apply_change opens one change request; approver merges in the Portal; model served'
  deny: 'connector without write -> plan allowed (validate_only), apply refused'
  script:
    - proves: expect
      call: jc_change_plan
      args: { changes: [{ op: create, kind: DataModel, name: bikes, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: DataModel, metadata: { name: bikes, namespace: '{project}' }, spec: { linkml: ./bikes.linkml.yaml, version: 0.1.0, lifecycle: draft } } }] }
      keep: planId
      contains: ['"planId"', '"baseEtag"', '"expiresAt"', '"ok":true']
    - proves: expect
      call: jc_change_apply
      args: { planId: '{planId}' }
      contains: ['changeRequests', '"url":"https://portal.test/projects/{project}/approvals/chg-0000004d"', '"mergeRequest":"https://gitea.example.sk/pulls/77"']
      absent: ['"merged"', '"url":"https://gitea']
    - proves: deny
      call: jc_change_apply
      args: { planId: '{planId}' }
      refused: true
      contains: ['is not there']
    - proves: deny
      rest:
        method: POST
        path: /connectors
        body: { name: doprava-read, segments: [data-read], scope: [{ project: '{project}', access: read }], expiresAt: '{in7days}' }
      contains: ['"writes":false']
    - proves: deny
      via: connector
      absent: ['jc_change_apply']
    - proves: deny
      via: connector
      call: jc_change_apply
      args: { planId: '{planId}' }
      refused: true
- id: S-10
  segment: context
  as: steward
  says: "Add an optional slot direction (enum in, out) to BikeCounter."
  expect: 'diff touches one model file; version bumped; existing entities still valid'
  deny: 'removing a required slot used by stored entities -> plan shows the breaking change and the affected count'
  script:
    - proves: expect
      call: jc_change_plan
      args:
        changes:
          - op: patch
            kind: DataModel
            name: bike-counter
            source: |
              id: https://example.org/doprava
              name: doprava
              default_range: string
              enums:
                Direction:
                  permissible_values: { in: {}, out: {} }
              slots:
                name: { required: true }
                count: { range: integer }
                startDate: { range: datetime, required: true }
                direction: { range: Direction }
              classes:
                BikeCounter: { slots: [name, count, direction] }
                Event: { slots: [name, startDate] }
                Station: { slots: [name] }
      keep: planId
      contains: ['"planId"', '"severity":"additive"', '"version":"1.1.0"', '"lane":"yellow"', 'direction']
    - proves: expect
      call: jc_change_apply
      args: { planId: '{planId}' }
      contains: ['changeRequests', 'https://gitea.example.sk/pulls/77']
      absent: ['"merged"']
    - proves: deny
      call: jc_change_plan
      args:
        changes:
          - op: patch
            kind: DataModel
            name: bike-counter
            source: |
              id: https://example.org/doprava
              name: doprava
              default_range: string
              slots:
                name: { required: true }
                count: { range: integer }
                startDate: { range: datetime, required: true }
              classes:
                BikeCounter: { slots: [count] }
                Event: { slots: [name, startDate] }
                Station: { slots: [name] }
      contains: ['"severity":"breaking"', '"version":"2.0.0"', '"lane":"red"', 'BikeCounter.name', '"affectedEntities":12']
- id: S-11
  segment: context
  as: steward
  says: "Infer a DataModel from this CSV sample."
  given: |-
    The sample, file counters.csv:
    id,name,count,observedAt
    c1,Most SNP,42,2026-10-27T10:00:00Z
  expect: 'model inference returns slots with ranges matching the sample columns'
  deny: 'none'
  script:
    # Model Tools answers what it inferred from these exact bytes (inferred-counters.json).
    - proves: expect
      call: jc_model_infer
      args: { name: counters.csv, sample: "id,name,count,observedAt\nc1,Most SNP,42,2026-10-27T10:00:00Z\n" }
      contains: ['"count":"integer"', '"name":"string"', '"observedAt":"datetime"', 'Counters']
- id: S-12
  segment: context
  as: steward
  says: "Create a context space Doprava with retention 365 days."
  expect: 'Space manifest valid, retention block as asked, change request opened'
  deny: 'steward of another project -> refused'
  script:
    # Retention deletes data, so only an owner of the space sets it (DM-85): the steward is told
    # so, and the project's admin plans it.
    - proves: expect
      call: jc_change_plan
      args: { changes: [{ op: create, kind: ContextSpace, name: doprava-archiv, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: ContextSpace, metadata: { name: doprava-archiv, namespace: '{project}' }, spec: { isSandbox: true, retention: [{ entityType: '*', history: P365D }] } } }] }
      refused: true
      contains: ['DM-85']
    - proves: expect
      as: project-admin
      call: jc_change_plan
      args: { changes: [{ op: create, kind: ContextSpace, name: doprava-archiv, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: ContextSpace, metadata: { name: doprava-archiv, namespace: '{project}' }, spec: { isSandbox: true, retention: [{ entityType: '*', history: P365D }] } } }] }
      keep: planId
      contains: ['"planId"', 'retention']
    - proves: expect
      as: project-admin
      call: jc_change_apply
      args: { planId: '{planId}' }
      contains: ['changeRequests']
    # A space, its Endpoint and its write Policy plan together, each check seeing its siblings,
    # and apply as one change request (T-6282).
    - proves: expect
      as: project-admin
      call: jc_change_plan
      args: { changes: [{ op: create, kind: ContextSpace, name: parking, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: ContextSpace, metadata: { name: parking, namespace: '{project}' }, spec: { isSandbox: true } } }, { op: create, kind: Endpoint, name: '{project}-parking', manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: Endpoint, metadata: { name: '{project}-parking', namespace: '{project}' }, spec: { contextSpaceRef: parking, audience: public, enabledRepresentations: [ngsi-ld] } } }, { op: create, kind: Policy, name: parking-writers, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: Policy, metadata: { name: parking-writers, namespace: '{project}' }, spec: { contextSpaceRef: parking, assigner: 'did:web:hel.fi', assignee: { kind: group, id: scn-writers }, operations: [createEntity, updateAttrs], information: [{ entities: [{ type: BikeCounter }] }] } } }] }
      keep: planId
      contains: ['"planId"', '"ok":true', 'no Policy of the space parking grants the public role']
    - proves: expect
      as: project-admin
      call: jc_change_apply
      args: { planId: '{planId}' }
      contains: ['"changeRequests":[{', 'pulls/77']
      absent: ['},{"url"']
    # A space neither in the plan nor in the project is still refused at the field naming it.
    - proves: deny
      as: project-admin
      call: jc_change_plan
      args: { changes: [{ op: create, kind: ContextSpace, name: parking-two, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: ContextSpace, metadata: { name: parking-two, namespace: '{project}' }, spec: { isSandbox: true } } }, { op: create, kind: Endpoint, name: '{project}-nowhere', manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: Endpoint, metadata: { name: '{project}-nowhere', namespace: '{project}' }, spec: { contextSpaceRef: nowhere, audience: public, enabledRepresentations: [ngsi-ld] } } }] }
      refused: true
      contains: ['/changes/1/manifest/spec/contextSpaceRef', 'nowhere']
    - proves: deny
      call: jc_change_plan
      project: other
      args: { changes: [{ op: create, kind: ContextSpace, name: doprava-archiv, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: ContextSpace, metadata: { name: doprava-archiv, namespace: t-scn-other }, spec: { isSandbox: true } } }] }
      refused: true
- id: S-13
  segment: context
  as: steward
  says: "Create an Endpoint that serves BikeCounter from space Doprava, public read, NGSI-LD + OData + GeoJSON."
  expect: 'Endpoint manifest without a slug, the platform mints one (EP-75), representations as asked, Policy binding; after merge the Endpoint answers'
  deny: 'a slug the caller typed -> refused naming /changes/0/manifest/spec/slug (EP-75, T-6285)'
  script:
    - proves: expect
      call: jc_change_plan
      args: { changes: [{ op: create, kind: Endpoint, name: '{project}-public', manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: Endpoint, metadata: { name: '{project}-public', namespace: '{project}' }, spec: { contextSpaceRef: doprava, audience: public, enabledRepresentations: [ngsi-ld, odata, ogc-features] } } }] }
      keep: planId
      contains: ['"planId"', '"ok":true', 'changes nothing live']
    - proves: expect
      call: jc_change_apply
      args: { planId: '{planId}' }
      contains: ['changeRequests']
    - proves: deny
      call: jc_change_plan
      args: { changes: [{ op: create, kind: Endpoint, name: '{project}-bad', manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: Endpoint, metadata: { name: '{project}-bad', namespace: '{project}' }, spec: { slug: bikecounters0publicdopravaz, contextSpaceRef: doprava, audience: public, enabledRepresentations: [ngsi-ld] } } }] }
      refused: true
      contains: ['/changes/0/manifest', 'slug']
- id: S-14
  segment: context
  as: steward
  says: "Hide attribute ownerEmail from the public Endpoint."
  expect: 'view projection drops the attribute; public read no longer shows it; q on it returns nothing (no inference)'
  deny: 'none'
  script:
    - proves: expect
      call: jc_change_plan
      args: { changes: [{ op: patch, kind: Endpoint, name: '{project}-counters', patch: { spec: { title: null, entityTypes: null, projection: { hiddenAttributes: [ownerEmail] } } } }] }
      keep: planId
      contains: ['"planId"', 'hiddenAttributes', 'ownerEmail']
    - proves: expect
      call: jc_change_apply
      args: { planId: '{planId}' }
      contains: ['changeRequests']
- id: S-15
  segment: context
  as: steward
  says: "Add a relationship refStation from BikeCounter to Station, with the inverse slot."
  expect: 'both slots in the model; the model compiles in Model Tools'
  deny: 'relationship to a missing class -> plan refused naming the class'
  script:
    - proves: expect
      call: jc_change_plan
      args:
        changes:
          - op: patch
            kind: DataModel
            name: bike-counter
            source: |
              id: https://example.org/doprava
              name: doprava
              default_range: string
              slots:
                name: { required: true }
                count: { range: integer }
                startDate: { range: datetime, required: true }
                refStation: { range: Station }
                refBikeCounter: { range: BikeCounter, multivalued: true, inverse: refStation }
              classes:
                BikeCounter: { slots: [name, count, refStation] }
                Event: { slots: [name, startDate] }
                Station: { slots: [name, refBikeCounter] }
      keep: planId
      contains: ['"planId"', 'refStation', 'refBikeCounter', '"ok":true']
    - proves: expect
      call: jc_change_apply
      args: { planId: '{planId}' }
      contains: ['changeRequests']
    - proves: deny
      call: jc_change_plan
      args:
        changes:
          - op: patch
            kind: DataModel
            name: bike-counter
            source: |
              id: https://hel.fi/models/bike-counter
              name: bike-counter
              prefixes:
                linkml: https://w3id.org/linkml/
              imports: [linkml:types]
              classes:
                BikeCounter:
                  attributes:
                    name: { range: string }
                    count: { range: integer, required: true }
                    refStation: { range: Depot }
                Station:
                  attributes:
                    name: { range: string }
                    refBikeCounter: { range: BikeCounter, multivalued: true, inverse: refStation }
      refused: true
      contains: ['/changes/0/source/classes/BikeCounter/attributes/refStation/range', "class 'Depot'"]
- id: S-16
  segment: context
  as: steward
  says: "Deprecate the old Endpoint and point users to the new one."
  given: 'The old one is Endpoint {project}-counters; its successor is described at https://data.example.sk/changes/counters-v2. Deprecated since 2026-10-28, sunset 2027-02-01.'
  expect: 'EndpointDeprecation manifest; old Endpoint answers with the deprecation header'
  deny: 'none'
  script:
    - proves: expect
      call: jc_change_plan
      args: { changes: [{ op: patch, kind: Endpoint, name: '{project}-counters', patch: { spec: { deprecation: { since: '2026-10-28', sunset: '2027-02-01', link: 'https://data.example.sk/changes/counters-v2' } } } }] }
      keep: planId
      contains: ['"planId"', '"ok":true', 'deprecation', '2027-02-01']
    - proves: expect
      call: jc_change_apply
      args: { planId: '{planId}' }
      contains: ['changeRequests']
      absent: ['"merged"']
    - proves: deny
      call: jc_change_plan
      args: { changes: [{ op: patch, kind: Endpoint, name: '{project}-counters', patch: { spec: { deprecation: { since: '2026-10-28', sunset: '2026-11-28' } } } }] }
      refused: true
      contains: ['spec.deprecation.sunset', 'EP-146']

