      accepted: true
      contains: ['"paused":true']
    - proves: expect
      call: jc_syncsource_status
      args: { name: regional }
      contains: ['"paused":true']
    - proves: expect
      call: jc_syncsource_pause
      args: { name: regional, paused: false }
