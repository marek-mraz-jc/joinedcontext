- id: S-86
  segment: pipeline
  as: steward
  says: "The mapping of counters-steps writes no count. Find the step that loses it and fix it."
  expect: 'try_mapping with steps answers each step''s records, so the broken step is found and fixed before a change request; nothing is written before approval (T-6082)'
