        path: /connectors
        body: { name: s56-pipeline, segments: [pipeline], scope: [{ project: '{project}', access: read }], expiresAt: '{in7days}' }
      contains: ['"state":"active"']
    # Step 1 (the second) reads `cnt`, a field the source never had: its records show the
    # parsed row going in and the failure it made, so the agent reads where the count went.
    - proves: expect
      via: connector
      call: jc_pipeline_try_mapping
      args: { steps: true, pipeline: { apiVersion: joinedcontext.com/v1alpha2, kind: Pipeline, metadata: { name: counters-steps, namespace: '{project}' }, spec: { class: scheduled, schedule: '0 * * * *', sources: [{ dataSourceRef: { kind: DataSource, name: counters-csv } }], steps: [{ processor: { mapping: 'root = this' } }, { kind: bloblang, bloblang: 'root = this\nroot.count = this.cnt.number()' }, { kind: bloblang, bloblang: 'root.id = "urn:ngsi-ld:BikeCounter:" + this.id\nroot.type = "BikeCounter"\nroot.count = { "type": "Property", "value": this.count, "observedAt": this.observedAt }' }], outputs: [{ targetEndpoint: 'urn:ngsi-ld:Endpoint:hel.fi:{project}-doprava:{project}-intake' }] } }, sample: { text: "id,name,count,observedAt\nc1,Most SNP,42,2026-10-27T10:00:00Z\n", format: csv } }
      runner: [{ input: '{"id":"c1","count":"42","observedAt":"2026-10-27T10:00:00Z"}', output: null, error: 'failed assignment (line 2): expected number value, got null', step: '1', steps: ['{"id":"c1","count":"42","observedAt":"2026-10-27T10:00:00Z"}', null, null] }]
      contains: ['"steps":[', '"name":"mapping"', '"name":"bloblang"', '"count":"42"', '"dropped":1', '"line":2']
    # The fixed step: every step shows its records and the last one the entity it writes.
    - proves: expect
      via: connector
      call: jc_pipeline_try_mapping
      args: { steps: true, pipeline: { apiVersion: joinedcontext.com/v1alpha2, kind: Pipeline, metadata: { name: counters-steps, namespace: '{project}' }, spec: { class: scheduled, schedule: '0 * * * *', sources: [{ dataSourceRef: { kind: DataSource, name: counters-csv } }], steps: [{ processor: { mapping: 'root = this' } }, { kind: bloblang, bloblang: 'root = this\nroot.count = this.count.number()' }, { kind: bloblang, bloblang: 'root.id = "urn:ngsi-ld:BikeCounter:" + this.id\nroot.type = "BikeCounter"\nroot.count = { "type": "Property", "value": this.count, "observedAt": this.observedAt }' }], outputs: [{ targetEndpoint: 'urn:ngsi-ld:Endpoint:hel.fi:{project}-doprava:{project}-intake' }] } }, sample: { text: "id,name,count,observedAt\nc1,Most SNP,42,2026-10-27T10:00:00Z\n", format: csv } }
      runner: [{ input: '{"id":"c1","count":"42","observedAt":"2026-10-27T10:00:00Z"}', output: { id: 'urn:ngsi-ld:BikeCounter:c1', type: BikeCounter, count: { type: Property, value: 42, observedAt: '2026-10-27T10:00:00Z' } }, error: null, steps: ['{"id":"c1","count":"42","observedAt":"2026-10-27T10:00:00Z"}', '{"id":"c1","count":42,"observedAt":"2026-10-27T10:00:00Z"}', '{"id":"urn:ngsi-ld:BikeCounter:c1","type":"BikeCounter"}'] }]
      contains: ['"count":42', '"dropped":0', 'urn:ngsi-ld:BikeCounter:c1']
