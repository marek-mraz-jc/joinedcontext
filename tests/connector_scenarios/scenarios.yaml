      args: { pipeline: { apiVersion: joinedcontext.com/v1alpha2, kind: Pipeline, metadata: { name: trips-try, namespace: '{project}' }, spec: { class: scheduled, schedule: '0 * * * *', sources: [{ dataSourceRef: { kind: DataSource, name: trips-csv } }], steps: [{ processor: { mapping: 'root = this' } }], outputs: [{ targetEndpoint: 'urn:ngsi-ld:Endpoint:hel.fi:{project}-doprava:{project}-intake' }] } }, sample: { text: "rider,station\nJana Novakova,Most SNP\n", format: csv }, steps: true }
      runner: [{ input: '{"rider":"Jana Novakova","station":"Most SNP"}', output: { rider: Jana Novakova, station: Most SNP }, error: null, steps: ['{"rider":"Jana Novakova","station":"Most SNP"}'] }]
      contains: ['Most SNP', 'DataSource/trips-csv.rider']
      absent: ['Jana Novakova']
    # The rows come only where the connector reaches.
    - proves: deny
      via: connector
      call: jc_pipeline_sample_source
      project: other
      args: { dataSource: trips-csv }
      refused: true
      contains: ['does not reach project']
      absent: ['Jana Novakova', 'Most SNP']
- id: S-88
  segment: knowledge
  # project-admin: the steward's MCP minute (120 calls, shared by every scenario) is nearly full.
  as: project-admin
  says: 'Which knowledge sources does the project have, how far is the crawl of the city website, and what does it say about parking permits, with the pages it used?'
  given: 'The project declares KnowledgeSource city-web, crawled last night with one failed page.'
  expect: 'jc_knowledge_status lists city-web with its crawl state, counts and failed reads; jc_knowledge_search answers passages each with its page url and title; a new KnowledgeSource plans (T-6284)'
  deny: 'a connector without the knowledge segment -> the knowledge tools are not there and KnowledgeSource is refused'
  script:
    - proves: expect
      manifest: { kind: Group, name: knowledge-stewards, spec: { members: [{ user: scn.project-admin@hel.fi }] } }
    - proves: expect
      manifest: { kind: DelegationPolicy, name: knowledge-doprava, spec: { subjects: [{ kind: Group, name: knowledge-stewards }], projects: ['{project}'], segments: [knowledge, data-read], writes: false, maxExpiry: P90D } }
    - proves: expect
      rest:
        method: POST
        path: /connectors
        body: { name: s56-knowledge, segments: [knowledge], scope: [{ project: '{project}', access: read }], expiresAt: '{in7days}' }
      contains: ['"state":"active"']
    - proves: expect
      via: connector
      contains: ['jc_knowledge_status', 'jc_knowledge_search', 'jc_change_plan']
      absent: ['jc_data_query', 'jc_pipeline_logs']
    - proves: expect
      via: connector
      call: jc_resource_list
      args: { kind: KnowledgeSource }
      contains: ['city-web']
    - proves: expect
      via: connector
      call: jc_knowledge_status
      contains: ['"source":"city-web"', '"state":"crawled"', '"pages":12', 'https://city.example/']
    - proves: expect
      via: connector
      call: jc_knowledge_status
      args: { source: city-web }
      contains: ['"failed":1', 'https://city.example/old-fees', 'HTTP 404']
    - proves: expect
      via: connector
      call: jc_knowledge_search
      args: { source: city-web, q: parking permit }
      contains: ['"title":"Parking permits"', '"url":"https://city.example/parking"', '30 EUR']
    - proves: expect
      via: connector
      call: jc_change_plan
      args: { changes: [{ op: create, kind: KnowledgeSource, name: news-web, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: KnowledgeSource, metadata: { name: news-web, namespace: '{project}' }, spec: { source: website, startUrls: ['https://city.example/news/'], maxDepth: 1 } } }] }
      contains: ['"planId"', '"ok":true']
    - proves: deny
      via: connector
      call: jc_knowledge_status
      args: { source: nowhere }
      refused: true
      contains: ["KnowledgeSource 'nowhere' not found"]
    - proves: deny
      rest:
        method: POST
        path: /connectors
        body: { name: s56-data, segments: [data-read], scope: [{ project: '{project}', access: read }], expiresAt: '{in7days}' }
      contains: ['"state":"active"']
    - proves: deny
      via: connector
      contains: ['jc_resource_list']
      absent: ['jc_knowledge_status', 'jc_knowledge_search']
    - proves: deny
      via: connector
      call: jc_knowledge_search
      args: { source: city-web, q: parking permit }
      refused: true
    - proves: deny
      via: connector
      call: jc_resource_list
      args: { kind: KnowledgeSource }
      refused: true
      contains: ['read only']
- id: S-89
  segment: pipeline
  # org-admin and viewer: the project-admin's and steward's MCP minutes (120 calls each) are nearly full.
  as: org-admin
  says: "Which MQTT brokers does this project have, and what did the sensors broker capture lately? Then add an mqtt source reading it."
  expect: 'the pipeline segment lists MqttBroker and reads the capture through jc_mqtt_captured; a DataSource naming a broker the project lacks is refused by spec.mqtt.brokerRef (T-6290)'
  deny: 'a caller who may not approve brokers -> 404 as for a broker that is not there; a wildcard topic -> refused'
  script:
    # The administrator's ceiling, as the reconciler loads it from Git once merged.
    - proves: expect
      manifest: { kind: Group, name: devices, spec: { members: [{ user: scn.org-admin@hel.fi }] } }
    - proves: expect
      manifest: { kind: DelegationPolicy, name: devices-pipeline, spec: { subjects: [{ kind: Group, name: devices }], projects: ['{project}'], segments: [pipeline], writes: true, maxExpiry: P90D } }
    - proves: expect
      manifest: { kind: MqttBroker, name: sensors, namespace: '{project}', spec: { roles: [] } }
    - proves: expect
      rest:
        method: POST
        path: /connectors
        body: { name: s89-devices, segments: [pipeline], scope: [{ project: '{project}', access: read }], expiresAt: '{in7days}' }
      contains: ['"state":"active"']
    - proves: expect
      via: connector
      call: jc_resource_list
      args: { kind: MqttBroker }
      contains: ['sensors']
    - proves: expect
      via: connector
      call: jc_mqtt_captured
      args: { name: sensors, limit: 10 }
      contains: ['"broker":"sensors"', '"mode":"ingest"', '"messages":[]']
    - proves: expect
      via: connector
      call: jc_change_plan
      args: { changes: [{ op: create, kind: DataSource, name: air-mqtt, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: DataSource, metadata: { name: air-mqtt, namespace: '{project}' }, spec: { type: mqtt, mqtt: { brokerRef: { kind: MqttBroker, name: t6248-sensors }, topics: ['sensors/+/air'] } } } }] }
      refused: true
      contains: ['spec.mqtt.brokerRef', 't6248-sensors']
    - proves: deny
      via: connector
      call: jc_mqtt_captured
      args: { name: sensors, topic: 'sensors/#' }
      refused: true
      contains: ['without + or #']
    - proves: deny
      as: viewer
      call: jc_mqtt_captured
      args: { name: sensors }
      refused: true
      contains: ['not found']
      absent: ['"messages"']
- id: S-90
  segment: data-read
  # A member (ADR-N-067 §2.4, T-6413): no RoleBinding anywhere; a Policy shares the project's citizen
  # reports with the Organization, its intake Endpoint with nobody she belongs to.
  as: member
  says: "Which datasets are shared with me? Show the newest citizen reports."
  expect: 'a data-read connector over the shared reports Endpoint: tools/list offers jc_data_query bounded to it, the read answers its entities without the personal attributes; no write tool'
  deny: 'a write preset, write access, a whole project or an Endpoint not shared -> 403 naming the field; a write tool or an unshared Endpoint through the connector -> refused, nothing of it in the answer'
  script:
    - proves: deny
      rest:
        method: POST
        path: /connectors
        body: { name: s90-writes, segments: [context], scope: [{ project: '{project}', endpoint: '{project}-reports', access: read }], expiresAt: '{in7days}' }
      refused: true
      contains: ['segments']
    - proves: deny
      rest:
        method: POST
        path: /connectors
        body: { name: s90-writes, segments: [data-read], scope: [{ project: '{project}', endpoint: '{project}-reports', access: write }], expiresAt: '{in7days}' }
      refused: true
      contains: ['scope[0].access']
    - proves: deny
      rest:
        method: POST
        path: /connectors
        body: { name: s90-whole, segments: [data-read], scope: [{ project: '{project}', access: read }], expiresAt: '{in7days}' }
      refused: true
      contains: ['scope[0].endpoint']
    - proves: deny
      rest:
        method: POST
        path: /connectors
        body: { name: s90-intake, segments: [data-read], scope: [{ project: '{project}', endpoint: '{project}-intake', access: read }], expiresAt: '{in7days}' }
      refused: true
      contains: ['scope[0].project']
    - proves: expect
      rest: { method: GET, path: /connectors/options }
      contains: ['"organizationData":true', '{project}-reports']
      absent: ['{project}-intake']
    - proves: expect
      rest:
        method: POST
        path: /connectors
        body: { name: s90-shared, segments: [data-read], scope: [{ project: '{project}', endpoint: '{project}-reports', access: read }], expiresAt: '{in7days}' }
      contains: ['"state":"active"']
    - proves: expect
      via: connector
      contains: ['jc_data_query']
      absent: ['jc_data_write', 'jc_change_plan', 'jc_resource_list']
    - proves: expect
      via: connector
      call: jc_data_query
      args: { endpoint: '{project}-reports', type: PotholeReport }
      contains: ['urn:ngsi-ld:PotholeReport:1']
      absent: ['jana@example.org']
    - proves: deny
      via: connector
      call: jc_data_write
      args: { endpoint: '{project}-reports', action: create, entities: [{ id: 'urn:ngsi-ld:PotholeReport:2', type: PotholeReport }] }
      refused: true
    - proves: deny
      via: connector
      call: jc_data_query
      args: { endpoint: '{project}-intake', type: BikeCounter }
      refused: true
      contains: ['{project}-reports']
      absent: ['urn:ngsi-ld:BikeCounter']
- id: S-91
  segment: context
  # T-6451: the whole platform from one connector, as the live walk on dev did it
  # (evidence/T-6451, conformance tests/connectors/scenarios-wave/T-6451.yaml).
  as: org-admin
  says: "Create a context space for my organization's vendor data, a data model, a write Endpoint, a data source and pipeline from a public URL, a Policy giving read to a second group, and a map layer."
  expect: 'one connector with every segment plans space, Endpoint, Policy, DataSource and Layer as one change request and the Pipeline as the next; an audience the person is outside of warns in the plan with the fix; nothing is live before a person approves'
  deny: 'approving through the connector is no tool; a key typed into the chat is refused; a project outside the scope is refused'
  script:
    - proves: expect
      manifest: { kind: Group, name: vendors, spec: { members: [{ user: scn.org-admin@hel.fi }] } }
    - proves: expect
      manifest: { kind: DelegationPolicy, name: vendors-all, spec: { subjects: [{ kind: Group, name: vendors }], projects: ['{project}'], segments: [data-read, context, pipeline, access, publish, apps, operate], writes: true, maxExpiry: P90D } }
    - proves: expect
      rest:
        method: POST
        path: /connectors
        body: { name: s91-vendor, segments: [data-read, context, pipeline, access, publish, apps, operate], scope: [{ project: '{project}', access: write }], writes: true, expiresAt: '{in7days}' }
      contains: ['"state":"active"']
    - proves: expect
      via: connector
      contains: ['jc_change_plan', 'jc_data_write', 'jc_pipeline_run']
      absent: ['jc_change_approve']
    - proves: expect
      via: connector
      call: jc_change_plan
      args: { changes: [{ op: create, kind: ContextSpace, name: vendor, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: ContextSpace, metadata: { name: vendor, namespace: '{project}' }, spec: { isSandbox: true } } }, { op: create, kind: Endpoint, name: '{project}-vendor', manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: Endpoint, metadata: { name: '{project}-vendor', namespace: '{project}' }, spec: { contextSpaceRef: vendor, audience: public, enabledRepresentations: [ngsi-ld] } } }, { op: create, kind: Policy, name: vendor-readers, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: Policy, metadata: { name: vendor-readers, namespace: '{project}' }, spec: { contextSpaceRef: vendor, assigner: 'did:web:{orgDomain}', assignee: { kind: group, id: scn-readers }, operations: [retrieveOps], information: [{ entities: [{ type: BikeCounter }] }] } } }, { op: create, kind: DataSource, name: vendor-feed, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: DataSource, metadata: { name: vendor-feed, namespace: '{project}' }, spec: { type: http, http: { url: 'https://data.example.sk/counters.csv', format: csv } } } }, { op: create, kind: Layer, name: vendor-map, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: Layer, metadata: { name: vendor-map, namespace: '{project}' }, spec: { entityType: BikeCounter, sourceEndpointRef: '{project}-vendor' } } }] }
      keep: planId
      contains: ['"planId"', '"ok":true']
      absent: ['you would not reach']
    - proves: expect
      via: connector
      call: jc_change_apply
      args: { planId: '{planId}' }
      contains: ['"changeRequests":[{', 'a person with approve']
    # A pipeline goes through jc_pipeline_test before a plan takes it.
    - proves: deny
      via: connector
      call: jc_change_plan
      args: { changes: [{ op: create, kind: Pipeline, name: vendor-load, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: Pipeline, metadata: { name: vendor-load, namespace: '{project}' }, spec: { class: scheduled, schedule: '0 * * * *', source: { dataSourceRef: { kind: DataSource, name: counters-csv } }, targetEndpoint: 'urn:ngsi-ld:Endpoint:hel.fi:{project}-doprava:{project}-intake', output: { type: BikeCounter, mode: upsert }, quotas: { maxMemoryMb: 128, cpuMillicores: 100 } } } }] }
      refused: true
      contains: ['jc_pipeline_test']
    # The person is in no group of this project, so the gateway would answer them 404 (T-6451).
    - proves: deny
      via: connector
      call: jc_change_plan
      args: { changes: [{ op: create, kind: Endpoint, name: '{project}-listed', manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: Endpoint, metadata: { name: '{project}-listed', namespace: '{project}' }, spec: { contextSpaceRef: doprava, audience: project-list, allowedProjects: [t-scn-other], enabledRepresentations: [ngsi-ld] } } }] }
      contains: ['you would not reach this Endpoint', '"path":"spec.audience"']
    - proves: deny
      via: connector
      call: jc_change_plan
      project: other
      args: { changes: [{ op: create, kind: ContextSpace, name: vendor, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: ContextSpace, metadata: { name: vendor, namespace: t-scn-other }, spec: { isSandbox: true } } }] }
      refused: true
- id: S-92
  segment: data-read
  # A vendor (T-6470, ADR-N-067 2.2): viewer of one project by RoleBinding, no person of the
  # Organization. A project they are not bound on is closed to them at the Portal; the gateway's
  # 404 on another project's `organization` Endpoint and its refusal of a `{kind: organization}`
  # grant are mocked here and proven in the gateway's attack_organization tests.
  as: vendor
  says: "Show me the bike counters of the project I work on, and those of the other project."
  expect: 'a data-read connector over the Endpoint of the project they are bound on, which reads its entities'
  deny: 'a project they are not bound on -> 403 naming the field at creation, nothing of it in the answer'
  script:
    - proves: deny
      rest:
        method: POST
        path: /connectors
        body: { name: s92-other, segments: [data-read], scope: [{ project: 't-scn-other', endpoint: 't-scn-other-reports', access: read }], expiresAt: '{in7days}' }
      refused: true
      contains: ['scope[0].project']
    - proves: expect
      rest: { method: GET, path: /connectors/options }
      contains: ['{project}-intake']
      absent: ['t-scn-other']
    - proves: expect
      rest:
        method: POST
        path: /connectors
        body: { name: s92-intake, segments: [data-read], scope: [{ project: '{project}', endpoint: '{project}-intake', access: read }], expiresAt: '{in7days}' }
      contains: ['"state":"active"']
    - proves: expect
      via: connector
      contains: ['jc_data_query']
      absent: ['jc_data_write', 'jc_change_plan']
