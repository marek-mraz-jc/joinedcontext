[package]
name = "ekiben-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "ekiben"
path = "src/main.rs"

[features]
# parquet_decode (arrow-rs parquet) and protobuf (protox + prost-reflect) are the heavy decoders; both on by default
# because seeds use them, off with --no-default-features for a smaller binary.
default = ["parquet", "protobuf", "websocket", "ngsild"]
parquet = ["dep:ekiben-parquet"]
protobuf = ["dep:ekiben-protobuf"]
# The NGSI-LD connector pair (ekiben extension): `ngsi_ld` processor, output and input.
ngsild = ["dep:ekiben-io-ngsild"]
# The websocket input (E3); off with --no-default-features.
websocket = ["ekiben-io-http/websocket"]

[dependencies]
ekiben-bloblang = { workspace = true }
ekiben-core = { workspace = true }
ekiben-processors = { workspace = true }
ekiben-io-http = { workspace = true }
ekiben-io-file = { workspace = true }
ekiben-io-nats = { workspace = true }
ekiben-text = { workspace = true }
ekiben-io-ngsild = { workspace = true, optional = true }
ekiben-parquet = { workspace = true, optional = true }
ekiben-protobuf = { workspace = true, optional = true }
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
aws-lc-rs = { workspace = true }
ekiben-testkit = { workspace = true }
tempfile = { workspace = true }
flate2 = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "pipeline_bench"
harness = false
