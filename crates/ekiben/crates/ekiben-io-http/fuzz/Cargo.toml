# Fuzzes the parsers of ekiben-io-http that read bytes from outside (T-7579): the MQTT wire
# (packet framing and PUBLISH), multipart bodies with their Content-Type, and route patterns with
# percent-decoded request paths. Each must answer or refuse, never panic, hang or allocate past
# its input. Run by hand: cargo +nightly fuzz run <target> -- -max_total_time=300. Not a member
# of the ekiben workspace.
[package]
name = "ekiben-io-http-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ekiben-io-http = { path = "..", features = ["fuzzing"] }

[[bin]]
name = "mqtt_wire"
path = "fuzz_targets/mqtt_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "multipart"
path = "fuzz_targets/multipart.rs"
test = false
doc = false
bench = false

[[bin]]
name = "path"
path = "fuzz_targets/path.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
