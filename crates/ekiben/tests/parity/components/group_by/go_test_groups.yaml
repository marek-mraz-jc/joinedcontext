input:
  stdin:
    scanner:
      to_the_end: {}
pipeline:
  threads: 1
  processors:
    - unarchive:
        format: lines
    - group_by:
      - check: 'content().contains("foo")'
        processors:
          - archive:
              format: lines
      - check: 'content().contains("bar")'
        processors:
          - bloblang: 'root = content().uppercase()'
          - bloblang: 'root = content().trim()'
    - mapping: 'root = {"b": content().string(), "m": @, "i": batch_index(), "n": batch_size()}'
output:
  stdout: {}
