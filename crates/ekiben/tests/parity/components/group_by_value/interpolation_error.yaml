input:
  stdin:
    scanner:
      to_the_end: {}
pipeline:
  threads: 1
  processors:
    - unarchive:
        format: lines
    - group_by_value:
        value: '${! this.k.number() }'
    - mapping: 'root = {"b": content().string(), "e": error(), "i": batch_index(), "n": batch_size()}'
output:
  stdout: {}
