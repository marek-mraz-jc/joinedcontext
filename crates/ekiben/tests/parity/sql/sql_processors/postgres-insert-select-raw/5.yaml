logger: {level: OFF}
input:
  generate:
    count: 1
    interval: ""
    mapping: 'root = {"min": 2, "name": "doc-9"}'
pipeline:
  threads: 1
  processors:
    - sql_raw:
        driver: postgres
        dsn: ${PG_DSN}
        query: "SELECT foo FROM footable WHERE bar = $1"
        args_mapping: 'root = [ 99 ]'
output:
  stdout: {}
