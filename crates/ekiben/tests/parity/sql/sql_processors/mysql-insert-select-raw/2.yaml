logger: {level: OFF}
input:
  generate:
    count: 3
    interval: ""
    mapping: 'root = {"i": counter()}'
pipeline:
  threads: 1
  processors:
    - sql_insert:
        driver: mysql
        dsn: ${MY_DSN}
        table: footable
        columns: [ foo, bar, baz ]
        args_mapping: 'root = [ "doc-" + this.i.string(), this.i, "b" + this.i.string() ]'
output:
  stdout: {}
