logger: {level: OFF}
input:
  generate:
    count: 1
    interval: ""
    mapping: 'root = {"min": 2, "name": "doc-9"}'
pipeline:
  threads: 1
  processors:
    - sql_raw:
        driver: mysql
        dsn: ${MY_DSN}
        query: "UPDATE footable SET foo = ? WHERE bar = ?"
        args_mapping: 'root = [ this.name, this.min ]'
        exec_only: true
    - sql_raw:
        driver: mysql
        dsn: ${MY_DSN}
        query: "SELECT foo, bar, baz FROM footable WHERE bar >= ? ORDER BY bar"
        args_mapping: 'root = [ 2 ]'
output:
  stdout: {}
