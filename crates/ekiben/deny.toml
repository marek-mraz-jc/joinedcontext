[licenses]
# Permissive licenses only; copyleft stays out.
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "MIT-0", "BSD-1-Clause", "BSD-2-Clause",
         "BSD-3-Clause", "0BSD", "ISC", "BSL-1.0", "CC0-1.0", "CDLA-Permissive-2.0", "Unicode-3.0", "Unlicense", "Zlib"]
# The pure-Rust libbzip2 port behind the decompress scanner's bzip2 (T-6843) keeps libbzip2's own
# permissive BSD-style licence; allowed for that crate alone.
exceptions = [{ allow = ["bzip2-1.0.6"], crate = "libbz2-rs-sys" }]

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
