[licenses]
# Permissive licenses only; copyleft stays out.
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "MIT-0", "BSD-1-Clause", "BSD-2-Clause",
         "BSD-3-Clause", "0BSD", "ISC", "BSL-1.0", "CC0-1.0", "CDLA-Permissive-2.0", "Unicode-3.0", "Unlicense", "Zlib"]
# The pure-Rust libbzip2 port behind the decompress scanner's bzip2 (T-6843) keeps libbzip2's own
# permissive BSD-style licence; allowed for that crate alone.
exceptions = [{ allow = ["bzip2-1.0.6"], crate = "libbz2-rs-sys" }]

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0441", reason = "pin-utils 0.1.1 unmaintained (no vulnerability; std::pin::pin! replaces it): only via async-imap 0.12.0 (newest) -> ekiben-io-remote, the imap input (T-7087). Drop when async-imap releases without pin-utils" },
    { id = "RUSTSEC-2026-0543", reason = "chrono 0.4.45 unmaintained (no vulnerability, no safe upgrade): a direct dependency of 76 Cargo.toml files (timestamps, RFC 3339 wire formats, sqlx timestamptz). Owner 2026-11-18 dated ignore; remove by 2027-02-18 or when the migration task T-7233 (to jiff) lands, whichever is first" },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
