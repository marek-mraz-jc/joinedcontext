[package]
name = "shako-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "shako"
path = "src/main.rs"

[dependencies]
shako-api = { path = "../api" }
shako-core = { path = "../core" }
shako-git = { path = "../git" }
shako-mcp = { path = "../mcp" }
shako-registry = { path = "../registry" }
shako-store-memory = { path = "../store-memory" }
shako-store-pg = { path = "../store-pg" }
shako-web = { path = "../web" }
jc-router = { path = "../../shared/jc-router" }
axum = { version = "0.8", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
http = "1.5"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "sync", "time"] }
tracing = "0.1"
uuid = { version = ">=1.28, <1.29.1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
# The Portal's own forge client drives tests/portal_contract.rs, so every call is the Portal's request
# and every answer goes through the Portal's own parsing.
joinedcontext-portal = { path = "../../portal" }
base64 = "0.22"
hmac = "0.12"
http-body-util = "0.1"
ipnet = "2.12"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
tempfile = "3.27"
tower = { version = "0.5", features = ["util"] }
url = "2.5"
zip = { version = "9.2", default-features = false, features = ["deflate"] }
