[package]
name = "shako-store-memory"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
shako-core = { path = "../core" }
chrono = { version = "0.4", features = ["serde"] }
odata-table = { git = "https://github.com/marek-mraz-jc/Antares-NGSI-LD-Context-Broker", rev = "9dc22aacc41b0f4f41a1bd493a371ba49b4ca5cd", package = "odata-table" }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["sync"] }
uuid = { version = ">=1.28, <1.29.1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
shako-core = { path = "../core", features = ["testkit"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
