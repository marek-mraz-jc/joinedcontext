[package]
name = "shako-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
shako-api = { path = "../api" }
shako-core = { path = "../core" }
shako-git = { path = "../git" }
jc-router = { path = "../../shared/jc-router" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
shako-store-memory = { path = "../store-memory" }
tempfile = "3.27"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
