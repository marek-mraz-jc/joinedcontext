[package]
name = "shako-git"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
shako-core = { path = "../core" }
base64 = "0.22"
bstr = "1.13"
jc-time = { path = "../../shared/jc-time" }
flate2 = "1.1"
gix = "0.90"
gix-hash = "0.28"
gix-object = "0.66"
gix-odb = "0.87"
gix-pack = "0.77"
gix-packetline = "0.24"
gix-ref = "0.69"
gix-validate = "0.13"
parking_lot = "0.12"
regex = "1.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_norway = "0.9"
tar = "0.4"
tempfile = "3.27"
tokio = { version = "1.54", features = ["sync", "io-util", "rt"] }
uuid = { version = ">=1.28, <1.29.1", features = ["v4", "v7", "serde"] }
zip = { version = "9.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
