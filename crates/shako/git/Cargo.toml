[package]
name = "shako-git"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
shako-core = { path = "../core" }
bstr = "1.13"
bytes = "1.12"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.1"
gix = "0.90"
gix-archive = "0.39"
gix-hash = "0.28"
gix-merge = "0.23"
gix-object = "0.66"
gix-odb = "0.87"
gix-pack = "0.77"
gix-packetline = "0.24"
gix-protocol = "0.68"
gix-ref = "0.69"
gix-revwalk = "0.38"
gix-validate = "0.13"
hex = "0.4"
parking_lot = "0.12"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.54", features = ["sync", "task", "io-util", "rt"] }
uuid = { version = ">=1.28, <1.29.1", features = ["v4", "v7", "serde"] }
zip = { version = "9.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
