[package]
name = "shako-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
shako-core = { path = "../core" }
shako-git = { path = "../git" }
jc-router = { path = "../../shared/jc-router" }
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
bytes = "1.12"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1.5"
http-body-util = "0.1"
odata-csdl = { git = "https://github.com/marek-mraz-jc/Antares-NGSI-LD-Context-Broker", rev = "9dc22aacc41b0f4f41a1bd493a371ba49b4ca5cd", package = "odata-csdl" }
odata-table = { git = "https://github.com/marek-mraz-jc/Antares-NGSI-LD-Context-Broker", rev = "9dc22aacc41b0f4f41a1bd493a371ba49b4ca5cd", package = "odata-table" }
odata-url = { git = "https://github.com/marek-mraz-jc/Antares-NGSI-LD-Context-Broker", rev = "9dc22aacc41b0f4f41a1bd493a371ba49b4ca5cd", package = "odata-url" }
parking_lot = "0.12"
percent-encoding = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1.54", features = ["sync", "time"] }
tokio-stream = "0.1"
tracing = "0.1"
utoipa = "5.5"
url = "2.5"
uuid = { version = ">=1.28, <1.29.1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
shako-store-memory = { path = "../store-memory" }
tempfile = "3.27"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
