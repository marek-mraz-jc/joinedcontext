[package]
name = "shako-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
shako-api = { path = "../api" }
shako-core = { path = "../core" }
shako-git = { path = "../git" }
jc-router = { path = "../../shared/jc-router" }
# Without `config`: askama.toml support pulls basic-toml (RUSTSEC-2026-0374, unmaintained).
askama = { version = "0.12.1", default-features = false, features = ["humansize", "num-traits", "urlencode"] }
askama_escape = "0.10"
axum = "0.8"
http = "1.5"
pulldown-cmark = "0.13"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.54", features = ["rt"] }
url = "2.5"

[dev-dependencies]
shako-store-memory = { path = "../store-memory" }
http-body-util = "0.1"
tempfile = "3.27"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
