[package]
name = "controlroom-model"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }
odata-csdl = "0.3"
odata-table = "0.3"
odata-url = "0.3"
regex = "1"
schemars = { version = "0.8", features = ["uuid1", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
