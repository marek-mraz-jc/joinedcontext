[package]
name = "controlroom-mcp"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
controlroom-api = { path = "../api" }
controlroom-import = { path = "../import" }
controlroom-model = { path = "../model" }
controlroom-query = { path = "../query" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
controlroom-store-memory = { path = "../store-memory" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
