[package]
name = "controlroom-import"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
controlroom-model = { path = "../model" }
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
controlroom-store-memory = { path = "../store-memory" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
