[package]
name = "controlroom-server"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "controlroom"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json"] }
clap = { version = "4", features = ["derive"] }
controlroom-api = { path = "../api" }
controlroom-expr = { path = "../expr" }
controlroom-import = { path = "../import" }
controlroom-mcp = { path = "../mcp" }
controlroom-model = { path = "../model" }
controlroom-query = { path = "../query" }
controlroom-store-memory = { path = "../store-memory" }
controlroom-store-pg = { path = "../store-pg" }
http = "1"
jc-router = { path = "../../shared/jc-router" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
ipnet = "2"
tower = { version = "0.5", features = ["util"] }
