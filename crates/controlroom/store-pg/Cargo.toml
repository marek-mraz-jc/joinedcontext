[package]
name = "controlroom-store-pg"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
controlroom-model = { path = "../model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "rt", "sync"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
zeroize = "1"

[dev-dependencies]
controlroom-store-memory = { path = "../store-memory" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
