[package]
name = "controlroom-api"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["json"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
controlroom-expr = { path = "../expr" }
controlroom-import = { path = "../import" }
controlroom-model = { path = "../model" }
controlroom-query = { path = "../query" }
hex = "0.4"
http = "1"
http-body-util = "0.1"
indexmap = { version = "2", features = ["serde"] }
jc-router = { path = "../../shared/jc-router" }
odata-csdl = "0.3"
odata-table = "0.3"
odata-url = "0.3"
parking_lot = "0.12"
percent-encoding = "2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
controlroom-store-memory = { path = "../store-memory" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
