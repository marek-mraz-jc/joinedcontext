[package]
name = "kaisatsu-oidc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
kaisatsu-core = { path = "../core" }
kaisatsu-crypto = { path = "../crypto" }
jc-router = { path = "../../shared/jc-router" }
axum = { version = "0.8", features = ["form", "json"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
http = "1.5"
ipnet = "2.12"
jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs", "use_pem"] }
parking_lot = "0.12"
regex = "1.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
sha2 = "0.11"
subtle = "2.6"
tokio = { version = "1.54", features = ["net", "time", "sync"] }
tracing = "0.1"
url = "2.5"
uuid = { version = ">=1.28, <1.29.1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
kaisatsu-store-memory = { path = "../store-memory" }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
