<!DOCTYPE html>
<html lang="__LANG__" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>__TITLE__</title>
<style nonce="__NONCE__">
__BRANDING_CSS__
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
    background: #f0f0f0;
    color: #151515;
    font-family: var(--jc-font-body, system-ui, sans-serif);
    font-size: 1rem;
    line-height: 1.5;
}
[hidden] { display: none !important; }
a { color: #0066cc; }
.skip { position: absolute; left: -999px; top: 0; }
.skip:focus { left: 1rem; z-index: 10; background: #fff; padding: 0.5rem; }
.masthead {
    display: flex; align-items: center; gap: 1rem;
    min-height: 4.25rem; padding: 0 1.5rem;
    background: #151515; color: #fff;
}
.masthead .brand { font-family: var(--jc-font-heading, inherit); font-weight: 600; font-size: 1.125rem; }
.masthead .spacer { flex: 1; }
.masthead .who { font-size: 0.9375rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 18rem; }
.icon-btn, .masthead .signout {
    background: transparent; color: #fff; border: 1px solid #8a8d90; border-radius: 3px;
    padding: 0.375rem 0.75rem; font: inherit; font-size: 0.9375rem; cursor: pointer; min-height: 2.25rem;
}
.icon-btn { display: none; }
.layout { display: grid; grid-template-columns: 18rem 1fr; min-height: calc(100vh - 4.25rem); }
nav.sidebar { background: #212427; color: #fff; padding: 1rem 0; }
nav.sidebar .group { padding: 0.75rem 1.5rem 0.25rem; font-size: 0.875rem; color: #d2d2d2; }
nav.sidebar a {
    display: block; padding: 0.625rem 1.5rem; color: #fff; text-decoration: none; border-left: 3px solid transparent;
}
nav.sidebar a.sub { padding-left: 2.25rem; font-size: 0.9375rem; }
nav.sidebar a[aria-current="page"] { background: #4f5255; border-left-color: var(--jc-primary, #73bcf7); }
nav.sidebar a:hover { background: #3c3f42; }
main { padding: 1.5rem 1.5rem 3rem; min-width: 0; }
.page { background: #fff; padding: 1.5rem; max-width: 60rem; }
h1 { font-family: var(--jc-font-heading, inherit); font-size: 1.75rem; font-weight: 400; margin: 0 0 0.25rem; }
.lead { margin: 0 0 1.5rem; color: #3c3f42; }
h2 { font-size: 1.25rem; font-weight: 500; margin: 2rem 0 0.25rem; }
h3 { font-size: 1rem; font-weight: 600; margin: 0; }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.5rem 1rem; margin-top: 1.5rem; }
.section-head + .sessions { margin-top: 1rem; }
.muted { color: #3c3f42; margin: 0.25rem 0 0.75rem; }
.alert { border: 1px solid; border-left-width: 4px; padding: 0.75rem 1rem; margin: 0 0 1.25rem; }
.alert.ok { border-color: #3e8635; background: #f3faf2; color: #1e4f18; }
.alert.err { border-color: #c9190b; background: #faeae8; color: #7d1007; }
.alert.info { border-color: #2b9af3; background: #e7f1fa; color: #002952; }
.field { margin-bottom: 1.25rem; max-width: 34rem; }
label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
input[type=text], input[type=email] {
    width: 100%; padding: 0.5rem 0.75rem; font: inherit; border: 1px solid #8a8d90; border-bottom-color: #4f5255; border-radius: 0; background: #fff; color: #151515;
}
input[readonly] { background: #f0f0f0; border-color: #d2d2d2; }
input[aria-invalid=true] { border-color: #c9190b; border-bottom-width: 2px; }
.hint { font-size: 0.875rem; color: #3c3f42; margin-top: 0.25rem; }
.ferr { font-size: 0.875rem; color: #a30000; margin-top: 0.25rem; }
.req { color: #a30000; }
.btn {
    font: inherit; padding: 0.375rem 1rem; min-height: 2.25rem; border-radius: 3px; cursor: pointer;
    border: 1px solid #0066cc; background: #fff; color: #0066cc; text-decoration: none; display: inline-flex; align-items: center;
}
.btn.primary { background: var(--jc-primary, #0066cc); border-color: var(--jc-primary, #0066cc); color: var(--jc-primary-fg, #fff); }
.btn.danger { background: #c9190b; border-color: #c9190b; color: #fff; }
.btn.danger-outline { border-color: #c9190b; color: #a30000; }
.btn.link { border-color: transparent; padding-left: 0; padding-right: 0; }
.btn[disabled] { opacity: 0.6; cursor: default; }
.actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.5rem; }
.rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid #d2d2d2; }
.rows li {
    display: grid; grid-template-columns: minmax(8rem, 1fr) minmax(10rem, 2fr) auto; gap: 0.5rem 1.5rem; align-items: center;
    padding: 1rem; border-bottom: 1px solid #d2d2d2;
}
.rows li.empty { display: block; text-align: center; color: #3c3f42; }
.rows .when b { margin-right: 0.5rem; }
.rows .row-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: flex-end; }
.sessions { display: grid; gap: 1rem; }
.session { border: 1px solid #d2d2d2; padding: 1rem 1.25rem; }
.session-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.5rem; align-items: center; }
.badge { display: inline-block; font-size: 0.8125rem; background: #3e8635; color: #fff; border-radius: 1rem; padding: 0 0.625rem; margin-left: 0.5rem; vertical-align: middle; }
dl.facts { display: flex; flex-wrap: wrap; gap: 0.75rem 2rem; margin: 0.75rem 0 0; }
dl.facts dt { font-size: 0.875rem; color: #3c3f42; }
dl.facts dd { margin: 0; white-space: nowrap; }
.loading { color: #3c3f42; padding: 2rem 0; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #0066cc; outline-offset: 2px; }
@media (max-width: 52rem) {
    .layout { grid-template-columns: 1fr; }
    .icon-btn { display: inline-block; }
    nav.sidebar { display: none; }
    nav.sidebar.open { display: block; }
    main { padding: 1rem; }
    .page { padding: 1rem; }
    .masthead { padding: 0 1rem; gap: 0.75rem; }
    .masthead .who { display: none; }
    .rows li { grid-template-columns: 1fr; }
    .rows .row-actions { justify-content: flex-start; }
    h1 { font-size: 1.5rem; }
}
</style>
</head>
<body>
<a class="skip" href="#main" id="skip"></a>
<header class="masthead">
    <button type="button" class="icon-btn" id="menu-btn" aria-controls="sidebar" aria-expanded="false"></button>
    <span class="brand">__REALM__</span>
    <span class="spacer"></span>
    <span class="who" id="who"></span>
    <button type="button" class="signout" id="signout" hidden></button>
</header>
<div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main id="main" tabindex="-1"><div class="page" id="page"><p class="loading" id="loading"></p></div></main>
</div>
<script type="application/json" id="cfg">__CONFIG__</script>
<script type="application/json" id="i18n">__STRINGS__</script>
<script nonce="__NONCE__">
(function () {
"use strict";
var cfg = JSON.parse(document.getElementById("cfg").textContent);
var T = JSON.parse(document.getElementById("i18n").textContent);
function t(k) { return Object.prototype.hasOwnProperty.call(T, k) ? T[k] : k; }
function fmt(k, a) { return t(k).replace(/\{(\d)\}/g, function (_, i) { return a[+i]; }); }
var token = null, idToken = null, me = null;
var PAGES = [
    { path: "/personal-info", title: "accountPersonalInfo", render: personalInfo },
    { path: "/account-security/signing-in", title: "accountSigningIn", group: "accountSecurity", render: signingIn },
    { path: "/account-security/device-activity", title: "accountDeviceActivity", group: "accountSecurity", render: deviceActivity }
];

function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
        if (k === "text") { n.textContent = attrs[k]; }
        else if (k === "on") { Object.keys(attrs.on).forEach(function (ev) { n.addEventListener(ev, attrs.on[ev]); }); }
        else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) { n.setAttribute(k, attrs[k] === true ? "" : attrs[k]); }
    });
    (kids || []).forEach(function (c) { if (c) { n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); } });
    return n;
}
function b64url(bytes) {
    var s = ""; bytes.forEach(function (b) { s += String.fromCharCode(b); });
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function randomString() { return b64url(crypto.getRandomValues(new Uint8Array(32))); }
function redirectUri() { return location.origin + cfg.base + "/"; }

function signIn(extra) {
    var verifier = randomString(), state = randomString();
    crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)).then(function (h) {
        var back = location.pathname.indexOf(cfg.base) === 0 ? location.pathname : cfg.base + "/";
        sessionStorage.setItem("kc-pkce", JSON.stringify({ verifier: verifier, state: state, path: back, action: (extra && extra.kc_action) || null }));
        var q = new URLSearchParams({
            client_id: cfg.clientId, redirect_uri: redirectUri(), response_type: "code", scope: "openid",
            state: state, code_challenge: b64url(new Uint8Array(h)), code_challenge_method: "S256", ui_locales: cfg.locale
        });
        Object.keys(extra || {}).forEach(function (k) { q.set(k, extra[k]); });
        location.assign(cfg.oidc + "/auth?" + q.toString());
    });
}

function boot() {
    var q = new URLSearchParams(location.search);
    if (!q.has("code") && !q.has("error") && !q.has("kc_action_status")) { signIn(); return; }
    var saved = null;
    try { saved = JSON.parse(sessionStorage.getItem("kc-pkce") || "null"); } catch (e) { saved = null; }
    sessionStorage.removeItem("kc-pkce");
    var status = q.get("kc_action_status");
    if (status) { sessionStorage.setItem("kc-flash", status === "success" && saved && saved.action ? status + ":" + saved.action : status); }
    if (!saved || q.get("state") !== saved.state || !q.has("code")) {
        if (saved && saved.path) { history.replaceState(null, "", saved.path); }
        signIn(); return;
    }
    history.replaceState(null, "", saved.path);
    fetch(cfg.oidc + "/token", {
        method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
            grant_type: "authorization_code", code: q.get("code"), redirect_uri: redirectUri(),
            client_id: cfg.clientId, code_verifier: saved.verifier
        })
    }).then(function (r) { if (!r.ok) { throw new Error("token"); } return r.json(); })
      .then(function (tok) { token = tok.access_token; idToken = tok.id_token; return api("GET", "/"); })
      .then(function (r) { return r.json(); })
      .then(function (info) { me = info; shell(); route(); })
      .catch(function () { fatal(); });
}

function api(method, path, body) {
    var init = { method: method, headers: { "Authorization": "Bearer " + token, "Accept": "application/json" } };
    if (body !== undefined) { init.headers["Content-Type"] = "application/json"; init.body = JSON.stringify(body); }
    return fetch(cfg.base + path, init).then(function (r) {
        if (r.status === 401) { signIn(); throw new Error("signed out"); }
        return r;
    });
}

function fatal() {
    var page = document.getElementById("page");
    page.replaceChildren(el("div", { "class": "alert err", role: "alert", text: t("accountError") }));
}

function shell() {
    document.getElementById("skip").textContent = t("accountSkip");
    var who = [me.firstName, me.lastName].filter(Boolean).join(" ") || me.username;
    document.getElementById("who").textContent = who;
    var so = document.getElementById("signout");
    so.textContent = t("accountSignOutLink"); so.hidden = false;
    so.addEventListener("click", function () {
        var q = new URLSearchParams({ client_id: cfg.clientId, post_logout_redirect_uri: redirectUri() });
        if (idToken) { q.set("id_token_hint", idToken); }
        location.assign(cfg.oidc + "/logout?" + q.toString());
    });
    var mb = document.getElementById("menu-btn");
    mb.textContent = t("accountMenu");
    var nav = document.getElementById("sidebar");
    nav.setAttribute("aria-label", t("accountTitle"));
    mb.addEventListener("click", function () {
        var open = nav.classList.toggle("open");
        mb.setAttribute("aria-expanded", open ? "true" : "false");
    });
    var lastGroup = null;
    PAGES.forEach(function (p) {
        if (p.group && p.group !== lastGroup) { nav.appendChild(el("div", { "class": "group", text: t(p.group) })); }
        lastGroup = p.group || null;
        nav.appendChild(el("a", {
            href: cfg.base + p.path, "class": p.group ? "sub" : null, "data-path": p.path, text: t(p.title),
            on: { click: function (ev) {
                if (ev.button !== 0 || ev.metaKey || ev.ctrlKey) { return; }
                ev.preventDefault(); history.pushState(null, "", cfg.base + p.path);
                nav.classList.remove("open"); mb.setAttribute("aria-expanded", "false"); route();
            } }
        }));
    });
    window.addEventListener("popstate", route);
}

function current() {
    var rest = location.pathname.slice(cfg.base.length).replace(/\/$/, "");
    return PAGES.filter(function (p) { return p.path === rest; })[0] || PAGES[0];
}

function route() {
    var p = current();
    document.querySelectorAll("nav.sidebar a").forEach(function (a) {
        if (a.getAttribute("data-path") === p.path) { a.setAttribute("aria-current", "page"); } else { a.removeAttribute("aria-current"); }
    });
    document.title = t(p.title) + " · " + cfg.realm;
    var page = document.getElementById("page");
    page.replaceChildren(el("p", { "class": "loading", text: t("accountLoading") }));
    var flash = sessionStorage.getItem("kc-flash");
    sessionStorage.removeItem("kc-flash");
    p.render(page, flash);
}

function alertBox(kind, key) { return alertText(kind, t(key)); }
function alertText(kind, text) {
    return el("div", { "class": "alert " + kind, role: kind === "err" ? "alert" : "status", text: text });
}
function flashBox(flash) {
    if (flash === "success:UPDATE_PASSWORD") { return alertBox("ok", "accountPasswordUpdated"); }
    if (flash === "success:CONFIGURE_TOTP") { return alertBox("ok", "accountOtpAdded"); }
    if (flash && flash.indexOf("success") === 0) { return alertBox("ok", "accountActionSuccess"); }
    if (flash === "cancelled") { return alertBox("info", "accountActionCancelled"); }
    if (flash === "error") { return alertBox("err", "accountError"); }
    return null;
}
function when(ms) {
    if (!ms) { return ""; }
    return new Intl.DateTimeFormat(cfg.locale, { dateStyle: "medium", timeStyle: "short" }).format(new Date(ms));
}
function errorKey(r) {
    return r.json().then(function (j) { return j && j.errorMessage ? j : { errorMessage: "accountError" }; }, function () { return { errorMessage: "accountError" }; });
}

// ---- personal info
function personalInfo(page, flash) {
    var form = el("form", { novalidate: true, id: "personal-info" });
    var status = el("div", { "aria-live": "polite" });
    var fields = [
        { name: "username", type: "text", label: "accountUsername", ro: true, auto: "username" },
        { name: "email", type: "email", label: "accountEmail", hint: "accountEmailHint", auto: "email", req: true },
        { name: "firstName", type: "text", label: "accountFirstName", auto: "given-name" },
        { name: "lastName", type: "text", label: "accountLastName", auto: "family-name" }
    ];
    var inputs = {};
    fields.forEach(function (f) {
        var input = el("input", { id: f.name, name: f.name, type: f.type, value: me[f.name] || "", readonly: !!f.ro, required: !!f.req, "aria-required": f.req ? "true" : null, autocomplete: f.auto, "aria-describedby": f.name + "-help" });
        inputs[f.name] = input;
        var help = el("div", { id: f.name + "-help" }, [f.hint ? el("div", { "class": "hint", text: t(f.hint) }) : null]);
        if (f.name === "email" && me.email && !me.emailVerified) { help.appendChild(el("div", { "class": "hint", text: t("accountEmailUnverified") })); }
        form.appendChild(el("div", { "class": "field" }, [el("label", { "for": f.name }, [t(f.label), f.req ? el("span", { "class": "req", "aria-hidden": "true", text: " *" }) : null]), input, help]));
    });
    var save = el("button", { type: "submit", "class": "btn primary", text: t("accountSave") });
    var reset = el("button", { type: "button", "class": "btn link", text: t("doCancel"), on: { click: function () { route(); } } });
    form.appendChild(el("div", { "class": "actions" }, [save, reset]));
    form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        status.replaceChildren();
        Object.keys(inputs).forEach(function (k) { inputs[k].removeAttribute("aria-invalid"); var e = document.getElementById(k + "-err"); if (e) { e.remove(); } });
        save.disabled = true;
        api("POST", "/", { username: me.username, email: inputs.email.value, firstName: inputs.firstName.value, lastName: inputs.lastName.value })
            .then(function (r) {
                if (r.ok) { return r.json().then(function (info) { me = info; personalInfo(page, null); page.insertBefore(alertBox("ok", "accountProfileSaved"), page.children[2]); }); }
                return errorKey(r).then(function (e) {
                    var input = inputs[e.field];
                    if (input) {
                        input.setAttribute("aria-invalid", "true");
                        var help = document.getElementById(e.field + "-help");
                        help.insertBefore(el("div", { id: e.field + "-err", "class": "ferr", text: t(e.errorMessage) }), help.firstChild);
                        input.focus();
                    } else {
                        status.replaceChildren(alertBox("err", e.errorMessage));
                    }
                });
            }).catch(function () { status.replaceChildren(alertBox("err", "accountError")); })
            .then(function () { save.disabled = false; });
    });
    page.replaceChildren(
        el("h1", { text: t("accountPersonalInfo") }),
        el("p", { "class": "lead", text: t("accountPersonalInfoIntro") }),
        flashBox(flash) || el("span"), status, form
    );
}

// ---- signing in
function credentialRow(c, removable, onRemoved, status) {
    var label = c.userLabel || t(c.type === "otp" ? "accountOtp" : c.type === "password" ? "passwordLabel" : "accountPasskeys");
    var actions = el("div", { "class": "row-actions" });
    function normal() {
        actions.replaceChildren();
        if (c.type === "password") {
            actions.appendChild(el("button", { type: "button", "class": "btn", text: t("accountUpdate"), on: { click: function () { signIn({ kc_action: "UPDATE_PASSWORD" }); } } }));
        } else if (removable) {
            actions.appendChild(el("button", { type: "button", "class": "btn danger-outline", text: t("accountRemove"), "aria-label": t("accountRemove") + ": " + label, on: { click: confirmStep } }));
        }
    }
    function confirmStep() {
        var yes = el("button", { type: "button", "class": "btn danger", text: t("accountRemoveConfirmButton"), on: { click: function () {
            yes.disabled = true;
            api("DELETE", "/credentials/" + encodeURIComponent(c.id)).then(function (r) {
                if (r.ok) { onRemoved("accountRemoved"); return; }
                return errorKey(r).then(function (e) { status.replaceChildren(alertBox("err", e.errorMessage)); normal(); });
            }).catch(function () { status.replaceChildren(alertBox("err", "accountError")); normal(); });
        } } });
        actions.replaceChildren(
            el("span", { "class": "hint", text: fmt("accountRemoveConfirm", [label]) }),
            yes,
            el("button", { type: "button", "class": "btn link", text: t("doCancel"), on: { click: normal } })
        );
        yes.focus();
    }
    normal();
    return el("li", {}, [
        el("span", { text: label }),
        el("span", { "class": "when" }, [el("b", { text: t("accountCreated") }), when(c.createdDate)]),
        actions
    ]);
}

function signingIn(page, flash, notice) {
    api("GET", "/credentials").then(function (r) { if (!r.ok) { throw new Error(); } return r.json(); }).then(function (groups) {
        var by = {}; groups.forEach(function (g) { by[g.type] = g; });
        var status = el("div", { "aria-live": "polite" });
        if (notice) { status.appendChild(alertBox("ok", notice)); }
        function reload(key) { signingIn(page, null, key); }
        function list(g, emptyKey) {
            var ul = el("ul", { "class": "rows" });
            var items = (g && g.userCredentialMetadatas) || [];
            if (!items.length) { ul.appendChild(el("li", { "class": "empty", text: t(emptyKey) })); }
            items.forEach(function (m) { ul.appendChild(credentialRow(m.credential, g.removeable, reload, status)); });
            return ul;
        }
        var otp = by.otp || {};
        var otpHead = el("div", { "class": "section-head" }, [
            el("div", {}, [el("h3", { text: t("accountOtp") }), el("p", { "class": "muted", text: t("accountOtpIntro") })]),
            el("button", { type: "button", "class": "btn link", text: t("accountOtpSetUp"), on: { click: function () { signIn({ kc_action: "CONFIGURE_TOTP" }); } } })
        ]);
        var kids = [
            el("h1", { text: t("accountSigningIn") }),
            el("p", { "class": "lead", text: t("accountSigningInIntro") }),
            flashBox(flash) || el("span"), status,
            el("h2", { text: t("accountBasicAuth") }),
            el("div", { "class": "section-head" }, [el("div", {}, [el("h3", { text: t("passwordLabel") }), el("p", { "class": "muted", text: t("accountPasswordIntro") })])]),
            list(by.password, "accountPasswordNone"),
            el("h2", { text: t("accountTwoFactor") }),
            otpHead,
            otp.required ? el("p", { "class": "hint", text: t("accountOtpRequiredHint") }) : null,
            list(otp, "accountOtpNone")
        ];
        var pk = by["webauthn-passwordless"];
        if (pk && pk.userCredentialMetadatas && pk.userCredentialMetadatas.length) {
            kids.push(el("h2", { text: t("accountPasskeys") }), el("p", { "class": "muted", text: t("accountPasskeysIntro") }), list(pk, "accountOtpNone"));
        }
        page.replaceChildren.apply(page, kids.filter(Boolean));
    }).catch(fatal);
}

// ---- device activity
function deviceActivity(page, flash, notice) {
    api("GET", "/sessions").then(function (r) { if (!r.ok) { throw new Error(); } return r.json(); }).then(function (sessions) {
        var status = el("div", { "aria-live": "polite" });
        if (notice) { status.appendChild(alertText("ok", notice)); }
        sessions.sort(function (a, b) { return (b.current ? 1 : 0) - (a.current ? 1 : 0) || b.lastAccess - a.lastAccess; });
        var all = el("button", { type: "button", "class": "btn", text: t("accountSignOutAll"), on: { click: function () {
            all.replaceWith(el("span", { "class": "row-actions" }, [
                el("span", { "class": "hint", text: t("accountSignOutAllConfirm") }),
                el("button", { type: "button", "class": "btn danger", text: t("accountSignOutAll"), on: { click: function () {
                    api("DELETE", "/sessions?current=true").then(function () { token = null; signIn(); }).catch(fatal);
                } } }),
                el("button", { type: "button", "class": "btn link", text: t("doCancel"), on: { click: function () { deviceActivity(page, null); } } })
            ]));
        } } });
        var box = el("div", { "class": "sessions" });
        sessions.forEach(function (s) {
            var apps = s.clients.map(function (c) { return c.clientName; }).join(", ");
            var device = fmt("accountDeviceOn", [s.browser === "Other" ? t("accountOtherBrowser") : s.browser, s.os === "Other" ? t("accountOtherSystem") : s.os]);
            var title = el("h3", {}, [device, s.current ? el("span", { "class": "badge", text: t("accountCurrentSession") }) : null]);
            var top = el("div", { "class": "session-top" }, [title]);
            if (!s.current) {
                top.appendChild(el("button", { type: "button", "class": "btn", text: t("accountSignOut"), "aria-label": t("accountSignOut") + ": " + device + ", " + (s.ipAddress || ""), on: { click: function () {
                    api("DELETE", "/sessions/" + encodeURIComponent(s.id)).then(function (r) {
                        if (r.ok) { deviceActivity(page, null, fmt("accountSignedOutDevice", [device, s.ipAddress || "-"])); } else { status.replaceChildren(alertBox("err", "accountError")); }
                    }).catch(fatal);
                } } }));
            }
            box.appendChild(el("section", { "class": "session", "aria-label": device }, [
                top,
                el("dl", { "class": "facts" }, [
                    el("div", {}, [el("dt", { text: t("accountIpAddress") }), el("dd", { text: s.ipAddress || "-" })]),
                    el("div", {}, [el("dt", { text: t("accountStarted") }), el("dd", { text: when(s.started * 1000) })]),
                    el("div", {}, [el("dt", { text: t("accountLastAccess") }), el("dd", { text: when(s.lastAccess * 1000) })]),
                    el("div", {}, [el("dt", { text: t("accountExpires") }), el("dd", { text: when(s.expires * 1000) })]),
                    el("div", {}, [el("dt", { text: t("accountClients") }), el("dd", { text: apps || "-" })])
                ])
            ]));
        });
        page.replaceChildren(
            el("h1", { text: t("accountDeviceActivity") }),
            el("p", { "class": "lead", text: t("accountDeviceActivityIntro") }),
            flashBox(flash) || el("span"), status,
            el("div", { "class": "section-head" }, [el("h2", { text: t("accountSignedInDevices") }), all]),
            box
        );
    }).catch(fatal);
}

document.getElementById("loading").textContent = t("accountLoading");
boot();
})();
</script>
</body>
</html>
