[package]
name = "kaisatsu-login"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
kaisatsu-core = { path = "../core" }
kaisatsu-crypto = { path = "../crypto" }
kaisatsu-oidc = { path = "../oidc" }
jc-router = { path = "../../shared/jc-router" }
askama = "0.12"
axum = { version = "0.8", features = ["form", "json"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
http = "1.5"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls", "aws-lc-rs", "smtp-transport", "builder", "webpki-roots"] }
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
thiserror = "2.0"
tracing = "0.1"
url = "2.5"
uuid = { version = ">=1.28, <1.29.1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
kaisatsu-store-memory = { path = "../store-memory" }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
