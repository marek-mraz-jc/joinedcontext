[package]
name = "kaisatsu-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
kaisatsu-core = { path = "../core" }
kaisatsu-admin = { path = "../admin" }
kaisatsu-oidc = { path = "../oidc" }
jc-router = { path = "../../shared/jc-router" }
axum = { version = "0.8", features = ["json"] }
http = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
kaisatsu-store-memory = { path = "../store-memory" }
kaisatsu-crypto = { path = "../crypto" }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
