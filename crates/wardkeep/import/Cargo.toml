[package]
name = "wardkeep-import"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
wardkeep-core = { path = "../core" }
wardkeep-crypto = { path = "../crypto" }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.13"
schemars = { version = "0.8", features = ["uuid1", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
url = "2.5"
uuid = { version = "1.29", features = ["v4", "v7", "serde"] }

[dev-dependencies]
wardkeep-store-memory = { path = "../store-memory" }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
