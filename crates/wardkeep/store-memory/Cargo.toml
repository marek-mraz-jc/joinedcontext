[package]
name = "wardkeep-store-memory"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
wardkeep-core = { path = "../core" }
wardkeep-crypto = { path = "../crypto" }
chrono = { version = "0.4", features = ["serde"] }
futures-core = "0.3"
odata-table = { git = "https://github.com/marek-mraz-jc/Antares-NGSI-LD-Context-Broker", rev = "9dc22aacc41b0f4f41a1bd493a371ba49b4ca5cd", package = "odata-table" }
odata-url = { git = "https://github.com/marek-mraz-jc/Antares-NGSI-LD-Context-Broker", rev = "9dc22aacc41b0f4f41a1bd493a371ba49b4ca5cd", package = "odata-url" }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.29", features = ["v4", "v7", "serde"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
