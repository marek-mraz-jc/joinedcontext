name: ci-full
# the slow lane: runs once a day on main (02:07Z) when main moved, and on demand; never a PR gate.
# It also holds what left the per-push ci.yml (T-6153): the SDK's screens, the component gallery
# and every App (apps-all); ui-coverage runs the whole UI suite.
# The MVP pushes to main many times an hour, and a full run per push queued behind the next
# one; ci.yml stays the per-push gate. tasks/ci files a task for a red daily run like any other.
# Every 3 h it billed ~1,100 portal and ~300 platform minutes a day (T-4696). image.yml also
# builds on this run's request, so the commit tested here has a ship run promote.yml can attest.
# To put the per-push trigger back: add `push: { branches: [main] }` under `on:`.
on:
  schedule: [{ cron: "7 2 * * *" }]
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: "ci-full-${{ github.ref }}", cancel-in-progress: false }
jobs:
  # Only when main moved since this workflow's last verdict (T-6153: the checks the
  # per-push lane dropped run here, and a schedule that finds main unchanged repeats nothing);
  # a dispatch always runs. promote.yml promotes, and a production namespace admits, only a
  # commit with a green run of this workflow that ran its checks, so every check here holds
  # before prod.
  moved:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: { contents: read, actions: read }
    outputs: { run: "${{ steps.last.outputs.run }}" }
    steps:
      - id: last
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -eu
          # An earlier run of this workflow on this commit that reached a verdict (a cancelled one did not).
          earlier=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci-full.yml/runs?head_sha=$GITHUB_SHA&status=completed&per_page=20" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and (.conclusion == \"success\" or .conclusion == \"failure\"))] | length" || echo 0)
          echo "earlier runs on $GITHUB_SHA: $earlier"
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$earlier" != 0 ]; then run=false; else run=true; fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"
  test-all:
    needs: moved
    if: needs.moved.outputs.run == 'true'
    runs-on: ubuntu-latest
    # A cold cache compiles for ~31 min before the first test (run 39819576000), and a run cut
    # off at the timeout saves no cache, so 40 min kept every later run cold (T-5251).
    timeout-minutes: 60
    # The Portal's own PostgreSQL. Without it every test gated on
    # JC_PORTAL_TEST_DATABASE_URL skips itself, so the key store, the preferences and the
    # builder-run tables were covered by tests that never ran (T-2063, T-2064). The fast `ci`
    # lane keeps no service: it stays under five minutes and these are not its cases.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jc
          POSTGRES_PASSWORD: jc
          POSTGRES_DB: jc_portal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # --all-targets --all-features links every test binary: ld died of SIGBUS on a full disk
      # before any test ran (runs 41184314456, 41291762743, 41420091286), so the runner's unused
      # SDKs go first.
      - name: room on the disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The kit bundle is embedded at build time (sdk/dist, ignored in git); the integration
      # tests under tests/ take the preview branch only when it is there, so the slow lane
      # builds it first and tests the Portal as it ships (AP-56, AP-63).
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm, cache-dependency-path: sdk/pnpm-lock.yaml }
      - run: cd sdk && pnpm install --frozen-lockfile && pnpm build
      # The pipeline runner at the digest components/pipeline-runner/images.yaml pins, in streams
      # mode, for the tests that replace and delete a stream whose write fails (T-2983). A
      # service container cannot be given the `streams` argument, so it is started here. The
      # three variables are placeholders the outcome sink names; nothing answers at that URL.
      # On the host network, not a published port: the paging tests' gateway is a mock on the
      # runner's 127.0.0.1, which a bridged container cannot reach (T-3132, T-3170).
      # JC_MQTT_NAMESPACE fills the client id an MQTT source renders; sample-mqtt.test is the name
      # the MQTT sample tests give the brokers below, since a saved source never names 127.0.0.1;
      # a host starting `mqtt-` is refused as a platform broker's Service name (PL-76, T-5561).
      - run: >-
          docker run -d --name pipeline-runner --network host
          --add-host sample-mqtt.test:127.0.0.1
          -e JC_CLIENT_ID=ci -e JC_CLIENT_SECRET=ci -e JC_TOKEN_URL=http://127.0.0.1:9/token
          -e JC_MQTT_NAMESPACE=ci
          ghcr.io/warpstreamlabs/bento@sha256:656c55de3f8deddd4ee743f3c76f3b497e67324e940f2bc1769693cd8b906364
          streams
      # Two MQTT brokers for the workbench's MQTT sample (T-4841, tests/mqtt_sample_runner_tests.rs):
      # an anonymous one on 18830 and one that takes jc-sample / sample-pass alone on 18831.
      - name: the MQTT brokers
        run: |
          set -eu
          dir="${{ runner.temp }}/mqtt"
          mkdir -p "$dir"
          printf 'listeners.tcp {\n  bind = "0.0.0.0:18831"\n}\nauth {\n  allow_anonymous = false\n  no_match = deny\n  deny_action = disconnect\n  password = {include "/etc/nanomq_pwd.conf"}\n}\n' > "$dir/nanomq.conf"
          printf 'jc-sample:sample-pass\n' > "$dir/pwd.conf"
          docker run -d --name mqtt-anonymous --network host \
            eclipse-mosquitto@sha256:94f5a3d7deafa59fa3440d227ddad558f59d293c612138de841eec61bfa4d353 \
            mosquitto -p 18830
          docker run -d --name mqtt-login --network host \
            -v "$dir/nanomq.conf:/etc/nanomq.conf:ro" -v "$dir/pwd.conf:/etc/nanomq_pwd.conf:ro" \
            emqx/nanomq@sha256:ca2d97a32b731642225e96c8e5ed7492e996697a54516ee6766192aae950df93
      # The Antares broker as the platform runs it, the `-jc` image at the digest T-3636 published
      # (views, linkml, the joinedcontext engine), for the view writer's test against a real
      # broker (T-3703). The admin token is made here and never leaves the runner; the schema
      # bound is what a schema write needs (unset, every PUT /q/schemas answers 503).
      - name: the -jc broker
        run: |
          set -eu
          dir="${{ runner.temp }}/broker"
          mkdir -p "$dir"
          head -c 48 /dev/urandom | base64 | tr -d '/+=\n' > "$dir/token"
          chmod 644 "$dir/token"
          docker run -d --name broker -p 127.0.0.1:9090:9090 -v "$dir:/run/secrets/broker:ro" \
            -e ANTARES_ADMIN_TOKEN_FILE=/run/secrets/broker/token -e ANTARES_POLICY=joinedcontext \
            -e ANTARES_SCHEMA_MAX_BYTES=4194304 \
            ghcr.io/marek-mraz-jc/antares-broker-jc@sha256:b83f08ce79bc62946d8d4609f9a5318fb3ca1a2fc41f6173956a400e519b66eb
          for _ in $(seq 30); do
            curl -sf -H "authorization: Bearer $(cat "$dir/token")" localhost:9090/q/views >/dev/null && exit 0
            sleep 1
          done
          docker logs broker
          exit 1
      # Every test binary runs: without --no-fail-fast the first failing one hid the rest
      # (resource_mutate_tests was red for hours behind kit_pass_tests, T-2859).
      - run: cargo test --workspace --all-targets --all-features --no-fail-fast
        env:
          JC_PREVIEW_OUT: "${{ runner.temp }}/preview"
          JC_PORTAL_TEST_DATABASE_URL: postgres://jc:jc@127.0.0.1:5432/jc_portal_test
          # The apps database's tests make a CREATEROLE login and a database each (AP-149).
          JC_APPS_DB_TEST_URL: postgres://jc:jc@127.0.0.1:5432/jc_portal_test
          JC_PORTAL_TEST_BENTO_URL: http://127.0.0.1:4195
          JC_PORTAL_TEST_MQTT_URL: tcp://sample-mqtt.test:18830
          JC_PORTAL_TEST_MQTT_AUTH_URL: tcp://sample-mqtt.test:18831
          JC_PORTAL_TEST_BROKER_URL: http://127.0.0.1:9090
          JC_PORTAL_TEST_BROKER_TOKEN_FILE: "${{ runner.temp }}/broker/token"
      # The template's preview document, as the test above wrote it, rendered in a sandboxed
      # frame with its own policy (SDK-16, T-0678).
      - run: cd sdk && pnpm exec playwright install --with-deps chromium && pnpm e2e
        env: { JC_PREVIEW_OUT: "${{ runner.temp }}/preview" }
      - run: cargo doc --workspace --no-deps
        env: { RUSTDOCFLAGS: "-D warnings" }
  # The connector scenarios run by a model (T-5961, GOAL-connectors): each scenario's `says` and a
  # connector of its segment, graded on the doors' answers and the forge's writes, never on the
  # model's words. Today's assistant model only (USD 1.16 a run on 2026-10-28; the OpenRouter key
  # is capped at USD 20); candidates run by hand with JC_MODEL_EVAL_MODELS
  # (tests/connector_scenarios/model.rs). The table, with tokens and USD per scenario, goes to the
  # job summary. The pass rate is a reading: the job is red only when the model API refuses more
  # than a tenth of the scenarios. Without the repository secret it prints a notice and runs nothing.
  model-evals:
    needs: moved
    if: needs.moved.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env: { OPENROUTER_API_KEY: "${{ secrets.OPENROUTER_API_KEY }}" }
    steps:
      # Until the owner sets the repository secret, the job says so and runs nothing.
      - if: env.OPENROUTER_API_KEY == ''
        run: 'echo "::notice::model-evals skipped, no OPENROUTER_API_KEY repository secret"'
      - if: env.OPENROUTER_API_KEY != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: env.OPENROUTER_API_KEY != ''
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - if: env.OPENROUTER_API_KEY != ''
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - if: env.OPENROUTER_API_KEY != ''
        run: >-
          cargo test --locked --test connector_scenarios -- --ignored --exact
          model::the_model_lane_runs_every_scenario --nocapture
        env:
          JC_MODEL_EVAL_MODELS: google/gemini-3.8-flash
          JC_MODEL_EVAL_OUT: "${{ runner.temp }}/model-evals.md"
      - if: always() && env.OPENROUTER_API_KEY != ''
        run: cat "${{ runner.temp }}/model-evals.md" >> "$GITHUB_STEP_SUMMARY" || true
  wasm-apps:
    needs: moved
    if: needs.moved.outputs.run == 'true'
    # The Helsinki server WASM Apps on the real host (T-3346..T-3350, ADR-N-044): each App's
    # component, its migrations run twice as its owner, its routes against Postgres and RustFS and
    # a mock gateway (tests/wasm-apps). Its own workspace, so wasmtime stays out of test-all.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { targets: wasm32-wasip2 }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: tests/wasm-apps }
      # The host judges an App's SQL by Postgres's own parser (pg_query), built with bindgen.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev
      # RustFS at the digest the platform's own storage tests use.
      - run: >-
          docker run -d --name wasm-rustfs -p 19000:9000 -e RUSTFS_ACCESS_KEY=ci-root -e RUSTFS_SECRET_KEY=ci-root-secret
          docker.io/rustfs/rustfs@sha256:c36b3efea3d1e503f1a2581abd0e7611e0e5820dd30e1850a52384b3fc52bda4
          && for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:19000/ && break; sleep 1; done
      - run: cargo test --locked --manifest-path tests/wasm-apps/Cargo.toml --no-fail-fast
        env:
          JC_WASM_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
          JC_WASM_TEST_S3: http://127.0.0.1:19000
          JC_WASM_TEST_S3_KEY: ci-root
          JC_WASM_TEST_S3_SECRET: ci-root-secret
  connector-load:
    needs: moved
    if: needs.moved.outputs.run == 'true'
    # The connector door's budget (T-5978, AG-143): a release Portal with 1,000 connectors over
    # 50 projects and its stores in Postgres, k6 holding tools/list and two read tools at 60 calls
    # a second; p95 over the budget, a dropped arrival, a wrong answer or a rights change not
    # holding at the next call fails the job (tests/k6/connector-door.js).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jc
          POSTGRES_PASSWORD: jc
          POSTGRES_DB: jc_portal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with: { k6-version: "2.3.0" }
      - run: cargo test --locked --release --test connector_scenarios -- --ignored --exact the_connector_door_holds_its_budget_under_load --nocapture
        env:
          JC_PORTAL_TEST_DATABASE_URL: postgres://jc:jc@127.0.0.1:5432/jc_portal_test
  readme:
    needs: moved
    if: needs.moved.outputs.run == 'true'
    # Every command the README tells a newcomer to type is run here (T-2144, TS-19). A
    # renamed crate, a moved script or a flag that no longer exists then fails a lane rather
    # than somebody's first hour. Only the Build and Test sections run; "Run locally" starts
    # a server and is read by eye. 90 minutes: release build, clippy, the lib tests, the whole
    # UI suite unsharded and the Postgres-backed crate tests add up to ~42 (T-3665); 41455543617 hit a 60-minute cap still in the crate tests (T-5181).
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # A release build, the debug test builds and the whole UI suite filled the disk
      # (run 42032022491: "No space left on device"), so the runner's unused SDKs go first.
      - name: room on the disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: the extractor reads what it is meant to read
        run: python3 scripts/ci/check-readme-commands.py --selftest
      - run: python3 scripts/ci/check-readme-commands.py
  ui-coverage:
    needs: moved
    if: needs.moved.outputs.run == 'true'
    # What the UI suite covers, measured and never targeted (T-2136, TS-01). The thresholds in
    # `ui/vite.config.ts` are what it reached when they were written, so the number can rise and
    # cannot fall. Not in the fast lane: instrumenting every module costs more than its budget.
    # 40 minutes: the instrumented suite took 15, 24 and then over 25 minutes on main on
    # 2026-10-21 (runs 39640761469, 39593671500, 39680049167 cancelled mid-suite, T-5151).
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: has
        run: echo "ui=$([ -f ui/package.json ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.ui == 'yes'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { version: 10 }
      - if: steps.has.outputs.ui == 'yes'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm, cache-dependency-path: ui/pnpm-lock.yaml }
      # The SDK first, for the reason the fast lane gives: the UI links its sources (T-1439).
      - if: steps.has.outputs.ui == 'yes'
        run: cd sdk && pnpm install --frozen-lockfile
      - if: steps.has.outputs.ui == 'yes'
        run: cd ui && pnpm install --frozen-lockfile && pnpm vitest run --coverage
      # A published advisory in what the browser runs turns this lane red (T-3295); one with no
      # fix yet is overridden in package.json or ignored with its reason (T-3209 policy).
      - if: steps.has.outputs.ui == 'yes'
        run: (cd sdk && pnpm audit --prod --audit-level moderate) && (cd ui && pnpm audit --prod --audit-level moderate)
      - if: steps.has.outputs.ui == 'yes'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: ui-coverage, path: ui/coverage, if-no-files-found: error }
  web-performance:
    needs: moved
    if: needs.moved.outputs.run == 'true'
    # The public pages on a phone (T-5122): Lighthouse's mobile profile against dev, three runs a
    # page, judged by scripts/web-performance.mjs (a ceiling fails, the Core Web Vitals target
    # warns). Lighthouse runs on the runner; nothing is added to the pages it measures, and the
    # reports stay in this run's artifact, never on a third-party server.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: the ceilings' judge
        run: node --test scripts/web-performance.test.mjs
      - name: Lighthouse, mobile profile, three runs a page
        run: |
          mkdir -p "$RUNNER_TEMP/lighthouse"
          # npx resolves from the registry with no lock; --before keeps it to releases a week old (the cooldown).
          before=$(date -u -d '7 days ago' +%Y-%m-%d)
          node scripts/web-performance.mjs urls dev.joinedcontext.com | while read -r slug url; do
            for run in 1 2 3; do
              report="$RUNNER_TEMP/lighthouse/$slug-$run.json"
              # A run Lighthouse itself broke (Chrome never opened its debugging port, so no report;
              # NO_NAVSTART or a protocol timeout in the trace) is tried again, up to three times:
              # it hit a different page each night (T-5745). A page that does not load keeps failing.
              for _ in 1 2 3; do
                rm -f "$report"
                npx --yes --before="$before" lighthouse@12.8.2 "$url" --quiet --only-categories=performance \
                  --chrome-flags="--headless=new --no-sandbox" --output=json --output-path="$report" || true
                [ -s "$report" ] || continue
                jq -e '.runtimeError.code | IN("NO_NAVSTART", "NO_TRACING_STARTED", "PROTOCOL_TIMEOUT")' "$report" >/dev/null || break
              done
            done
          done
      - name: every public page under its ceiling
        run: node scripts/web-performance.mjs check "$RUNNER_TEMP/lighthouse"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: lighthouse, path: "${{ runner.temp }}/lighthouse", if-no-files-found: warn }
  apps-all:
    needs: moved
    if: needs.moved.outputs.run == 'true'
    # Every App, its tests, the coverage gate and its bundle (T-3373); the fast lane runs only the
    # Apps a change touched. The WebAssembly Apps with the lane's builder and wasm-bindgen.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APPS_ALL: "1"
      WASM_BINDGEN_VERSION: "0.2.129"
      WASM_BINDGEN_SHA256: "82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { targets: "wasm32-unknown-unknown,wasm32-wasip2", components: llvm-tools-preview }
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with: { tool: cargo-llvm-cov }
      - name: wasm-bindgen, the runner's version, checked by its digest
        run: |
          curl -sSfLo wb.tar.gz "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${WASM_BINDGEN_SHA256}  wb.tar.gz" | sha256sum --check --status
          tar xzf wb.tar.gz && sudo install -m 0755 "wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm, cache-dependency-path: sdk/pnpm-lock.yaml }
      - run: cd sdk && pnpm install --frozen-lockfile
      - name: every WebAssembly App
        run: sh scripts/apps-ci.sh wasm
      - name: every other App
        run: sh scripts/apps-ci.sh ui
  # The component-gallery baselines (T-5575; UI-15, UI-16, UI-27): four screenshots against the
  # vite dev server, no backend. Per push from T-5575 to T-6153, here since (no failure in 7 days). PW_ONLY=gallery starts the dev server alone (playwright.config.ts). A baseline
  # changes on purpose only: `pnpm e2e -- --project=gallery --update-snapshots`.
  ui-gallery:
    needs: moved
    if: needs.moved.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The baselines are taken in this image (its chromium and fonts; the command is in
    # gallery.spec.ts): on the bare runner the fallback fonts moved ~2 000 pixels per shot (T-5575).
    # Its tag matches @playwright/test in ui/pnpm-lock.yaml; move both together.
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm, cache-dependency-path: ui/pnpm-lock.yaml }
      # The UI links the SDK's sources and `link:` installs nothing for the sibling (T-1439).
      - run: cd sdk && pnpm install --frozen-lockfile
      - run: cd ui && pnpm install --frozen-lockfile
      - name: the component gallery matches its baselines
        env: { PW_ONLY: gallery }
        run: cd ui && pnpm exec playwright test
      # The actual and diff PNGs tell an intended change, whose baseline then wants regenerating,
      # from a layout that broke (T-2311).
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-gallery-results
          path: ui/test-results/
          retention-days: 7
          if-no-files-found: ignore
  # The SDK's own typecheck, screens and build (SDK-01, AP-56), per push until T-6153 (166 s a
  # push, no failure in 7 days).
  sdk-screens:
    needs: moved
    if: needs.moved.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm, cache-dependency-path: sdk/pnpm-lock.yaml }
      - run: cd sdk && pnpm install --frozen-lockfile && pnpm typecheck && pnpm test && pnpm build
  supply-chain:
    needs: moved
    if: needs.moved.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with: { tool: "cargo-audit,cargo-deny" }
      - run: cargo audit
      - run: cargo deny check advisories bans licenses sources
  trivy-fs:
    needs: moved
    if: needs.moved.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: fs, severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true }
  e2e:
    needs: moved
    if: needs.moved.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # The Apps installed without a lockfile take no release younger than a day (T-3527, as
    # scripts/apps-ci.sh does).
    env:
      npm_config_minimum_release_age: 1440
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: has
        run: echo "ui=$([ -f ui/package.json ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.ui == 'yes'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { version: 10 }
      - if: steps.has.outputs.ui == 'yes'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      # The SDK before the UI, for the same reason the fast lane does it (T-1439): the UI links the
      # SDK's sources and `link:` installs nothing for the sibling, so the Vite build behind these
      # journeys cannot resolve the SDK's own dependencies — `maplibre-gl` is the one that failed.
      - if: steps.has.outputs.ui == 'yes'
        run: cd sdk && pnpm install --frozen-lockfile
      - if: steps.has.outputs.ui == 'yes'
        run: cd ui && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium && pnpm e2e
      # A red lane that leaves nothing behind cannot be fixed by whoever reads it. The trace and
      # the actual screenshot are the only way to tell an intended visual change — whose golden
      # then wants regenerating — from a layout that broke, and this lane is the one place with
      # a browser that works, so the images cannot be produced anywhere else (T-2311).
      - if: always() && steps.has.outputs.ui == 'yes'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results
          path: |
            ui/test-results/
            ui/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - if: steps.has.outputs.ui == 'no'
        run: echo "no ui/package.json yet"
      # The reference apps run their flows against their own binary, so the toolchain has to
      # be here too (AP-34, AP-40).
      - if: steps.has.outputs.ui == 'yes'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - if: steps.has.outputs.ui == 'yes'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - if: steps.has.outputs.ui == 'yes'
        name: the reference app flows
        # Built first: the SDK-template apps serve their own `dist/` (their playwright config says
        # so), and without it every flow met an empty page (T-2946).
        run: |
          set -eu
          for app in apps/*/ui; do
            [ -f "$app/playwright.config.ts" ] || continue
            # An app with a lockfile installs from it frozen; one without names the SDK as the
            # template does, pointed here at this checkout as the fast lane does (T-2912).
            (cd "$app" && if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else
              npm pkg set "dependencies.@joinedcontext/sdk=link:$GITHUB_WORKSPACE/sdk" \
              && pnpm install --no-frozen-lockfile; fi && pnpm build \
              && pnpm exec playwright install --with-deps chromium && pnpm e2e)
          done
      # The same flows for an application at the root of its own repository (T-2596), built from
      # the tree copied out with the SDK linked from this checkout, as the fast lane tests it.
      - if: steps.has.outputs.ui == 'yes'
        name: the flows of the applications in their own repository
        run: |
          set -eu
          for app in apps/*/; do
            [ -f "$app/playwright.config.ts" ] || continue
            # One with a WebAssembly part runs its flows in ci.yml's wasm-example job, which builds
            # wasm/pkg first (AP-142); built here it would miss its module.
            [ -f "$app/wasm/Cargo.toml" ] && continue
            work=$(mktemp -d)
            cp -r "$app". "$work"
            (cd "$work" && npm pkg set "dependencies.@joinedcontext/sdk=link:$GITHUB_WORKSPACE/sdk" \
              && pnpm install --no-frozen-lockfile && pnpm build \
              && pnpm exec playwright install --with-deps chromium && pnpm e2e)
          done
