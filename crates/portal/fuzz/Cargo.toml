# Fuzzing the Portal's parsers of outside input (T-7656, T-7727, T-7729, T-7698, T-7699): label and
# field selectors and the list filter and orderBy of a request's query string, the gateway's
# Prometheus page, a pipeline's cron schedule, the masking of a record the runner posts, the list
# query string and its cursor, a device's JSON Web Key Set, an MQTT test-publish body, and (T-7658) a
# feedback body, a comment's mentions, a git bundle's header, an entity bound for the trash and an
# Endpoint preview's body, and (T-7659) an export's revision and kinds filter, the secrets a bundle
# strips and a visualization's title. Its own
# workspace, not a member of the Portal's: `cargo +nightly fuzz run <target> fuzz/corpus/<target>
# fuzz/seeds/<target>` from crates/portal; seeds/ holds the committed seed inputs.
[package]
name = "joinedcontext-portal-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
joinedcontext-portal = { path = ".." }
jc-core = { git = "https://github.com/marek-mraz-jc/joinedcontext-platform.git", rev = "9b0b85944083ae547b331d2327db4021e81cd08a", version = "0.1.0" }

[[bin]]
name = "selector"
path = "fuzz_targets/selector.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filter"
path = "fuzz_targets/filter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "prometheus"
path = "fuzz_targets/prometheus.rs"
test = false
doc = false
bench = false

[[bin]]
name = "schedule"
path = "fuzz_targets/schedule.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mask"
path = "fuzz_targets/mask.rs"
test = false
doc = false
bench = false

[[bin]]
name = "list_query"
path = "fuzz_targets/list_query.rs"
test = false
doc = false
bench = false

[[bin]]
name = "device_jwks"
path = "fuzz_targets/device_jwks.rs"
test = false
doc = false
bench = false

[[bin]]
name = "test_publish"
path = "fuzz_targets/test_publish.rs"
test = false
doc = false
bench = false

# The Portal's own patches (../Cargo.toml), one directory deeper: the vendored platform, ngsild
# and the patched rstar and geo-types, so the targets link the code the Portal ships.
[patch."https://github.com/marek-mraz-jc/joinedcontext-platform.git"]
jc-core = { path = "../../../vendor/joinedcontext-platform/crates/jc-core" }
jcctl = { path = "../../../vendor/joinedcontext-platform/crates/jcctl" }
context-gateway = { path = "../../../vendor/joinedcontext-platform/crates/context-gateway" }

[patch."https://github.com/marek-mraz-jc/ngsild"]
ngsild-ql = { path = "../../../vendor/ngsild/crates/antares-ql" }
ngsild-jsonld = { path = "../../../vendor/ngsild/crates/antares-jsonld" }
ngsild-matcher = { path = "../../../vendor/ngsild/crates/antares-matcher" }
ngsild-model = { path = "../../../vendor/ngsild/crates/antares-model" }

[patch.crates-io]
rstar = { path = "../../antares/vendor/rstar" }
geo-types = { path = "../../antares/vendor/geo-types" }

