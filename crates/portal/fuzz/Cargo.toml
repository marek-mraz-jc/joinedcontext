# Fuzzing the Portal's parsers of outside input (T-7656, T-7727, T-7729, T-7698, T-7699): label and
# field selectors and the list filter and orderBy of a request's query string, the gateway's
# Prometheus page, a pipeline's cron schedule, the masking of a record the runner posts, the list
# query string and its cursor, a device's JSON Web Key Set, an MQTT test-publish body, (T-7658) a
# feedback body, a comment's mentions, a git bundle's header, an entity bound for the trash and an
# Endpoint preview's body, (T-7605) the unverified `iss` of a bearer token, the double-submit
# CSRF check over arbitrary headers, the login redirect target and an Organization realm list from
# jc's host registry, and (T-7652) a forge's receive-pack answer, an App's host name under the apps
# apex and an App repository's build workflow, (T-7711) the assistant's reading of a model
# answer's tool calls, a JSON merge patch of a manifest, a data tool's answer and an App's written
# paths and texts, (T-7724) a robots.txt body, a link found in an entity and the manifests a
# checkout proposes to the judge, and (T-7729) a pipeline test's manifest and records and a public
# documentation page's path. Its own
# workspace, not a member of the Portal's: `cargo +nightly fuzz run <target> fuzz/corpus/<target>
# fuzz/seeds/<target>` from crates/portal; seeds/ holds the committed seed inputs.
# The targets, one per line: .gitattributes merges this file with merge=union, so two branches
# that each add a line both keep theirs. Add a line, never a [[bin]] block (it would mix with
# this array and cargo refuses the file).
bin = [
  { name = "selector", path = "fuzz_targets/selector.rs", test = false, doc = false, bench = false },
  { name = "filter", path = "fuzz_targets/filter.rs", test = false, doc = false, bench = false },
  { name = "prometheus", path = "fuzz_targets/prometheus.rs", test = false, doc = false, bench = false },
  { name = "schedule", path = "fuzz_targets/schedule.rs", test = false, doc = false, bench = false },
  { name = "mask", path = "fuzz_targets/mask.rs", test = false, doc = false, bench = false },
  { name = "list_query", path = "fuzz_targets/list_query.rs", test = false, doc = false, bench = false },
  { name = "device_jwks", path = "fuzz_targets/device_jwks.rs", test = false, doc = false, bench = false },
  { name = "test_publish", path = "fuzz_targets/test_publish.rs", test = false, doc = false, bench = false },
  { name = "feedback", path = "fuzz_targets/feedback.rs", test = false, doc = false, bench = false },
  { name = "mentions", path = "fuzz_targets/mentions.rs", test = false, doc = false, bench = false },
  { name = "bundle_head", path = "fuzz_targets/bundle_head.rs", test = false, doc = false, bench = false },
  { name = "trash_entity", path = "fuzz_targets/trash_entity.rs", test = false, doc = false, bench = false },
  { name = "preview_query", path = "fuzz_targets/preview_query.rs", test = false, doc = false, bench = false },
  { name = "receive_pack", path = "fuzz_targets/receive_pack.rs", test = false, doc = false, bench = false },
  { name = "auth_issuer_of", path = "fuzz_targets/auth_issuer_of.rs", test = false, doc = false, bench = false },
  { name = "app_origin", path = "fuzz_targets/app_origin.rs", test = false, doc = false, bench = false },
  { name = "auth_csrf_double_submit", path = "fuzz_targets/auth_csrf_double_submit.rs", test = false, doc = false, bench = false },
  { name = "build_workflow", path = "fuzz_targets/build_workflow.rs", test = false, doc = false, bench = false },
  { name = "auth_login_redirect", path = "fuzz_targets/auth_login_redirect.rs", test = false, doc = false, bench = false },
  { name = "auth_realms_parse", path = "fuzz_targets/auth_realms_parse.rs", test = false, doc = false, bench = false },
  { name = "catalog_answers", path = "fuzz_targets/catalog_answers.rs", test = false, doc = false, bench = false },
  { name = "kube_objects", path = "fuzz_targets/kube_objects.rs", test = false, doc = false, bench = false },
  { name = "agents_model_calls", path = "fuzz_targets/agents_model_calls.rs", test = false, doc = false, bench = false },
  { name = "agents_merge_patch", path = "fuzz_targets/agents_merge_patch.rs", test = false, doc = false, bench = false },
  { name = "agents_tool_answer", path = "fuzz_targets/agents_tool_answer.rs", test = false, doc = false, bench = false },
  { name = "agents_code_paths", path = "fuzz_targets/agents_code_paths.rs", test = false, doc = false, bench = false },
