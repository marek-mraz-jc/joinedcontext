# Default form arrangement for DataSource (UI-02).
# Connects to external data sources; examples match Helsinki open data feeds.
apiVersion: joinedcontext.com/v1alpha1
kind: UiSchema
metadata:
  name: datasource
spec:
  for: DataSource
  guide: User-Guide/04-pipelines
  about:
    en: >-
      A data source is where the platform fetches from: a feed, a broker, an API. It brings
      nothing in by itself — a pipeline reads it and writes into a space — so all it needs is the
      address, how to reach it and, where the source asks for one, the name of a stored secret.
    sk: >-
      Dátový zdroj je miesto, odkiaľ platforma číta: kanál, broker, API. Sám nič neprinesie —
      číta ho pipeline a zapisuje do priestoru — takže potrebuje len adresu, spôsob prístupu a,
      ak to zdroj žiada, názov uloženého tajomstva.
    cs: >-
      Datový zdroj je místo, odkud platforma čte: kanál, broker, API. Sám nic nepřinese — čte jej
      pipeline a zapisuje do prostoru — takže potřebuje jen adresu, způsob přístupu a, pokud to
      zdroj žádá, název uloženého tajemství.
    de: >-
      Eine Datenquelle ist der Ort, von dem die Plattform abruft: ein Feed, ein Broker, eine API.
      Sie bringt allein nichts herein — eine Pipeline liest sie und schreibt in einen Raum —, also
      braucht sie nur die Adresse, den Zugang und, wo die Quelle es verlangt, den Namen eines
      hinterlegten Secrets.
  # The form shows one connection at a time, the one the person picked; the others are
  # arranged here all the same and passed over while they are not on the form.
  # A webhook carries no tls: the sender calls the installation's own HTTPS edge (PL-122).
  variants: [mqtt, http, webSocket, gtfsRt, webhook, tls]
  order: [name, title, mqtt, http, webSocket, gtfsRt, webhook, tls]
  groups:
    - title:
        en: Basics
        sk: Základné údaje
        cs: Základní údaje
        de: Basisdaten
      description:
        en: Identifier and descriptive title for this data source.
        sk: Identifikátor a popisný titulok tohto zdroja údajov.
        cs: Identifikátor a popisný titulek tohoto zdroje dat.
        de: Kennung und beschreibender Titel dieser Datenquelle.
      fields: [name, title]
    - title:
        en: Where the data comes from
        sk: Odkiaľ dáta prichádzajú
        cs: Odkud data přicházejí
        de: Woher die Daten stammen
      description:
        en: Connection settings and remote endpoint configuration for the selected feed type.
        sk: Nastavenia pripojenia a vzdialeného rozhrania pre vybraný typ zdroja.
        cs: Nastavení připojení a vzdáleného rozhraní pro vybraný typ zdroje.
        de: Verbindungseinstellungen und Konfiguration der Gegenstelle für den gewählten Feed-Typ.
      fields: [mqtt, http, webSocket, gtfsRt, webhook]
    - title:
        en: TLS certificates
        sk: Certifikáty TLS
        cs: Certifikáty TLS
        de: TLS-Zertifikate
      description:
        en: Optional custom certificate authority for secure connections.
        sk: Voliteľná vlastná certifikačná autorita pre zabezpečené spojenia.
        cs: Volitelná vlastní certifikační autorita pro zabezpečená spojení.
        de: Optionale benutzerdefinierte Zertifizierungsstelle für sichere Verbindungen.
      folded: true
      fields: [tls]
  fields:
    name:
      placeholder: "bike-stations-gbfs"
      help:
        en: Identifier for this data source used by pipelines to refer to it.
        sk: Identifikátor tohto zdroja údajov, na ktorý sa odkazujú pipelines.
        cs: Identifikátor tohoto zdroje dat, na který se odkazují pipelines.
        de: Kennung dieser Datenquelle, auf die Pipelines verweisen.
    title:
      help:
        en: The name of this feed as people read it in lists and when they build a pipeline.
        sk: Názov tohto zdroja, ako ho ľudia čítajú v zoznamoch a pri stavbe pipeline.
        cs: Název tohoto zdroje, jak jej lidé čtou v seznamech a při stavbě pipeline.
        de: Der Name dieses Feeds in Listen und beim Bauen einer Pipeline.
    mqtt.brokerRef.name:
      help:
        en: An MQTT broker of this project; the pipeline reads it inside the platform with no URL or password. Empty reads an external broker.
        sk: MQTT broker tohto projektu; pipeline ho číta vnútri platformy bez URL a hesla. Prázdne číta externý broker.
        cs: MQTT broker tohoto projektu; pipeline ho čte uvnitř platformy bez URL a hesla. Prázdné čte externí broker.
        de: Ein MQTT-Broker dieses Projekts; die Pipeline liest ihn innerhalb der Plattform ohne URL und Passwort. Leer liest einen externen Broker.
    mqtt.urls:
      help:
        en: Network addresses of the message brokers; each starts with tcp://, tls://, ws:// or wss:// and names the host and port.
        sk: Sieťové adresy brokerov správ; každá začína tcp://, tls://, ws:// alebo wss:// a uvádza hostiteľa a port.
        cs: Síťové adresy brokerů zpráv; každá začíná tcp://, tls://, ws:// nebo wss:// a uvádí hostitele a port.
        de: Netzwerkadressen der Message-Broker; jede beginnt mit tcp://, tls://, ws:// oder wss:// und nennt Host und Port.
    mqtt.topics:
      help:
        en: "Message topics to subscribe to on the broker; + stands for one level of a topic and # for every level below it."
        sk: "Témy správ, ktoré sa majú odoberať na brokeri; + zastupuje jednu úroveň témy a # všetky úrovne pod ňou."
        cs: "Témata zpráv, která se mají odebírat na brokeru; + zastupuje jednu úroveň tématu a # všechny úrovně pod ní."
        de: "Nachrichten-Topics, die auf dem Broker abonniert werden sollen; + steht für eine Ebene eines Topics, # für alle Ebenen darunter."
    mqtt.qos:
      help:
        en: How hard the broker tries to deliver each message; leave it empty for the broker's own, at most once.
        sk: Ako veľmi sa broker snaží doručiť každú správu; nechajte prázdne pre predvoľbu brokera, najviac raz.
        cs: Jak moc se broker snaží doručit každou zprávu; nechte prázdné pro výchozí volbu brokeru, nejvýše jednou.
        de: Wie sehr der Broker jede Nachricht zuzustellen versucht; leer lassen für die Vorgabe des Brokers, höchstens einmal.
    mqtt.cleanSession:
      help:
        en: Discard previous state and start a fresh session on each connection.
        sk: Zahodiť predchádzajúci stav a začať čistú reláciu pri každom pripojení.
        cs: Zahodit předchozí stav a začít čistou relaci při každém připojení.
        de: Vorherigen Zustand verwerfen und bei jeder Verbindung eine neue Sitzung starten.
    mqtt.username:
      help:
        en: Username used to authenticate with the message broker.
        sk: Používateľské meno použité na overenie voči brokeru správ.
        cs: Uživatelské jméno použité pro ověření vůči brokeru zpráv.
        de: Benutzername zur Authentifizierung beim Message-Broker.
    mqtt.passwordRef.name:
      help:
        en: Name of the stored secret holding the broker password.
        sk: Názov uloženého tajomstva obsahujúceho heslo k brokeru.
        cs: Název uloženého tajemství obsahujícího heslo k brokeru.
        de: Name des gespeicherten Secrets mit dem Broker-Passwort.
    mqtt.passwordRef.key:
      help:
        en: Key inside the secret storing the broker password.
        sk: Kľúč v tajomstve, pod ktorým je uložené heslo k brokeru.
        cs: Klíč v tajemství, pod kterým je uloženo heslo k brokeru.
        de: Schlüssel innerhalb des Secrets, unter dem das Broker-Passwort hinterlegt ist.
    http.url:
      help:
        en: Web address of the external JSON, XML, or binary feed to poll; it starts with http:// or https:// and is fetched as written, query included.
        sk: Webová adresa externého zdroja JSON, XML alebo binárnych dát; začína http:// alebo https:// a načíta sa tak, ako je napísaná, aj s parametrami.
        cs: Webová adresa externího zdroje JSON, XML nebo binárních dat; začíná http:// nebo https:// a načte se tak, jak je napsaná, i s parametry.
        de: Webadresse des externen JSON-, XML- oder Binär-Feeds; sie beginnt mit http:// oder https:// und wird so abgerufen, wie sie geschrieben ist, mit Parametern.
    http.verb:
      help:
        en: HTTP request method sent to the remote server, typically GET.
        sk: Metóda požiadavky HTTP odosielaná na vzdialený server, zvyčajne GET.
        cs: Metoda požadavku HTTP odesílaná na vzdálený server, obvykle GET.
        de: An den entfernten Server gesendete HTTP-Anfragemethode, typischerweise GET.
    http.timeout:
      help:
        en: How long to wait for the remote server before giving up, such as 30s.
        sk: Ako dlho sa čaká na odpoveď vzdialeného servera pred zlyhaním, napríklad 30s.
        cs: Jak dlouho se čeká na odpověď vzdáleného serveru před selháním, například 30s.
        de: Wie lange auf eine Antwort des entfernten Servers gewartet wird, etwa 30s.
    http.records:
      help:
        en: For a JSON answer that keeps its records in an array, the path to it, such as data.stations; each item becomes one record.
        sk: Pre JSON odpoveď so záznamami v poli cesta k nemu, napríklad data.stations; každá položka je jeden záznam.
        cs: U odpovědi JSON se záznamy v poli cesta k němu, například data.stations; každá položka je jeden záznam.
        de: Bei einer JSON-Antwort mit Datensätzen in einem Array der Pfad dorthin, etwa data.stations; jedes Element wird ein Datensatz.
    http.format:
      help:
        en: "How the answer becomes records: CSV or a spreadsheet gives one record per row, with the header row's names as keys; a zipped shapefile (.shp, .dbf, .prj) one GeoJSON feature per record in WGS 84. Leave empty to read the whole answer as one record."
        sk: "Ako sa z odpovede stanú záznamy: CSV alebo tabuľka dáva jeden záznam na riadok s názvami z hlavičky ako kľúčmi; shapefile v zipe (.shp, .dbf, .prj) jeden prvok GeoJSON na záznam vo WGS 84. Prázdne pole číta celú odpoveď ako jeden záznam."
        cs: "Jak se z odpovědi stanou záznamy: CSV nebo tabulka dává jeden záznam na řádek s názvy z hlavičky jako klíči; shapefile v zipu (.shp, .dbf, .prj) jeden prvek GeoJSON na záznam ve WGS 84. Prázdné pole čte celou odpověď jako jeden záznam."
        de: "Wie aus der Antwort Datensätze werden: CSV oder eine Tabelle ergibt einen Datensatz je Zeile, mit den Namen der Kopfzeile als Schlüsseln; ein gezipptes Shapefile (.shp, .dbf, .prj) ein GeoJSON-Feature je Datensatz in WGS 84. Leer gelassen wird die ganze Antwort ein Datensatz."
    http.sheet:
      help:
        en: "Only for a spreadsheet: the sheet to read by its tab name, for example Stations 2026. Leave empty for the first sheet."
        sk: "Len pre tabuľku: hárok na čítanie podľa názvu záložky, napríklad Stanice 2026. Prázdne pole číta prvý hárok."
        cs: "Jen pro tabulku: list ke čtení podle názvu záložky, například Stanice 2026. Prázdné pole čte první list."
        de: "Nur für eine Tabelle: das zu lesende Blatt nach seinem Reiternamen, zum Beispiel Stationen 2026. Leer gelassen das erste Blatt."
    http.preset.kind:
      help:
        en: "The kind of service the URL names, for example ArcGIS Feature Service for …/FeatureServer/0/query."
        sk: "Druh služby, ktorú URL označuje, napríklad ArcGIS Feature Service pre …/FeatureServer/0/query."
        cs: "Druh služby, kterou URL označuje, například ArcGIS Feature Service pro …/FeatureServer/0/query."
        de: "Die Art des Dienstes, den die URL nennt, zum Beispiel ArcGIS Feature Service für …/FeatureServer/0/query."
    http.preset.pageSize:
      help:
        en: "1 to 10000, 1000 when empty, for example 200. Lower it when the service answers slowly."
        sk: "1 až 10000, prázdne = 1000, napríklad 200. Znížte, keď služba odpovedá pomaly."
        cs: "1 až 10000, prázdné = 1000, například 200. Snižte, když služba odpovídá pomalu."
        de: "1 bis 10000, leer = 1000, zum Beispiel 200. Senken Sie den Wert, wenn der Dienst langsam antwortet."
    http.preset.organization:
      help:
        en: "CKAN only: the organization whose datasets are read, for example bcn. Find lists them."
        sk: "Len CKAN: organizácia, ktorej dátové sady sa čítajú, napríklad bcn. Nájsť ich vypíše."
        cs: "Jen CKAN: organizace, jejíž datové sady se čtou, například bcn. Najít je vypíše."
        de: "Nur CKAN: die Organisation, deren Datensätze gelesen werden, zum Beispiel bcn. Suchen listet sie."
    http.preset.resourceId:
      help:
        en: "CKAN only: the resource whose datastore rows are read, for example 5b8f3a5e-0c1e-4f53-9d4a-1f2a3b4c5d6e."
        sk: "Len CKAN: zdroj, ktorého riadky datastore sa čítajú, napríklad 5b8f3a5e-0c1e-4f53-9d4a-1f2a3b4c5d6e."
        cs: "Jen CKAN: zdroj, jehož řádky datastore se čtou, například 5b8f3a5e-0c1e-4f53-9d4a-1f2a3b4c5d6e."
        de: "Nur CKAN: die Ressource, deren Datastore-Zeilen gelesen werden, zum Beispiel 5b8f3a5e-0c1e-4f53-9d4a-1f2a3b4c5d6e."
    http.preset.objectIdField:
      help:
        en: "ArcGIS only: the field that keeps the order stable across pages, OBJECTID when empty."
        sk: "Len ArcGIS: pole, ktoré drží stále poradie naprieč stránkami, prázdne = OBJECTID."
        cs: "Jen ArcGIS: pole, které drží stálé pořadí napříč stránkami, prázdné = OBJECTID."
        de: "Nur ArcGIS: das Feld, das die Reihenfolge über Seiten stabil hält, leer = OBJECTID."
    http.preset.outFields:
      help:
        en: "ArcGIS only: each field by name, for example objectid and naz_mco; never *."
        sk: "Len ArcGIS: každé pole menom, napríklad objectid a naz_mco; nikdy *."
        cs: "Jen ArcGIS: každé pole jménem, například objectid a naz_mco; nikdy *."
        de: "Nur ArcGIS: jedes Feld mit Namen, zum Beispiel objectid und naz_mco; nie *."
    http.preset.typeNames:
      help:
        en: "WFS only: the feature type read, for example avoindata:Helsinki_osoiteluettelo. Find lists them."
        sk: "Len WFS: čítaný typ prvku, napríklad avoindata:Helsinki_osoiteluettelo. Nájsť ich vypíše."
        cs: "Jen WFS: čtený typ prvku, například avoindata:Helsinki_osoiteluettelo. Najít je vypíše."
        de: "Nur WFS: die gelesene Objektart, zum Beispiel avoindata:Helsinki_osoiteluettelo. Suchen listet sie."
    http.preset.srsName:
      help:
        en: "WFS only: the coordinates asked for, EPSG:4326 when empty."
        sk: "Len WFS: požadované súradnice, prázdne = EPSG:4326."
        cs: "Jen WFS: požadované souřadnice, prázdné = EPSG:4326."
        de: "Nur WFS: die angefragten Koordinaten, leer = EPSG:4326."
    http.preset.expand:
      help:
        en: "SensorThings only: what is read with each entity, for example Datastreams/Observations."
        sk: "Len SensorThings: čo sa číta s každou entitou, napríklad Datastreams/Observations."
        cs: "Jen SensorThings: co se čte s každou entitou, například Datastreams/Observations."
        de: "Nur SensorThings: was mit jeder Entität gelesen wird, zum Beispiel Datastreams/Observations."
    http.paging.mode:
      help:
        en: "How the API names its next page, for example Offset and limit for ?offset=0&limit=100."
        sk: "Ako API označuje ďalšiu stránku, napríklad Posun a limit pre ?offset=0&limit=100."
        cs: "Jak API označuje další stránku, například Posun a limit pro ?offset=0&limit=100."
        de: "Wie die API ihre nächste Seite nennt, zum Beispiel Offset und Limit für ?offset=0&limit=100."
    http.paging.param:
      help:
        en: "Page number: the parameter name, page when empty."
        sk: "Číslo stránky: meno parametra, prázdne = page."
        cs: "Číslo stránky: jméno parametru, prázdné = page."
        de: "Seitennummer: der Parametername, leer = page."
    http.paging.start:
      help:
        en: "Page number or offset: where the walk starts, for example 1 for a page number, 0 for an offset."
        sk: "Kde prechádzanie začína, napríklad 1 pre číslo stránky, 0 pre posun."
        cs: "Kde procházení začíná, například 1 pro číslo stránky, 0 pro posun."
        de: "Wo das Blättern beginnt, zum Beispiel 1 für eine Seitennummer, 0 für einen Offset."
    http.paging.sizeParam:
      help:
        en: "Page number: the parameter the size is sent in, for example per_page."
        sk: "Číslo stránky: parameter, v ktorom sa posiela veľkosť, napríklad per_page."
        cs: "Číslo stránky: parametr, ve kterém se posílá velikost, například per_page."
        de: "Seitennummer: der Parameter für die Größe, zum Beispiel per_page."
    http.paging.size:
      help:
        en: "Page number: the records asked for per page, for example 100; a shorter page ends the walk."
        sk: "Číslo stránky: záznamov na stránku, napríklad 100; kratšia stránka prechádzanie ukončí."
        cs: "Číslo stránky: záznamů na stránku, například 100; kratší stránka procházení ukončí."
        de: "Seitennummer: Datensätze pro Seite, zum Beispiel 100; eine kürzere Seite beendet das Blättern."
    http.paging.offsetParam:
      help:
        en: "Offset: the parameter name, offset when empty, for example $skip or resultOffset."
        sk: "Posun: meno parametra, prázdne = offset, napríklad $skip alebo resultOffset."
        cs: "Posun: jméno parametru, prázdné = offset, například $skip nebo resultOffset."
        de: "Offset: der Parametername, leer = offset, zum Beispiel $skip oder resultOffset."
    http.paging.limitParam:
      help:
        en: "Offset: the page size parameter, limit when empty, for example $top or resultRecordCount."
        sk: "Posun: parameter veľkosti stránky, prázdne = limit, napríklad $top alebo resultRecordCount."
        cs: "Posun: parametr velikosti stránky, prázdné = limit, například $top nebo resultRecordCount."
        de: "Offset: der Seitengrößenparameter, leer = limit, zum Beispiel $top oder resultRecordCount."
    http.paging.limit:
      help:
        en: "Offset: the records asked for per page, for example 500."
        sk: "Posun: záznamov na stránku, napríklad 500."
        cs: "Posun: záznamů na stránku, například 500."
        de: "Offset: Datensätze pro Seite, zum Beispiel 500."
    http.paging.cursor:
      help:
        en: "Cursor: where the answer holds the next cursor, for example meta.next."
        sk: "Kurzor: kde odpoveď drží ďalší kurzor, napríklad meta.next."
        cs: "Kurzor: kde odpověď drží další kurzor, například meta.next."
        de: "Cursor: wo die Antwort den nächsten Cursor hält, zum Beispiel meta.next."
    http.paging.cursorParam:
      help:
        en: "Cursor: the query parameter it is sent back in, for example cursor."
        sk: "Kurzor: parameter dopytu, v ktorom sa vracia, napríklad cursor."
        cs: "Kurzor: parametr dotazu, ve kterém se vrací, například cursor."
        de: "Cursor: der Abfrageparameter, in dem er zurückgeht, zum Beispiel cursor."
    http.paging.cursorHeader:
      help:
        en: "Cursor: the header it is sent back in instead, for example X-Next-Cursor."
        sk: "Kurzor: hlavička, v ktorej sa vracia namiesto parametra, napríklad X-Next-Cursor."
        cs: "Kurzor: hlavička, ve které se vrací místo parametru, například X-Next-Cursor."
        de: "Cursor: der Header, in dem er statt eines Parameters zurückgeht, zum Beispiel X-Next-Cursor."
    http.paging.next:
      help:
        en: "Next URL: where the answer holds it, for example @odata.nextLink or links[rel=next].href."
        sk: "Ďalšia URL: kde ju odpoveď drží, napríklad @odata.nextLink alebo links[rel=next].href."
        cs: "Další URL: kde ji odpověď drží, například @odata.nextLink nebo links[rel=next].href."
        de: "Nächste URL: wo die Antwort sie hält, zum Beispiel @odata.nextLink oder links[rel=next].href."
    http.paging.total:
      help:
        en: "Where the first page announces the count, for example numberMatched; a run that reads another number fails."
        sk: "Kde prvá stránka ohlasuje počet, napríklad numberMatched; beh s iným počtom zlyhá."
        cs: "Kde první stránka ohlašuje počet, například numberMatched; běh s jiným počtem selže."
        de: "Wo die erste Seite die Anzahl nennt, zum Beispiel numberMatched; ein Lauf mit anderer Anzahl schlägt fehl."
    http.paging.more:
      help:
        en: "A true or false that says another page exists, for example exceededTransferLimit."
        sk: "Hodnota true alebo false, že existuje ďalšia stránka, napríklad exceededTransferLimit."
        cs: "Hodnota true nebo false, že existuje další stránka, například exceededTransferLimit."
        de: "Ein true oder false, ob es eine weitere Seite gibt, zum Beispiel exceededTransferLimit."
    http.paging.maxPages:
      help:
        en: "1 to 10000, 1000 when empty; reaching it fails the run as incomplete."
        sk: "1 až 10000, prázdne = 1000; dosiahnutie znamená neúplný beh."
        cs: "1 až 10000, prázdné = 1000; dosažení znamená neúplný běh."
        de: "1 bis 10000, leer = 1000; wird es erreicht, ist der Lauf unvollständig."
    http.paging.maxRecords:
      help:
        en: "The most records one run reads, for example 50000; reaching it fails the run."
        sk: "Najviac záznamov jedného behu, napríklad 50000; dosiahnutie beh ukončí chybou."
        cs: "Nejvíc záznamů jednoho běhu, například 50000; dosažení běh ukončí chybou."
        de: "Die meisten Datensätze eines Laufs, zum Beispiel 50000; wird es erreicht, schlägt der Lauf fehl."
    http.paging.delay:
      help:
        en: "For example 200ms or 1s, at most a minute."
        sk: "Napríklad 200ms alebo 1s, najviac minúta."
        cs: "Například 200ms nebo 1s, nejvýš minuta."
        de: "Zum Beispiel 200ms oder 1s, höchstens eine Minute."
    http.authorization.scheme:
      help:
        en: Authentication prefix sent in the header, defaulting to Bearer when left blank.
        sk: Prefix overenia v hlavičke, pri prázdnom poli sa použije Bearer.
        cs: Prefix ověření v hlavičce, při prázdném poli se použije Bearer.
        de: Authentifizierungs-Präfix im Header, standardmäßig Bearer wenn leer gelassen.
    http.authorization.headerRef.name:
      help:
        en: Name of the stored secret holding the API token or credentials.
        sk: Názov uloženého tajomstva obsahujúceho API token alebo prihlasovacie údaje.
        cs: Název uloženého tajemství obsahujícího API token nebo přihlašovací údaje.
        de: Name des gespeicherten Secrets mit dem API-Token oder den Zugangsdaten.
    http.authorization.headerRef.key:
      help:
        en: Property key inside the secret storing the token value.
        sk: Kľúč vlastnosti v tajomstve, kde je uložená hodnota tokenu.
        cs: Klíč vlastnosti v tajemství, kde je uložena hodnota tokenu.
        de: Schlüssel innerhalb des Secrets, unter dem der Token-Wert hinterlegt ist.
    webSocket.url:
      help:
        en: Web address of the WebSocket server to stream messages from; it starts with ws:// or wss://.
        sk: Webová adresa servera WebSocket, z ktorého prúdia správy; začína ws:// alebo wss://.
        cs: Webová adresa serveru WebSocket, ze kterého proudí zprávy; začíná ws:// nebo wss://.
        de: Webadresse des WebSocket-Servers, von dem Nachrichten gestreamt werden; sie beginnt mit ws:// oder wss://.
    webSocket.openMessage:
      widget: textarea
      help:
        en: Initial message sent to the server immediately after connecting.
        sk: Úvodná správa odoslaná na server bezprostredne po pripojení.
        cs: Úvodní zpráva odeslaná na server bezprostředně po připojení.
        de: Erste Nachricht, die unmittelbar nach dem Verbindungsaufbau an den Server gesendet wird.
    gtfsRt.url:
      help:
        en: Web address of the GTFS-realtime protobuf feed itself, not of its documentation page; it starts with http:// or https://.
        sk: Webová adresa samotného zdroja GTFS-realtime (protobuf), nie stránky s jeho dokumentáciou; začína http:// alebo https://.
        cs: Webová adresa samotného zdroje GTFS-realtime (protobuf), ne stránky s jeho dokumentací; začíná http:// nebo https://.
        de: Webadresse des GTFS-realtime-Feeds (protobuf) selbst, nicht seiner Dokumentationsseite; sie beginnt mit http:// oder https://.
    gtfsRt.feed:
      help:
        en: Type of real-time transit information contained in the feed.
        sk: Typ informácií o verejnej doprave v reálnom čase obsiahnutých v zdroji.
        cs: Typ informací o veřejné dopravě v reálném čase obsažených ve zdroji.
        de: Art der im Feed enthaltenen Echtzeit-Verkehrsinformationen.
    webhook.auth:
      help:
        en: How the sender proves itself. Pick what it supports; a signed body, such as GitHub's X-Hub-Signature-256, is safer than a token because nobody can change it on the way.
        sk: Ako sa odosielateľ preukazuje. Vyberte, čo podporuje; podpísané telo, napríklad X-Hub-Signature-256 z GitHubu, je bezpečnejšie ako token, lebo ho cestou nikto nezmení.
        cs: Jak se odesílatel prokazuje. Vyberte, co podporuje; podepsané tělo, například X-Hub-Signature-256 z GitHubu, je bezpečnější než token, protože ho cestou nikdo nezmění.
        de: Wie sich der Absender ausweist. Wählen Sie, was er unterstützt; ein signierter Inhalt, etwa GitHubs X-Hub-Signature-256, ist sicherer als ein Token, weil ihn unterwegs niemand ändern kann.
    webhook.maxBodyBytes:
      help:
        en: The largest event accepted, in bytes; a larger one is refused with 413. 1 to 16777216, for example 1048576 (1 MiB, the default).
        sk: Najväčšia prijatá udalosť v bajtoch; väčšia je odmietnutá s 413. 1 až 16777216, napríklad 1048576 (1 MiB, predvolené).
        cs: Největší přijatá událost v bajtech; větší je odmítnuta s 413. 1 až 16777216, například 1048576 (1 MiB, výchozí).
        de: Das größte angenommene Ereignis in Bytes; ein größeres wird mit 413 abgelehnt. 1 bis 16777216, zum Beispiel 1048576 (1 MiB, Standard).
    webhook.maxInFlight:
      help:
        en: How many events may wait for the pipeline at once; more are told to retry with 503. 1 to 1024, for example 64 (the default).
        sk: Koľko udalostí môže naraz čakať na pipeline; ďalšie dostanú 503 a pokyn skúsiť znova. 1 až 1024, napríklad 64 (predvolené).
        cs: Kolik událostí smí najednou čekat na pipeline; další dostanou 503 a pokyn zkusit znovu. 1 až 1024, například 64 (výchozí).
        de: Wie viele Ereignisse gleichzeitig auf die Pipeline warten dürfen; weitere erhalten 503 und sollen es erneut versuchen. 1 bis 1024, zum Beispiel 64 (Standard).
    tls.caCertRef.name:
      help:
        en: Name of the secret containing a custom certificate authority file.
        sk: Názov tajomstva obsahujúceho vlastný certifikát certifikačnej autority.
        cs: Název tajemství obsahujícího vlastní certifikát certifikační autority.
        de: Name des Secrets, das eine benutzerdefinierte Zertifizierungsstelle enthält.
    tls.caCertRef.key:
      help:
        en: Key inside the certificate secret containing the PEM certificate.
        sk: Kľúč v tajomstve s certifikátom obsahujúci formát PEM.
        cs: Klíč v tajemství s certifikátem obsahující formát PEM.
        de: Schlüssel im Zertifikats-Secret, der das PEM-Zertifikat enthält.
