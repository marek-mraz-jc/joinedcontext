[package]
name = "daiya-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
daiya-api = { path = "../api" }
daiya-import = { path = "../import" }
daiya-model = { path = "../model" }
daiya-query = { path = "../query" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
daiya-store-memory = { path = "../store-memory" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
axum = "0.8"
http = "1"
http-body-util = "0.1"
jc-router = { path = "../../shared/jc-router" }
tower = { version = "0.5", features = ["util"] }
