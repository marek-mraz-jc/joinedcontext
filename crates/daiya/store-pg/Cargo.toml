[package]
name = "daiya-store-pg"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
jc-pool = { path = "../../shared/jc-pool" }
jc-time = { path = "../../shared/jc-time", features = ["sqlx"] }
daiya-model = { path = "../model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "rt", "sync"] }
url = "2"
uuid = { version = ">=1.28, <1.29.1", features = ["v4", "v7", "serde"] }
zeroize = "1"

[dev-dependencies]
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
daiya-import = { path = "../import" }
daiya-query = { path = "../query" }
daiya-store-memory = { path = "../store-memory" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
