[package]
name = "daiya-store-pg"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
daiya-model = { path = "../model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "rt", "sync"] }
url = "2"
uuid = { version = ">=1.28, <1.29.1", features = ["v4", "v7", "serde"] }
zeroize = "1"

[dev-dependencies]
daiya-import = { path = "../import" }
daiya-query = { path = "../query" }
daiya-store-memory = { path = "../store-memory" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
