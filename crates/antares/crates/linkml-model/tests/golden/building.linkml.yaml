id: https://example.org/building
name: building
version: "1.2.0"
prefixes:
  bld: https://example.org/building#
  schema: https://schema.org/
  unece: http://purl.oclc.org/NET/ssnx/qu/unit#
default_prefix: bld
default_range: string
imports:
  - linkml:types
classes:
  Asset:
    name: Asset
    slots:
      - name
      - status
    description: Anything the building operator tracks.
  Room:
    class_uri: schema:Room
    is_a: Asset
    slots:
      - temperature
      - floor
      - sensors
    slot_usage:
      name:
        required: true
        description: "The room's \"label\"."
    description: "A room | with a pipe and *stars*."
  Sensor:
    is_a: Asset
    slots:
      - location
slots:
  floor:
    range: integer
    required: true
  location:
    range: Room
    inlined: false
    description: "Where the sensor hangs.\nSecond line."
  name:
    name: name
    slot_uri: schema:name
    range: string
  sensors:
    range: Sensor
    multivalued: true
    inverse: location
  status:
    range: Status
  temperature:
    range: float
    unit:
      ucum_code: Cel
      symbol: "°C"
      exact_mappings:
        - unece:CEL
    annotations:
      ngsi_ld_kind: Property
enums:
  Status:
    description: Operating state.
    permissible_values:
      active:
        text: active
        meaning: bld:Active
      retired:
        description: Out of service.
