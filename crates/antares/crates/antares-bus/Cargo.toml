[package]
name = "antares-bus"
description = "Change-event bus: ChangeEvent + the local in-process impl and the NATS JetStream impl."
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
rust-version.workspace = true

# ADR-0027 / surfaces-threat-model 9.1: checked by dev/check-module-rules.py.
[package.metadata.antares]
role = "core"

[dependencies]
antares-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-nats = { workspace = true }
percent-encoding = "2"
futures-util = { workspace = true }
tracing = { workspace = true }

[features]
# Test builds only: names the consumers a bus opened and lets a test drop one
# or close the connection (antares-broker's wiring tests). Never a runtime API.
test-kit = []

[dev-dependencies]
tracing-subscriber = { workspace = true }

[lints]
workspace = true
