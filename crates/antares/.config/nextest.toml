# cargo-nextest config. The `ci` profile is the ONE thing that makes the
# unit half of the test story machine-readable: every workspace/feature
# config writes a JUnit file, dev/unit-junit.sh keeps it under a per-config
# name, and dev/unit-report-site.py folds them all into one page next to the
# ETSI report. Robot HTML stays the drill-down for the ETSI half.

[profile.ci]
# A red config must still report EVERY test it ran, otherwise the page shows
# "12 passed" for a run that stopped at the first failure and reads green-ish.
fail-fast = false
failure-output = "immediate-final"
status-level = "fail"

[profile.ci.junit]
# relative to target/nextest/ci/
path = "junit.xml"
# without this a failure's <failure> body is empty and the report page has
# nothing to show but the test name
store-success-output = false
store-failure-output = true

# nextest runs each test in its OWN PROCESS, so the in-process serialization
# these integration suites carry (nats_e2e's SERIAL mutex, pg_temporal's
# PARTITION_DDL lock) serializes nothing here — and the pentest/outbox tests
# assert EXCLUSIVE database state that a concurrently running broker's outbox
# drain legitimately destroys — it publishes the rows the sigkill drill and
# the RLS pentest have just seeded, out from under them. One serial group
# restores the sequencing `cargo test`'s one-binary-at-a-time execution used
# to provide. `ws` is here because its api pods drain the same outbox (T-4916).
# Defined on the default profile; ci inherits.
# The group also holds every binary that runs the history maintenance on the
# shared database (pg_retention calls it; store_combos, secret_logs and
# upsert_transactions start a broker whose first tick runs it) and every one
# that runs `GRANT ... ON ALL TABLES` (pg, read_statement_budget). The
# maintenance builds the audit index of a week with CREATE INDEX CONCURRENTLY
# (waits up to 10 s for older snapshots, holding the week's SHARE UPDATE
# EXCLUSIVE lock), locks attr_instances/attr_rows ACCESS EXCLUSIVE and drops
# weeks: beside it pg's ANALYZE ran into its 5 s lock_timeout and a GRANT met
# a dropped week ("tuple concurrently deleted"), runs 42664879047, 42669283046.
# pg_seal and pg_tenant_rename call seal_plaintext, which seals every tenant of
# the shared database: a sibling test's pass sealed the rows a count asserts on
# first (pg_seal.rs:200 >= 2 came back under 2, run 45030786975).
# pg_temporal_last_n judges a plan by the statistics its own ANALYZE gathered: pg's ANALYZE of a
# near-empty history between the two turned the week read into a full scan of the window
# (4360 rows for 436, runs 45088137464 .. 45082408704).
# The broker's outbox flush test leaves one row pending and times the drain against it: a
# concurrent broker's outbox drain publishes and acks that row, and the flush returns early.
[test-groups]
db-exclusive = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(nats_e2e) or binary(pg_rls_pentest) or binary(pg_outbox) or binary(pg_temporal) or binary(pg_doc) or binary(pg_entity) or binary(pg) or binary(ws) or binary(pg_retention) or binary(store_combos) or binary(secret_logs) or binary(upsert_transactions) or binary(read_statement_budget) or binary(pg_seal) or binary(pg_tenant_rename) or binary(pg_temporal_last_n) or (binary_id(antares-broker) and test(outbox_flush_waits_for_pending_rows))'
test-group = 'db-exclusive'
