[package]
name = "dataroom-harvest"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
description = "Catalogue harvesters (DCAT-AP, NKOD SPARQL, CKAN Action API, ArcGIS Hub) with SSRF guard and withdrawal"

[dependencies]
chrono = { version = "0.4.38", features = ["serde"] }
dataroom-core = { path = "../core" }
dataroom-rdf = { path = "../rdf" }
reqwest = { version = "0.12.9", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
unicode-normalization = "0.1.24"
url = "2.5.4"
uuid = { version = "1.11.0", features = ["v4", "v5", "v7", "serde"] }

[dev-dependencies]
dataroom-store-memory = { path = "../store-memory" }
tokio = { version = "1.44.1", features = ["io-util", "macros", "net", "rt", "time"] }
