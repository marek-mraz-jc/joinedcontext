# Fuzzes what dataroom-core and dataroom-server read from outside (T-7624): branding overrides
# (JSON, YAML, colours, fonts, addresses), uploaded logos, CKAN payloads, file names and bytes,
# slugs, language tags, ids and vocabulary IRIs, and a whole CKAN dump through the import. Any
# input must end in a value or an error, never a panic, a hang or an allocation the input did not
# pay for. Run by hand: cargo +nightly fuzz run <target> -- -max_total_time=300 -rss_limit_mb=2048.
# Not a member of the root workspace.
[package]
name = "dataroom-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
serde_json = "1"
uuid = "1"
tokio = { version = "1", features = ["rt"] }
dataroom-core = { path = "../core" }
dataroom-server = { path = "../server" }
dataroom-store-memory = { path = "../store-memory" }

[[bin]]
name = "branding"
path = "fuzz_targets/branding.rs"
test = false
doc = false
bench = false

[[bin]]
name = "logo"
path = "fuzz_targets/logo.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ckan_payload"
path = "fuzz_targets/ckan_payload.rs"
test = false
doc = false
bench = false

[[bin]]
name = "text_fields"
path = "fuzz_targets/text_fields.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ckan_import"
path = "fuzz_targets/ckan_import.rs"
test = false
doc = false
bench = false

[patch.crates-io]
rumqttc = { path = "../../antares/vendor/rumqttc" }
oxrdfxml = { path = "../../../vendor/oxrdfxml" }
tikv-jemalloc-ctl = { path = "../../../vendor/tikv-jemalloc-ctl" }
kreuzberg = { path = "../../../vendor/joinedcontext-platform/vendor/kreuzberg" }
paste = { path = "../../../vendor/paste" }
jaq-core = { path = "../../../vendor/jaq-core" }
jaq-json = { path = "../../../vendor/jaq-json" }
ml-kem = { path = "../../../vendor/ml-kem" }
rstar = { path = "../../antares/vendor/rstar" }
geo-types = { path = "../../antares/vendor/geo-types" }
faster-hex = { path = "../../../vendor/faster-hex" }

[patch."https://github.com/marek-mraz-jc/joinedcontext-platform.git"]
jc-core = { path = "../../../vendor/joinedcontext-platform/crates/jc-core" }

[workspace]
members = ["."]
