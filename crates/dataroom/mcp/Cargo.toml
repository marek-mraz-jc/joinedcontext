[package]
name = "dataroom-mcp"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
description = "Model Context Protocol (MCP) server and tool dispatcher generated from the dataroom operation registry"
publish = false

[dependencies]
dataroom-core = { path = "../core" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
dataroom-store-memory = { path = "../store-memory" }
tokio = { version = "1.44.1", features = ["macros", "rt"] }
uuid = { version = "1.11.0", features = ["v4", "v7", "serde"] }
