[package]
name = "dataroom-rdf"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
description = "DCAT-AP RDF mapping under profiles read as data, and serializers (Turtle, JSON-LD, RDF/XML, N-Triples)"
publish = false

[dependencies]
jc-time = { path = "../../shared/jc-time" }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
dataroom-core = { path = "../core" }
oxjsonld = "0.1.0"
oxrdf = "0.2.4"
oxrdfxml = "0.1.7"
oxttl = "0.1.8"
# `debug-embed`: a profile is in every binary, a debug one included.
rust-embed = { version = "8", features = ["debug-embed"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
uuid = { version = "1.11.0", features = ["v4", "v5", "v7", "serde"] }
