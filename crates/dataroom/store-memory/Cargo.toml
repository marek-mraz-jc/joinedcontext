[package]
name = "dataroom-store-memory"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
description = "In-memory Store implementation for dataroom with OData MemoryTable integration"

[dependencies]
chrono = { version = "0.4.38", features = ["serde"] }
dataroom-core = { path = "../core" }
odata-table = { git = "https://github.com/marek-mraz-jc/Antares-NGSI-LD-Context-Broker", rev = "9dc22aacc41b0f4f41a1bd493a371ba49b4ca5cd", package = "odata-table" }
serde_json = "1.0.140"
uuid = { version = "1.11.0", features = ["v4", "v7"] }
