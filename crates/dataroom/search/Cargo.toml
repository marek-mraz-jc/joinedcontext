[package]
name = "dataroom-search"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
description = "Full-text search (sk, cs, en, fi, ca), unaccent prefix matching, closed fq grammar and facet counting for dataroom"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dataroom-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = ">=0.8, <0.10", default-features = false, features = ["runtime-tokio", "postgres", "json", "chrono", "uuid"] }
unicode-normalization = "0.1"
uuid = { version = "1.8", features = ["v4", "v7", "serde"] }

[dev-dependencies]
dataroom-store-memory = { path = "../store-memory" }
tokio = { version = "1", features = ["macros", "rt"] }
