[package]
name = "dataroom-search"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
description = "Full-text search (sk, cs, en, fi, ca), unaccent prefix matching, closed fq grammar and facet counting for dataroom"
publish = false

[dependencies]
chrono = { version = "0.4.38", features = ["serde"] }
dataroom-core = { path = "../core" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
unicode-normalization = "0.1.24"
uuid = { version = "1.11.0", features = ["v4", "v7", "serde"] }

[dev-dependencies]
dataroom-store-memory = { path = "../store-memory" }
tokio = { version = "1.44.1", features = ["macros", "rt"] }
