[package]
name = "dataroom-api"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
description = "Axum HTTP router for dataroom: REST, OData v4, OpenAPI 3.1, CKAN Action API v3, DCAT-AP feeds, Atom, MCP, and HTML UI"
publish = false

[dependencies]
axum = { version = "0.8.1", features = ["json", "query", "original-uri"] }
chrono = { version = "0.4.38", features = ["serde"] }
dataroom-core = { path = "../core" }
dataroom-harvest = { path = "../harvest" }
dataroom-mcp = { path = "../mcp" }
dataroom-plugin = { path = "../plugin" }
dataroom-rdf = { path = "../rdf" }
dataroom-search = { path = "../search" }
dataroom-shacl = { path = "../shacl" }
dataroom-web = { path = "../web" }
jc-router = { path = "../../shared/jc-router" }
odata-csdl = { git = "https://github.com/marek-mraz-jc/Antares-NGSI-LD-Context-Broker", rev = "9dc22aacc41b0f4f41a1bd493a371ba49b4ca5cd", package = "odata-csdl" }
odata-table = { git = "https://github.com/marek-mraz-jc/Antares-NGSI-LD-Context-Broker", rev = "9dc22aacc41b0f4f41a1bd493a371ba49b4ca5cd", package = "odata-table" }
odata-url = { git = "https://github.com/marek-mraz-jc/Antares-NGSI-LD-Context-Broker", rev = "9dc22aacc41b0f4f41a1bd493a371ba49b4ca5cd", package = "odata-url" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.1", features = ["rt"] }
tower = { version = "0.5.2", features = ["util"] }
url = "2.5.4"
uuid = { version = "1.11.0", features = ["v4", "v5", "v7", "serde"] }

[dev-dependencies]
dataroom-store-memory = { path = "../store-memory" }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking"] }
http-body-util = "0.1.3"
# The Portal's own CKAN client and publisher, replayed against the router (PORTAL-CALLS.md).
jc-core = { git = "https://github.com/marek-mraz-jc/joinedcontext-platform.git", rev = "9b0b85944083ae547b331d2327db4021e81cd08a", version = "0.1.0" }
jcctl = { git = "https://github.com/marek-mraz-jc/joinedcontext-platform.git", rev = "9b0b85944083ae547b331d2327db4021e81cd08a", version = "0.1.0", default-features = false }
tokio = { version = "1.44.1", features = ["macros", "rt", "rt-multi-thread", "net"] }
