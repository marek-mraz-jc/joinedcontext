[package]
name = "dataroom-web"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
description = "Server-rendered HTML pages (askama), i18n (sk, cs, en), CSP nonces and SDK DataGrid configurations for dataroom"
publish = false

[dependencies]
base64 = "0.22.1"
# Without `config`: askama.toml support pulls basic-toml (RUSTSEC-2026-0374, unmaintained).
askama = { version = "0.12.1", default-features = false, features = ["humansize", "num-traits", "urlencode"] }
jc-time = { path = "../../shared/jc-time" }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
dataroom-core = { path = "../core" }
dataroom-search = { path = "../search" }
# The open data pages' built-in Markdown and its one safe renderer (T-7030, T-7031).
jc-core = { git = "https://github.com/marek-mraz-jc/joinedcontext-platform.git", rev = "9b0b85944083ae547b331d2327db4021e81cd08a", version = "0.1.0" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
url = "2.5.4"
