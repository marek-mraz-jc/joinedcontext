<!doctype html>
<html lang="{{ chrome.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ dataset_title }} | {{ chrome.site_title }}</title>
<style nonce="{{ chrome.csp_nonce }}">
  :root {
    --jc-primary: {{ chrome.branding.colours.primary }};
    --jc-primary-fg: {{ chrome.branding.primary_foreground }};
    --jc-primary-rgb: {{ chrome.branding.primary_rgb }};
    --jc-secondary: {{ chrome.branding.colours.secondary }};
    --jc-accent: {{ chrome.branding.colours.accent }};
    --jc-background: {{ chrome.branding.colours.background }};
    --jc-text: {{ chrome.branding.colours.text }};
    --jc-font-heading: {{ chrome.branding.fonts.heading }};
    --jc-font-body: {{ chrome.branding.fonts.body }};
  }
</style>
<link rel="stylesheet" href="{{ chrome.mount_prefix }}/jc-theme.css">
</head>
<body class="jc-embed">
  <main class="jc-map-page">
    <link rel="stylesheet" href="{{ chrome.mount_prefix }}/maplibre-gl-6.14.0/maplibre-gl.css">
    {% if has_pmtiles %}<script nonce="{{ chrome.csp_nonce }}" src="{{ chrome.mount_prefix }}/pmtiles-4.5.0.js"></script>{% endif %}
    <div class="jc-map" data-jc-map='{{ map_config_json }}'>
      <div class="jc-map-area" role="application" aria-label="{{ labels.map_title }}: {{ dataset_title }}" aria-describedby="jc-map-keys"></div>
      <p class="jc-map-note" role="status"></p>
      <p id="jc-map-keys" class="visually-hidden">{{ labels.map_keys }}</p>
    </div>
    <p class="jc-map-links">
      <a href="{{ dataset_url }}" target="_blank" rel="noopener">{{ labels.map_in_catalogue }}</a>
      <a href="{{ dataset_url }}#jc-preview-title" target="_blank" rel="noopener">{{ labels.map_as_table }}</a>
    </p>
  </main>
  <script nonce="{{ chrome.csp_nonce }}" type="module" src="{{ chrome.mount_prefix }}/jc-map.js"></script>
</body>
</html>
