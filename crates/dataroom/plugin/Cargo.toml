[package]
name = "dataroom-plugin"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
description = "Built-in view renderers, the view-HTML sanitizer and the view payload check for dataroom"
publish = false

[features]
default = ["dcat", "view-table", "view-map", "view-text", "view-image", "view-chart", "pages"]
dcat = []
view-table = []
view-map = []
view-text = []
view-image = []
view-chart = []
pages = []

[dependencies]
dataroom-core = { path = "../core" }
serde_json = "1.0.140"
