[package]
name = "dataroom-server"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
description = "The dataroom binary and CLI commands (serve, migrate, harvest, feed-check, import-ckan)"
publish = false

[[bin]]
name = "dataroom"
path = "src/main.rs"

[dependencies]
axum = "0.8.1"
jc-time = { path = "../../shared/jc-time" }
clap = { version = "4.5.32", features = ["derive", "env"] }
dataroom-api = { path = "../api" }
dataroom-core = { path = "../core" }
dataroom-harvest = { path = "../harvest" }
dataroom-shacl = { path = "../shacl" }
dataroom-store-memory = { path = "../store-memory" }
dataroom-store-pg = { path = "../store-pg" }
serde_json = "1.0.140"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.44.1", features = ["full"] }
uuid = { version = "1.11.0", features = ["v4", "v7", "serde"] }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.2", features = ["util"] }
