[package]
name = "dataroom-server"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
description = "The dataroom binary and CLI commands (serve, migrate, harvest, feed-check, import-ckan)"

[[bin]]
name = "dataroom"
path = "src/main.rs"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dataroom-api = { path = "../api" }
dataroom-core = { path = "../core" }
dataroom-harvest = { path = "../harvest" }
dataroom-mcp = { path = "../mcp" }
dataroom-plugin = { path = "../plugin" }
dataroom-rdf = { path = "../rdf" }
dataroom-search = { path = "../search" }
dataroom-shacl = { path = "../shacl" }
dataroom-store-memory = { path = "../store-memory" }
dataroom-store-pg = { path = "../store-pg" }
dataroom-web = { path = "../web" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = ">=0.8, <0.10", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.8", features = ["v4", "v7", "serde"] }
