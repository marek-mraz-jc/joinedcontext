[package]
name = "jc-router"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
axum = "0.8"
http = "1.5"
ipnet = "2.12"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tower = "0.5"
url = "2.5"

[dev-dependencies]
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
http-body-util = "0.1"
