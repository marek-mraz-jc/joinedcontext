[package]
name = "jc-types"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The tenancy key of jc: OrgId, ProjectId, SpaceId, the (OrgId, ProjectId) pair and the one builder of internal names (ARCH/TEN-01, TEN-04, TEN-10)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.11.0", features = ["v4", "serde"] }

[dev-dependencies]
serde_json = "1"
