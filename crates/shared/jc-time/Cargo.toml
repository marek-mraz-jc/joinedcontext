[package]
name = "jc-time"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "TimestampTz: a jiff instant that writes RFC 3339 byte for byte as chrono did, with its JSON Schema and Postgres mapping (T-7233 chrono -> jiff plan)"

[features]
schemars = ["dep:schemars"]
sqlx = ["dep:sqlx"]

[dependencies]
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
serde = "1.0"
schemars = { version = "0.8", optional = true }
sqlx = { version = "0.9", default-features = false, features = ["postgres"], optional = true }

[dev-dependencies]
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio"] }
tokio = { version = "1", features = ["macros", "rt"] }
