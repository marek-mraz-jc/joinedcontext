<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>joinedcontext chart</title>
<style>
:root { --bg: #ffffff; --fg: #1b1f24; --muted: #5b6470; --line: #d8dde3; --grid: #e5e7eb; --ink: #1f2937;
  --tip: #ffffff; --red: #cf222e; --link: #0b57d0; color-scheme: light; }
:root[data-theme="dark"] { --bg: #16191d; --fg: #e6e9ed; --muted: #a0a8b3; --line: #343a42; --grid: #2b3038;
  --ink: #d1d5db; --tip: #1f2328; --red: #ff7b72; --link: #8ab4f8; color-scheme: dark; }
body { margin: 0; padding: 12px 16px; background: var(--bg); color: var(--fg);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
h1 { font-size: 16px; margin: 0 0 2px; overflow-wrap: anywhere; }
h2 { font-size: 13px; margin: 12px 0 4px; }
p { margin: 4px 0; }
.muted { color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.refused { color: var(--red); }
.plot { position: relative; margin-top: 8px; }
svg { display: block; max-width: 100%; height: auto; overflow: visible; }
svg:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }
.axis { stroke: var(--ink); stroke-width: 1; }
.grid { stroke: var(--grid); stroke-width: 1; }
.tick { fill: var(--ink); font-size: 12px; }
.axis-title { fill: var(--fg); font-size: 12px; font-weight: 600; }
.focus { fill: none; stroke: var(--fg); stroke-width: 2; }
.tip { position: absolute; pointer-events: none; background: var(--tip); color: var(--fg); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 8px; font-size: 12px; white-space: pre-line; max-width: 260px;
  overflow-wrap: anywhere; box-shadow: 0 2px 8px rgba(0, 0, 0, .15); }
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 16px; margin-top: 8px; align-items: start; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.tile.refused-tile { grid-column: 1 / -1; }
.tile h2 { font-size: 15px; margin: 0 0 2px; overflow-wrap: anywhere; }
.tip.below { position: static; max-width: none; margin-top: 6px; box-shadow: none; }
ol.cats { margin: 0; padding-left: 0; list-style: none; font-size: 13px; columns: 2 220px; }
ol.cats li { overflow-wrap: anywhere; break-inside: avoid; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: baseline; }
.num { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin-right: 6px; color: var(--muted); }
a.button { display: inline-block; margin-top: 12px; padding: 6px 14px; border-radius: 6px; background: var(--link);
  color: var(--bg); text-decoration: none; font-weight: 600; }
a.button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
</style>
</head>
<body>
<main id="view" aria-live="polite"><p class="muted">Waiting for the chart…</p></main>
<script>
// The joinedcontext chart view (MCP Apps, T-6866). It draws the one jc_render result the host
// hands it and nothing else: no network, no token. The chart is inline SVG made with
// createElementNS from the result's _meta (the checked spec and its points: numbers only); every
// text, the data's category values included, goes in through textContent. Its one link goes to
// the Portal origin the server wrote here when it served the view; with none written (null, the
// gateway's door) it draws no link.
(function () {
  "use strict";
  var PORTAL = __PORTAL_ORIGIN__;
  var NAME = /^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$/;
  var SVG = "http://www.w3.org/2000/svg";
  var MARKS = ["line", "bar", "area", "point", "arc", "rule"];
  var SCALES = ["quantitative", "temporal", "nominal"];
  var PALETTE = ["#2563eb", "#ea580c", "#16a34a", "#dc2626", "#9333ea", "#0d9488", "#ca8a04", "#db2777"];
  var MAX_CATS = 50;
  var view = document.getElementById("view");
  var project = null;
  var last = null;
  var nextId = 1;

  function send(message) { window.parent.postMessage(message, "*"); }
  function request(method, params) { send({ jsonrpc: "2.0", id: nextId++, method: method, params: params }); }
  function el(tag, text, cls) {
    var node = document.createElement(tag);
    if (text !== undefined && text !== null) node.textContent = String(text);
    if (cls) node.className = cls;
    return node;
  }
  // An SVG element; each attribute value is a number or one of this page's own constants.
  function svg(tag, attrs, text) {
    var node = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { node.setAttribute(k, attrs[k]); });
    if (text !== undefined) node.textContent = String(text);
    return node;
  }
  function num(v) { return typeof v === "number" && isFinite(v) ? v : null; }
  function int(v) { return typeof v === "number" && isFinite(v) && v >= 0 && Math.floor(v) === v ? v : null; }
  function str(v) { return typeof v === "string" ? v : ""; }
  function color(i) { return PALETTE[(i || 0) % PALETTE.length]; }
  function r1(v) { return Math.round(v * 10) / 10; }

  // The checked spec as the server sent it, every member kept to its type.
  function specOf(raw) {
    if (!raw || typeof raw !== "object" || MARKS.indexOf(raw.mark) < 0) return null;
    function channel(c) {
      if (!c || typeof c !== "object" || SCALES.indexOf(c.scale) < 0) return null;
      return { scale: c.scale, title: str(c.title) };
    }
    return {
      mark: raw.mark, title: str(raw.title),
      width: Math.min(Math.max(int(raw.width) || 800, 50), 4000),
      height: Math.min(Math.max(int(raw.height) || 450, 50), 4000),
      x: channel(raw.x), y: channel(raw.y), color: channel(raw.color), size: channel(raw.size), theta: channel(raw.theta)
    };
  }
  function pointsOf(raw) {
    if (!Array.isArray(raw)) return [];
    return raw.slice(0, 2000).map(function (p) {
      p = p && typeof p === "object" ? p : {};
      var t = typeof p.observedAt === "string" && !isNaN(Date.parse(p.observedAt)) ? new Date(p.observedAt) : null;
      return { x: num(p.x), y: num(p.y), color: int(p.color), size: num(p.size), theta: num(p.theta), observedAt: t };
    });
  }
  function catsOf(raw, name) {
    var list = raw && typeof raw === "object" && Array.isArray(raw[name]) ? raw[name] : [];
    return list.map(function (c) { return c && typeof c === "object" ? String(c.value) : String(c); });
  }

  function niceTicks(lo, hi) {
    var span = hi - lo;
    if (!(span > 0)) return [lo];
    var mag = Math.pow(10, Math.floor(Math.log10(span / 5)));
    var step = [1, 2, 5, 10].map(function (m) { return m * mag; }).filter(function (s) { return span / s <= 6; })[0] || 10 * mag;
    var out = [];
    for (var t = Math.ceil(lo / step) * step; t <= hi + step * 1e-9 && out.length < 12; t += step) out.push(t);
    return out;
  }
  function number(v) {
    if (Math.abs(v) >= 1e9) return number(v / 1e9) + "G";
    if (Math.abs(v) >= 1e6) return number(v / 1e6) + "M";
    return String(Math.round(v * 1000) / 1000);
  }
  function date(ms, span) {
    var iso = new Date(ms).toISOString();
    return span <= 2 * 86400000 ? iso.slice(11, 16) : iso.slice(0, 10);
  }
  function label(ch, v, span) {
    if (ch.scale === "temporal") return date(v, span);
    if (ch.scale === "nominal") return "#" + (Math.round(v) + 1);
    return number(v);
  }
  // The domain of one positional channel, as the PNG takes it.
  function domain(ch, values, count, fromZero) {
    if (ch.scale === "nominal") return [-0.5, Math.max(count, 1) - 0.5];
    var lo = Infinity, hi = -Infinity;
    values.forEach(function (v) { if (v !== null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } });
    if (!isFinite(lo)) { lo = 0; hi = 1; }
    if (fromZero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
    if (lo === hi) { var pad = ch.scale === "temporal" ? 3600000 : Math.abs(lo) / 10 || 1; lo -= pad; hi += pad; }
    return [lo, hi];
  }
  function axisTicks(ch, d, room) {
    if (ch.scale === "nominal") {
      var n = Math.round(d[1] + 0.5), every = Math.max(1, Math.ceil(n / Math.max(room, 1))), out = [];
      for (var i = 0; i < n; i += every) out.push(i);
      return out;
    }
    if (ch.scale === "temporal") {
      var k = Math.max(2, Math.min(room, 6)), ts = [];
      for (var j = 0; j < k; j++) ts.push(d[0] + (d[1] - d[0]) * j / (k - 1));
      return ts;
    }
    return niceTicks(d[0], d[1]);
  }

  // Draws the chart into a new <svg> of `width` px; returns it with the screen position of each point.
  function draw(spec, points, cats, width, labelId) {
    var W = Math.max(240, Math.min(width, 4000));
    var H = Math.max(W < 600 ? 240 : 180, Math.min(Math.round(spec.height * Math.min(1, W / spec.width)), 900));
    var root = svg("svg", { width: W, height: H, viewBox: "0 0 " + W + " " + H, role: "img", "aria-labelledby": labelId, tabindex: 0 });
    root.appendChild(svg("title", {}, spec.title || "Chart"));
    var marks = svg("g", {});
    var at = [];
    if (spec.mark === "arc") {
      var total = 0;
      points.forEach(function (p) { if (p.theta !== null && p.theta > 0) total += p.theta; });
      var cx = W / 2, cy = H / 2, r = Math.max(10, Math.min(W, H) / 2 - 12), a0 = -Math.PI / 2;
      points.forEach(function (p, i) {
        if (!(p.theta > 0) || !(total > 0)) return;
        var a1 = a0 + 2 * Math.PI * p.theta / total, mid = (a0 + a1) / 2, large = a1 - a0 > Math.PI ? 1 : 0;
        var fill = color(p.color !== null ? p.color : i);
        if (points.length === 1 || p.theta === total) {
          marks.appendChild(svg("circle", { cx: r1(cx), cy: r1(cy), r: r1(r), fill: fill }));
        } else {
          marks.appendChild(svg("path", { fill: fill, stroke: "#ffffff", "stroke-width": 1, d: "M" + r1(cx) + " " + r1(cy) +
            " L" + r1(cx + r * Math.cos(a0)) + " " + r1(cy + r * Math.sin(a0)) + " A" + r1(r) + " " + r1(r) + " 0 " + large + " 1 " +
            r1(cx + r * Math.cos(a1)) + " " + r1(cy + r * Math.sin(a1)) + " Z" }));
        }
        at.push({ i: i, sx: cx + r * 0.6 * Math.cos(mid), sy: cy + r * 0.6 * Math.sin(mid) });
        a0 = a1;
      });
      root.appendChild(marks);
      return { node: root, at: at };
    }
    var left = spec.y ? 64 : 16, right = 28, top = 12, bottom = spec.x ? 44 : 16;
    var pw = Math.max(20, W - left - right), ph = Math.max(20, H - top - bottom);
    var bars = spec.mark === "bar" || spec.mark === "area";
    var horizontal = spec.mark === "bar" && spec.y && spec.y.scale === "nominal" && spec.x && spec.x.scale !== "nominal";
    var dx = spec.x ? domain(spec.x, points.map(function (p) { return p.x; }), cats.x.length, bars && horizontal) : [0, 1];
    var dy = spec.y ? domain(spec.y, points.map(function (p) { return p.y; }), cats.y.length, bars && !horizontal) : [0, 1];
    function sx(v) { return left + (v - dx[0]) / (dx[1] - dx[0]) * pw; }
    function sy(v) { return top + ph - (v - dy[0]) / (dy[1] - dy[0]) * ph; }
    var grid = svg("g", {});
    if (spec.y) {
      axisTicks(spec.y, dy, Math.floor(ph / 24)).forEach(function (t) {
        var y = r1(sy(t));
        grid.appendChild(svg("line", { "class": "grid", x1: left, x2: left + pw, y1: y, y2: y }));
        grid.appendChild(svg("text", { "class": "tick", x: left - 6, y: y + 4, "text-anchor": "end" }, label(spec.y, t, dy[1] - dy[0])));
      });
      grid.appendChild(svg("text", { "class": "axis-title", x: 12, y: r1(top + ph / 2), "text-anchor": "middle",
        transform: "rotate(-90 12 " + r1(top + ph / 2) + ")" }, spec.y.title));
    }
    if (spec.x) {
      axisTicks(spec.x, dx, Math.floor(pw / (spec.x.scale === "temporal" && dx[1] - dx[0] <= 2 * 86400000 ? 52 : 76))).forEach(function (t) {
        var x = r1(sx(t));
        grid.appendChild(svg("line", { "class": "axis", x1: x, x2: x, y1: top + ph, y2: top + ph + 4 }));
        grid.appendChild(svg("text", { "class": "tick", x: x, y: top + ph + 16, "text-anchor": "middle" }, label(spec.x, t, dx[1] - dx[0])));
      });
      grid.appendChild(svg("text", { "class": "axis-title", x: r1(left + pw / 2), y: H - 6, "text-anchor": "middle" }, spec.x.title));
    }
    grid.appendChild(svg("line", { "class": "axis", x1: left, x2: left + pw, y1: top + ph, y2: top + ph }));
    grid.appendChild(svg("line", { "class": "axis", x1: left, x2: left, y1: top, y2: top + ph }));
    root.appendChild(grid);

    var groups = {};
    points.forEach(function (p, i) { var g = p.color || 0; (groups[g] = groups[g] || []).push(i); });
    var groupCount = Math.max(1, cats.color.length);
    if (spec.mark === "line" || spec.mark === "area") {
      Object.keys(groups).forEach(function (g) {
        var idx = groups[g].filter(function (i) { return points[i].x !== null && points[i].y !== null; })
          .sort(function (a, b) { return points[a].x - points[b].x; });
        if (!idx.length) return;
        var d = idx.map(function (i, k) { return (k ? "L" : "M") + r1(sx(points[i].x)) + " " + r1(sy(points[i].y)); }).join(" ");
        if (spec.mark === "area") {
          var base = r1(sy(Math.max(dy[0], Math.min(0, dy[1]))));
          d += " L" + r1(sx(points[idx[idx.length - 1]].x)) + " " + base + " L" + r1(sx(points[idx[0]].x)) + " " + base + " Z";
          marks.appendChild(svg("path", { d: d, fill: color(+g), "fill-opacity": 0.35, stroke: color(+g), "stroke-width": 2 }));
        } else {
          marks.appendChild(svg("path", { d: d, fill: "none", stroke: color(+g), "stroke-width": 2 }));
        }
        idx.forEach(function (i) { at.push({ i: i, sx: sx(points[i].x), sy: sy(points[i].y) }); });
      });
    } else if (spec.mark === "bar") {
      var band = horizontal ? (spec.y.scale === "nominal" ? ph / Math.max(cats.y.length, 1) : 8)
        : (spec.x && spec.x.scale === "nominal" ? pw / Math.max(cats.x.length, 1) : Math.max(2, Math.min(24, pw / Math.max(points.length, 1))));
      var thick = Math.max(1, band * 0.8 / (spec.x && spec.x.scale === "nominal" || horizontal ? groupCount : 1));
      points.forEach(function (p, i) {
        if (p.x === null || p.y === null) return;
        var off = (spec.x && spec.x.scale === "nominal" || horizontal) && groupCount > 1 ? ((p.color || 0) - (groupCount - 1) / 2) * thick : 0;
        var x, y, w, h;
        if (horizontal) {
          var x0 = sx(Math.max(dx[0], Math.min(0, dx[1])));
          x = Math.min(x0, sx(p.x)); w = Math.abs(sx(p.x) - x0); y = sy(p.y) + off - thick / 2; h = thick;
        } else {
          var y0 = sy(Math.max(dy[0], Math.min(0, dy[1])));
          x = sx(p.x) + off - thick / 2; w = thick; y = Math.min(y0, sy(p.y)); h = Math.abs(sy(p.y) - y0);
        }
        marks.appendChild(svg("rect", { x: r1(x), y: r1(y), width: r1(w), height: r1(Math.max(h, 1)), fill: color(p.color) }));
        at.push({ i: i, sx: horizontal ? x + w : x + w / 2, sy: horizontal ? y + h / 2 : y });
      });
    } else if (spec.mark === "point") {
      var maxSize = 0;
      points.forEach(function (p) { if (p.size !== null) maxSize = Math.max(maxSize, Math.abs(p.size)); });
      points.forEach(function (p, i) {
        if (p.x === null || p.y === null) return;
        var r = p.size !== null && maxSize > 0 ? 2 + 10 * Math.sqrt(Math.abs(p.size) / maxSize) : 4;
        marks.appendChild(svg("circle", { cx: r1(sx(p.x)), cy: r1(sy(p.y)), r: r1(r), fill: color(p.color), "fill-opacity": 0.8 }));
        at.push({ i: i, sx: sx(p.x), sy: sy(p.y) });
      });
    } else {
      points.forEach(function (p, i) {
        var a;
        if (p.x !== null && p.y !== null) a = { x1: sx(p.x), x2: sx(p.x), y1: sy(Math.max(dy[0], Math.min(0, dy[1]))), y2: sy(p.y) };
        else if (p.x !== null) a = { x1: sx(p.x), x2: sx(p.x), y1: top, y2: top + ph };
        else if (p.y !== null) a = { x1: left, x2: left + pw, y1: sy(p.y), y2: sy(p.y) };
        else return;
        marks.appendChild(svg("line", { x1: r1(a.x1), x2: r1(a.x2), y1: r1(a.y1), y2: r1(a.y2), stroke: color(p.color), "stroke-width": 2 }));
        at.push({ i: i, sx: a.x2, sy: (a.y1 + a.y2) / 2 });
      });
    }
    root.appendChild(marks);
    return { node: root, at: at };
  }

  function valueText(ch, v, list) {
    if (v === null || !ch) return null;
    if (ch.scale === "nominal") return "#" + (v + 1) + (list[v] !== undefined ? " " + list[v] : "");
    if (ch.scale === "temporal") return new Date(v).toISOString().replace(".000Z", "Z");
    return number(v);
  }
  function tipText(spec, p, cats) {
    var lines = [];
    [["x", spec.x, p.x, cats.x], ["y", spec.y, p.y, cats.y]].forEach(function (c) {
      var t = valueText(c[1], c[2], c[3]);
      if (t !== null) lines.push((c[1].title || c[0]) + ": " + t);
    });
    if (spec.color && p.color !== null) lines.push((spec.color.title || "color") + ": #" + (p.color + 1) + (cats.color[p.color] !== undefined ? " " + cats.color[p.color] : ""));
    if (spec.size && p.size !== null) lines.push((spec.size.title || "size") + ": " + number(p.size));
    if (spec.theta && p.theta !== null) lines.push((spec.theta.title || "theta") + ": " + number(p.theta));
    // A time axis already says when; observedAt is added only where the x channel is not time.
    if (p.observedAt && !(spec.x && spec.x.scale === "temporal")) lines.push("observedAt: " + p.observedAt.toISOString().replace(".000Z", "Z"));
    return lines.join("\n");
  }

  // One tooltip per chart: the nearest point to the pointer, or the next one by arrow key.
  function interact(plot, drawn, spec, points, cats, live) {
    var tip = el("div", null, "tip"), ring = svg("circle", { "class": "focus", r: 0, cx: 0, cy: 0 }), current = -1;
    tip.hidden = true;
    drawn.node.appendChild(ring);
    plot.appendChild(tip);
    function show(k) {
      if (k < 0 || k >= drawn.at.length) return;
      current = k;
      var a = drawn.at[k], scale = drawn.node.getBoundingClientRect().width / (+drawn.node.getAttribute("width") || 1) || 1;
      ring.setAttribute("r", 7);
      ring.setAttribute("cx", r1(a.sx));
      ring.setAttribute("cy", r1(a.sy));
      tip.textContent = tipText(spec, points[a.i], cats);
      tip.hidden = false;
      // A narrow frame shows the values under the chart, so no tooltip covers the plot.
      var w = plot.clientWidth || 0;
      tip.className = w && w < 600 ? "tip below" : "tip";
      if (tip.className === "tip") {
        var x = a.sx * scale + 14, y = a.sy * scale - tip.offsetHeight - 10;
        if (x + tip.offsetWidth > w) x = a.sx * scale - tip.offsetWidth - 14;
        if (y < 0) y = a.sy * scale + 14;
        tip.style.left = Math.round(Math.max(0, x)) + "px";
        tip.style.top = Math.round(y) + "px";
      }
      else sized();
      live.textContent = tip.textContent;
    }
    function hide() { tip.hidden = true; ring.setAttribute("r", 0); if (tip.className !== "tip") sized(); }
    drawn.node.addEventListener("mousemove", function (event) {
      var box = drawn.node.getBoundingClientRect(), scale = box.width / (+drawn.node.getAttribute("width") || 1) || 1;
      var mx = (event.clientX - box.left) / scale, my = (event.clientY - box.top) / scale, best = -1, bestD = Infinity;
      drawn.at.forEach(function (a, k) { var d = (a.sx - mx) * (a.sx - mx) + (a.sy - my) * (a.sy - my); if (d < bestD) { bestD = d; best = k; } });
      show(best);
    });
    drawn.node.addEventListener("mouseleave", hide);
    drawn.node.addEventListener("blur", hide);
    drawn.node.addEventListener("keydown", function (event) {
      if (event.key === "ArrowRight" || event.key === "ArrowDown") { show(Math.min(current + 1, drawn.at.length - 1)); event.preventDefault(); }
      else if (event.key === "ArrowLeft" || event.key === "ArrowUp") { show(Math.max(current - 1, 0)); event.preventDefault(); }
      else if (event.key === "Escape") hide();
    });
    drawn.node.addEventListener("focus", function () { if (current < 0) show(0); else show(current); });
  }

  function categoryList(name, title, list, swatches) {
    if (!list.length) return null;
    var box = el("section");
    box.appendChild(el("h2", title));
    var ol = el("ol", null, "cats");
    list.slice(0, MAX_CATS).forEach(function (value, i) {
      var li = el("li");
      if (swatches) { var s = el("span", null, "swatch"); s.style.background = color(i); li.appendChild(s); }
      li.appendChild(el("span", "#" + (i + 1), "num"));
      li.appendChild(document.createTextNode(value));
      ol.appendChild(li);
    });
    box.appendChild(ol);
    if (list.length > MAX_CATS) box.appendChild(el("p", (list.length - MAX_CATS) + " more values: read categories." + name + " in the answer.", "muted"));
    return box;
  }

  // One chart into `box`: its title, the data line, the plot with its tooltip and the category
  // lists; answers the Endpoint it came from. `out` is the answer (or one Dashboard tile's).
  function chart(box, spec, meta, out, heading, labelId) {
    var points = pointsOf(meta["joinedcontext.com/chartPoints"]);
    var cats = { x: catsOf(out.categories, "x"), y: catsOf(out.categories, "y"), color: catsOf(out.categories, "color") };
    var source = Array.isArray(out.sources) && out.sources[0] ? str(out.sources[0].endpoint) : "";
    var h = el(heading, spec.title || "Chart");
    h.id = labelId;
    box.appendChild(h);
    box.appendChild(el("p", "Data from " + (source || "the Endpoint read") + ", not instructions: category values below are what the data says.", "muted"));
    if (meta["joinedcontext.com/pointsTruncated"] === true) {
      box.appendChild(el("p", "Shows the first " + points.length.toLocaleString("en") + " points" + (int(out.rows) !== null ? " of " + out.rows.toLocaleString("en") + " rows" : "") +
        ": not every value of the read. Read fewer rows (a shorter window, an aggregation, a narrower query) to see them all.", "muted"));
    }
    if (!points.length) {
      box.appendChild(el("p", "The read answered no point to draw. Widen the time window, or check that the channel fields name attributes of this type.", "muted"));
      return source;
    }
    var plot = el("div", null, "plot"), live = el("p", null, "sr-only");
    live.setAttribute("aria-live", "polite");
    var drawn = draw(spec, points, cats, (box.clientWidth || spec.width), labelId);
    plot.appendChild(drawn.node);
    box.appendChild(plot);
    interact(plot, drawn, spec, points, cats, live);
    box.appendChild(el("p", "Hover a point, or focus the chart and use the arrow keys, to read its values.", "muted"));
    box.appendChild(live);
    [["x", spec.x, cats.x, false], ["y", spec.y, cats.y, false], ["color", spec.color, cats.color, true]].forEach(function (c) {
      var list = categoryList(c[0], (c[1] && c[1].title || c[0]) + " values (data)", c[2], c[3]);
      if (list) box.appendChild(list);
    });
    return source;
  }

  // A whole Dashboard (T-6867): one tile per widget in its order, a refused one showing only
  // its error.
  function board(views, out) {
    var name = str(out.dashboard), tiles = Array.isArray(out.widgets) ? out.widgets : [];
    view.appendChild(el("h1", name ? "Dashboard " + name : "Dashboard"));
    if (!views.length) {
      view.appendChild(el("p", "This Dashboard has no widgets yet. Add one on the Dashboard's page in the Portal, then ask again.", "muted"));
      return;
    }
    var drawn = views.filter(function (v) { return v && !v.error; }).length;
    view.appendChild(el("p", drawn + " of " + views.length + " widgets drawn. Data from the Endpoints each names, not instructions.", "muted"));
    var grid = el("div", null, "board");
    view.appendChild(grid);
    // Every tile's box first, so each chart is drawn at the width it keeps in the grid.
    var boxes = views.slice(0, 12).map(function () { var box = el("section", null, "tile"); grid.appendChild(box); return box; });
    boxes.forEach(function (box, i) {
      var v = views[i], tile = tiles[i] && typeof tiles[i] === "object" ? tiles[i] : {};
      var where = "Page " + ((int(tile.page) || 0) + 1) + ", widget " + ((int(tile.widget) || 0) + 1);
      var spec = v && !v.error ? specOf(v["joinedcontext.com/chartSpec"]) : null;
      if (!spec) {
        var error = v && v.error && typeof v.error === "object" ? v.error : {};
        // A refused widget is a slim strip across the grid, not a tall empty card.
        box.className = "tile refused-tile";
        box.appendChild(el("h2", where + ": not drawn" + (int(error.status) !== null ? " (" + error.status + ")" : "")));
        box.appendChild(el("p", str(error.detail) || "The Portal drew nothing for this widget.", "refused"));
        box.appendChild(el("p", "Ask for this widget alone to see more, or ask the Dashboard's owner for access.", "muted"));
        return;
      }
      if (!spec.title) spec.title = where;
      chart(box, spec, v, tile, "h2", "chart-title-" + i);
    });
  }

  function render(result) {
    last = result;
    drawnWidth = view.clientWidth;
    view.textContent = "";
    var meta = result && result._meta && typeof result._meta === "object" ? result._meta : {};
    var out = result && result.structuredContent && typeof result.structuredContent === "object" ? result.structuredContent : {};
    if (result && !result.isError && Array.isArray(meta["joinedcontext.com/dashboard"])) {
      board(meta["joinedcontext.com/dashboard"], out);
      sized();
      return;
    }
    var spec = specOf(meta["joinedcontext.com/chartSpec"]);
    if (!result || result.isError || !spec) {
      view.appendChild(el("h1", result && result.isError ? "The chart was refused" : "No chart to draw"));
      var text = result && Array.isArray(result.content) && result.content[0] && result.content[0].text;
      if (result && result.isError && typeof text === "string") {
        // The Portal's refusal: its first line, then each named error it does not already say.
        var lines = text.split("\n"), head = lines[0];
        view.appendChild(el("p", head, "refused"));
        lines.slice(1).forEach(function (line) {
          var item = line.replace(/^- /, "");
          if (item && head.indexOf(item) < 0) view.appendChild(el("p", item, "refused"));
        });
        view.appendChild(el("p", "Nothing was drawn. Ask again with the change the message names.", "muted"));
      } else {
        view.appendChild(el("p", "The answer holds no chart points. Read the answer in the chat.", "muted"));
      }
      sized();
      return;
    }
    var source = chart(view, spec, meta, out, "h1", "chart-title");
    if (PORTAL && project && NAME.test(project) && NAME.test(source)) {
      var url = PORTAL + "/projects/" + encodeURIComponent(project) + "/endpoints/" + encodeURIComponent(source);
      var a = el("a", "Open the Endpoint in Portal", "button");
      a.href = url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.addEventListener("click", function (event) { event.preventDefault(); request("ui/open-link", { url: url }); });
      view.appendChild(a);
    }
    sized();
  }
  function sized() {
    send({ jsonrpc: "2.0", method: "ui/notifications/size-changed",
      params: { width: document.documentElement.scrollWidth, height: Math.ceil(document.body.getBoundingClientRect().height) } });
  }
  function theme(context) {
    if (context && (context.theme === "dark" || context.theme === "light")) document.documentElement.dataset.theme = context.theme;
  }
  // The host sets the frame's height from size-changed: redraw only when the width moved.
  var resizing = null, drawnWidth = 0;
  window.addEventListener("resize", function () {
    clearTimeout(resizing);
    resizing = setTimeout(function () { if (last && view.clientWidth !== drawnWidth) render(last); }, 150);
  });
  if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "dark";
  window.addEventListener("message", function (event) {
    if (event.source !== window.parent) return;
    var m = event.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id === 1 && m.result) {
      theme(m.result.hostContext);
      send({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} });
    } else if (m.method === "ui/notifications/tool-input") {
      var args = m.params && m.params.arguments;
      project = args && typeof args.project === "string" ? args.project : null;
      if (last) render(last);
    } else if (m.method === "ui/notifications/tool-result") {
      render(m.params);
    } else if (m.method === "ui/notifications/host-context-changed") {
      theme(m.params);
    } else if (m.method === "ui/resource-teardown" && m.id !== undefined) {
      send({ jsonrpc: "2.0", id: m.id, result: {} });
    }
  });
  request("ui/initialize", { protocolVersion: "2026-01-26", appInfo: { name: "joinedcontext-chart", version: "1" }, appCapabilities: {} });
})();
</script>
</body>
</html>
