<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>joinedcontext chart</title>
<style>
/* The chart's colours come from the chart theme (look() below); the page's own are its two signals. */
:root { --red: #cf222e; --link: #0b57d0; color-scheme: light; }
:root[data-theme="dark"] { --red: #ff7b72; --link: #8ab4f8; color-scheme: dark; }
body { margin: 0; padding: 12px 16px; background: var(--bg); color: var(--fg);
  font: 14px/1.45 var(--font); }
h1 { font-size: 16px; margin: 0 0 2px; overflow-wrap: anywhere; }
h2 { font-size: 13px; margin: 12px 0 4px; }
p { margin: 4px 0; }
.muted { color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.refused { color: var(--red); }
.warn { border-left: 4px solid var(--red); padding: 6px 10px; font-weight: 600; }
.plot { position: relative; margin-top: 8px; }
.plot:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }
.canvas svg { display: block; max-width: 100%; height: auto; }
img.picture { display: block; max-width: 100%; height: auto; margin-top: 8px; border: 1px solid var(--line); border-radius: 6px; }
.tip { position: absolute; pointer-events: none; background: var(--tip); color: var(--fg); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 8px; font-size: 12px; white-space: pre-line; max-width: 260px;
  overflow-wrap: anywhere; box-shadow: 0 2px 8px rgba(0, 0, 0, .15); }
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 16px; margin-top: 8px; align-items: start; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.tile.refused-tile { grid-column: 1 / -1; }
.tile h2 { font-size: 15px; margin: 0 0 2px; overflow-wrap: anywhere; }
.tip.below { position: static; max-width: none; margin-top: 6px; box-shadow: none; }
ol.cats { margin: 0; padding-left: 0; list-style: none; font-size: 13px; columns: 2 220px; }
ol.cats li { overflow-wrap: anywhere; break-inside: avoid; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: baseline; }
.num { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin-right: 6px; color: var(--muted); }
a.button { display: inline-block; margin-top: 12px; padding: 6px 14px; border-radius: 6px; background: var(--link);
  color: var(--bg); text-decoration: none; font-weight: 600; }
a.button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
</style>
</head>
<body>
<main id="view" aria-live="polite"><p class="muted">Waiting for the chart…</p></main>
<!-- The chart library (T-6887), inlined by jc_chart::view_page from vendor/viz/vendor and held
     to its SHA256SUMS line: vega, vega-lite and Vega's expression interpreter, no vega-embed. -->
<script>__JC_VEGA__</script>
<script>__JC_VEGA_LITE__</script>
<script>__JC_VEGA_INTERPRETER__</script>
<script>
// The joinedcontext chart view (MCP Apps, T-6866). It draws the one jc_render result the host
// hands it and nothing else: no network, no token. The chart library draws it (T-6887) from a
// Vega-Lite spec this page builds out of the result's _meta (the checked spec's scales and its
// points: numbers only), through Vega's expression interpreter and a loader that loads nothing;
// every text, the titles and the data's category values included, goes in through textContent
// outside the library. When the library cannot draw, the answer's PNG stands in. Its one link goes to
// the Portal origin the server wrote here when it served the view; with none written (null, the
// gateway's door) it draws no link.
(function () {
  "use strict";
  var PORTAL = __PORTAL_ORIGIN__;
  var NAME = /^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$/;
  var MARKS = ["line", "bar", "area", "point", "arc", "rule"];
  var SCALES = ["quantitative", "temporal", "nominal"];
  // The chart theme (T-6886, jc-chart theme.json), written here by the server that serves the
  // view: the chart's colours and type for the light and the dark host.
  var THEME = __JC_THEME__;
  var PALETTE = THEME.light.range.category;
  var MAX_CATS = 50;
  var view = document.getElementById("view");
  var project = null;
  var last = null;
  var nextId = 1;

  function send(message) { window.parent.postMessage(message, "*"); }
  function request(method, params) { send({ jsonrpc: "2.0", id: nextId++, method: method, params: params }); }
  function el(tag, text, cls) {
    var node = document.createElement(tag);
    if (text !== undefined && text !== null) node.textContent = String(text);
    if (cls) node.className = cls;
    return node;
  }
  function num(v) { return typeof v === "number" && isFinite(v) ? v : null; }
  function int(v) { return typeof v === "number" && isFinite(v) && v >= 0 && Math.floor(v) === v ? v : null; }
  function str(v) { return typeof v === "string" ? v : ""; }
  function color(i) { return PALETTE[(i || 0) % PALETTE.length]; }

  // The checked spec as the server sent it, every member kept to its type.
  function specOf(raw) {
    if (!raw || typeof raw !== "object" || MARKS.indexOf(raw.mark) < 0) return null;
    function channel(c) {
      if (!c || typeof c !== "object" || SCALES.indexOf(c.scale) < 0) return null;
      return { scale: c.scale, title: str(c.title) };
    }
    return {
      mark: raw.mark, title: str(raw.title),
      width: Math.min(Math.max(int(raw.width) || 800, 50), 4000),
      height: Math.min(Math.max(int(raw.height) || 450, 50), 4000),
      x: channel(raw.x), y: channel(raw.y), color: channel(raw.color), size: channel(raw.size), theta: channel(raw.theta)
    };
  }
  function pointsOf(raw) {
    if (!Array.isArray(raw)) return [];
    return raw.slice(0, 2000).map(function (p) {
      p = p && typeof p === "object" ? p : {};
      var t = typeof p.observedAt === "string" && !isNaN(Date.parse(p.observedAt)) ? new Date(p.observedAt) : null;
      return { x: num(p.x), y: num(p.y), color: int(p.color), size: num(p.size), theta: num(p.theta), observedAt: t };
    });
  }
  function catsOf(raw, name) {
    var list = raw && typeof raw === "object" && Array.isArray(raw[name]) ? raw[name] : [];
    return list.map(function (c) { return c && typeof c === "object" ? String(c.value) : String(c); });
  }

  function number(v) {
    if (Math.abs(v) >= 1e9) return number(v / 1e9) + "G";
    if (Math.abs(v) >= 1e6) return number(v / 1e6) + "M";
    return String(Math.round(v * 1000) / 1000);
  }
  function valueText(ch, v, list) {
    if (v === null || !ch) return null;
    if (ch.scale === "nominal") return "#" + (v + 1) + (list[v] !== undefined ? " " + list[v] : "");
    if (ch.scale === "temporal") return new Date(v).toISOString().replace(".000Z", "Z");
    return number(v);
  }
  function tipText(spec, p, cats) {
    var lines = [];
    [["x", spec.x, p.x, cats.x], ["y", spec.y, p.y, cats.y]].forEach(function (c) {
      var t = valueText(c[1], c[2], c[3]);
      if (t !== null) lines.push((c[1].title || c[0]) + ": " + t);
    });
    if (spec.color && p.color !== null) lines.push((spec.color.title || "color") + ": #" + (p.color + 1) + (cats.color[p.color] !== undefined ? " " + cats.color[p.color] : ""));
    if (spec.size && p.size !== null) lines.push((spec.size.title || "size") + ": " + number(p.size));
    if (spec.theta && p.theta !== null) lines.push((spec.theta.title || "theta") + ": " + number(p.theta));
    // A time axis already says when; observedAt is added only where the x channel is not time.
    if (p.observedAt && !(spec.x && spec.x.scale === "temporal")) lines.push("observedAt: " + p.observedAt.toISOString().replace(".000Z", "Z"));
    return lines.join("\n");
  }

  // The Vega-Lite spec of one chart, built here from the checked spec's scales and the numbers
  // (T-6887): every value in it is a number, a "#n" label made from an integer, or a constant of
  // this page. No title, category value or other text of the answer goes in, and nothing in it is
  // an expression, a signal, a param, a URL or a link; the titles are this page's own HTML text.
  function label(i) { return "#" + (i + 1); }
  function vlSpec(spec, points, width, mode) {
    var W = Math.max(240, Math.min(width, 4000));
    var H = Math.max(W < 600 ? 240 : 180, Math.min(Math.round(spec.height * Math.min(1, W / spec.width)), 900));
    var arc = spec.mark === "arc";
    var colors = 0;
    var rows = [];
    points.forEach(function (p, i) {
      if (arc ? !(p.theta > 0) : (spec.x && p.x === null) || (spec.y && p.y === null) || (!spec.x && !spec.y)) return;
      if (spec.mark === "rule" && p.x === null && p.y === null) return;
      var c = p.color !== null ? p.color : arc ? i : 0;
      colors = Math.max(colors, c + 1);
      var row = { i: i, c: c, cl: label(c) };
      if (spec.x && p.x !== null) { row.x = p.x; if (spec.x.scale === "nominal") row.xl = label(p.x); }
      if (spec.y && p.y !== null) { row.y = p.y; if (spec.y.scale === "nominal") row.yl = label(p.y); }
      if (spec.size && p.size !== null) row.size = Math.abs(p.size);
      if (arc) row.theta = p.theta;
      rows.push(row);
    });
    function position(name, ch) {
      if (!ch) return null;
      if (ch.scale === "nominal") {
        return { field: name + "l", type: "nominal", sort: { field: name, op: "min" }, title: null, axis: { labelAngle: 0 } };
      }
      if (ch.scale === "temporal") return { field: name, type: "temporal", scale: { type: "utc" }, title: null };
      return { field: name, type: "quantitative", title: null, scale: { zero: false, nice: 6 } };
    }
    var domain = [];
    for (var k = 0; k < Math.max(colors, 1); k++) domain.push(label(k));
    var palette = (THEME[mode] || THEME.light).range.category;
    var range = domain.map(function (_, k) { return palette[k % palette.length]; });
    var enc = { tooltip: { field: "i", type: "quantitative" } };
    var grouped = arc || (spec.color && points.some(function (p) { return p.color !== null; }));
    if (grouped) enc.color = { field: "cl", type: "nominal", scale: { domain: domain, range: range }, legend: null };
    // One series takes the theme's first colour: Vega-Lite draws a rule black by default.
    var mark = grouped ? { type: spec.mark } : { type: spec.mark, color: palette[0] };
    if (arc) {
      enc.theta = { field: "theta", type: "quantitative", stack: true };
    } else {
      var x = position("x", spec.x), y = position("y", spec.y);
      var horizontal = spec.mark === "bar" && spec.y && spec.y.scale === "nominal" && !(spec.x && spec.x.scale === "nominal");
      if (x) enc.x = x;
      if (y) enc.y = y;
      if (spec.mark === "bar" || spec.mark === "area") {
        // A bar or an area starts at zero and draws each group beside, never on top of, the others.
        var value = horizontal ? x : y;
        if (value && value.type === "quantitative") { value.scale = { zero: true, nice: 6 }; value.stack = null; }
        if (grouped && spec.mark === "bar" && horizontal && y && y.type === "nominal") enc.yOffset = { field: "cl", type: "nominal", sort: { field: "c", op: "min" } };
        else if (grouped && spec.mark === "bar" && x && x.type === "nominal") enc.xOffset = { field: "cl", type: "nominal", sort: { field: "c", op: "min" } };
      }
      if (spec.mark === "rule" && x && y) { y.scale = { zero: true, nice: 6 }; enc.y2 = { datum: 0 }; }
      if (spec.mark === "point" && spec.size) enc.size = { field: "size", type: "quantitative", legend: null };
      // A line or an area is hovered at its points, which are drawn but not painted.
      if (spec.mark === "line" || spec.mark === "area") mark.point = { opacity: 0, size: 80 };
    }
    var config = Object.assign({}, THEME[mode] || THEME.light, { aria: false });
    return {
      $schema: "https://vega.github.io/schema/vega-lite/v6.json",
      width: W, height: H, autosize: { type: "fit", contains: "padding" },
      data: { values: rows }, mark: mark, encoding: enc, config: config
    };
  }

  // Vega asks its loader for nothing this page's spec names; any ask is refused all the same.
  function refused() { return Promise.reject(new Error("the chart view loads nothing")); }
  var LOADER = { load: refused, sanitize: refused, http: refused, file: refused };
  var views = [];

  // Draws one chart with the library into `plot`, its values in a tooltip of text: the hovered
  // mark's, or the next one's by arrow key. Throws, or calls `failed`, when the library cannot draw.
  function plotChart(plot, spec, points, cats, live, failed) {
    if (typeof vega === "undefined" || typeof vegaLite === "undefined" || !vega.expressionInterpreter) {
      throw new Error("the chart library did not load");
    }
    var mode = document.documentElement.dataset.theme === "dark" ? "dark" : "light";
    var vl = vlSpec(spec, points, plot.clientWidth || spec.width, mode);
    var canvas = el("div", null, "canvas");
    var tip = el("div", null, "tip"), current = -1;
    var order = vl.data.values.map(function (row) { return row.i; });
    tip.hidden = true;
    plot.appendChild(canvas);
    plot.appendChild(tip);
    function show(i, x, y) {
      tip.textContent = tipText(spec, points[i], cats);
      tip.hidden = false;
      // A narrow frame, or the keyboard, shows the values under the chart, so no tooltip covers it.
      var w = plot.clientWidth || 0;
      tip.className = x === undefined || (w && w < 600) ? "tip below" : "tip";
      if (tip.className === "tip") {
        var left = x + 14, top = y - tip.offsetHeight - 10;
        if (left + tip.offsetWidth > w) left = x - tip.offsetWidth - 14;
        if (top < 0) top = y + 14;
        tip.style.left = Math.round(Math.max(0, left)) + "px";
        tip.style.top = Math.round(top) + "px";
      }
      live.textContent = tip.textContent;
      sized();
    }
    function hide() { if (!tip.hidden) { tip.hidden = true; sized(); } }
    var runtime = vega.parse(vegaLite.compile(vl).spec, null, { ast: true });
    var view = new vega.View(runtime, {
      renderer: "svg", container: canvas, loader: LOADER, expr: vega.expressionInterpreter, hover: false
    });
    views.push(view);
    view.tooltip(function (handler, event, item, value) {
      var i = item && item.datum ? int(item.datum.i) : null;
      if (value === undefined || value === null || i === null || !points[i] || !event) { hide(); return; }
      var box = plot.getBoundingClientRect();
      current = order.indexOf(i);
      show(i, event.clientX - box.left, event.clientY - box.top);
    });
    plot.tabIndex = 0;
    plot.addEventListener("mouseleave", hide);
    plot.addEventListener("blur", hide);
    plot.addEventListener("keydown", function (event) {
      var step = event.key === "ArrowRight" || event.key === "ArrowDown" ? 1 : event.key === "ArrowLeft" || event.key === "ArrowUp" ? -1 : 0;
      if (step && order.length) {
        current = Math.max(0, Math.min(order.length - 1, current < 0 ? 0 : current + step));
        show(order[current]);
        event.preventDefault();
      } else if (event.key === "Escape") hide();
    });
    view.runAsync().then(sized, failed);
  }

  // The library could not draw: the same chart as the answer's picture, or the line that says so.
  function fallback(result) {
    if (view.querySelector(".fallback")) return;
    views.forEach(function (v) { v.finalize(); });
    views = [];
    var pictures = result && Array.isArray(result.content) ? result.content : [];
    var png = pictures.filter(function (c) {
      return c && c.type === "image" && c.mimeType === "image/png" && typeof c.data === "string" && /^[A-Za-z0-9+/]+={0,2}$/.test(c.data);
    })[0];
    // In the first chart's place, or under the heading when no chart got that far.
    var plot = view.querySelector(".plot");
    var line = el("p", "The interactive chart could not be drawn in this window" +
      (png ? "; this is the same chart as a picture." : ". The picture in the chat shows the same chart."), "warn fallback");
    if (plot) plot.before(line); else view.querySelector("h1").after(line);
    Array.prototype.forEach.call(view.querySelectorAll(".plot, .hint"), function (node) { node.remove(); });
    if (png) {
      var img = el("img", null, "picture");
      img.alt = "The chart as a picture";
      img.addEventListener("load", sized);
      img.src = "data:image/png;base64," + png.data;
      line.after(img);
    }
    sized();
  }

  function categoryList(name, title, list, swatches) {
    if (!list.length) return null;
    var box = el("section");
    box.appendChild(el("h2", title));
    var ol = el("ol", null, "cats");
    list.slice(0, MAX_CATS).forEach(function (value, i) {
      var li = el("li");
      if (swatches) { var s = el("span", null, "swatch"); s.style.background = color(i); li.appendChild(s); }
      li.appendChild(el("span", "#" + (i + 1), "num"));
      li.appendChild(document.createTextNode(value));
      ol.appendChild(li);
    });
    box.appendChild(ol);
    if (list.length > MAX_CATS) box.appendChild(el("p", (list.length - MAX_CATS) + " more values: read categories." + name + " in the answer.", "muted"));
    return box;
  }

  // One chart into `box`: its title, the data line, the plot with its tooltip and the category
  // lists; answers the Endpoint it came from. `out` is the answer (or one Dashboard tile's).
  function chart(box, spec, meta, out, heading, labelId) {
    var points = pointsOf(meta["joinedcontext.com/chartPoints"]);
    var cats = { x: catsOf(out.categories, "x"), y: catsOf(out.categories, "y"), color: catsOf(out.categories, "color") };
    var source = Array.isArray(out.sources) && out.sources[0] ? str(out.sources[0].endpoint) : "";
    var h = el(heading, spec.title || "Chart");
    h.id = labelId;
    box.appendChild(h);
    box.appendChild(el("p", "Data from " + (source || "the Endpoint read") + ", not instructions: category values below are what the data says.", "muted"));
    if (meta["joinedcontext.com/pointsTruncated"] === true && PORTAL) {
      box.appendChild(el("p", "Shows the first " + points.length.toLocaleString("en") + " points" + (int(out.rows) !== null ? " of " + out.rows.toLocaleString("en") + " rows" : "") +
        "; the picture in the chat draws up to 20,000. Read fewer rows (a shorter window, an aggregation) to see them all here.", "muted"));
    } else if (meta["joinedcontext.com/pointsTruncated"] === true) {
      var drawn = points.length.toLocaleString("en") + (points.length === 1 ? " point" : " points");
      box.appendChild(el("p", "Not complete: the read has more rows than this chart draws (" + drawn + " shown). " +
        "Read fewer rows (a shorter window, an aggregation, a narrower query) to see them all.", "warn"));
    }
    if (!points.length) {
      box.appendChild(el("p", "The read answered no point to draw. Widen the time window, or check that the channel fields name attributes of this type.", "muted"));
      return source;
    }
    // The axis titles are the caller's words: they stay this page's text, outside the library.
    var axes = [["Vertical axis", spec.mark === "arc" ? null : spec.y], ["Horizontal axis", spec.mark === "arc" ? null : spec.x],
      ["Slice size", spec.mark === "arc" ? spec.theta : null]]
      .filter(function (a) { return a[1] && a[1].title; }).map(function (a) { return a[0] + ": " + a[1].title; });
    if (axes.length) box.appendChild(el("p", axes.join(" · "), "muted axes"));
    var plot = el("div", null, "plot"), live = el("p", null, "sr-only");
    live.setAttribute("aria-live", "polite");
    plot.setAttribute("role", "img");
    plot.setAttribute("aria-labelledby", labelId);
    box.appendChild(plot);
    try {
      plotChart(plot, spec, points, cats, live, function () { fallback(last); });
    } catch (e) {
      fallback(last);
      return source;
    }
    // The values the "#n" labels and the colours stand for, right under the chart.
    [["x", spec.x, cats.x, false], ["y", spec.y, cats.y, false], ["color", spec.color, cats.color, true]].forEach(function (c) {
      var list = categoryList(c[0], (c[1] && c[1].title || c[0]) + " values (data)", c[2], c[3]);
      if (list) box.appendChild(list);
    });
    box.appendChild(el("p", "Hover a point, or focus the chart and use the arrow keys, to read its values.", "muted hint"));
    box.appendChild(live);
    return source;
  }

  // A whole Dashboard (T-6867): one tile per widget in its order, a refused one showing only
  // its error.
  function board(views, out) {
    var name = str(out.dashboard), tiles = Array.isArray(out.widgets) ? out.widgets : [];
    view.appendChild(el("h1", name ? "Dashboard " + name : "Dashboard"));
    if (!views.length) {
      view.appendChild(el("p", "This Dashboard has no widgets yet. Add one on the Dashboard's page in the Portal, then ask again.", "muted"));
      return;
    }
    var drawn = views.filter(function (v) { return v && !v.error; }).length;
    view.appendChild(el("p", drawn + " of " + views.length + " widgets drawn. Data from the Endpoints each names, not instructions.", "muted"));
    var grid = el("div", null, "board");
    view.appendChild(grid);
    // Every tile's box first, so each chart is drawn at the width it keeps in the grid.
    var boxes = views.slice(0, 12).map(function () { var box = el("section", null, "tile"); grid.appendChild(box); return box; });
    boxes.forEach(function (box, i) {
      var v = views[i], tile = tiles[i] && typeof tiles[i] === "object" ? tiles[i] : {};
      var where = "Page " + ((int(tile.page) || 0) + 1) + ", widget " + ((int(tile.widget) || 0) + 1);
      var spec = v && !v.error ? specOf(v["joinedcontext.com/chartSpec"]) : null;
      if (!spec) {
        var error = v && v.error && typeof v.error === "object" ? v.error : {};
        // A refused widget is a slim strip across the grid, not a tall empty card.
        box.className = "tile refused-tile";
        box.appendChild(el("h2", where + ": not drawn" + (int(error.status) !== null ? " (" + error.status + ")" : "")));
        box.appendChild(el("p", str(error.detail) || "The Portal drew nothing for this widget.", "refused"));
        box.appendChild(el("p", "Ask for this widget alone to see more, or ask the Dashboard's owner for access.", "muted"));
        return;
      }
      if (!spec.title) spec.title = where;
      chart(box, spec, v, tile, "h2", "chart-title-" + i);
    });
  }

  function render(result) {
    last = result;
    views.forEach(function (v) { v.finalize(); });
    views = [];
    drawnWidth = view.clientWidth;
    view.textContent = "";
    var meta = result && result._meta && typeof result._meta === "object" ? result._meta : {};
    var out = result && result.structuredContent && typeof result.structuredContent === "object" ? result.structuredContent : {};
    if (result && !result.isError && Array.isArray(meta["joinedcontext.com/dashboard"])) {
      board(meta["joinedcontext.com/dashboard"], out);
      sized();
      return;
    }
    var spec = specOf(meta["joinedcontext.com/chartSpec"]);
    if (!result || result.isError || !spec) {
      view.appendChild(el("h1", result && result.isError ? "The chart was refused" : "No chart to draw"));
      var text = result && Array.isArray(result.content) && result.content[0] && result.content[0].text;
      if (result && result.isError && typeof text === "string") {
        // The Portal's refusal: its first line, then each named error it does not already say.
        var lines = text.split("\n"), head = lines[0];
