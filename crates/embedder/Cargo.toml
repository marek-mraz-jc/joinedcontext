[package]
name = "jc-embedder"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The embedding model (multilingual-e5-small int8) in process, as a service several deployments share, and that service's client"

[[bin]]
name = "jc-embedder"
path = "src/bin/jc-embedder.rs"

[dependencies]
jc-door = { path = "../shared/jc-door" }
jc-secret = { path = "../shared/jc-secret" }
axum = "0.8"
hex = "0.4"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
# ONNX Runtime loaded at start from ORT_DYLIB_PATH, as the assistant does (its Cargo.toml says why).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "api-24", "load-dynamic"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
base64 = "0.22"

[dev-dependencies]
jc-door = { path = "../shared/jc-door", features = ["testing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "test-util", "io-util"] }
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }
